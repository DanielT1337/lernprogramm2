            max-width: 650px;

        button.success-btn { background: var(--success); font-size: 1.2rem; padding: 15px 40px; }

        .card {
            border: 2px solid #f1f1f1;

            margin-bottom: 2rem;

        /* Neue Filter-Bereich Styles */

        .theme-list {

<script>
    // ==========================================
    // DATENBANK (INTEGRIERT)
    // ==========================================
    
    // HIER DEINE GESAMTEN CSV-DATEN EINFÜGEN (zwischen die Backticks ` `)
    const QUESTIONS_DATA = `
Altersbedingte Veränderungen;Welchen Einfluss hat die verminderte glomeruläre Filtrationsrate (GFR) im Alter auf die Pharmakotherapie?;Durch die nachlassende Nierenfunktion verlängert sich die Halbwertszeit renal ausgeschiedener Medikamente, was das Risiko für Akkumulation und Toxizität (z.B. bei Digoxin oder NSAR) massiv erhöht.
Altersbedingte Veränderungen;Erklären Sie den Begriff der Presbyakusis und die daraus resultierenden pflegerischen Konsequenzen.;Es handelt sich um die Altersschwerhörigkeit (v.a. im Hochtonbereich). Pflegerisch muss tief moduliert, deutlich, langsam und von Angesicht zu Angesicht gesprochen werden, da hohe Töne schlechter gefiltert werden können.
Altersbedingte Veränderungen;Wie verändert sich die Thermoregulation im Alter und welche Gefahr resultiert daraus?;Durch weniger Unterhautfettgewebe, verminderte Schweissproduktion und ein reduziertes Durstgefühl können ältere Menschen Hitze und Kälte schlechter kompensieren, was zu Dehydration oder unbemerkter Hypothermie führen kann.
Altersbedingte Veränderungen;Was bedeutet die Abnahme der Lungenelastizität (Compliance) für die Atemreserve älterer Patienten?;Die Vitalkapazität sinkt und das Residualvolumen steigt, da die Lunge sich nicht mehr vollständig zusammenzieht. Dies führt bei Belastung schneller zu Dyspnoe und erhöht das Risiko für respiratorische Infekte (Atelektasenbildung).
Altersbedingte Veränderungen;Beschreiben Sie die Veränderung der Haut im Alter in Bezug auf das Dekubitusrisiko.;Die Epidermis wird dünner (Atrophie), die Verzahnung zwischen Dermis und Epidermis lässt nach und die Vaskularisation sinkt. Die Haut ist weniger scherfest und regeneriert langsamer, was das Dekubitusrisiko erhöht.
Altersbedingte Veränderungen;Welche Auswirkungen hat die verminderte Magensäureproduktion (Achlorhydrie) auf die Nährstoffaufnahme?;Die Aufnahme von Vitamin B12, Eisen und Kalzium kann beeinträchtigt sein, da diese Stoffe ein saures Milieu zur Freisetzung benötigen, was langfristig zu Anämie oder Osteoporose führen kann.
Altersbedingte Veränderungen;Wie verändert sich die Körperzusammensetzung im Alter (Sarkopenie) und was ist die Folge?;Die Muskelmasse nimmt ab und der Fettanteil (viszeral) zu. Dies führt zu verminderter Kraft, erhöhter Sturzgefahr und einem veränderten Verteilungsvolumen für lipophile Medikamente.
Altersbedingte Veränderungen;Warum zeigen ältere Menschen bei Infektionen oft kein Fieber?;Das Immunsystem reagiert langsamer (Immunoseneszenz) und die zentrale Temperaturregelung im Hypothalamus ist weniger sensibel. Ein Infekt zeigt sich oft eher durch Verwirrtheit (Delir) als durch Temperaturanstieg.
Altersbedingte Veränderungen;Welche physiologische Veränderung im Auge führt zur Presbyopie (Altersweitsichtigkeit)?;Die Linse verliert an Elastizität und die Fähigkeit zur Akkommodation (Naheinstellung) lässt nach, da der Ziliarmuskel die Linse nicht mehr ausreichend krümmen kann.
Altersbedingte Veränderungen;Wie wirkt sich die Abnahme der Barorezeptorensensibilität im Alter aus?;Die Blutdruckanpassung bei Lagewechsel erfolgt verzögert, was häufig zu orthostatischer Hypotonie und damit verbundenen Synkopen und Stürzen führt.
Angina pectoris;Erklären Sie die Pathophysiologie der Angina pectoris.;Es besteht ein Missverhältnis zwischen Sauerstoffangebot und Sauerstoffbedarf des Myokards, meist ausgelöst durch Stenosen der Koronararterien (Koronare Herzkrankheit).
Angina pectoris;Was unterscheidet eine stabile von einer instabilen Angina pectoris?;Stabile AP tritt bei reproduzierbarer Belastung auf und verschwindet in Ruhe/nach Nitro-Gabe. Instabile AP tritt in Ruhe auf, nimmt an Intensität zu oder spricht nicht auf Nitro an (akutes Koronarsyndrom-Gefahr!).
Angina pectoris;Welche atypischen Symptome zeigen Frauen oder Diabetiker häufig bei einer Angina pectoris?;Statt des klassischen Vernichtungsschmerzes treten oft "Silent Ischemia" (bei Diabetes), Übelkeit, Oberbauchschmerzen, isolierte Dyspnoe oder starke Müdigkeit auf.
Angina pectoris;Wie wirkt Glyceroltrinitrat (Nitro-Spray) im Akutfall?;Es wirkt gefässerweiternd (v.a. venöses Pooling), wodurch der venöse Rückstrom zum Herzen sinkt (Vorlastsenkung). Das Herz muss gegen weniger Druck arbeiten und benötigt weniger Sauerstoff.
Angina pectoris;Warum ist eine Blutdruckmessung vor der Gabe von Nitro-Spray obligat?;Da Nitro-Spray eine starke Vasodilatation bewirkt, kann es zu einem massiven Blutdruckabfall (Hypotonie) führen. Bei einem systolischen Wert unter 90-100 mmHg darf es meist nicht verabreicht werden.
Angina pectoris;Welche diagnostischen Massnahmen sind bei Verdacht auf AP wegweisend?;Ruhe- und Belastungs-EKG (ST-Streckenveränderungen), Echokardiographie (Wandbewegungsstörungen) und die Koronarangiographie zur Darstellung der Stenosen.
Angina pectoris;Nennen Sie drei Medikamentengruppen der Langzeittherapie bei AP und deren Ziel.;Betablocker (Senkung der Herzfrequenz/Sauerstoffbedarf), Thrombozytenaggregationshemmer (Prävention von Thromben), Statine (Plaquestabilisierung).
Angina pectoris;Beschreiben Sie das PQRST-Schema zur Schmerzeinschätzung bei AP.;P: Provokation, Q: Qualität (drückend, brennend), R: Region/Ausstrahlung (linker Arm, Kiefer), S: Stärke (NRS 1-10), T: Timing (Dauer des Anfalls).
Angina pectoris;Was ist eine Prinzmetal-Angina?;Eine Sonderform der AP, die durch Spasmen der Koronararterien (unabhängig von Belastung oder Stenosen) ausgelöst wird und oft zu vorübergehenden EKG-Veränderungen führt.
Angina pectoris;Welche pflegerischen Sofortmassnahmen ergreifen Sie bei einem akuten AP-Anfall?;Pat. mit erhöhtem Oberkörper lagern (Herzbett), Enge Kleidung öffnen, Ruhe vermitteln, O2-Gabe nach Verordnung, Vitalzeichenkontrolle, Arzt informieren.
Behinderung / Beeinträchtigung;Erklären Sie das biopsychosoziale Modell der ICF.;Behinderung wird nicht nur als Defekt der Person gesehen, sondern als Wechselwirkung zwischen Gesundheitsproblem, Körperstrukturen, Aktivitäten und der Teilhabe unter Berücksichtigung von Kontextfaktoren.
Behinderung / Beeinträchtigung;Was ist der Unterschied zwischen einer "Aktivitätseinschränkung" und einer "Teilhabebeeinträchtigung" laut ICF?;Aktivität betrifft die Durchführung einer Aufgabe (z.B. Gehen), Teilhabe betrifft das Einbezogensein in eine Lebenssituation (z.B. Besuch eines Konzerts trotz Rollstuhl).
Behinderung / Beeinträchtigung;Definieren Sie den Begriff "Inklusion" im Gegensatz zu "Integration".;Integration möchte Menschen in ein bestehendes System einfügen (Anpassung des Individuums). Inklusion fordert, dass das System von vornherein so gestaltet ist, dass alle ohne Anpassung teilhaben können.
Behinderung / Beeinträchtigung;Welche Bedeutung hat die UN-Behindertenrechtskonvention für die Pflege?;Sie stärkt das Recht auf Selbstbestimmung, Barrierefreiheit und eine qualitativ hochwertige Gesundheitsversorgung ohne Diskriminierung, was die Pflege zur Förderung der Autonomie verpflichtet.
Behinderung / Beeinträchtigung;Nennen Sie drei Kontextfaktoren der ICF und geben Sie Beispiele.;Umweltfaktoren (Rampe vorhanden?), persönliche Faktoren (Alter, Motivation) und soziale Faktoren (Unterstützung durch Angehörige).
Behinderung / Beeinträchtigung;Was versteht man unter "Leichter Sprache" im Kontext der geistigen Behinderung?;Ein Regelwerk für Sprache, das kurze Sätze, einfache Wörter, Verzicht auf Metaphern und klare Struktur nutzt, um Barrierefreiheit in der Kommunikation zu schaffen.
Behinderung / Beeinträchtigung;Warum ist das Risiko für Multimorbidität bei Menschen mit Behinderung oft höher?;Durch eingeschränkte Mobilität, Kommunikationsbarrieren (Schmerzäußerung!) und teilweise syndrombedingte Organfehlbildungen werden Sekundärerkrankungen oft später erkannt oder begünstigt.
Behinderung / Beeinträchtigung;Beschreiben Sie das ethische Dilemma zwischen "Fürsorge" und "Autonomie" bei kognitiver Beeinträchtigung.;Pflegende müssen abwägen, wann sie zum Schutz des Patienten intervenieren (Fürsorge) und wann sie riskante Entscheidungen des Patienten im Sinne der Selbstbestimmung akzeptieren müssen.
Behinderung / Beeinträchtigung;Welche Rolle spielt die interprofessionelle Zusammenarbeit (Logopädie, Physiotherapie) bei chronischer Behinderung?;Sie dient der Funktionserhaltung und Prävention von Sekundärschäden (Kontrakturen, Pneumonien), um die grösstmögliche Selbstständigkeit im Alltag (Aktivität) zu sichern.
Behinderung / Beeinträchtigung;Was bedeutet "Empowerment" in der Begleitung von Menschen mit Beeinträchtigung?;Es ist ein Prozess, bei dem Menschen (wieder) die Kontrolle über ihr Leben gewinnen und durch die Pflege befähigt werden, ihre eigenen Ressourcen zu nutzen und Interessen zu vertreten.
Beschwerden im Abdomen;Was verstehen Sie unter einem "akuten Abdomen" und welche drei Leitsymptome kennzeichnen dieses Krankheitsbild?;Es ist ein potenziell lebensbedrohlicher Symptomkomplex, keine endgültige Diagnose. Die drei Leitsymptome sind: akuter heftiger Bauchschmerz, Abwehrspannung der Bauchdecken (Défense musculaire) und Kreislaufdysregulation bis hin zum Schock.
Beschwerden im Abdomen;Erklären Sie das Rovsing-Zeichen und das Blumberg-Zeichen bei Verdacht auf Appendizitis.;Rovsing-Zeichen: Schmerzen im rechten Unterbauch beim retrograden Ausstreichen des Kolons (Richtung Zäkum). Blumberg-Zeichen: Kontralateraler Loslassschmerz; tiefe Palpation im linken Unterbauch verursacht beim plötzlichen Loslassen Schmerzen rechts.
Beschwerden im Abdomen;Was ist der pathophysiologische Unterschied zwischen einem mechanischen und einem paralytischen Ileus?;Mechanisch: Verlegung des Darmlumens (z.B. durch Tumor, Briden), anfangs zeigt sich eine gesteigerte Hyperperistaltik. Paralytisch: Darmlähmung (z.B. durch Peritonitis, Opiate), es fehlt jegliche Peristaltik (Totenstille bei Auskultation).
Beschwerden im Abdomen;Warum ist die routinemässige Gabe von starken Analgetika bei unklaren akuten Abdominalbeschwerden vor der ärztlichen Diagnostik kritisch?;Starke Analgetika (wie Opiate) können die klinischen Leitsymptome (Schmerz, Abwehrspannung) verschleiern. Dies kann die Diagnosestellung verzögern, was bei drohender Perforation oder Ischämie lebensgefährlich ist.
Beschwerden im Abdomen;Warum muss bei einem abdominalen Assessment die Auskultation zwingend vor der Palpation erfolgen?;Die Palpation kann die Darmperistaltik mechanisch anregen oder verändern. Dies würde das anschliessende Auskultationsergebnis (z.B. fehlende Darmgeräusche bei Verdacht auf Ileus) verfälschen.
Beschwerden im Abdomen;Welche pathophysiologischen Mechanismen führen bei einer Peritonitis zu einem hypovolämischen Schock?;Die massive Entzündung führt zur Vasodilatation und erhöhten Kapillarpermeabilität. Dadurch verschiebt sich extrem viel intravasale Flüssigkeit in das Darmlumen und die freie Bauchhöhle (Third Spacing).
Beschwerden im Abdomen;Wie lässt sich eine Gallenkolik schmerztechnisch charakterisieren und wo liegt das typische Ausstrahlungsgebiet?;Typisch sind krampfartige, wellenförmige (an- und abschwellende) Schmerzen im rechten Oberbauch, die häufig in den rechten Rücken oder bis in die rechte Schulter ausstrahlen.
Beschwerden im Abdomen;Wie unterscheiden sich Hämatemesis, Melaena und Hämatochezie und welche Rückschlüsse auf die Blutungsquelle lassen sie zu?;Hämatemesis (oft kaffeesatzartig): obere GI-Blutung. Melaena (Teerstuhl): obere GI-Blutung (Blut durch Magensäure verdaut). Hämatochezie (frisches rotes Blut): meist untere GI-Blutung, kann bei sehr massiver Blutung auch obere GI-Blutung sein.
Beschwerden im Abdomen;Welche zwei Hauptursachen stehen bei der akuten Pankreatitis im Vordergrund und wie präsentiert sich der typische Schmerz?;Ursachen sind meist Gallensteine (biliäre Pankreatitis) oder chronischer Alkoholabusus. Der Schmerz präsentiert sich typischerweise als massiver, gürtelförmiger, in den Rücken ausstrahlender Oberbauchschmerz.
Beschwerden im Abdomen;Auf welche spezifischen Überwachungsparameter achten Sie postoperativ nach einer Darmanastomose bezüglich einer Anastomoseninsuffizienz?;Zunehmende Abdominalschmerzen, plötzlich auftretendes Fieber, Tachykardie, trübes, eitriges oder stuhliges Sekret in der Wunddrainage sowie ein rascher Anstieg der Entzündungsparameter (CRP, Leukozyten).
Bewusstseinsstörungen;Aus welchen drei Parametern setzt sich die Glasgow Coma Scale (GCS) zusammen und wo liegt der kritische Wert für die Intubationspflicht?;Die GCS beurteilt: Augenöffnen (1-4), verbale Reaktion (1-5) und motorische Reaktion (1-6). Ein Wert von 8 oder weniger deutet auf ein Koma hin und erfordert meist eine Intubation zum Schutz der Atemwege vor Aspiration.
Bewusstseinsstörungen;Was ist der Unterschied zwischen quantitativen und qualitativen Bewusstseinsstörungen? Nennen Sie Beispiele.;Quantitativ betrifft die Wachheit/Vigilanz (Benommenheit, Somnolenz, Sopor, Koma). Qualitativ betrifft die normalen kognitiven und affektiven Funktionen (Verwirrtheit, Delir, Halluzinationen) bei oft erhaltener Wachheit.
Bewusstseinsstörungen;Erklären Sie das Akronym AEIOU-TIPS als Merkregel für die Ursachen von Bewusstseinsstörungen.;A: Alkohol/Azidose, E: Epilepsie/Elektrolyte, I: Insulin (Hypo-/Hyperglykämie), O: Opiate/Overdose, U: Urämie, T: Trauma/Tumor, I: Infektion (Meningitis/Sepsis), P: Psychogen/Poison, S: Schock/Stroke.
Bewusstseinsstörungen;Welche Bedeutung hat die Pupillenkontrolle bei einem bewusstseinsgestörten Patienten und was deutet auf eine Einklemmung hin?;Sie gibt Auskunft über die Hirnstammfunktion und den N. oculomotorius. Eine einseitig weite, lichtstarre Pupille (Anisokorie) ist ein Alarmzeichen für eine ipsilaterale zerebrale Einklemmung durch massiv erhöhten Hirndruck.
Bewusstseinsstörungen;Warum führt eine Hypoglykämie so schnell zu neurologischen Ausfällen und Bewusstseinsstörungen?;Das Gehirn kann im Gegensatz zum Muskelgewebe keine Glukose speichern. Es benötigt unabhängig von Insulin eine kontinuierliche Glukosezufuhr aus dem Blut als primären Energielieferanten für den Zellstoffwechsel.
Bewusstseinsstörungen;Welche drei motorischen Subtypen des Delirs unterscheidet man und welcher Typ wird pflegerisch am häufigsten übersehen?;Man unterscheidet das hyperaktive, das hypoaktive und das gemischte Delir. Das hypoaktive Delir wird oft übersehen, da die Patienten ruhig sind, und wird fälschlicherweise als Depression oder Fatigue interpretiert.
Bewusstseinsstörungen;Welcher Metabolit ist massgeblich für die hepatische Enzephalopathie (HE) verantwortlich und wie wird er therapeutisch gesenkt?;Ammoniak, das bei Leberinsuffizienz nicht mehr in Harnstoff umgewandelt wird. Therapeutisch wird oft Lactulose verabreicht; sie senkt den pH-Wert im Darm, wandelt Ammoniak in nicht-resorbierbares Ammonium um und führt es ab.
Bewusstseinsstörungen;Was ist der Cushing-Reflex bei erhöhtem intrakraniellen Druck (ICP) und aus welchen drei Zeichen (Cushing-Trias) besteht er?;Es ist eine lebensbedrohliche Reaktion des Hirnstamms auf Ischämie bei extremem Hirndruck. Die Trias besteht aus: starker arterieller Hypertonie, Bradykardie und unregelmässiger Atmung.
Bewusstseinsstörungen;Welche prioritäre pflegerische Massnahme ergreifen Sie bei einem plötzlich somnolenten Patienten, der erbricht?;Sofortige Seitenlagerung (bzw. stabile Seitenlagerung) und Absaugbereitschaft erstellen. Oberste Priorität hat das Verhindern einer Aspiration von Mageninhalt in die tieferen Atemwege.
Bewusstseinsstörungen;Wie entsteht eine CO2-Narkose bei COPD-Patienten und wie zeigt sich dies klinisch?;COPD-Patienten adaptieren sich an hohes CO2, ihr Atemantrieb wird oft durch Sauerstoffmangel (Hypoxie) gesteuert. Eine zu hohe O2-Gabe nimmt diesen Antrieb, die Atmung flacht ab, CO2 kumuliert massiv. Klinisch: Somnolenz, rote/warme Haut, Tremor, Koma.
Breaking Bad News;Erklären Sie die 6 Schritte des SPIKES-Protokolls zum Überbringen schlechter Nachrichten.;S: Setting (ruhige Umgebung schaffen), P: Perception (Wissensstand/Wahrnehmung des Pat. erfragen), I: Invitation (Informationsbedarf klären), K: Knowledge (Wissen vermitteln), E: Emotions (Emotionen empathisch auffangen), S: Strategy/Summary (Zusammenfassung/weiteres Vorgehen).
Breaking Bad News;Welche Vorbereitungen bezüglich des Settings sind zwingend erforderlich, bevor ein Gespräch über eine infauste Prognose geführt wird?;Ein ungestörter Raum, Sitzgelegenheiten auf Augenhöhe, Vermeidung von Störungen (Telefon stumm, Pieper abgeben), ausreichend eingeplante Zeit und der Einbezug von Bezugspersonen, sofern der Patient dies wünscht.
Breaking Bad News;Welche Aufgaben hat die Pflegefachperson während und nach einem ärztlichen "Breaking Bad News"-Gespräch?;Währenddessen: Nonverbale Reaktionen des Patienten beobachten und durch Präsenz unterstützen. Danach: Nachbetreuung, Fragen klären, medizinische Informationen in verständliche Sprache übersetzen und ggf. Seelsorge/Psychoonkologie beiziehen.
Breaking Bad News;Erklären Sie das NURSE-Modell als Struktur für empathische Reaktionen auf starke Patientenemotionen.;N: Naming (Emotion benennen), U: Understanding (Verständnis ausdrücken), R: Respecting (Respektieren/Anerkennen der Situation), S: Supporting (Unterstützung anbieten), E: Exploring (Weiteres Erforschen/Nachfragen, was der Pat. jetzt braucht).
Breaking Bad News;Wie gehen Sie ethisch damit um, wenn Angehörige fordern, dem Patienten eine terminale Diagnose zu verschweigen?;Es besteht ein Dilemma (Autonomie vs. Fürsorge). Der urteilsfähige Patient hat ein juristisches und ethisches Recht auf die Wahrheit. Pflegende müssen die Ängste der Angehörigen besprechen, dürfen den Patienten aber auf Nachfrage nicht anlügen.
Breaking Bad News;Warum können sich Patienten oft nicht an die Details eines medizinischen Aufklärungsgesprächs erinnern, in dem schlechte Nachrichten überbracht wurden?;Der Schock über die Nachricht löst eine akute Stressreaktion aus (Fight/Flight/Freeze). Dies blockiert die kognitive Aufnahmefähigkeit und Informationsverarbeitung massiv ("Tunnelblick").
Breaking Bad News;Warum ist das Aushalten von Gesprächspausen (Schweigen) nach dem Überbringen der Diagnose so essenziell?;Es gibt dem Patienten die dringend benötigte Zeit, die Nachricht kognitiv zu realisieren, Emotionen zuzulassen und eigene Fragen zu formulieren, anstatt durch schnelles Weiterreden der Fachpersonen überfahren zu werden.
Breaking Bad News;Wie erkennen Sie ein "maladaptives Coping" nach einer schlechten Nachricht und wie können Sie professionell reagieren?;Es zeigt sich oft durch Aggression, extreme Verleugnung oder selbstschädigendes Verhalten. Reaktion: Eigene Sicherheit gewährleisten, die dahinterliegende Verzweiflung benennen, nicht verurteilen, deeskalierend wirken und ggf. psychologischen Konsiliardienst beiziehen.
Breaking Bad News;Was versteht man in der Kommunikation unter einem "Warning Shot" (Warnschuss) und welchen Zweck erfüllt er?;Eine einleitende Formulierung (z.B. "Ich habe leider keine guten Neuigkeiten für Sie"). Sie gibt dem Patienten wenige Sekunden Zeit, sich mental und emotional darauf vorzubereiten, dass gleich eine schwere Information folgt.
Breaking Bad News;Welche Bewältigungsstrategien stehen dem interprofessionellen Team zur Verfügung, wenn es durch emotional stark belastende Patientengespräche zur Erschöpfung kommt?;Regelmässige strukturierte Fallbesprechungen, Intervision, Supervision durch externe Fachpersonen, Debriefing unmittelbar nach extremen Situationen und eine bewusst gelebte Fehler- und emotionale Unterstützungskultur im Betrieb.
Bronchialkarzinom;Was ist der pathophysiologische und therapeutische Hauptunterschied zwischen dem kleinzelligen (SCLC) und dem nicht-kleinzelligen Bronchialkarzinom (NSCLC)?;Das SCLC wächst extrem schnell und metastasiert sehr früh (oft schon Mikrometastasen bei Diagnose), weshalb primär systemisch (Chemo/Radiotherapie) behandelt wird. Das NSCLC wächst langsamer und wird in frühen Stadien primär kurativ operiert.
Bronchialkarzinom;Warum wird ein Bronchialkarzinom oft erst in einem sehr späten, inoperablen Stadium diagnostiziert?;Die Lunge selbst besitzt keine Schmerzrezeptoren. Symptome wie chronischer Husten werden von Risikopatienten (Rauchern) oft bagatellisiert. Leitsymptome wie Hämoptoe, B-Symptomatik oder Dyspnoe treten oft erst auf, wenn der Tumor Gefässe, Bronchien oder die Pleura infiltriert hat.
Bronchialkarzinom;Wohin metastasiert das Bronchialkarzinom typischerweise hämatogen und welche Symptome entstehen dadurch?;Häufige Metastasierungsorte sind Gehirn (Neurologische Ausfälle, Kopfschmerzen), Knochen (pathologische Frakturen, Knochenschmerzen), Leber (Ikterus, Aszites) und Nebennieren.
Bronchialkarzinom;Was ist ein paraneoplastisches Syndrom und warum tritt es beim SCLC häufig auf?;Tumorzellen produzieren hormonähnliche Stoffe (z.B. ADH). Dies führt zu systemischen Symptomen (z.B. SIADH mit Hyponatriämie), die unabhängig vom eigentlichen Tumorwachstum oder Metastasierungsort auftreten.
Bronchialkarzinom;Welche diagnostischen Verfahren sind bei Verdacht auf ein Bronchialkarzinom wegweisend für Staging und Histologie?;Ein CT-Thorax (Lokalisation/Größe), eine Bronchoskopie mit Biopsie (zur Bestimmung des genauen histologischen Gewebetyps) und ein PET-CT (zur Suche nach Metastasen/Staging).
Bronchialkarzinom;Welche akuten pflegerischen Massnahmen ergreifen Sie bei einem Patienten mit massiver Hämoptoe (Bluthusten)?;Sofortige Oberkörperhochlagerung, Pat. zur betroffenen Seite lagern (verhindert Übertreten des Blutes in den gesunden Lungenflügel), Ruhe bewahren (Pat. nicht alleine lassen), Vitalzeichen/SpO2 kontrollieren, Absaugbereitschaft erstellen und umgehend den Arzt alarmieren.
Bronchialkarzinom;Welche palliativen pflegerischen Interventionen lindern Atemnot bei fortgeschrittenem Bronchialkarzinom (ohne Medikamente)?;Einsatz der Lippenbremse (verhindert Bronchialkollaps), atemerleichternde Körperhaltungen (Kutschersitz, V-Lagerung zur Atemhilfsmuskulatur-Aktivierung), Kaltluftreiz im Gesicht (Ventilator) und beruhigende, geführte Atmung zur Reduktion von Panik.
Bronchialkarzinom;Warum werden bei palliativen Patienten mit Bronchialkarzinom Opioide (Morphin) zur Dyspnoe-Therapie eingesetzt?;Morphin senkt die Sensibilität des Atemzentrums für CO2, dämpft das Gefühl der Atemnot im ZNS und verringert die Atemarbeit, wodurch der Teufelskreis aus Dyspnoe, Panik und noch höherem Sauerstoffbedarf durchbrochen wird.
Bronchialkarzinom;Welche spezifischen psychosozialen Belastungen (Scham/Schuld) erleben Patienten mit Bronchialkarzinom häufig und wie begegnen Sie diesen?;Patienten empfinden oft starke Selbstvorwürfe ("Hätte ich nicht geraucht, wäre ich nicht krank") und fühlen sich stigmatisiert. Pflegende müssen eine wertfreie, empathische Haltung einnehmen (Caring) und das Thema Sucht professionell und ohne Verurteilung begleiten.
Bronchialkarzinom;Was ist die Indikation für eine Pleurapunktion bei Lungenkrebs und welche pflegerische Überwachung ist danach zwingend?;Sie dient der Entlastung bei malignem Pleuraerguss (Atemerleichterung). Postinterventionell muss der Patient engmaschig auf Symptome eines Pneumothorax (plötzliche Dyspnoe, asymmetrische Atembewegung) und Nachblutungen überwacht werden.
Caring / Verhandeln;Was versteht man unter dem Begriff "Caring" in der Pflege (z.B. nach Jean Watson)?;Caring ist der Kern der Pflege. Es geht über die rein medizinische Verrichtung hinaus und beschreibt eine Haltung der menschlichen Zuwendung, Empathie, Präsenz und den Aufbau einer heilenden, vertrauensvollen Beziehung zum Patienten.
Caring / Verhandeln;Nennen Sie den Unterschied zwischen "Curing" und "Caring".;Curing ist krankheitsorientiert und zielt auf die medizinische Heilung oder Beseitigung von Pathologien ab. Caring ist patientenorientiert und fokussiert sich auf das Wohlbefinden, die Begleitung und die Linderung von Leid, unabhängig von der Heilungsaussicht.
Caring / Verhandeln;Was bedeutet "Shared Decision Making" (Partizipative Entscheidungsfindung) im Kontext des Verhandelns?;Es ist ein Prozess, bei dem Fachpersonen und Patienten gleichberechtigt Behandlungsentscheidungen treffen. Die Fachperson bringt die medizinisch-pflegerische Evidenz ein, der Patient seine persönlichen Werte und Präferenzen.
Caring / Verhandeln;Was ist "Compassion Fatigue" (Mitgefühlserschöpfung) und wie unterscheidet es sich vom klassischen Burnout?;Compassion Fatigue entsteht spezifisch durch die emotionale Belastung aus der traumatischen/leidvollen Beziehung zu Patienten. Burnout hingegen ist eine allgemeine emotionale Erschöpfung, die oft durch organisatorische Faktoren (Stress, Personalmangel) ausgelöst wird.
Caring / Verhandeln;Welche Rolle spielt die "Health Literacy" (Gesundheitskompetenz) beim pflegerischen Verhandeln?;Verhandeln setzt voraus, dass der Patient die Informationen versteht. Ist die Health Literacy gering, muss die Pflegefachperson komplexe Fachsprache in einfache, verständliche Konzepte übersetzen, bevor eine echte gemeinsame Entscheidung möglich ist.
Caring / Verhandeln;Wie setzen Sie Caring in einer hochtechnisierten Umgebung wie der Intensivstation um ("High-Tech vs. High-Touch")?;Trotz Maschinenfokus bleibt der Mensch im Zentrum: durch bewusste, beruhigende Berührungen (Basale Stimulation), Ansprache des Patienten auch bei Sedierung und die Einbindung sowie Betreuung der Angehörigen.
Caring / Verhandeln;Wie gehen Sie im Sinne des Verhandelns mit einem Patienten um, der non-adhärent bezüglich seiner Medikamente ist?;Statt Paternalismus (Belehren) wird die subjektive Krankheitstheorie erfragt. Die Gründe für die Non-Adhärenz (z.B. Angst vor Nebenwirkungen, Kosten) werden explorativ erörtert, um gemeinsam einen alltagstauglichen Kompromiss zu finden.
Caring / Verhandeln;Was bedeutet das Prinzip der "Advocacy" (Anwaltschaft) in der Pflege?;Pflegende übernehmen eine Schutz- und Fürsprecherrolle. Sie setzen sich aktiv für die Rechte, Bedürfnisse und die Autonomie von Patienten ein, insbesondere wenn diese vulnerabel sind oder sich nicht selbst äußern können (z.B. gegenüber dem Ärzteteam).
Caring / Verhandeln;Was ist "Paternalismus" und warum steht er im Widerspruch zum modernen Pflegeverständnis des Verhandelns?;Paternalismus bedeutet, bevormundend "von oben herab" für den Patienten zu entscheiden, in der Annahme, man wisse als Fachperson, was das Beste sei. Dies entmündigt den Patienten und verletzt das ethische Grundprinzip der Autonomie.
Caring / Verhandeln;Welche Bedeutung hat das Element "Präsenz" (Being with) in den Caring-Dimensionen nach Swanson?;Es bedeutet emotionale Verfügbarkeit und echtes, ungeteiltes "Da-Sein" für den Patienten, Gefühle zu teilen und auszuhalten, ohne sofort in einen reinen "Aktionsmodus" (Handeln) zu verfallen.
Chronische entzündliche Darmerkrankungen;Was ist der hauptsächliche topografische Unterschied (Befallsmuster) zwischen Morbus Crohn und Colitis ulcerosa?;Morbus Crohn kann den gesamten Gastrointestinaltrakt vom Mund bis zum Anus befallen und tritt meist segmental (diskontinuierlich, "skip lesions") auf. Colitis ulcerosa beschränkt sich in der Regel auf das Colon und Rektum und breitet sich kontinuierlich von anal nach kranial aus.
Chronische entzündliche Darmerkrankungen;Wie unterscheiden sich Morbus Crohn und Colitis ulcerosa hinsichtlich der Wandinfiltration (Tiefenausdehnung) im Darm?;Morbus Crohn ist transmural, das heisst die Entzündung betrifft alle Wandschichten des Darms. Colitis ulcerosa betrifft hingegen ausschliesslich die oberflächlichen Schichten (Mukosa und Submukosa).
Chronische entzündliche Darmerkrankungen;Was sind die typischen Leitsymptome bei einem akuten Schub der Colitis ulcerosa?;Im Vordergrund stehen blutig-schleimige, oft krampfartige Diarrhoen (bis zu 20-30x täglich) sowie Tenesmen (schmerzhafter Stuhldrang).
Chronische entzündliche Darmerkrankungen;Warum kommt es beim Morbus Crohn häufig zur Bildung von Fisteln, Abszessen und Stenosen?;Aufgrund der transmuralen Entzündung (durch alle Wandschichten hindurch) entstehen tiefgreifende Schäden. Gewebevernarbungen führen zu Stenosen, Gewebeeinschmelzungen zu Abszessen und unnatürliche Gänge zu Nachbarorganen zu Fisteln (z.B. entero-vaginal).
Chronische entzündliche Darmerkrankungen;Welche Bedeutung hat die Ernährung während eines akuten Schubs und worauf muss pflegerisch geachtet werden?;Die Darmmukosa ist stark entzündet. Die Ernährung sollte ballaststoffarm, leicht verdaulich, fettarm und nicht blähend sein (leichte Vollkost). Milchprodukte werden im Schub oft schlecht toleriert. Bei schweren Schüben ist teils parenterale Ernährung nötig.
Chronische entzündliche Darmerkrankungen;Was versteht man unter extraintestinalen Manifestationen bei CED und nennen Sie zwei Beispiele.;Es handelt sich um entzündliche Begleiterkrankungen ausserhalb des Darms, ausgelöst durch die systemische Autoimmunreaktion. Beispiele: Gelenkentzündungen (Arthritis), Augenentzündungen (Uveitis) oder Hautveränderungen (Erythema nodosum).
Chronische entzündliche Darmerkrankungen;Welche Gefahr verbirgt sich hinter dem sogenannten Malabsorptionssyndrom beim Morbus Crohn (v.a. bei terminaler Ileitis)?;Durch die Entzündung oder Resektion von Darmabschnitten können Nährstoffe nicht mehr ausreichend aufgenommen werden. Folgen sind massive Gewichtsabnahme, Elektrolytentgleisungen, Anämie und Vitamin-B12-Mangel (da B12 im terminalen Ileum resorbiert wird).
Chronische entzündliche Darmerkrankungen;Was ist ein "Toxisches Megakolon" und warum ist es eine gefürchtete Komplikation bei der Colitis ulcerosa?;Es ist eine lebensbedrohliche Komplikation, bei der der Dickdarm massiv überdehnt (paralytisch) wird. Es drohen Darmperforation, bakterielle Peritonitis, Sepsis und Schock.
Chronische entzündliche Darmerkrankungen;Welche Wirkstoffgruppen kommen typischerweise im Stufenschema zur pharmakologischen Behandlung von CED zum Einsatz?;Aminosalicylate (z.B. Mesalazin zur Entzündungshemmung lokal), Kortikosteroide (Prednison bei akuten Schüben), Immunsuppressiva (Azathioprin) und moderne Biologika (z.B. Infliximab, hemmen spezifische Botenstoffe wie TNF-alpha).
Chronische entzündliche Darmerkrankungen;Welche psychosozialen Aspekte müssen Sie bei der Betreuung junger CED-Patienten zwingend einbeziehen (z.B. bei Stoma-Anlage)?;Die Erkrankungen beginnen oft im jungen Erwachsenenalter. Körperbildveränderungen (Stoma, Gewichtsverlust, Steroid-Nebenwirkungen), Einschränkungen in der Sexualität, Scham (Diarrhoen/Inkontinenzangst) und soziale Isolation erfordern gezieltes Body-Image-Training und Coping-Unterstützung.
Chronische Krankheiten;Was ist das Pflegemodell der Krankheitsverlaufskurve (Trajectory Model) nach Corbin und Strauss?;Es beschreibt chronische Krankheit nicht als statischen Zustand, sondern als dynamischen Prozess mit verschiedenen Phasen (z.B. stabil, instabil, akut, abwärts), in denen Pflege und Selbstmanagement phasenadaptiert unterstützen müssen.
Chronische Krankheiten;Erklären Sie das "Shifting Perspectives Model" bei chronischen Erkrankungen.;Das Modell besagt, dass chronisch Kranke zwischen zwei Perspektiven wechseln: Entweder steht die Krankheit im Vordergrund (Illness in the foreground) oder das normale Leben und Wohlbefinden (Wellness in the foreground).
Chronische Krankheiten;Worin liegt der Unterschied zwischen Adhärenz und Compliance in der chronischen Pflege?;Compliance bezeichnet das passive Befolgen ärztlicher Anordnungen. Adhärenz ist ein aktiver, partnerschaftlicher Prozess (Verhandeln), bei dem Behandlungsziele gemeinsam vereinbart und vom Patienten eigenverantwortlich mitgetragen werden.
Chronische Krankheiten;Was versteht man unter dem Begriff "Empowerment" bei Patienten mit chronischen Krankheiten?;Es ist der Prozess, bei dem Patienten befähigt werden, Experten für ihre eigene Erkrankung zu werden, Autonomie zu erlangen und durch Wissen (Health Literacy) und Ressourcenaktivierung ihr Selbstmanagement zu stärken.
Chronische Krankheiten;Warum leiden Patienten mit chronischen Erkrankungen häufig unter "Fatigue" und wie unterscheidet sie sich von normaler Müdigkeit?;Fatigue ist eine multidimensionale, pathologische Erschöpfung, die sich durch normalen Schlaf oder Erholung nicht beheben lässt. Sie wird oft durch inflammatorische Prozesse, Schmerzen oder psychische Belastung (Coping) ausgelöst.
Chronische Krankheiten;Welche Bedeutung hat das familiäre System (Familienzentrierte Pflege) bei der Bewältigung einer chronischen Erkrankung?;Die Krankheit betrifft nie nur das Individuum. Angehörige sind Mitbetroffene und gleichzeitig wichtigste Ressource. Eine Dysfunktion im familiären Coping kann den Krankheitsverlauf des Patienten massiv negativ beeinflussen.
Chronische Krankheiten;Was ist "maladaptives Coping" und wie kann es sich bei chronischen Erkrankungen äussern?;Es ist eine dysfunktionale Bewältigungsstrategie, z.B. durch anhaltende Verleugnung der Diagnose, sozialen Rückzug, Aggression oder Non-Adhärenz, was langfristig zu einer Verschlechterung des Gesundheitszustandes führt.
Chronische Krankheiten;Erklären Sie das Konzept des "Selbstmanagements" in der chronischen Pflege.;Es umfasst die täglichen Aufgaben, die Patienten bewältigen müssen, um mit der Krankheit zu leben (Symptomkontrolle, Medikamenteneinnahme, Anpassung des Lebensstils, Umgang mit emotionalen Folgen).
Chronische Krankheiten;Warum sind chronisch kranke Patienten besonders vulnerabel für Stigmatisierungsprozesse?;Sichtbare Symptome, Hilfsmittel oder Leistungsabfall weichen von der gesellschaftlichen Norm ab. Dies kann zu Diskriminierung, Scham und sozialer Isolation (Teilhabebeeinträchtigung) führen.
Chronische Krankheiten;Inwiefern verschwimmen die Grenzen zwischen kurativer, rehabilitativer und palliativer Pflege bei fortgeschrittenen chronischen Krankheiten?;Da eine Heilung (Kuration) ausgeschlossen ist, zielt die Behandlung auf Symptomkontrolle, Erhalt der Lebensqualität und Funktionserhalt (Rehabilitation) ab. In späten Phasen rückt die palliative Begleitung in den Fokus.
COPD;Erklären Sie die Pathophysiologie der COPD anhand der zwei Hauptkomponenten (chronisch obstruktive Bronchitis und Lungenemphysem).;Die chronische Entzündung führt zu einer Verengung/Verschleimung der Bronchien (Obstruktion). Gleichzeitig werden die Alveolarsepten zerstört (Emphysem), was zu einem Überblähungszustand (Air Trapping) und Gasaustauschverlust führt.
COPD;Warum darf einem Patienten mit fortgeschrittener COPD bei Dyspnoe in der Regel nicht unkontrolliert hochdosierter Sauerstoff verabreicht werden?;COPD-Patienten adaptieren sich an hohe CO2-Werte im Blut. Ihr Atemantrieb wird oft nicht mehr durch CO2, sondern durch Sauerstoffmangel (Hypoxie) gesteuert. Zuviel O2 nimmt den Atemantrieb, was zur tödlichen CO2-Narkose führen kann.
COPD;Wie wirkt die "Lippenbremse" pathophysiologisch und warum ist sie bei COPD so wichtig?;Durch das langsame Ausatmen gegen den Widerstand der fast geschlossenen Lippen entsteht ein positiver endexspiratorischer Druck (PEEP) in den Atemwegen. Dieser verhindert den vorzeitigen Kollaps der kleinen Bronchien und reduziert das "Air Trapping".
COPD;Was ist ein "Cor pulmonale" und warum entsteht es häufig als Folge einer COPD?;Es ist eine Rechtsherzinsuffizienz infolge einer Lungenerkrankung. Die chronische Hypoxie bei COPD führt zu einer Vasokonstriktion der Lungengefässe (Euler-Liljestrand-Mechanismus). Das rechte Herz muss gegen diesen hohen Widerstand anpumpen und hypertrophiert/versagt.
COPD;Was misst die Spirometrie bei der COPD-Diagnostik und was bedeutet der FEV1-Wert?;Sie misst die Lungenfunktion. Der FEV1-Wert (Einsekundenkapazität) zeigt an, wie viel Luft der Patient nach maximaler Einatmung in einer Sekunde forciert ausatmen kann. Er ist das Hauptkriterium für den Schweregrad der Obstruktion.
COPD;Was bedeutet die GOLD-Klassifikation und nach welchen Kriterien wird sie heute vorgenommen?;Sie dient der Einteilung des Schweregrads der COPD. Sie kombiniert den objektiv gemessenen FEV1-Wert (Grade 1-4) mit der subjektiven Symptombelastung und der Exazerbationshistorie (Gruppen A-E bzw. früher A-D).
COPD;Wie erkennen Sie klinisch eine beginnende CO2-Narkose (Hyperkapnie) bei einem COPD-Patienten?;Der Patient wird somnolent bis komatös, zeigt oft eine gerötete/warme Haut (Vasodilatation durch CO2), schwitzt, hat einen weichen/flachen Puls und teils einen Flapping Tremor (Asterixis).
COPD;Was ist eine akute Exazerbation der COPD (AECOPD) und was sind die häufigsten Auslöser?;Eine akute, über die täglichen Schwankungen hinausgehende Verschlechterung der Symptome (mehr Husten, purulentes Sputum, stärkere Dyspnoe), die eine Therapieanpassung erfordert. Häufigste Auslöser sind virale oder bakterielle Atemwegsinfekte.
COPD;Warum sind viele Patienten mit schwerer COPD kachektisch (unterernährt) und was ist die pflegerische Konsequenz?;Die massive Atemarbeit (Nutzung der Atemhilfsmuskulatur) verbraucht extrem viele Kalorien, während Dyspnoe beim Essen die Nahrungsaufnahme erschwert. Pflege: hochkalorische, leicht kaubare, kleine und häufige Mahlzeiten anbieten.
COPD;Erklären Sie die Wirkungsweise der Basis-Medikamente LAMA und LABA in der COPD-Therapie.;Es sind langwirksame Bronchodilatatoren. LAMA (Anticholinergika) blockieren die rezeptorvermittelte Verengung durch den Parasympathikus. LABA (Beta-2-Sympathomimetika) stimulieren die Rezeptoren, die eine Erschlaffung der Bronchialmuskulatur bewirken.
CVI;Was ist der Unterschied zwischen einem ischämischen und einem hämorrhagischen CVI in Bezug auf Pathophysiologie und Häufigkeit?;Der ischämische CVI (ca. 80-85%) entsteht durch einen Gefässverschluss (Thrombus/Embolus), der zu einer Minderdurchblutung führt. Der hämorrhagische CVI (ca. 15-20%) entsteht durch die Ruptur eines Blutgefässes (z.B. Aneurysma/Hypertonie) mit Einblutung ins Gehirn.
CVI;Erklären Sie das Konzept der "Penumbra" bei einem akuten Hirninfarkt und deren klinische Bedeutung.;Die Penumbra ist das minderdurchblutete, aber noch lebende Gewebegebiet, das den eigentlichen Infarktkern (irreversibel tot) umgibt. Ziel jeder Akuttherapie (Thrombolyse, Blutdruckmanagement) ist die Rettung der Penumbra vor dem endgültigen Absterben.
CVI;Warum wird bei einem akuten ischämischen CVI in der Frühphase oft eine sogenannte "permissive Hypertonie" (leicht erhöhter Blutdruck) toleriert?;Ein zu schnelles Senken des Blutdrucks würde den Perfusionsdruck im Gehirn verringern. Ein leicht erhöhter Blutdruck stellt sicher, dass die Penumbra durch Kollateralgefässe weiterhin ausreichend durchblutet wird.
CVI;Was ist das FAST-Schema und wofür wird es angewendet?;Ein Screening-Tool zur schnellen Erkennung eines Stroke: F (Face - hängender Mundwinkel), A (Arms - Armhalteschwäche), S (Speech - Sprachstörungen), T (Time - sofortige Alarmierung, da das Zeitfenster für Thrombolyse sehr eng ist).
CVI;Was ist das Kernziel des Bobath-Konzepts in der Rehabilitation von Patienten mit Hemiplegie?;Es zielt darauf ab, abnorme Haltungs- und Bewegungsmuster (Spastiken) zu hemmen und physiologische Bewegungsabläufe durch ständige Fazilitation (Bahnen) neu zu erlernen (Neuroplastizität), oft unter Einbezug der betroffenen (plegischen) Seite.
CVI;Wie unterscheidet sich eine motorische Aphasie (Broca) von einer sensorischen Aphasie (Wernicke)?;Broca-Aphasie: Sprachverständnis ist oft intakt, aber die Sprachproduktion ist massiv gestört (Telegrammstil, Wortfindungsstörungen). Wernicke-Aphasie: Sprachproduktion ist flüssig (teils überschiessend, "Wortsalat"), aber das Sprachverständnis ist stark beeinträchtigt.
CVI;Was ist ein Neglect-Syndrom und wie gehen Sie pflegerisch (im Rahmen des Bobath-Konzepts) damit um?;Es ist eine Aufmerksamkeitsstörung, bei der die betroffene Körper-/Raumhälfte nicht mehr wahrgenommen wird (trotz intakter Augen). Pflegerisch wird der Raum so gestaltet, dass Reize (Ansprache, Essen, TV) von der betroffenen Seite kommen, um Aufmerksamkeit zu erzwingen.
CVI;Warum besteht bei CVI-Patienten ein hohes Aspirationsrisiko und welche pflegerischen Präventivmassnahmen ergreifen Sie?;Durch Paresen der Schluckmuskulatur (Dysphagie) ist der Schluckakt gestört. Prävention: aufrechte Sitzposition (90 Grad) beim Essen, Kostanpassung (püriert, Flüssigkeiten eindicken), nach dem Essen 30 Min. sitzen bleiben, sorgfältige Mundpflege.
CVI;Was ist eine TIA (Transitorische Ischämische Attacke) und warum ist sie ein medizinischer Notfall?;Eine TIA ist eine vorübergehende neurologische Ausfallerscheinung durch eine kurzzeitige Ischämie, die sich innert 24 Stunden (meist Minuten) vollständig zurückbildet. Sie ist ein Warnschuss mit massiv erhöhtem Risiko für einen definitiven CVI in den folgenden Tagen.
CVI;Welche Komplikationen drohen an der plegischen Schulter (Schulter-Hand-Syndrom) und wie können Sie diese pflegerisch vermeiden?;Durch den Verlust des Muskeltonus kann der Humeruskopf aus der Gelenkpfanne rutschen (Subluxation), was extrem schmerzhaft ist. Vermeidung: Die betroffene Schulter/Arm muss beim Lagern und Mobilisieren immer physiologisch unterlagert und geführt werden (niemals am plegischen Arm ziehen!).
Delir;Wie unterscheidet sich ein Delir von einer Demenz primär in Bezug auf Beginn und Verlauf?;Das Delir beginnt akut (innerhalb von Stunden bis Tagen) und hat einen fluktuierenden Verlauf (oft abends/nachts schlimmer), ist potenziell reversibel und geht mit einer Bewusstseinsstörung einher. Demenz beginnt schleichend, ist chronisch-progredient und das Bewusstsein ist anfangs klar.
Delir;Welche pathophysiologische Neurotransmitter-Hypothese steht bei der Entstehung eines Delirs im Zentrum?;Man geht von einem relativen Mangel an Acetylcholin (wichtig für Aufmerksamkeit und Gedächtnis) und einem relativen Überschuss an Dopamin aus. Dies erklärt, warum anticholinerge Medikamente ein Delir auslösen können.
Delir;Erklären Sie den Unterschied zwischen prädisponierenden und auslösenden (präzipitierenden) Faktoren beim Delir.;Prädisponierende Faktoren machen den Patienten vulnerabel (z.B. hohes Alter, vorbestehende Demenz, Multimorbidität). Auslösende Faktoren sind der akute Trigger (z.B. Harnwegsinfekt, Operation, Dehydratation, Schmerz). Je vulnerabler der Pat., desto geringer muss der Trigger sein.
Delir;Warum ist das hypoaktive Delir pflegerisch besonders gefährlich und wird oft übersehen?;Die Patienten sind apathisch, somnolent und still. Es wird fälschlicherweise oft als "guter, ruhiger Patient", als Depression oder Fatigue interpretiert. Dadurch verzögert sich die Ursachensuche, was die Mortalität massiv erhöht.
Delir;Welche Rolle spielen sensorische Deprivation und Reizüberflutung bei der Delirentstehung?;Fehlende sensorische Reize (fehlende Brille/Hörgerät) verhindern die Orientierung in der Realität und fördern Halluzinationen. Reizüberflutung (Lärm, ständige Interventionen auf IPS) stört den Schlaf-Wach-Rhythmus und überlastet das Gehirn.
Delir;Was messen die Assessment-Instrumente DOS (Delirium Observation Screening Scale) und CAM (Confusion Assessment Method)?;Die DOS misst Verhaltensbeobachtungen durch die Pflege über Schichten hinweg (Screening). Die CAM ist ein diagnostisches Instrument, das spezifisch nach den Hauptkriterien (akuter Beginn, Inaufmerksamkeit, desorganisiertes Denken, Bewusstseinsveränderung) sucht.
Delir;Nennen Sie drei nicht-medikamentöse pflegerische Interventionen zur Delirprävention / -behandlung.;Förderung der Orientierung (Uhr, Kalender, Kommunikation), Sicherstellung von Seh-/Hörhilfen, Frühmobilisation (Aktivierung), strikte Einhaltung des Tag-Nacht-Rhythmus (Lichtmanagement, Schlafhygiene).
Delir;Warum ist die Gabe von Benzodiazepinen bei deliranten älteren Menschen (ohne Alkoholentzugsdelir) kontraindiziert?;Benzodiazepine können eine paradoxe Reaktion auslösen (Verstärkung der Agitation), verschlechtern die Kognition weiter und erhöhen das Sturz- sowie Aspirationsrisiko massiv. Sie triggern das Delir oft zusätzlich.
Delir;Wie gehen Sie kommunikativ mit einem hyperaktiven, stark halluzinierenden und ängstlichen Delir-Patienten um?;Wenn strikte Reorientierung die Angst verstärkt, nutzt man validierende Elemente: Emotionen anerkennen ("Ich sehe, Sie haben Angst"), Sicherheit vermitteln, einfache und kurze Sätze verwenden, nicht mit dem Patienten über seine Halluzinationen streiten.
Delir;Welche körperlichen (somatischen) Ursachen müssen bei einem neu aufgetretenen Delir sofort ärztlich ausgeschlossen werden (Prinzip "I WATCH DEATH" oder "DELIRIUM")?;Infektionen (Pneumonie, HWI), Hypoxie, Dehydratation/Elektrolytentgleisung, akute Schmerzen, Harnverhalt/Obstipation sowie unerwünschte Arzneimittelwirkungen (Polypharmazie).
Diabetes / Pankreas;Wie unterscheiden sich Typ-1- und Typ-2-Diabetes pathophysiologisch grundsätzlich?;Typ 1 ist eine Autoimmunerkrankung mit Zerstörung der B-Zellen (absoluter Insulinmangel). Typ 2 beginnt mit einer Insulinresistenz der Körperzellen (Schlüssel-Schloss-Prinzip funktioniert nicht), was zunächst zu Hyperinsulinämie und später zur Erschöpfung des Pankreas (relativer Mangel) führt.
Diabetes / Pankreas;Erklären Sie den Unterschied zwischen der endokrinen und exokrinen Funktion des Pankreas.;Endokrin (nach innen ins Blut): Regulation des Blutzuckers durch Hormone der Langerhans-Inseln (Insulin, Glukagon). Exokrin (nach aussen in den Zwölffingerdarm): Produktion von Verdauungsenzymen (Amylase, Lipase, Proteasen) zur Aufspaltung von Nahrung.
Diabetes / Pankreas;Wie unterscheiden sich sympathoadrenerge von neuroglykopenischen Symptomen bei einer Hypoglykämie?;Sympathoadrenerg (Adrenalinausschüttung als Warnsignal): Schwitzen, Tremor, Tachykardie, Blässe, Heisshunger. Neuroglykopenisch (Glukosemangel im ZNS): Verwirrtheit, Sprachstörungen, Apathie, Krampfanfälle, Koma.
Diabetes / Pankreas;Warum ist die diabetische Ketoazidose (DKA) typisch für Typ 1 und das hyperosmolare Koma typisch für Typ 2?;Bei Typ 1 fehlt Insulin komplett. Der Körper verbrennt als Ersatz massiv Fett, wobei saure Ketonkörper entstehen (Azidose). Bei Typ 2 ist oft noch eine minimale Restsekretion von Insulin vorhanden, die eine Ketoazidose verhindert, aber der BZ steigt extrem an, was zu massiver Dehydratation (hyperosmolar) führt.
Diabetes / Pankreas;Erklären Sie die Pathogenese des diabetischen Fusssyndroms (Kombination aus drei Faktoren).;Es resultiert aus der diabetischen Polyneuropathie (Schmerz- und Druckempfinden fehlen), der Makro- und Mikroangiopathie (verminderte Durchblutung und Wundheilung) und der erhöhten Infektanfälligkeit (Bakterien vermehren sich gut im süssen Blut/Gewebe).
Diabetes / Pankreas;Was misst der HbA1c-Wert und welche pflegerische Bedeutung hat er?;Er misst den Anteil des glykierten (verzuckerten) Hämoglobins und fungiert als "Blutzuckergedächtnis" der letzten 8-12 Wochen. Er zeigt, wie gut die langfristige BZ-Einstellung ist und ob die aktuelle Adhärenz/Therapie ausreicht.
Diabetes / Pankreas;Warum müssen Insulin-Injektionsstellen systematisch gewechselt werden und was passiert, wenn man dies nicht tut?;Um Lipodystrophien (Verdickungen oder Dellen im Unterhautfettgewebe) zu vermeiden. In diese veränderten Areale gespritztes Insulin wird unkalkulierbar (zu schnell oder gar nicht) resorbiert, was zu schweren BZ-Schwankungen führt.
Diabetes / Pankreas;Was ist der pathophysiologische Hauptprozess bei einer akuten Pankreatitis?;Es kommt zu einer verfrühten Aktivierung der Verdauungsenzyme (v.a. Trypsin) bereits innerhalb der Bauchspeicheldrüse statt erst im Duodenum. Das führt zur Autodigestion (Selbstverdauung) des Organs mit massiver systemischer Entzündungsreaktion (SIRS).
Diabetes / Pankreas;Welche drei pflegerischen Schwerpunkte stehen bei der konservativen Therapie der akuten Pankreatitis in den ersten 48 Stunden im Fokus?;1. Engmaschiges Volumenmanagement (massive Flüssigkeitsverluste ins Gewebe/Third Spacing), 2. Konsequente Analgesie (oft Opiate aufgrund stärkster Schmerzen), 3. Ernährungskonzept (früher strikte Karenz, heute oft früher, behutsamer oraler Kostaufbau, sofern schmerzfrei).
Diabetes / Pankreas;Warum entwickeln Patienten mit langjährigem Diabetes mellitus oft eine chronische Niereninsuffizienz (diabetische Nephropathie)?;Der chronisch hohe Blutzucker und der oft begleitende hohe Blutdruck schädigen die feinen Kapillaren in den Glomeruli (Mikroangiopathie). Die Filterfunktion geht kaputt, Proteine werden ausgeschieden (Mikroalbuminurie) und das Nierengewebe vernarbt.
Dysphagie;Welche der drei Schluckphasen (oral, pharyngeal, ösophageal) ist bei neurologischen Erkrankungen (wie CVI) am häufigsten gestört und warum ist dies kritisch?;Die pharyngeale Phase (Rachenphase). Da dieser Reflex unwillkürlich gesteuert wird, können neurologische Ausfälle dazu führen, dass die Epiglottis die Trachea nicht rechtzeitig verschliesst, was zu direkter Aspiration führt.
Dysphagie;Was versteht man unter einer "stillen Aspiration" und wie können Sie diese klinisch vermuten?;Nahrung/Flüssigkeit gelangt in die Luftröhre, ohne dass ein Hustenreflex (Schutzreflex) ausgelöst wird. Hinweise darauf sind ein Sättigungsabfall beim/nach dem Essen, eine gurgelnde ("feuchte") Stimme, rezidivierende unklare Fieberschübe oder Pneumonien.
Dysphagie;Welche Gefahr bergen "Mischkonsistenzen" (z.B. Minestrone, Birchermüesli) für Patienten mit Dysphagie?;Sie erfordern eine extrem hohe intraorale Kontrolle. Der Patient muss die festen Bestandteile kauen und im Mund behalten, während er gleichzeitig verhindern muss, dass die wässrigen Bestandteile vorzeitig unkontrolliert in den Rachen fliessen (Aspirationsgefahr).
Dysphagie;Was ist das "Chin-Tuck-Manöver" (Kinn zur Brust) und wie wirkt es pathophysiologisch schützend?;Beim Schlucken wird das Kinn aktiv zur Brust geneigt. Dadurch weitet sich der Raum der Valleculae (Ausbuchtungen vor der Epiglottis), die Nahrung wird dort kurz gesammelt, und der Eingang zur Luftröhre wird anatomisch verengt.
Dysphagie;Nennen Sie vier klinische Warnsignale, die beim Essen auf eine Dysphagie hindeuten.;Häufiges Räuspern oder Husten während/nach dem Essen, Austreten von Nahrung aus Nase oder Mund, ständiges "Taschenbilden" (Nahrungsreste in den Wangentaschen/Pooling) und eine gurgelnde Stimmqualität.
Dysphagie;Warum ist eine penible Mundpflege bei Dysphagie-Patienten eine der wichtigsten Pneumonieprophylaxen?;Auch Dysphagie-Patienten mit Magensonde (Nahrungskarenz) schlucken/aspirieren unbemerkt eigenen Speichel. Eine hohe bakterielle Keimlast im Mundraum (durch Zahnbelag/Borken) führt bei Speichelaspiration direkt zur schweren Aspirationspneumonie.
Dysphagie;Welche drei schwerwiegenden Folgekomplikationen bilden die sogenannte "Komplikationstrilogie" der Dysphagie?;1. Aspirationspneumonie (durch Eintritt von Nahrung/Flüssigkeit/Keimen in die Lunge), 2. Malnutrition (Mangelernährung durch reduzierte Nahrungsaufnahme aus Angst oder Erschöpfung), 3. Exsikkose (Dehydratation, da flüssige Konsistenzen oft am schlechtesten geschluckt werden können).
Dysphagie;Worauf müssen Sie bei der Medikamentenverabreichung bei Dysphagie zwingend achten (bzgl. Mörsern)?;Nicht jedes Medikament darf gemörsert und in Brei verabreicht werden (z.B. Retard-Kapseln verlieren ihre verzögerte Wirkung -> Toxizität; magensaftresistente Tabletten werden im Magen zerstört). Alternativ müssen Tropfen, Säfte oder Pflaster vom Arzt verordnet werden.
Dysphagie;Was ist der GUSS (Gugging Swallowing Screen) und wie ist er grob aufgebaut?;Es ist ein evidenzbasiertes Assessment zur Erfassung von Dysphagie und Aspirationsrisiko bei CVI-Patienten. Es testet zuerst den Leerschluck/Speichel, dann halbfeste (Brei), dann flüssige (Wasser) und zuletzt feste Konsistenzen. Bricht der Pat. bei einer Stufe ab, wird diese gestrichen.
Dysphagie;Welches Haltungsmanagement ist vor, während und nach dem Essen bei Dysphagie essenziell?;Der Patient muss aufrecht sitzen (90-Grad-Winkel, Kopf leicht nach vorne geneigt). Wichtig: Auch nach Beendigung der Mahlzeit muss der Patient für mindestens 30 Minuten aufrecht sitzen bleiben, um einen Reflux und eine nachträgliche Aspiration zu verhindern.
Dyspnoe;Warum ist Dyspnoe primär ein subjektives Symptom und wie wird es im Assessment erfasst?;Dyspnoe ist das subjektive Empfinden von Atemnot, das nicht zwingend mit objektiven Messwerten (wie SpO2 oder Atemfrequenz) korrelieren muss. Zur Erfassung nutzt man Skalen wie die modifizierte Borg-Skala (0-10) oder die Visuelle Analogskala (VAS).
Dyspnoe;Erklären Sie die Pathophysiologie der Orthopnoe und warum das Aufsitzen die Symptomatik lindert.;Orthopnoe ist stärkste Atemnot im Liegen, oft bei Linksherzinsuffizienz. Im Liegen erhöht sich der venöse Rückstrom zum rechten Herzen, das linke Herz kann das Volumen nicht wegpumpen, es staut sich in die Lunge (Lungenödem). Aufsitzen (Herzbett) senkt die Vorlast durch Blutversackung in den Beinen.
Dyspnoe;Wie unterscheiden sich die klinischen Zeichen einer kardial bedingten Dyspnoe von einer pulmonal bedingten Dyspnoe?;Kardial (z.B. Lungenödem): Orthopnoe, feuchte Rasselgeräusche, schaumiges Sputum, oft Nykturie. Pulmonal (z.B. Asthma/COPD): oft exspiratorischer Stridor (Giemen/Brummen), verlängertes Exspirium, zähes Sputum, Einsatz der Atemhilfsmuskulatur.
Dyspnoe;Wie wirkt der Kutschersitz biomechanisch atemerleichternd?;Durch das Aufstützen der Arme wird der Schultergürtel fixiert. Dadurch können die Hilfsmuskeln der Atmung (z.B. M. pectoralis major, M. sternocleidomastoideus) am Brustkorb ansetzen und den Thorax aktiv bei der Inspiration erweitern, was das Zwerchfell entlastet.
Dyspnoe;Was ist der "Teufelskreis der Atemnot" (Circulus vitiosus) und wie durchbrechen Sie diesen pflegerisch?;Dyspnoe löst Panik aus -> Sympathikusaktivierung -> Tachykardie/Tachypnoe -> erhöhter O2-Verbrauch und flache, ineffektive Atmung -> noch mehr Dyspnoe. Durchbrechen: Ruhe ausstrahlen, atemerleichternde Haltungen, Lippenbremse anleiten, Frischluftzufuhr, nicht von der Seite ansprechen.
Dyspnoe;Warum ist eine ausreichende Hydratation bei Patienten mit sekretbedingter Dyspnoe (z.B. Pneumonie, COPD) essenziell?;Das Bronchialsekret besteht zu einem grossen Teil aus Wasser. Bei Exsikkose wird das Sekret zäh und kann durch die Flimmerhärchen (Zilien) nicht mehr abtransportiert werden, was die Atemwege verlegt. Ausreichend Flüssigkeit hält das Sekret flüssig und abhustbar.
Dyspnoe;Wie unterscheiden sich Kussmaul-Atmung und Cheyne-Stokes-Atmung in Bezug auf Pathophysiologie und Rhythmus?;Kussmaul-Atmung ist eine abnorm vertiefte, regelmässige Atmung als Kompensationsversuch einer metabolischen Azidose (z.B. bei diabetischer Ketoazidose, um CO2 abzuatmen). Cheyne-Stokes-Atmung ist ein periodisches An- und Abschwellen der Atemtiefe mit Apnoepausen, typisch bei schwerer Herzinsuffizienz oder ZNS-Schäden.
Dyspnoe;Warum wird in der palliativen Pflege bei schwerer terminaler Dyspnoe Morphin verabreicht, obwohl es als atemdepressiv gilt?;Morphin dämpft das Atemzentrum im Hirnstamm, wodurch die Atemfrequenz und Atemarbeit sinken. Gleichzeitig nimmt es das subjektive Erstickungsgefühl (Angstlösung) und erweitert die pulmonalen Blutgefässe, was die Lunge entlastet. Der Patient atmet ruhiger und effektiver.
Dyspnoe;Welche Gefahr besteht bei der unkontrollierten O2-Gabe bei COPD-Patienten im Vergleich zu Patienten mit gesunder Lunge?;Gesunde atmen primär durch den CO2-Reiz (Hyperkapnie). Schwere COPD-Patienten sind an hohes CO2 gewöhnt, ihr Atemantrieb läuft oft über den O2-Mangel (Hypoxie-Drive). Gibt man zu viel O2, fällt dieser Reiz weg, die Atmung stoppt und eine lebensgefährliche CO2-Narkose droht.
Dyspnoe;Welche nicht-medikamentösen Interventionen der Basalen Stimulation können Sie bei schwerer Dyspnoe anwenden?;Die atemstimulierende Einreibung (ASE) zur Rhythmisierung der Atmung und Entspannung, Kaltluftreiz im Gesicht (z.B. Handventilator, stimuliert den N. trigeminus und suggeriert dem Hirn Frischluft) sowie die beruhigende, geführte Atmung (Mit-Atmen der Pflegeperson).
Endokrinologie;Erklären Sie das Prinzip des negativen Feedbacks (Rückkopplung) in der Hypothalamus-Hypophysen-Achse.;Der Hypothalamus schüttet Releasing-Hormone aus, die die Hypophyse anregen, glandotrope Hormone freizusetzen. Diese stimulieren die Zielorgane (z.B. Schilddrüse), Hormone ins Blut abzugeben. Ein hoher Hormonspiegel im Blut bremst (negatives Feedback) wiederum Hypothalamus und Hypophyse.
Endokrinologie;Wie unterscheiden sich die klinischen Leitsymptome einer Hyperthyreose von einer Hypothyreose?;Hyperthyreose (z.B. Morbus Basedow): Tachykardie, Gewichtsverlust trotz Heisshunger, Unruhe, Wärmeintoleranz, Diarrhoe, Schwitzen. Hypothyreose (z.B. Hashimoto): Bradykardie, Gewichtszunahme, Müdigkeit, Kälteintoleranz, Obstipation, trockene Haut.
Endokrinologie;Was ist eine thyreotoxische Krise und welche pflegerischen Überwachungsschwerpunkte setzen Sie dabei?;Es ist eine lebensbedrohliche Exazerbation einer Schilddrüsenüberfunktion mit massiver Tachykardie, hohem Fieber, Agitation bis hin zum Koma und Kreislaufversagen. Pflegefokus: strikte Vitalzeichenkontrolle (Herzrhythmus!), Fiebersenkung (kühle Waschungen), absolute Bettruhe und Abschirmung vor Reizen.
Endokrinologie;Welche Hormone werden in der Nebennierenrinde produziert und welche Hauptfunktion haben sie?;1. Glukokortikoide (Cortisol: Stresshormon, Blutzuckersteigerung, entzündungshemmend), 2. Mineralokortikoide (Aldosteron: Regulation von Natrium, Kalium und Blutdruck), 3. Androgene (Sexualhormone).
Endokrinologie;Erklären Sie die Symptomatik eines Cushing-Syndroms und unterscheiden Sie exogene von endogenen Ursachen.;Symptome: Stammfettsucht, Vollmondgesicht, Stiernacken, Osteoporose, Hypertonie, Striae rubrae. Exogen: iatrogen durch langfristige hochdosierte Kortison-Therapie. Endogen: Überproduktion von Cortisol durch Tumore in der Hypophyse oder Nebenniere.
Endokrinologie;Was ist eine Addison-Krise und warum ist sie ein absoluter Notfall?;Sie ist eine akute Unterfunktion der Nebennierenrinde (extremer Mangel an Cortisol und Aldosteron), oft ausgelöst durch Stress oder abruptes Absetzen von Steroiden. Es drohen schwerste Hypoglykämien, Hyponatriämie, Hyperkaliämie und ein therapierefraktärer hypovolämischer Schock.
Endokrinologie;Wie reguliert Aldosteron den Blutdruck und den Elektrolythaushalt im Rahmen des RAAS?;Aldosteron wirkt in der Niere (im distalen Tubulus). Es fördert die Rückresorption von Natrium und Wasser aus dem Primärharn ins Blut (Volumen steigt -> Blutdruck steigt) und fördert gleichzeitig die Ausscheidung von Kalium in den Urin.
Endokrinologie;Was ist das SIADH (Syndrom der inadäquaten ADH-Sekretion) und welche laborchemische Entgleisung steht im Vordergrund?;Es wird zu viel Antidiuretisches Hormon (ADH) produziert (oft paraneoplastisch bei Bronchial-Ca). Die Niere hält extrem viel freies Wasser im Körper zurück. Es entsteht eine Verdünnungs-Hyponatriämie, die zu Hirnödemen und Krampfanfällen führen kann.
Endokrinologie;Wie unterscheiden sich Diabetes mellitus und Diabetes insipidus grundlegend?;Diabetes mellitus ist eine Störung des Blutzuckerstoffwechsels (Insulinproblem). Diabetes insipidus ist ein Hormonmangel des ADH (Antidiuretisches Hormon), bei dem die Nieren den Urin nicht konzentrieren können. Folge sind extreme Polyurie (bis zu 20L/Tag) und Polydipsie.
Endokrinologie;Warum haben Frauen postmenopausal ein deutlich erhöhtes Risiko für Osteoporose?;Mit der Menopause sinkt die Produktion von Östrogen massiv. Östrogen hemmt normalerweise die Osteoklasten (knochenabbauende Zellen). Fällt dieser Schutz weg, überwiegt der Knochenabbau, die Knochendichte sinkt und das Frakturrisiko steigt.
Familienzentrierte Pflege;Was ist der zentrale systemtheoretische Grundgedanke der familienzentrierten Pflege?;Eine Familie wird als offenes, interagierendes System betrachtet. Die Erkrankung eines Familienmitglieds betrifft immer das gesamte System, und umgekehrt beeinflusst die familiäre Dynamik und Funktionalität massgeblich den Krankheitsverlauf und die Heilung des Patienten.
Familienzentrierte Pflege;In welche drei Hauptkategorien unterteilt sich das Calgary Familien-Assessment-Modell (CFAM)?;1. Strukturelles Assessment (Wer gehört zur Familie? Genogramm, Ökogramm, Kontext), 2. Entwicklungsbezogenes Assessment (In welcher Lebensphase steht die Familie?), 3. Funktionelles Assessment (Wie interagieren sie im Alltag? Kommunikation, Rollen).
Familienzentrierte Pflege;Was ist ein Genogramm und welchen pflegerischen Nutzen hat es im Assessment?;Es ist eine grafische Darstellung des Stammbaums (meist über 3 Generationen), die biologische und rechtliche familiäre Beziehungen sowie Krankheitsgeschichten visualisiert. Es hilft Pflegenden, rasch familiäre Muster, genetische Risiken und wichtige Bezugspersonen zu erkennen.
Familienzentrierte Pflege;Was ist ein Ökogramm (Ecomap) und was visualisiert es im Gegensatz zum Genogramm?;Während das Genogramm die internen Familienstrukturen zeigt, visualisiert das Ökogramm die Kontakte und Beziehungen der Familie nach aussen zu Systemen ihrer Umwelt (z.B. Arbeit, Schule, Freunde, Gesundheitssystem, Religion) und zeigt auf, ob diese Beziehungen stützend oder belastend sind.
Familienzentrierte Pflege;Erklären Sie die Methode des "Zirkulären Fragens" in Familieninterviews anhand eines Beispiels.;Anstatt direkt nach den Gefühlen einer Person zu fragen, fragt man eine Person nach ihrer Beobachtung der Beziehung zwischen zwei anderen. Beispiel: "Frau Müller, was denken Sie, wie Ihr Ehemann sich fühlt, wenn er sieht, dass Ihr Sohn Angst vor der Operation hat?" Es deckt Interaktionsmuster auf.
Familienzentrierte Pflege;Welche Warnsignale deuten auf eine Überlastung der pflegenden Angehörigen (Caregiver Burden) hin?;Körperliche Erschöpfung, eigener sozialer Rückzug, zunehmende eigene gesundheitliche Probleme (Schlaflosigkeit, Infektanfälligkeit), depressive Verstimmungen, Gereiztheit gegenüber dem Pflegebedürftigen oder verbale Äusserungen von Hoffnungslosigkeit.
Familienzentrierte Pflege;Das Calgary Family Intervention Model (CFIM) setzt in drei Domänen an. Welche sind dies und was ist das Ziel?;1. Kognitive Domäne (Wissen vermitteln, andere Sichtweisen aufzeigen), 2. Affektive Domäne (Emotionen lindern, emotionales Coping unterstützen), 3. Verhaltensbezogene Domäne (Neue Fähigkeiten trainieren, z.B. Injektionstechniken lernen).
Familienzentrierte Pflege;Warum ist es pflegerisch wichtig, die "Illness Beliefs" (Krankheitsüberzeugungen) einer Familie zu erfragen?;Familien haben oft tief verwurzelte, eigene Erklärungsmodelle für eine Krankheit (z.B. als Bestrafung, Schicksal oder durch eigenes Fehlverhalten). Diese Überzeugungen beeinflussen massiv die Adhärenz, das Coping und die familiäre Kommunikation.
Familienzentrierte Pflege;Was passiert systemisch, wenn sich familiäre "Rollen" durch eine chronische Krankheit starr verschieben (z.B. Parentifizierung)?;Wenn z.B. ein Kind die Erwachsenenrolle/Pflegerolle für ein krankes Elternteil übernimmt (Parentifizierung) oder ein gesunder Partner nur noch als Pflegekraft fungiert, verliert das System seine Flexibilität. Dies führt oft zu chronischen Konflikten, Überforderung und einem Verlust der ursprünglichen Paarbeziehung.
Familienzentrierte Pflege;Welche Phasen durchläuft eine Familie im "Familienlebenszyklus" (Developmental Assessment) und warum ist das für die Pflege relevant?;Typische Phasen sind z.B. Paarbildung, Familien mit kleinen Kindern, Familien mit Jugendlichen, "Empty Nest" und das Alter. Krankheiten wirken in Übergangsphasen (z.B. wenn Kinder gerade ausziehen wollen, aber plötzlich pflegen müssen) als extremer Stressor, was Pflegende bei der Entlassungsplanung berücksichtigen müssen.
Flüssigkeitsverlust;Unterscheiden Sie zwischen isotoner, hypertoner und hypotoner Dehydration hinsichtlich der Elektrolytkonzentration.;Isoton: Wasser- und Natriumverlust sind ausgeglichen (z.B. Erbrechen). Hyperton: Wasserverlust überwiegt (z.B. Schwitzen, Diabetes insipidus), Na+ im Blut steigt. Hypoton: Salzverlust überwiegt (z.B. massives Trinken von destilliertem Wasser, Diuretikamissbrauch), Na+ im Blut sinkt.
Flüssigkeitsverlust;Warum ist der Hautturgor allein kein verlässliches Zeichen für Flüssigkeitsverlust bei älteren Menschen?;Durch den physiologischen Alterungsprozess verliert die Haut an Elastizität (weniger Kollagen/subkutanes Fett). Ein stehende Hautfalte kann daher auch bei ausgeglichenem Flüssigkeitshaushalt vorkommen. Verlässlicher sind die Inspektion der Schleimhäute (trocken?) und die Zungengrundfeuchtigkeit.
Flüssigkeitsverlust;Erklären Sie den Begriff "Third Spacing" (Drittraum-Verlust) im Kontext von Ödemen und Hypovolämie.;Flüssigkeit tritt aus den Gefässen (intravasal) in den interstitiellen Raum (z.B. Aszites, Pleuraerguss) aus. Obwohl der Körper insgesamt "zu viel" Wasser hat, herrscht in den Gefässen ein Mangel (Hypovolämie), was zu Blutdruckabfall und Organversagen führen kann.
Flüssigkeitsverlust;Wie reagiert die Niere im Rahmen des RAAS auf einen massiven Flüssigkeitsverlust?;Durch den Abfall des Perfusionsdrucks schüttet die Niere Renin aus. Dies führt über Angiotensin II zur Vasokonstriktion und via Aldosteron zur Rückresorption von Natrium und Wasser. Die Urinausscheidung sinkt massiv (Oligurie/Anurie), um Volumen zu sparen.
Flüssigkeitsverlust;Welche Gefahr droht dem Herz-Kreislauf-System bei einem schnellen Verlust von mehr als 20 % des zirkulierenden Blutvolumens?;Es droht ein hypovolämischer Schock. Durch das fehlende Volumen sinkt der venöse Rückstrom, das Schlagvolumen bricht ein und die Gewebeperfusion (Sauerstoffversorgung) der Organe kann nicht mehr aufrechterhalten werden.
Flüssigkeitsverlust;Warum führt massiver Flüssigkeitsverlust (z.B. durch Diarrhoe) oft zu einer Hypokaliämie und welche Symptome treten auf?;Mit dem Wasser gehen Elektrolyte verloren. Kaliummangel führt zu Muskelschwäche, Obstipation (Darmträgheit) und vor allem zu lebensgefährlichen Herzrhythmusstörungen (Langsamer Puls, Extrasystolen).
Flüssigkeitsverlust;Welche Rolle spielt das Albumin beim Flüssigkeitsaustausch zwischen Kapillare und Interstitium?;Albumin erzeugt den kolloidosmotischen Druck. Es wirkt wie ein "Schwamm", der das Wasser innerhalb der Blutgefässe hält. Bei Albuminmangel (z.B. Leberzirrhose, Mangelernährung) entweicht Wasser ins Gewebe und führt zu Ödemen.
Flüssigkeitsverlust;Was ist eine Exsikkose und welche neurologischen Symptome sind bei älteren Patienten typisch?;Exsikkose ist das fortgeschrittene Stadium der Dehydration (Austrocknung). Typische Symptome sind Verwirrtheit (Delir), extreme Schläfrigkeit (Somnolenz), Schwindel und eine deutlich erschwerte Artikulation.
Flüssigkeitsverlust;Welche pflegerischen Parameter müssen bei einer Infusionstherapie zur Rehydrierung engmaschig überwacht werden?;Einfuhr-Ausfuhr-Bilanzierung, tägliche Gewichtskontrolle, Blutdruck/Puls (Orthostase-Check), Ödemkontrolle und die Beobachtung auf Zeichen einer Überwässerung (z.B. Dyspnoe durch Lungenödem).
Flüssigkeitsverlust;Warum ist das Durstgefühl bei Patienten mit hypertoner Dehydration ausgeprägter als bei isotoner Dehydration?;Bei hypertoner Dehydration steigt die Osmolarität (Salzkonzentration) im Blut. Dies reizt die Osmorezeptoren im Hypothalamus direkt, was ein starkes Durstsignal auslöst, um die Konzentration durch Trinken wieder zu verdünnen.
Genetik;Was ist der Unterschied zwischen Genotyp und Phänotyp?;Der Genotyp ist die gesamte genetische Ausstattung (das Erbbild) eines Individuums. Der Phänotyp ist das tatsächliche Erscheinungsbild (Merkmale wie Augenfarbe, Krankheiten), das durch das Zusammenspiel von Genen und Umwelteinflüssen entsteht.
Genetik;Erklären Sie den autosomal-dominanten Erbgang (z.B. bei Chorea Huntington).;Das defekte Gen liegt auf einem Autosom (Chromosom 1-22). Es reicht eine Kopie des veränderten Gens (von einem Elternteil), damit die Krankheit ausbricht. Die Wahrscheinlichkeit der Weitergabe an Nachkommen liegt bei 50 %.
Genetik;Was bedeutet "autosomal-rezessiv" für die Nachkommen, wenn beide Eltern Anlageträger (heterozygot) sind?;Beide Eltern sind gesund, tragen aber ein krankes Gen. Für die Kinder besteht eine 25 % Chance zu erkranken (wenn beide kranken Gene vererbt werden), eine 50 % Chance selbst Träger zu sein und eine 25 % Chance komplett gesund zu sein.
Genetik;Warum sind Männer häufiger von X-chromosomal-rezessiven Erbkrankheiten (z.B. Hämophilie) betroffen als Frauen?;Männer besitzen nur ein X-Chromosom (XY). Wenn dieses den Defekt trägt, bricht die Krankheit aus. Frauen (XX) können den Defekt meist durch ihr zweites, gesundes X-Chromosom kompensieren und sind dann nur Überträgerinnen (Konduktorinnen).
Genetik;Was versteht man unter einer "Trisomie" und wie entsteht sie (am Beispiel Trisomie 21)?;Bei der Zellteilung (Meiose) kommt es zu einer Fehlverteilung der Chromosomen (Non-Disjunction). Ein Chromosomenpaar trennt sich nicht, sodass in der befruchteten Eizelle ein Chromosom (hier Nr. 21) dreifach statt zweifach vorhanden ist.
Genetik;Welche Rolle spielt die Genetik bei der medikamentösen Therapie (Pharmakogenetik)?;Individuelle genetische Unterschiede führen dazu, dass Enzyme (z.B. in der Leber) Medikamente unterschiedlich schnell abbauen. "Ultra-rapid metabolizers" benötigen höhere Dosen, während "Poor metabolizers" schon bei Standarddosen Vergiftungserscheinungen zeigen können.
Genetik;Was ist das Ziel einer genetischen Beratung und welche Rolle hat die Pflegefachperson dabei?;Ziel ist die Information über Risiken, Krankheitsverläufe und Vererbungswahrscheinlichkeiten, um Ratsuchenden eine autonome Entscheidung zu ermöglichen. Pflegende unterstützen bei der Bewältigung der Diagnose, erklären Fachbegriffe und bieten psychosoziale Begleitung.
Genetik;Erklären Sie den Unterschied zwischen Keimbahnmutationen und somatischen Mutationen.;Keimbahnmutationen liegen in den Geschlechtszellen vor und werden an die Nachkommen vererbt. Somatische Mutationen entstehen in Körperzellen (z.B. durch UV-Strahlung) im Laufe des Lebens, sind nicht vererbbar, können aber zu Krebs führen.
Genetik;Was ist Epigenetik und wie beeinflusst sie die Genaktivität?;Epigenetik untersucht Änderungen der Genfunktion, die nicht auf einer Änderung der DNA-Sequenz beruhen, sondern auf "Schaltern" (z.B. Methylierung). Diese Schalter werden durch Umwelteinflüsse (Ernährung, Stress, Trauma) beeinflusst und können teils vererbt werden.
Genetik;Welches ethische Dilemma ergibt sich aus der pränatalen Gendiagnostik?;Es entsteht ein Konflikt zwischen dem Recht auf Wissen/Vorbereitung und dem Recht auf Nichtwissen, sowie die Gefahr der Selektion ("Designerbaby"-Debatte) und der Diskriminierung von Menschen mit Behinderungen.
Gesundheitsfördernde Pflegediagnosen;Wie unterscheidet sich eine gesundheitsfördernde Pflegediagnose (Health Promotion) grundsätzlich von einer problemfokussierten Pflegediagnose?;Problemfokussierte Diagnosen beschreiben eine bestehende negative Reaktion auf einen Gesundheitszustand. Gesundheitsfördernde Diagnosen konzentrieren sich auf das Potenzial und die Motivation des Patienten, sein Wohlbefinden und seine Gesundheit aktiv zu verbessern (Ressourcenorientierung).
Gesundheitsfördernde Pflegediagnosen;Wie ist die Struktur einer gesundheitsfördernden Pflegediagnose nach NANDA-I aufgebaut?;Sie besteht nur aus dem Diagnosetitel (Label) und den bestimmenden Merkmalen (Symptomen/Anzeichen der Bereitschaft). Da es sich um ein Wachstumspotenzial handelt, gibt es keine "beeinflussenden Faktoren" (Ursachen) wie bei Problemdiagnosen.
Gesundheitsfördernde Pflegediagnosen;Nennen Sie ein Beispiel für eine gesundheitsfördernde Pflegediagnose und deren Formulierung.;"Bereitschaft für eine verbesserte Selbstversorgung". Dies zeigt an, dass der Patient motiviert ist, seine Fähigkeiten in der Körperpflege oder Ernährung weiter zu optimieren, auch wenn derzeit kein Defizit vorliegt.
Gesundheitsfördernde Pflegediagnosen;Warum ist die Identifikation von Ressourcen für gesundheitsfördernde Diagnosen so wichtig?;Ressourcen (Kraft, Wissen, soziales Umfeld) sind der Motor für Gesundheitsförderung. Ohne die Identifikation dessen, was der Patient bereits gut kann oder was ihn motiviert, kann kein realistisches Ziel zur Steigerung des Wohlbefindens formuliert werden.
Gesundheitsfördernde Pflegediagnosen;In welchem Zusammenhang stehen gesundheitsfördernde Pflegediagnosen zum Konzept der Salutogenese (Antonovsky)?;Salutogenese fragt "Was hält den Menschen gesund?". Gesundheitsfördernde Diagnosen setzen genau hier an, indem sie die Widerstandsressourcen stärken und das Kohärenzgefühl fördern, anstatt nur nach Defiziten zu suchen.
Gesundheitsfördernde Pflegediagnosen;Wie leiten Sie den diagnostischen Prozess für eine gesundheitsfördernde Diagnose ein?;Durch aktives Zuhören und gezieltes Assessment von Äusserungen, die einen Wunsch nach Veränderung oder Lernen signalisieren (z.B. "Ich möchte wissen, wie ich mich fitter fühlen kann").
Gesundheitsfördernde Pflegediagnosen;Was ist das Ziel der Pflegeinterventionen bei einer gesundheitsfördernden Pflegediagnose?;Das Ziel ist die Stärkung der Eigenkompetenz (Empowerment), die Vermittlung von Wissen (Edukation) und die Unterstützung bei der Umsetzung gesundheitsförderlicher Verhaltensweisen im Alltag des Patienten.
Gesundheitsfördernde Pflegediagnosen;Warum werden gesundheitsfördernde Pflegediagnosen in der Akutpflege (Spital) oft vernachlässigt?;Der Fokus liegt im Spital meist auf der akuten Krisenintervention und Krankheitsbekämpfung (Pathogenese). Gesundheitsförderung erfordert Zeit für Edukation und Beratung, die im straffen Zeitplan oft zugunsten von Verrichtungen untergeht.
Gesundheitsfördernde Pflegediagnosen;Welche Rolle spielt die "Selbstwirksamkeitserwartung" bei der Umsetzung dieser Diagnosen?;Nur wenn der Patient daran glaubt, dass er die Veränderung aus eigener Kraft schaffen kann (Selbstwirksamkeit), wird er motiviert bleiben. Pflegende müssen durch Lob und kleine Erfolgsschritte dieses Vertrauen stärken.
Gesundheitsfördernde Pflegediagnosen;Was ist der Unterschied zwischen "Wellness" und "Health Promotion" in der Pflegeplanung?;Wellness ist ein subjektiver Zustand des Wohlbefindens. Health Promotion ist der aktive Prozess (die Handlung), der durch Pflegediagnosen strukturiert wird, um dieses Wohlbefinden und die Kontrolle über die eigene Gesundheit nachhaltig zu steigern.
Gesundheitliche Vorausplanung;Was ist der Hauptunterschied zwischen der klassischen Patientenverfügung und dem Konzept "Advance Care Planning" (ACP)?;Eine Patientenverfügung ist oft ein isoliertes, einmalig erstelltes Dokument. ACP hingegen ist ein begleiteter, fortlaufender Kommunikationsprozess mit geschulten Fachpersonen, um Werte, Ziele und Präferenzen für zukünftige medizinische Situationen tiefgreifend zu klären und zu dokumentieren.
Gesundheitliche Vorausplanung;Welche juristische und ethische Voraussetzung muss eine Person erfüllen, um eine gesundheitliche Vorausplanung gültig zu erstellen?;Die Person muss zum Zeitpunkt der Erstellung "urteilsfähig" sein. Das heisst, sie muss in der Lage sein, Informationen zu verstehen, die Konsequenzen von Entscheidungen abzuwägen und ihren eigenen Willen verständlich zu kommunizieren.
Gesundheitliche Vorausplanung;Welche Aufgabe hat eine in der Vorausplanung festgelegte vertretungsberechtigte Person?;Sie muss in Situationen, in denen der Patient nicht mehr urteilsfähig ist, medizinische Entscheidungen treffen. Diese Entscheidungen dürfen nicht auf ihren eigenen Wünschen basieren, sondern müssen strikt dem "mutmasslichen Willen" und den zuvor geäusserten Werten des Patienten entsprechen.
Gesundheitliche Vorausplanung;Warum ist die "Werteanamnese" ein zentraler Bestandteil des ACP-Prozesses?;Da medizinische Situationen (z.B. ein schwerer CVI) nie zu 100% vorhersagbar sind, reicht ein einfaches "Ja/Nein" zu Massnahmen oft nicht. Die Werteanamnese erfasst, was für den Patienten Lebensqualität ausmacht (z.B. Selbstständigkeit, Schmerzfreiheit), um Ärzten in Grauzonen eine Orientierung zu geben.
Gesundheitliche Vorausplanung;Wie ist das Vorgehen in einer akuten, unvorhergesehenen Notfallsituation, wenn unklar ist, ob eine Patientenverfügung existiert?;In akuten Notfällen, in denen keine Zeit für die Suche oder Interpretation von Dokumenten bleibt, gilt der Grundsatz "in dubio pro vita" (im Zweifel für das Leben). Es werden primär lebenserhaltende Massnahmen eingeleitet, bis die Sachlage oder der Patientenwille eindeutig geklärt ist.
Gesundheitliche Vorausplanung;Was ist ein "Notfallplan" (z.B. Palliative Notfallplanung) und wie unterscheidet er sich von der normalen Patientenverfügung?;Ein Notfallplan ist eine ärztliche Anordnung (direkt handlungsweisend für Rettungsdienste), die spezifisch für eine unmittelbar bevorstehende Krisensituation (z.B. akute Atemnot bei terminaler COPD) erstellt wird. Er regelt sofortige Massnahmen zur Symptomlinderung anstelle von Reanimation/Klinikeinweisung.
Gesundheitliche Vorausplanung;Welche Rolle nimmt die Pflegefachperson HF im Prozess der gesundheitlichen Vorausplanung ein?;Sie agiert als Initiatorin (erkennen des richtigen Zeitpunkts), als "Advocate" (Anwältin) des Patienten, klärt über pflegerische Konsequenzen auf und stellt sicher, dass die Dokumente im interprofessionellen Team bekannt und zugänglich sind.
Gesundheitliche Vorausplanung;Kann eine einmal erstellte gesundheitliche Vorausplanung widerrufen werden?;Ja, sie kann jederzeit mündlich, schriftlich oder durch eindeutiges nonverbales Verhalten widerrufen oder geändert werden, solange der Patient zu diesem Zeitpunkt bezüglich dieser Frage urteilsfähig ist.
Gesundheitliche Vorausplanung;Was versteht man im Rahmen von Behandlungsentscheidungen unter "Shared Decision Making" (Partizipative Entscheidungsfindung)?;Es ist ein gleichberechtigter Prozess: Der Arzt bringt die medizinische Evidenz und Prognose ein, der Patient (oder sein Vertreter) bringt seine persönlichen Werte und Lebensziele ein. Gemeinsam wird die am besten passende Behandlungsoption gewählt.
Gesundheitliche Vorausplanung;Warum ist die gesundheitliche Vorausplanung besonders bei der Diagnose einer Demenz im Frühstadium von enormer Wichtigkeit?;Weil das Zeitfenster der Urteilsfähigkeit begrenzt ist. Die Planung muss stattfinden, solange der Patient kognitiv noch in der Lage ist, seine Wünsche für das Spätstadium der Erkrankung (z.B. bezüglich Sondenernährung bei Dysphagie) selbstbestimmt zu äussern.
Haut / Haut Erkrankungen;Erklären Sie die Pathophysiologie der Psoriasis (Schuppenflechte).;Es handelt sich um eine autoimmunvermittelte, chronisch-entzündliche Erkrankung. Es kommt zu einer massiven Hyperproliferation der Keratinozyten (Zellumsatz in der Epidermis dauert nur 3-4 Tage statt 28 Tage), was zur Bildung der typischen silbrig-weissen Schuppen (Plaques) führt.
Haut / Haut Erkrankungen;Wie unterscheiden sich Primär- und Sekundäreffloreszenzen?;Primäreffloreszenzen (z.B. Makula, Papel, Vesikula) entstehen direkt durch die Erkrankung auf der gesunden Haut. Sekundäreffloreszenzen (z.B. Kruste, Ulkus, Narbe, Schuppe) entwickeln sich erst im späteren Verlauf aus den Primäreffloreszenzen oder durch Manipulation (Kratzen).
Haut / Haut Erkrankungen;Was ist die ABCDE-Regel und wofür wird sie angewendet?;Sie dient der Früherkennung des malignen Melanoms (schwarzer Hautkrebs). A: Asymmetrie, B: Begrenzung (unscharf/unregelmässig), C: Color (Farbveränderungen/Mehrfarbigkeit), D: Durchmesser (> 6 mm), E: Erhabenheit/Entwicklung (Veränderung über Zeit).
