Haut / Haut Erkrankungen;Erklären Sie die Pathophysiologie von Herpes Zoster (Gürtelrose).;Nach einer durchgemachten Windpocken-Infektion (Varizella-Zoster-Virus) verbleiben Viren lebenslang latent in den Spinalganglien. Bei Immunschwäche reaktivieren sie sich, wandern entlang der sensiblen Nervenfasern zur Haut und lösen dort im entsprechenden Dermatom schmerzhafte Bläschen aus.
Haut / Haut Erkrankungen;Was ist ein Erysipel (Wundrose) und welches sind die klinischen Leitsymptome?;Eine akute bakterielle Infektion (meist Streptokokken) der Dermis und der Lymphspalten, oft durch kleine Eintrittspforten (Rhagaden, Tinea pedis). Symptome: Scharf begrenzte, flammenförmige Rötung, Überwärmung, Schwellung, Schmerzen, sowie oft hohes Fieber und Schüttelfrost.
Haut / Haut Erkrankungen;Warum haben ältere Menschen häufig einen "pruritus senilis" (Altersjuckreiz) und was ist die primäre pflegerische Massnahme?;Die Talg- und Schweissproduktion nimmt im Alter ab, die Haut verliert ihre Barrierefunktion und trocknet stark aus (Xerosis cutis). Die wichtigste Massnahme ist die konsequente Basispflege mit rückfettenden W/O-Emulsionen (Wasser-in-Öl) und der Verzicht auf austrocknende Seifen.
Haut / Haut Erkrankungen;Welche negativen Auswirkungen hat eine lokale Langzeittherapie mit Kortikosteroiden auf die Haut?;Es kommt zu einer Atrophie (Verdünnung) der Haut (Pergamenthaut), Striae (Dehnungsstreifen), Teleangiektasien (erweiterte kleine Gefässe), erhöhter Verletzlichkeit und einer massiv verzögerten Wundheilung.
Haut / Haut Erkrankungen;Wie unterscheiden sich die typischen Prädilektionsstellen (bevorzugte Körperregionen) von Neurodermitis und Psoriasis?;Neurodermitis (atopisches Ekzem) betrifft typischerweise die Beugeseiten der Gelenke (Kniekehlen, Ellenbeugen) sowie Hals und Gesicht. Psoriasis tritt typischerweise an den Streckseiten auf (Ellenbogen, Knie, Kreuzbein) und betrifft häufig auch die Nägel (Tüpfelnägel).
Haut / Haut Erkrankungen;Erklären Sie das pathophysiologische Prinzip der Dekubitusentstehung.;Druck (und/oder Scherkräfte) auf ein Gewebeareal, der den Kapillarschliessdruck (ca. 32 mmHg) übersteigt, führt zur Ischämie (Minderdurchblutung). Die anhaltende Hypoxie und der Stau von toxischen Stoffwechselprodukten (Azidose) führen schliesslich zur irreversiblen Gewebsnekrose.
Haut / Haut Erkrankungen;Was passiert bei einer allergischen Kontaktdermatitis auf zellulärer Ebene (Typ-IV-Allergie)?;Es ist eine zellvermittelte Spättyp-Reaktion. Das Allergen (z.B. Nickel) dringt in die Haut ein, wird von Langerhans-Zellen präsentiert und sensibilisiert T-Lymphozyten. Bei erneutem Kontakt schütten die T-Zellen Zytokine aus, was nach 24-72 Stunden zu einem stark juckenden, entzündlichen Ekzem führt.
Herausforderndes Verhalten;Warum spricht man in der modernen Pflege von "herausforderndem Verhalten" statt von "aggressivem oder störendem Verhalten"?;Der Begriff "aggressiv/störend" verurteilt den Patienten und schiebt ihm die Schuld zu. "Herausfordernd" signalisiert, dass das Verhalten für die Pflegenden eine professionelle Herausforderung darstellt, deren Ursache (ein unbefriedigtes Bedürfnis) verstanden und gelöst werden muss.
Herausforderndes Verhalten;Erklären Sie das NDB-Modell (Need-Driven Dementia-Compromised Behavior).;Das Modell besagt, dass herausforderndes Verhalten bei Demenz kein sinnloses Symptom ist, sondern ein Kommunikationsversuch. Es entsteht, wenn kognitiv beeinträchtigte Menschen ein unbefriedigtes physisches (z.B. Schmerz, Durst) oder psychisches Bedürfnis (Angst, Langeweile) nicht mehr verbal äussern können.
Herausforderndes Verhalten;Welche Rolle spielt "Schmerz" als Auslöser für herausforderndes Verhalten bei demenziell erkrankten Menschen?;Da sie Schmerz oft nicht mehr lokalisieren oder mitteilen können, äussert sich dieser in Agitation, Abwehr bei der Pflege, Rufen oder Aggression. Pflegerisch muss Schmerz bei Verhaltensänderungen systematisch (z.B. mit der PAINAD-Skala) ausgeschlossen werden.
Herausforderndes Verhalten;Was ist das "Sundowning-Syndrom" bei Demenz und welche Faktoren begünstigen es?;Es beschreibt eine Zunahme von Unruhe, Verwirrtheit und Weglauftendenz am späten Nachmittag oder frühen Abend. Begünstigt wird es durch den Verlust des zirkadianen Rhythmus, körperliche Erschöpfung am Tagesende und veränderte Lichtverhältnisse (Schattenbildung löst Angst aus).
Herausforderndes Verhalten;Erklären Sie den Ansatz der "Validation" (z.B. nach Naomi Feil) im Umgang mit herausforderndem Verhalten.;Validation bedeutet, die Emotionen und die subjektive Realität des Patienten als gültig anzuerkennen, anstatt ihn in die objektive Realität zurückzuholen. (Bsp: Wenn die Patientin ihre verstorbene Mutter sucht, fragt man: "Vermissen Sie Ihre Mutter sehr?", anstatt zu sagen: "Die ist schon lange tot.").
Herausforderndes Verhalten;Wie können Über- oder Unterstimulation im Milieu herausforderndes Verhalten triggern?;Überstimulation (Lärm, grelles Licht, zu viele Personen) überfordert das kranke Gehirn und führt zu Stress/Angst. Unterstimulation (Langeweile, fehlende Aufgabe) führt zu sensorischer Deprivation, was die Patienten durch zielloses Umherwandern oder Rufen zu kompensieren suchen.
Herausforderndes Verhalten;Was versteht man unter "Emotionaler Ansteckung" in der Interaktion zwischen Pflegenden und Patienten?;Kognitiv beeinträchtigte Menschen sind oft extrem sensibel für nonverbale Signale. Wenn eine Pflegeperson gestresst, hektisch oder ängstlich in das Zimmer kommt, überträgt sich diese Anspannung unmittelbar auf den Patienten und kann dort sofort herausforderndes Verhalten auslösen.
Herausforderndes Verhalten;Wie reagieren Sie professionell (Deeskalation), wenn ein Patient bei der Körperpflege plötzlich zuschlagen will?;Eigenschutz beachten (Abstand halten), Ruhe bewahren, mit tiefer/ruhiger Stimme sprechen, die Handlung sofort unterbrechen ("Ich sehe, das ist Ihnen jetzt zu viel"), dem Patienten Raum geben und die Massnahme zu einem späteren Zeitpunkt unter anderen Bedingungen neu versuchen.
Herausforderndes Verhalten;Warum ist "Hin- und Weglauftendenz" (Wandering) aus Sicht des Patienten oft ein zielgerichtetes Verhalten?;Der Patient irrt meist nicht sinnlos umher, sondern verfolgt ein Ziel aus seiner inneren Realität (z.B. "Ich muss zur Arbeit", "Die Kinder kommen aus der Schule"). Interventionen zielen darauf ab, dieses innere Bedürfnis (z.B. nach einer sinnvollen Aufgabe oder Sicherheit) zu stillen.
Herausforderndes Verhalten;Welche ethischen und rechtlichen Vorgaben gelten beim Einsatz von freiheitseinschränkenden Massnahmen (FEM) bei herausforderndem Verhalten?;FEM (Bettgitter, Fixationen, sedierende Medikation) sind immer die absolute "Ultima Ratio". Sie dürfen nur angewendet werden, wenn eine akute Eigen- oder Fremdgefährdung besteht, alle milderen Massnahmen versagt haben, und sie müssen streng überwacht, dokumentiert und regelmässig reevaluiert werden.
Herz;Beschreiben Sie den Weg eines roten Blutkörperchens durch das Herz, beginnend in der Vena cava superior.;Vena cava superior -> rechter Vorhof -> Trikuspidalklappe -> rechte Herzkammer -> Pulmonalklappe -> Arteria pulmonalis -> Lunge -> Vena pulmonalis -> linker Vorhof -> Mitralklappe -> linke Herzkammer -> Aortenklappe -> Aorta.
Herz;Was versteht man unter dem Begriff "Endokarditis" und warum ist sie besonders für die Herzklappen gefährlich?;Eine Entzündung der Herzinnenhaut (Endokard), meist bakteriell. Da die Herzklappen aus Endokardfalten bestehen und keine eigene kapillare Blutversorgung zur Immunabwehr haben, können Bakterien die Klappen zerstören und zu akuter Klappeninsuffizienz sowie Embolien führen.
Herz;Erklären Sie den Unterschied zwischen einer Myokardischämie und einem Myokardinfarkt.;Myokardischämie ist eine reversible Minderdurchblutung des Herzmuskels durch Gefässverengung (z.B. Angina pectoris), die zu Sauerstoffmangel führt. Ein Myokardinfarkt ist die irreversible Nekrose (Absterben) des Herzmuskelgewebes durch einen kompletten Gefässverschluss.
Herz;Welche Aufgabe haben die Koronararterien (Herzkranzgefässe) und in welcher Herzphase werden sie primär durchblutet?;Sie versorgen den Herzmuskel (Myokard) mit Sauerstoff und Nährstoffen. Im Gegensatz zu fast allen anderen Organen werden die Koronarien hauptsächlich während der Diastole (Entspannungsphase) durchblutet, da der kontrahierende Muskel in der Systole die Gefässe zudrückt.
Herz;Was ist eine Perikarditis und was ist die gefährlichste Komplikation dieser Erkrankung?;Eine Entzündung des Herzbeutels. Die gefährlichste Komplikation ist die Perikardtamponade: Ein rascher Erguss im starren Herzbeutel komprimiert das Herz von aussen, sodass es sich in der Diastole nicht mehr füllen kann. Folge ist ein kardiogener Schock.
Herz;Wie unterscheiden sich die linke und rechte Herzkammer anatomisch und warum?;Die Myokardwand der linken Herzkammer ist wesentlich dicker (hypertrophiert) als die der rechten. Das liegt daran, dass das linke Herz gegen den hohen Widerstand des Körperkreislaufs anpumpen muss, während das rechte Herz nur in den Niederdruck-Lungenkreislauf pumpt.
Herz;Was ist ein Vorhofflimmern und welches schwerwiegende Risiko geht davon aus?;Eine Herzrhythmusstörung mit unkoordinierten, schnellen Vorhofkontraktionen (Flimmern). Das Blut stagniert in den Vorhöfen (v.a. im Vorhofohr), was zur Thrombenbildung führen kann. Löst sich ein Thrombus, droht ein arterieller Embolus (meist CVI/Schlaganfall).
Herz;Welche pflegerische Bedeutung hat die Überwachung der Halsvenen (Vena jugularis) bei Herzerkrankungen?;Eine im 45-Grad-Winkel gestaute, prall gefüllte sichtbare Halsvene (Jugularvenenstauung) ist ein klinisches Zeichen für einen Rückstau des venösen Blutes vor dem rechten Herzen, typisch für eine Rechtsherzinsuffizienz oder Volumenüberladung.
Herz;Was bewirken Beta-Rezeptoren-Blocker (Betablocker) am Herzen?;Sie blockieren die sympathischen Beta-1-Rezeptoren am Herzen. Dadurch senken sie die Herzfrequenz (negativ chronotrop), die Überleitungsgeschwindigkeit (negativ dromotrop) und die Kontraktionskraft (negativ inotrop), was den Sauerstoffbedarf des Myokards deutlich senkt.
Herz;Was misst das Troponin im Blut und warum ist es in der Akutkardiologie so wichtig?;Troponin ist ein herzmuskelspezifisches Protein. Bei einer Schädigung der Herzmuskelzellen (Nekrose, z.B. beim Myokardinfarkt) gelangt es ins Blut. Es ist der wichtigste und spezifischste Biomarker zur Diagnostik eines akuten Herzinfarkts.
Herz Physiologie;Beschreiben Sie das Reizleitungssystem des Herzens in der korrekten anatomischen Reihenfolge.;Sinusknoten (primärer Schrittmacher) -> AV-Knoten (Verzögerung der Erregung) -> His-Bündel -> Tawara-Schenkel (Kammerschenkel) -> Purkinje-Fasern (Erregung der Arbeitsmuskulatur der Ventrikel).
Herz Physiologie;Was ist das "Alles-oder-Nichts-Gesetz" am Herzmuskel?;Wenn ein elektrischer Reiz die Schwellenspannung überschreitet, kontrahiert sich das gesamte Myokard (Gewebe funktioniert als funktionelles Synzytium) maximal. Es gibt keine Teilkontraktion; ein überschwelliger Reiz löst immer ein komplettes Aktionspotenzial aus.
Herz Physiologie;Erklären Sie die Begriffe "Preload" (Vorlast) und "Afterload" (Nachlast).;Preload ist die Wandspannung am Ende der Diastole (abhängig von der venösen Füllung und Dehnung der Herzkammer). Afterload ist der Auswurfwiderstand, gegen den die Kammer während der Systole anpumpen muss (abhängig vom peripheren Blutdruck/Gefässwiderstand).
Herz Physiologie;Was besagt der Frank-Starling-Mechanismus des Herzens?;Er ist ein Selbstregulationsmechanismus: Je mehr venöses Blut in das Herz fliesst (erhöhter Preload), desto stärker wird die Herzmuskelfaser gedehnt. Diese Dehnung führt automatisch zu einer kraftvolleren Kontraktion, sodass das zusätzliche Blutvolumen ausgeworfen wird.
Herz Physiologie;Aus welchen zwei Parametern setzt sich das Herzzeitvolumen (HZV) zusammen und wie hoch ist es bei einem Erwachsenen in Ruhe in etwa?;HZV = Herzfrequenz (Schläge pro Minute) x Schlagvolumen (Menge Blut pro Schlag). In Ruhe liegt es bei etwa 70 Schlägen/min x 70 ml = ca. 4,9 bis 5 Liter pro Minute.
Herz Physiologie;Wie beeinflusst das vegetative Nervensystem (Sympathikus vs. Parasympathikus) die Herzfrequenz?;Der Sympathikus (über Adrenalin/Noradrenalin an Beta-1-Rezeptoren) steigert die Herzfrequenz (positiv chronotrop). Der Parasympathikus (über den N. vagus und Acetylcholin) senkt die Herzfrequenz (negativ chronotrop), wirkt aber primär nur auf Sinus- und AV-Knoten.
Herz Physiologie;Was geschieht in der isovolumetrischen Kontraktionsphase der Systole?;Die Herzkammern sind mit Blut gefüllt, alle Klappen (Segel- und Taschenklappen) sind geschlossen. Der Muskel kontrahiert sich, wodurch der Druck in der Kammer massiv ansteigt, das Volumen sich jedoch noch nicht ändert, bis der Druck hoch genug ist, die Aortenklappe aufzustossen.
Herz Physiologie;Was versteht man unter der Refraktärzeit des Herzmuskels und warum ist sie lebenswichtig?;Die Refraktärzeit ist die Phase nach einem Aktionspotenzial, in der die Herzmuskelzelle nicht erneut erregt werden kann. Sie ist beim Herzen besonders lang und verhindert eine Dauerkontraktion (Tetanus), wodurch die diastolische Entspannungs- und Füllungsphase garantiert bleibt.
Herz Physiologie;Wodurch entstehen der 1. und der 2. Herzton?;Der 1. Herzton (Anspannungston) entsteht durch die Anspannung der Kammermuskulatur und das Schliessen der Segelklappen (Beginn der Systole). Der 2. Herzton (Klappenton) entsteht durch das plötzliche Zuschlagen der Taschenklappen (Aorten- und Pulmonalklappe) am Ende der Systole.
Herz Physiologie;Was repräsentieren P-Welle, QRS-Komplex und T-Welle im EKG?;P-Welle: Vorhoferregung (Depolarisation). QRS-Komplex: Kammererregung (Depolarisation der Ventrikel). T-Welle: Kammererregungsrückbildung (Repolarisation der Ventrikel).
Herzinsuffizienz;Wie definiert sich eine Herzinsuffizienz pathophysiologisch?;Eine Unfähigkeit des Herzens, das vom Körper benötigte Herzzeitvolumen (Sauerstoff und Blut) bei normalem enddiastolischen Druck zu fördern. Das Herz ist als Pumpe zu schwach, um den Organismus ausreichend zu versorgen.
Herzinsuffizienz;Erklären Sie den Unterschied zwischen Vorwärts- und Rückwärtsversagen bei einer Herzinsuffizienz.;Vorwärtsversagen: Es wird nicht genug Blut in die Peripherie gepumpt (Müdigkeit, Schwäche, arterielle Hypotonie, Zyanose). Rückwärtsversagen: Das Blut staut sich vor dem versagenden Herzteil zurück in die Venen (Ödeme, Lungenstauung).
Herzinsuffizienz;Welche typischen klinischen Symptome zeigen sich bei einer isolierten Linksherzinsuffizienz?;Das Blut staut sich in die Lungenvenen zurück. Symptome: Dyspnoe (v.a. bei Belastung oder flachem Liegen = Orthopnoe), Husten (Asthma cardiale), Rasselgeräusche über der Lunge und im Extremfall ein lebensbedrohliches Lungenödem.
Herzinsuffizienz;Welche typischen klinischen Symptome zeigen sich bei einer isolierten Rechtsherzinsuffizienz?;Das Blut staut sich in den Körperkreislauf zurück. Symptome: Beinödeme (symmetrisch, eindrückbar), Jugularvenenstauung (Halsvenenstauung), Stauungsleber (Hepatomegalie) und Nykturie (nächtliches Wasserlassen durch Resorption der Ödeme im Liegen).
Herzinsuffizienz;Was ist die NYHA-Klassifikation und worauf basiert sie?;Sie teilt die Herzinsuffizienz in vier Schweregrade (I-IV) ein. Sie basiert rein auf der subjektiven Symptombelastung (Dyspnoe, Erschöpfung) des Patienten in Relation zur körperlichen Aktivität (von I = keine Beschwerden bei Belastung bis IV = Beschwerden bereits in absoluter Ruhe).
Herzinsuffizienz;Warum ist die tägliche Gewichtskontrolle bei Patienten mit Herzinsuffizienz eine zentrale pflegerische Massnahme?;Eine Gewichtszunahme ist das früheste und zuverlässigste Zeichen einer Flüssigkeitsretention (Ödembildung), noch bevor periphere Ödeme oder Atemnot sichtbar werden. Eine Zunahme von > 2 kg in 3 Tagen erfordert oft eine sofortige Anpassung der Diuretikatherapie.
Herzinsuffizienz;Erklären Sie die Wirkung von ACE-Hemmern bei der Herzinsuffizienz.;Sie blockieren das Angiotensin-Converting-Enzyme (Teil des RAAS). Dies verhindert die Bildung von Angiotensin II, was zu einer Vasodilatation (Senkung der Nachlast) führt. Zudem hemmt es die Aldosteron-Ausschüttung, was die Natrium/Wasser-Ausscheidung fördert (Senkung der Vorlast).
Herzinsuffizienz;Warum haben Patienten mit Rechtsherzinsuffizienz oft eine Nykturie (nächtliches Wasserlassen)?;Tagsüber (im Stehen/Sitzen) sackt Flüssigkeit schwerkraftbedingt ins Gewebe ab (Beinödeme), die Nierendurchblutung ist gering. Nachts (im Liegen) verbessert sich der venöse Rückstrom, die Ödeme werden mobilisiert, die Niere wird besser perfundiert und produziert massiv Urin.
Herzinsuffizienz;Wie wirkt das Diuretikum Torasemid (Schleifendiuretikum) auf das Carrier-System in der Niere?;Es blockiert den Na+/K+/2Cl--Cotransporter (Carrier) in der aufsteigenden Henle-Schleife. Dadurch werden diese Elektrolyte nicht rückresorbiert, verbleiben im Tubulussystem und binden osmotisch Wasser an sich, welches dann massiv ausgeschieden wird (Vorlastsenkung).
Herzinsuffizienz;Welche lebensstilverändernden Edukationsinhalte besprechen Sie vor Austritt mit einem Herzinsuffizienz-Patienten?;Tägliche Gewichtskontrolle (Morgens nach dem WC), Flüssigkeitsrestriktion (meist 1.5 - 2 Liter/Tag), salzarme Ernährung (Salz bindet Wasser), Erkennen von Dekompensationszeichen, Medikamentenadhärenz, absoluter Rauchstopp und angepasste körperliche Aktivität.
Hirnblutungen;Was ist der pathophysiologische und anatomische Unterschied zwischen einem Epiduralhämatom und einem Subduralhämatom?;Ein Epiduralhämatom ist meist eine arterielle Blutung (z.B. A. meningea media) zwischen Schädelknochen und Dura mater, typisch ist das "freie Intervall" (kurzes Erwachen vor dem Koma). Ein Subduralhämatom ist eine venöse Blutung (Abriss der Brückenvenen) zwischen Dura mater und Arachnoidea.
Hirnblutungen;Warum sind ältere Menschen stark prädisponiert für ein chronisches Subduralhämatom, selbst nach Bagatelltraumata?;Im Alter kommt es zur physiologischen Hirnatrophie (das Gehirn schrumpft). Dadurch vergrössert sich der Subduralraum, und die überbrückenden Venen stehen unter starkem Zug. Ein leichter Schlag reicht aus, um diese reissen zu lassen. Oft kommt eine Antikoagulation (Blutverdünner) erschwerend hinzu.
Hirnblutungen;Was ist das klinische Leitsymptom einer Subarachnoidalblutung (SAB)?;Ein plötzlicher, extrem heftiger "Vernichtungskopfschmerz" (Donnerschlagkopfschmerz), oft begleitet von Übelkeit, Erbrechen, Bewusstseinsstörungen und Nackensteifigkeit (Meningismus) durch die Reizung der Hirnhäute durch das Blut.
Hirnblutungen;Was ist die häufigste Ursache für eine Subarachnoidalblutung (SAB)?;Die Ruptur eines zerebralen Aneurysmas (eine Gefässaussackung), meist im Bereich der arteriellen Gefässschlinge an der Schädelbasis (Circulus arteriosus Willisii).
Hirnblutungen;Welche zwei schweren Sekundärkomplikationen drohen in den Tagen nach einer Subarachnoidalblutung (SAB)?;1. Vasospasmen (Krampfhafte Gefässverengungen durch Blutabbauprodukte im Liquor, was zu sekundären Hirninfarkten führt). 2. Hydrozephalus (Wasserkopf, da das Blut die Resorption des Liquors blockiert).
Hirnblutungen;Was ist die häufigste Ursache für eine spontane intrazerebrale Blutung (ICB)?;Eine chronische, unzureichend eingestellte arterielle Hypertonie. Sie führt zur Schädigung der kleinen Hirngefässe (Mikroangiopathie), die unter dem hohen Druck schliesslich platzen.
Hirnblutungen;Warum ist bei Verdacht auf Hirnblutung/Hirndruck eine 30-Grad-Oberkörperhochlagerung mit exakter Mittelstellung des Kopfes zwingend?;Diese Position fördert den venösen Abfluss über die Vena jugularis aus dem Schädel. Ist der Kopf abgeknickt, staut sich das venöse Blut zurück, was den intrakraniellen Druck (Hirndruck) sofort massiv und lebensgefährlich ansteigen lässt.
Hirnblutungen;Was versteht man unter dem Begriff "Einklemmung" (Herniation) bei Hirnblutungen?;Da der Schädel eine starre Knochenkapsel ist, führt die Raumforderung durch die Blutung zu einem massiven Druckanstieg. Das Gehirngewebe weicht nach unten aus und wird in das Hinterhauptsloch (Foramen magnum) gepresst, was den Hirnstamm (Atem-/Kreislaufzentrum) lebensgefährlich einklemmt.
Hirnblutungen;Wie interpretieren Sie eine neu aufgetretene, einseitig weite und lichtstarre Pupille (Anisokorie) bei einem Patienten mit SHT/Hirnblutung?;Es ist ein absolutes Alarmzeichen! Es deutet auf eine Kompression des Nervus oculomotorius (3. Hirnnerv) hin, verursacht durch einen massiv steigenden intrakraniellen Druck und eine drohende oder beginnende Einklemmung.
Hirnblutungen;Warum muss bei Patienten mit Hirnblutungen eine konsequente Obstipationsprophylaxe durchgeführt werden?;Starkes Pressen beim Stuhlgang (Valsalva-Manöver) erhöht den intrathorakalen Druck massiv. Dieser Druck überträgt sich direkt auf das venöse System und führt zu einem gefährlichen, steilen Anstieg des intrakraniellen Drucks (Hirndruckspitze).
Identität;Was beschreibt das Konzept der "Biographical Disruption" (Biografischer Bruch) im Zusammenhang mit chronischen Krankheiten?;Es beschreibt den Zustand, bei dem eine schwere Diagnose die bisherige Lebensplanung, das Selbstverständnis und die Rollenidentität eines Menschen radikal unterbricht. Die Person muss ihr Leben und ihre Identität an die neuen körperlichen und sozialen Realitäten anpassen.
Identität;Erklären Sie den Unterschied zwischen der "persönlichen Identität" und der "sozialen Identität" nach Goffman.;Die persönliche Identität umfasst die individuellen biografischen Merkmale und das eigene Selbstbild. Die soziale Identität ist das Bild, das die Gesellschaft von einer Person hat, basierend auf Rollen, Normen und Gruppenzugehörigkeiten.
Identität;Wie kann Stigmatisierung in der Pflege (z.B. bei psychiatrischen Erkrankungen oder HIV) die Identität eines Patienten beschädigen?;Das Stigma reduziert den Menschen auf ein einziges, negatives Merkmal ("Der Schizophrene" statt "Herr Müller"). Dies führt oft zur Internalisierung der Abwertung, zu Scham, sozialem Rückzug und dem Verlust des Selbstwertgefühls.
Identität;Was versteht man unter "Körperbild" (Body Image) und wie wird es durch einen operativen Eingriff wie die Anlage eines Stomas beeinflusst?;Das Körperbild ist die mentale Vorstellung und das emotionale Verhältnis zum eigenen Körper. Ein Stoma greift massiv in die körperliche Integrität ein und verändert das Kontinenzgefühl. Dies löst oft Ekel, Scham und eine Erschütterung der sexuellen Identität aus.
Identität;Wie trägt der personenzentrierte Ansatz nach Tom Kitwood zum Erhalt der Identität bei Menschen mit Demenz bei?;Kitwood besagt, dass Identität bei Demenz nicht nur kognitiv ist, sondern stark durch soziale Interaktion aufrechterhalten wird. Pflegende stützen die Identität des Patienten durch wertschätzende Interaktionen (Trost, Einbeziehung, Bindung), anstatt ihn auf seine Defizite zu reduzieren.
Identität;Was ist die "Narrative Identität" und welchen pflegerischen Nutzen hat das aktive Zuhören (Biografiearbeit)?;Narrative Identität bedeutet, dass wir wissen, wer wir sind, durch die Geschichten, die wir über unser Leben erzählen. Aktives Zuhören hilft dem Patienten, diese Geschichten zu ordnen, Sinn in der Krise zu finden und Pflegenden, individuelle Ressourcen und Werte zu erkennen.
Identität;Warum kann der Eintritt in ein Pflegeheim (Institutionalisierung) eine Identitätskrise auslösen?;Der Bewohner verliert seine gewohnte Umgebung, private Rückzugsräume, persönliche Besitztümer und oft seine Autonomie. Fremde Strukturen und Routinen (Aufstehen, Essenzeiten) dominieren, was zum Verlust der Rolle als selbstbestimmter Erwachsener führt.
Identität;Welche Bedeutung hat die sexuelle Identität in der Pflege und warum wird sie oft tabuisiert?;Die Sexualität ist ein zentraler Bestandteil der menschlichen Identität. Sie wird in der Pflege oft tabuisiert (v.a. bei alten oder behinderten Menschen) aus Scham, eigenen Moralvorstellungen oder Unsicherheit der Pflegenden. Dies führt zur Missachtung eines grundlegenden Patientenbedürfnisses.
Identität;Was bedeutet "Empowerment" in Bezug auf die Identität eines Patienten?;Empowerment befähigt den Patienten, Kontrolle und Autonomie über sein Leben (zurück) zu erlangen. Er wechselt von der passiven Rolle des "Hilfsempfängers" (Opfer) in die aktive Rolle des Gestalters, was die Identität stärkt und Selbstwirksamkeit fördert.
Identität;Inwiefern prägt die kulturelle Identität (Transkulturelle Pflege) den Umgang mit Schmerz?;Die Kultur definiert, wie Schmerz gezeigt und kommuniziert werden darf. In manchen Kulturen wird Schmerz laut und expressiv geäussert, in anderen wird stilles Ertragen (Stoizismus) erwartet. Pflegende müssen dies erkennen, um Schmerzen nicht aufgrund von Ethnozentrismus falsch einzuschätzen.
Immunologie;Was ist der Hauptunterschied zwischen dem unspezifischen (angeborenen) und dem spezifischen (erworbenen) Immunsystem?;Das unspezifische System reagiert extrem schnell (Minuten), aber immer gleich, es bildet kein Gedächtnis (z.B. Makrophagen, Hautbarriere). Das spezifische System braucht Tage zur Aktivierung, ist aber exakt auf den Erreger zugeschnitten und bildet Gedächtniszellen (B- und T-Lymphozyten).
Immunologie;Wie entsteht Fieber (Pathophysiologie) und welchen immunologischen Nutzen hat es?;Makrophagen schütten bei Kontakt mit Erregern Pyrogene (z.B. Interleukin-1) aus. Diese verstellen den Sollwert im Hypothalamus nach oben. Der Nutzen: Bei höheren Temperaturen arbeiten Immunzellen schneller und effektiver, während die Vermehrung von Bakterien/Viren gehemmt wird.
Immunologie;Erklären Sie die vier klassischen lokalen Entzündungszeichen (Kardinalsymptome nach Celsus) und deren pathophysiologische Ursache.;1. Rubor (Rötung) & 2. Calor (Wärme) entstehen durch Vasodilatation (mehr Durchblutung). 3. Tumor (Schwellung) entsteht durch erhöhte Gefässpermeabilität, wodurch Flüssigkeit ins Gewebe austritt (Exsudation). 4. Dolor (Schmerz) entsteht durch entzündliche Botenstoffe, die Nervenenden reizen.
Immunologie;Was ist der Unterschied zwischen der humoralen und der zellulären Immunantwort des spezifischen Immunsystems?;Humoral: B-Lymphozyten wandeln sich in Plasmazellen um und produzieren massenhaft Antikörper (Immunglobuline), die frei im Blut/Sekreten schwimmen und Erreger markieren. Zellulär: T-Killerzellen greifen direkt körpereigene Zellen an, die von Viren befallen oder tumorös entartet sind, und zerstören sie.
Immunologie;Was passiert bei einer Allergie vom Typ I (Soforttyp) im Körper (z.B. beim anaphylaktischen Schock)?;Der Körper hat fälschlicherweise IgE-Antikörper gegen ein harmloses Allergen gebildet. Beim Zweitkontakt bindet das Allergen an das IgE auf den Mastzellen. Diese platzen auf (Degranulation) und schütten massiv Histamin aus, was zu Vasodilatation, Bronchospasmus und Schock führt.
Immunologie;Was ist der Unterschied zwischen einer aktiven und einer passiven Immunisierung (Impfung)?;Aktiv: Abgetötete Erreger/Antigene werden gespritzt. Der Körper erarbeitet selbst Antikörper und Gedächtniszellen (wirkt nach Wochen, hält oft jahrelang). Passiv: Fertige Antikörper werden gespritzt (wirkt sofort als Notfallschutz, hält aber nur wenige Wochen, da kein Gedächtnis gebildet wird).
Immunologie;Erklären Sie das pathophysiologische Prinzip von Autoimmunerkrankungen (z.B. Rheumatoide Arthritis, Typ-1-Diabetes).;Das Immunsystem verliert seine Immuntoleranz. Es kann nicht mehr zwischen "Fremd" und "Eigen" unterscheiden und attackiert irrtümlicherweise gesundes körpereigenes Gewebe (Autoantigene) mit Antikörpern und T-Zellen, was zu chronischen Entzündungen und Gewebezerstörung führt.
Immunologie;Welche zentrale Aufgabe haben Makrophagen bei der Verbindung des unspezifischen mit dem spezifischen Immunsystem?;Sie fungieren als Antigen-präsentierende Zellen (APC). Sie fressen (phagozytieren) den Erreger, zerlegen ihn und präsentieren charakteristische Eiweissteile (Antigene) auf ihrer Zelloberfläche. Nur so können die T-Helferzellen den Erreger erkennen und das spezifische Immunsystem "einschalten".
Immunologie;Warum sind Patienten unter einer immunsuppressiven Therapie (z.B. Kortison, nach Organtransplantationen) pflegerisch extrem anspruchsvoll?;Weil ihre Immunabwehr künstlich blockiert ist. Pflegerisch steht die strikte Infektionsprophylaxe im Fokus. Zudem fehlen oft die klassischen Entzündungszeichen (z.B. kein Fieber trotz schwerer Pneumonie), weshalb die Beobachtung auf atypische Infektionszeichen lebensrettend ist.
Immunologie;Was ist die Pathophysiologie der Sepsis (Blutvergiftung)?;Eine Infektion löst eine unkontrollierte, überschiessende systemische Immunantwort aus (SIRS). Es kommt zur massiven Ausschüttung von Entzündungsmediatoren im ganzen Körper. Dies führt zu generalisierter Vasodilatation, Kapillarleckage ("undichte Gefässe"), extremem Blutdruckabfall und letztlich Multiorganversagen.
KHK;Erklären Sie die grundlegende Pathophysiologie der Koronaren Herzkrankheit (KHK).;Die KHK ist die Manifestation der Arteriosklerose in den Herzkranzgefässen. Durch Plaques (Ablagerungen von Cholesterin, Kalzium, Entzündungszellen) verengt sich das Gefässlumen (Stenose). Dies führt zu einem Missverhältnis zwischen Sauerstoffangebot und Sauerstoffbedarf des Herzmuskels (Ischämie).
KHK;Welches sind die klassischen beeinflussbaren (modifizierbaren) kardiovaskulären Risikofaktoren für eine KHK?;Arterielle Hypertonie, Diabetes mellitus, Hyperlipidämie (hohes LDL-Cholesterin), Nikotinabusus, Adipositas und Bewegungsmangel.
KHK;Was versteht man unter einer "stummen Ischämie" und bei welcher Patientengruppe tritt sie gehäuft auf?;Eine stumme Ischämie ist eine Durchblutungsstörung des Myokards ohne die typischen Angina-pectoris-Schmerzen. Sie tritt gehäuft bei Patienten mit langjährigem Diabetes mellitus auf, da deren Schmerzwahrnehmung durch die diabetische Polyneuropathie (Nervenschädigung) gestört ist.
KHK;Erklären Sie den Unterschied zwischen einem NSTEMI und einem STEMI im EKG und in der Pathologie.;Beim STEMI (ST-Hebungs-Infarkt) ist das Herzkranzgefäss komplett verschlossen, es kommt zu transmuralen Ischämien (ST-Hebungen im EKG). Beim NSTEMI (Nicht-ST-Hebungs-Infarkt) ist das Gefäss hochgradig verengt, aber nicht komplett dicht, das EKG zeigt keine ST-Hebungen, aber der Troponin-Wert ist positiv.
KHK;Welche spezifischen pflegerischen Überwachungsschwerpunkte setzen Sie in den ersten Stunden nach einer Koronarangiographie mit Stent-Einlage (PTCA) via Arteria radialis?;Überwachung der Punktionsstelle auf Nachblutungen oder Hämatome, Kontrolle von Durchblutung/Motorik/Sensibilität (DMS) der Hand, strenge Einhaltung der verordneten Ruhigstellung (z.B. Druckverband) sowie Überwachung auf erneute Angina-pectoris-Symptome (Stentthrombose).
KHK;Warum müssen Patienten nach einer Stent-Implantation zwingend eine duale Plättchenhemmung (DAPT) einnehmen?;Der Stent ist ein Fremdkörper im Blutgefäss. Um zu verhindern, dass die Thrombozyten an den Metallstreben aggregieren und den Stent sofort wieder verschliessen (Stentthrombose), müssen vorübergehend zwei verschiedene Thrombozytenaggregationshemmer (z.B. Aspirin plus Clopidogrel) kombiniert werden.
KHK;Was ist das Ziel der Gabe von Statinen bei der chronischen KHK, unabhängig vom aktuellen Cholesterinwert?;Statine senken nicht nur das LDL-Cholesterin, sondern haben sogenannte "pleiotrope Effekte". Sie wirken entzündungshemmend auf das Endothel und stabilisieren bestehende Plaques, wodurch das Risiko minimiert wird, dass diese aufreissen (Ruptur) und einen Infarkt auslösen.
KHK;Wie wirkt Nitroglycerin (Glyceroltrinitrat) pathophysiologisch bei einem KHK-Patienten mit akuter Angina pectoris?;Es setzt Stickstoffmonoxid (NO) frei, was primär zu einer Erweiterung der venösen Kapazitätsgefässe (Vorlastsenkung) und sekundär der Koronarien führt. Das venöse Blut versackt, das Herz muss weniger Volumen pumpen, wodurch die Wandspannung und der Sauerstoffbedarf des Myokards sinken.
KHK;Welche Spätkomplikationen drohen einem Patienten mit langjähriger, unzureichend behandelter KHK?;Die chronische Ischämie und kleinere unbemerkte Infarkte führen zum Untergang von Herzmuskelzellen und zur Vernarbung. Daraus entwickeln sich häufig eine ischämische Herzinsuffizienz (verminderte Pumpleistung) sowie lebensgefährliche Herzrhythmusstörungen.
KHK;Erklären Sie die Bedeutung der "Sekundärprävention" bei der KHK und nennen Sie pflegerische Edukationsansätze.;Sekundärprävention soll das Fortschreiten der Krankheit aufhalten. Edukation umfasst: konsequente Medikamentenadhärenz, radikaler Nikotinstopp, Umstellung auf mediterrane Kost, Gewichtsreduktion und moderates, regelmässiges Ausdauertraining (z.B. in Herzgruppen).
Kindes Recht;Welche zentrale Bedeutung hat der Begriff "Urteilsfähigkeit" im Schweizer Rechtssystem bezüglich medizinischer Behandlungen bei Minderjährigen?;Die Urteilsfähigkeit ist nicht an ein starres Alter gebunden, sondern situationsabhängig. Ist ein Kind/Jugendlicher fähig, die Bedeutung und Konsequenzen eines medizinischen Eingriffs zu verstehen (z.B. ein 14-Jähriger beim Setzen eines Gipses), darf er selbstständig einwilligen, auch gegen den Willen der Eltern.
Kindes Recht;Wie verhalten Sie sich ethisch und rechtlich, wenn eine 15-jährige, urteilsfähige Patientin die Pille verschrieben haben möchte, aber ausdrücklich verlangt, dass die Eltern nichts erfahren?;Da sie bezüglich dieser Frage urteilsfähig ist, greift das Berufsgeheimnis auch gegenüber den Eltern. Die Fachpersonen müssen die Vertraulichkeit wahren und dürfen die Eltern nicht informieren, solange keine akute Selbst- oder Fremdgefährdung besteht.
Kindes Recht;Was besagt das Prinzip des "Kindeswohls" (Best Interests of the Child) aus der UN-Kinderrechtskonvention für den Spitalalltag?;Bei allen Massnahmen, die Kinder betreffen (ob durch Ärzte, Pflege oder Verwaltung), muss das Wohl des Kindes vorrangig berücksichtigt werden. Dies umfasst z.B. das Recht auf schmerzfreie Behandlungen, altersgerechte Information und die Anwesenheit der Eltern.
Kindes Recht;Was verstehen Sie unter "Assent" (Zustimmung) im Gegensatz zu "Consent" (Einwilligung) in der Pädiatrie?;"Consent" ist die juristisch bindende Einwilligung (meist durch die Eltern bei fehlender Urteilsfähigkeit). "Assent" ist die altersgerechte Einbeziehung des Kindes. Auch wenn das Kind juristisch nicht entscheiden darf, muss ihm der Eingriff erklärt und seine aktive Mitwirkung/Zustimmung eingeholt werden.
Kindes Recht;Was sind pflegerische "Red Flags" (Warnsignale) für eine mögliche Kindeswohlgefährdung (Misshandlung/Vernachlässigung)?;Verletzungen, die nicht zum Unfallhergang oder Entwicklungsstand passen (z.B. Verbrennungen, symmetrische Hämatome), mangelnde Hygiene, extremes Untergewicht, auffälliges Verhalten (z.B. keine Schmerzäusserung, "frozen watchfulness") oder extrem verzögertes Aufsuchen medizinischer Hilfe.
Kindes Recht;Was tun Sie als Pflegefachperson, wenn Sie den konkreten Verdacht auf eine Kindeswohlgefährdung haben?;Der Eigenschutz des Kindes hat oberste Priorität. Man dokumentiert objektiv (Fakten, keine Interpretationen), bespricht den Verdacht sofort im interprofessionellen Team (Arzt, Sozialdienst) und zieht zur rechtlichen Klärung ggf. die KESB (Kindes- und Erwachsenenschutzbehörde) bei.
Kindes Recht;Dürfen Eltern aus religiösen Gründen eine lebensrettende Behandlung ihres Kindes (z.B. Bluttransfusion) ablehnen?;Nein. Wenn eine Behandlung akut lebensrettend ist, steht das Recht des Kindes auf Leben über der Religionsfreiheit oder dem Sorgerecht der Eltern. In solchen Notfällen muss das Spital notfalls gegen den Willen der Eltern handeln und rasch die KESB involvieren.
Kindes Recht;Welche Rechte haben hospitalisierte Kinder bezüglich Spiel und Bildung gemäss der Charta der Kinder im Spital (EACH-Charta)?;Kinder haben das Recht auf ein Umfeld, das ihrem Alter und Zustand entspricht. Das bedeutet Zugang zu Spielmöglichkeiten, Erholungseinrichtungen und, bei längeren Aufenthalten, das Recht auf angemessene schulische Betreuung, um die Entwicklung nicht zu gefährden.
Kindes Recht;Warum ist das "Rooming-in" (Mitaufnahme eines Elternteils) heute ein etabliertes Recht für Kinder im Spital?;Die Trennung von den Bezugspersonen löst bei Kindern extreme Ängste und Traumata aus (Hospitalismus). Die ständige Anwesenheit der Eltern bietet emotionale Sicherheit, fördert den Heilungsprozess und reduziert den Bedarf an Analgetika/Sedativa.
Kindes Recht;Welche Aufgabe hat die Pflegefachperson als "Advocate" (Anwalt/Fürsprecher) des Kindes auf der Abteilung?;Oft gehen die Bedürfnisse des Kindes im Stress des Klinikalltags oder bei Dominanz der Eltern unter. Die Pflegende sorgt dafür, dass die Stimme des Kindes gehört wird, z.B. indem sie schmerzhafte Prozeduren pausiert, wenn das Kind Angst hat, oder altersgerechte Erklärungen einfordert.
Komplizität, Notfallsituationen;Was macht eine Pflegesituation zu einer "komplexen Situation" im Gegensatz zu einer "komplizierten Situation"?;Eine komplizierte Situation ist schwierig, aber berechenbar (z.B. eine Routine-OP am Herzen). Eine komplexe Situation ist unberechenbar und dynamisch, da viele interagierende Faktoren (Multimorbidität, soziale Krisen, unklare Diagnosen) zusammenwirken und sich ständig gegenseitig beeinflussen.
Komplizität, Notfallsituationen;Warum ist das ABCDE-Schema in der Notfallmedizin und Akutpflege der Goldstandard?;Es bietet eine standardisierte, prioritätenbasierte Struktur, um in chaotischen Situationen systematisch lebensbedrohliche Probleme zu identifizieren und sofort zu behandeln (Treat first what kills first). Man geht erst zum nächsten Buchstaben, wenn das Problem im vorherigen behoben ist.
Komplizität, Notfallsituationen;Erklären Sie kurz die Bestandteile des ABCDE-Schemas.;A: Airway (Atemwege frei?), B: Breathing (Atmung ausreichend?), C: Circulation (Kreislauf stabil, Blutungen?), D: Disability (Neurologie, GCS, Pupillen?), E: Exposure (Umgebung, Temperatur, Entkleiden zur Ganzkörperinspektion).
Komplizität, Notfallsituationen;Welche Rolle spielen Triage-Systeme (z.B. Manchester Triage System) auf der Notfallstation?;Sie strukturieren Komplexität, indem sie nicht nach der Ankunftszeit behandeln, sondern systematisch die klinische Dringlichkeit evaluieren. Patienten werden in Farbcodes eingeteilt, die festlegen, in welcher maximalen Zeitspanne ein Arztkontakt zwingend erfolgen muss.
Komplizität, Notfallsituationen;Was ist die "Closed-Loop-Kommunikation" und warum ist sie in Notfallsituationen überlebenswichtig?;Es ist ein Kommunikationskreislauf, um Fehler zu vermeiden. Der Sender gibt einen Befehl ("Gib 1mg Adrenalin"). Der Empfänger bestätigt die Anweisung ("Ich ziehe 1mg Adrenalin auf"). Nach der Ausführung meldet er den Vollzug ("1mg Adrenalin ist verabreicht"). So weiss jeder, was exakt getan wurde.
Komplizität, Notfallsituationen;Was ist das SBAR-Konzept und in welchen komplexen Situationen wird es angewendet?;Es ist ein Kommunikationstool für Übergaben oder Notfall-Anrufe beim Arzt. S: Situation (Wer ruft an, was ist das aktuelle Problem), B: Background (Kurze Relevante Vorgeschichte), A: Assessment (Aktuelle Vitalwerte/Einschätzung), R: Recommendation (Empfehlung/Forderung, z.B. "Kommen Sie sofort").
Komplizität, Notfallsituationen;Erklären Sie den Begriff "Human Factors" im Bereich des Crisis Resource Managements (CRM).;Human Factors beschreiben, wie sich Stress, Müdigkeit, Hierarchien oder mangelnde Kommunikation auf die menschliche Leistung auswirken. In Notfällen passieren Fehler selten durch fehlendes Fachwissen, sondern meist durch das Versagen von Human Factors (z.B. niemand traut sich, den Chefarzt zu korrigieren).
Komplizität, Notfallsituationen;Welche Prioritäten setzen Sie pflegerisch beim Management eines akuten anaphylaktischen Schocks?;Sofortiger Stopp der Zufuhr des Auslösers (z.B. Infusion stoppen), Alarmierung, flache Lagerung mit Beinhochlagerung (bei Dyspnoe evtl. Oberkörper hoch), rasche i.m. Gabe von Adrenalin (Arzt/Protokoll), Sauerstoffgabe und grosszügige Volumengabe (Vollelektrolytlösung) wegen des massiven Vasodilatationsschocks.
Komplizität, Notfallsituationen;Sepsis ist ein komplexer, zeitkritischer Notfall. Was beinhalten die sogenannten "Sepsis Six", die innerhalb der ersten Stunde (Golden Hour) abgearbeitet werden müssen?;Drei diagnostische Massnahmen: 1. Laktat messen, 2. Blutkulturen abnehmen, 3. Urinausscheidung messen. Drei therapeutische Massnahmen: 4. Sauerstoff geben, 5. i.v. Antibiotika verabreichen, 6. i.v. Flüssigkeit (Volumen) geben.
Komplizität, Notfallsituationen;Warum ist ein strukturiertes "Debriefing" (Nachbesprechung) nach komplexen Notfallsituationen (z.B. Reanimation) im Pflegeteam unerlässlich?;Es dient zum einen der psychologischen Entlastung (Verhindern von Traumatisierung/Compassion Fatigue) und zum anderen der Fehleranalyse. Es klärt Fragen wie: Was lief gut? Wo gab es Kommunikationsprobleme? Was können wir beim nächsten Notfall systemisch verbessern?
Lähmung / Spastik;Was ist der pathophysiologische Unterschied zwischen einer schlaffen und einer spastischen Lähmung?;Schlaff: Schädigung des peripheren (2.) Motoneurons; es kommt kein Signal mehr am Muskel an, der Muskeltonus fehlt komplett, Reflexe fallen aus. Spastisch: Schädigung im ZNS (1. Motoneuron); die zentrale Hemmung fällt weg, der Muskeltonus ist massiv und unkontrolliert erhöht (Spastik), Reflexe sind gesteigert.
Lähmung / Spastik;Erklären Sie den Unterschied zwischen einer Parese und einer Plegie.;Eine Parese ist eine unvollständige Lähmung (Minderung der Muskelkraft), es ist noch eine Restfunktion oder Willkürmotorik vorhanden. Eine Plegie (oder Paralyse) ist eine komplette Lähmung ohne jegliche Möglichkeit der willkürlichen Bewegung.
Lähmung / Spastik;Warum entwickeln Patienten mit einer ausgeprägten Spastik ohne Pflegeintervention unweigerlich Kontrakturen?;Die Spastik führt zu einem dauerhaften, starken Zug einer bestimmten Muskelgruppe (meist der Beuger). Ohne die antagonistische Gegenbewegung verkürzen sich Muskeln, Sehnen und Bänder strukturell, was zur irreversiblen Gelenkversteifung (Kontraktur) führt.
Lähmung / Spastik;Welche pflegerischen Grundprinzipien gelten bei der Körperpflege von Patienten mit Spastik?;Grosse, flächige Berührungen anwenden (spitze Griffe triggern Spastik), Gelenke niemals mit Gewalt gegen den Widerstand aufbiegen, warmes Wasser verwenden (Kälte erhöht den Tonus) und das Tempo strikt an den Patienten anpassen.
Lähmung / Spastik;Wie wirkt das Bobath-Konzept bei Patienten mit halbseitiger spastischer Lähmung (Hemiplegie)?;Das Bobath-Konzept ist ein 24-Stunden-Konzept. Es zielt darauf ab, abnorme (spastische) Haltungs- und Bewegungsmuster zu hemmen und durch ständige, korrekte Reize (Fazilitation) physiologische Bewegungen im Gehirn neu zu bahnen (Neuroplastizität).
Lähmung / Spastik;Welche lebensgefährliche Gefahr droht bei Patienten mit Querschnittslähmung ab Höhe Th6 bei einem vollen Darm oder einer vollen Blase?;Die autonome Dysreflexie. Ein starker Reiz unterhalb der Läsion (z.B. volle Blase) löst einen massiven Sympathikusreflex aus. Da die hemmende Kontrolle des Gehirns fehlt, kommt es zu einer extremen, lebensgefährlichen arteriellen Hypertonie (Hirnblutungsgefahr!).
Lähmung / Spastik;Warum ist das Dekubitusrisiko bei einer schlaffen Querschnittslähmung maximal erhöht?;Es fehlen die Sensorik (der Patient spürt keinen Warnschmerz durch Ischämie) und die Motorik (der Patient kann das Gewicht nicht unbewusst verlagern). Zudem ist oft die Vasomotorik (Durchblutungsregulation) im gelähmten Bereich gestört.
Lähmung / Spastik;Welche Gefahr besteht für das Schultergelenk auf der betroffenen Seite bei einer schlaffen Hemiplegie und was ist die pflegerische Konsequenz?;Da der Muskeltonus fehlt, der den Humeruskopf in der Gelenkpfanne hält, kann der Arm leicht luxieren (Subluxation). Konsequenz: Den Arm immer physiologisch unterlagern, niemals (!) den Patienten am gelähmten Arm hochziehen oder transferieren.
Lähmung / Spastik;Welche medikamentösen Ansätze gibt es zur Behandlung einer schweren Spastik?;Systemisch werden Muskelrelaxantien (z.B. Baclofen, teils über eine intrathekale Pumpe direkt ins Nervenwasser) eingesetzt. Lokal kann Botulinumtoxin (Botox) in den spastischen Muskel injiziert werden, um die Erregungsübertragung vorübergehend chemisch zu blockieren.
Lähmung / Spastik;Wie gehen Sie pflegerisch mit dem "Neglect-Syndrom" bei einem Hemiplegie-Patienten um?;Der Patient nimmt die gelähmte Körper-/Raumhälfte nicht wahr. Zur Aktivierung muss die Umgebung (im Rahmen des Bobath-Konzepts) so gestaltet werden, dass Reize (Nachttisch, Besucher, Ansprache durch Pflege) konsequent über die betroffene Seite kommen.
Lungenemphysem;Erklären Sie die Pathophysiologie des Lungenemphysems.;Es kommt zu einer irreversiblen Zerstörung der Alveolarsepten (Trennwand der Lungenbläschen). Viele kleine Alveolen verschmelzen zu grossen, funktionslosen Emphysemblasen. Dadurch verringert sich die Gasaustauschfläche massiv und die Lunge verliert ihre elastische Rückstellkraft.
Lungenemphysem;Was beschreibt der Begriff "Fassthorax" und wie entsteht er beim Lungenemphysem?;Der Brustkorb nimmt dauerhaft die Form eines Fasses an (Inspirationsstellung). Durch den Elastizitätsverlust der Lunge kommt es zum "Air Trapping" – der Patient kann nicht mehr vollständig ausatmen, das Residualvolumen steigt, und die Lunge bleibt chronisch überbläht.
Lungenemphysem;Wie unterscheiden sich in der klassischen Lehre der "Pink Puffer" und der "Blue Bloater"?;Pink Puffer (Emphysem-Typ): Kachektisch, schwere Dyspnoe, kaum Zyanose, fassthorax. Blue Bloater (Bronchitis-Typ): Adipös, deutliche Zyanose (blue), viel Auswurf, oft geringere Dyspnoe, entwickelt rasch ein Cor pulmonale.
Lungenemphysem;Warum sind Patienten mit einem fortgeschrittenen Lungenemphysem häufig stark kachektisch (unterernährt)?;Die ausgeprägte Atemarbeit (permanenter Einsatz der Atemhilfsmuskulatur) verbraucht enorm viele Kalorien (bis zu 10-fach erhöht). Gleichzeitig behindert die schwere Atemnot die Nahrungsaufnahme, was rasch zu einem extremen Gewichtsverlust führt.
Lungenemphysem;Welche seltene, genetische Ursache kann auch bei Nichtrauchern in jungen Jahren zu einem Lungenemphysem führen?;Der Alpha-1-Antitrypsin-Mangel. Es fehlt ein Schutzprotein in der Lunge. Dadurch zerstören körpereigene Enzyme (Proteasen), die z.B. bei leichten Entzündungen ausgeschüttet werden, ungebremst das eigene Lungengewebe.
Lungenemphysem;Wie profitieren Emphysem-Patienten von der Atemtechnik "Lippenbremse"?;Beim Emphysem sind die Atemwege instabil. Bei der forcierten Ausatmung drohen sie zu kollabieren. Die Lippenbremse erzeugt einen positiven Druck (PEEP) in den Atemwegen, der diese von innen "aufschient", wodurch mehr alte Luft abgeatmet werden kann.
Lungenemphysem;Welches Akut-Ereignis droht, wenn eine oberflächliche Emphysemblase (Bulla) platzt?;Es entsteht ein Spontanpneumothorax. Durch das geplatzte Bläschen entweicht Atemluft in den Pleuraspalt, der lebenswichtige Unterdruck geht verloren und der betroffene Lungenflügel kollabiert, was zu plötzlicher, schwerer Dyspnoe führt.
Lungenemphysem;Was hören Sie bei der Auskultation und Perkussion über einem stark emphysematösen Thorax?;Perkussion (Klopfen): Hypersonorer (hohl klingender, "schachtelhalmer") Klopfschall aufgrund des massiven Luftgehalts. Auskultation: Abgeschwächtes Atemgeräusch bis hin zur "Silent Lung", da kaum noch Luftbewegung stattfindet.
Lungenemphysem;Warum führt ein Lungenemphysem langfristig zu einer Rechtsherzinsuffizienz (Cor pulmonale)?;Die Zerstörung der Alveolen geht mit der Zerstörung der dortigen Lungenkapillaren einher. Zudem verengen sich Gefässe durch chronischen O2-Mangel (Euler-Liljestrand-Mechanismus). Dies erhöht den pulmonalen Gefässwiderstand massiv; das rechte Herz muss extrem pumpen und versagt.
Lungenemphysem;Warum darf auch beim Lungenemphysem Sauerstoff nur vorsichtig (zielgesteuert) appliziert werden?;Wie bei schwerer COPD adaptiert sich das Atemzentrum an das chronisch hohe CO2 im Blut. Der Atemantrieb funktioniert oft nur noch über den Sauerstoffmangel (Hypoxie). Zu viel O2 stoppt die Atmung und führt zum tödlichen CO2-Koma.
Lungenödem;Was ist ein Lungenödem und wie unterscheidet sich das interstitielle vom alveolären Stadium?;Es ist ein Austritt von Blutflüssigkeit in die Lunge. Interstitielles Stadium: Flüssigkeit sammelt sich im Gewebe zwischen Kapillare und Alveole (Dyspnoe, oft noch trocken). Alveoläres Stadium: Flüssigkeit bricht in die Lungenbläschen ein (Brodeln, schaumiges Sputum, Erstickungsgefahr).
Lungenödem;Nennen Sie die Hauptursache für ein "kardiogenes Lungenödem".;Eine akute Linksherzinsuffizienz (z.B. durch Myokardinfarkt oder hypertensive Krise). Das linke Herz kann das Blut nicht in den Körper pumpen, es staut sich zurück in die Lungenvenen und Kapillaren. Der hohe hydrostatische Druck presst das Wasser ins Lungengewebe.
Lungenödem;Wie entsteht im Gegensatz dazu ein "toxisches Lungenödem" (nicht-kardiogen) und was ist das Tückische daran?;Es entsteht durch Inhalation von Reizgasen (Chlor, Rauchgas) oder Aspiration von Magensäure. Die Membran wird chemisch zerstört und "undicht" (erhöhte Permeabilität). Tückisch: Es tritt oft mit einer symptomfreien Latenzzeit von bis zu 24 Stunden nach der Exposition auf!
Lungenödem;Welche klinischen Leitsymptome zeigt ein Patient im Vollbild eines akuten Lungenödems?;Schwerste Dyspnoe, sitzende Haltung (Orthopnoe), Zyanose, Todesangst, "brodelnde" Atemgeräusche (feuchte Rasselgeräusche teils ohne Stethoskop hörbar), Tachykardie und Abhusten von schaumigem, oft rosafarbenem Sekret.
Lungenödem;Was ist die absolute Priorität in der Lagerung bei einem akuten kardialen Lungenödem und warum?;Sofortige und strikte Herzbettlagerung (aufrechter Oberkörper, Beine tief herabhängend). Dadurch versackt venöses Blut in den Beinen (Vorlastsenkung). Es fliesst weniger Blut zum Herzen und in die Lunge zurück, was den Druck auf das Ödem sofort reduziert.
Lungenödem;Warum ist bei einem kardialen Lungenödem die Gabe von Morphin oft indiziert (zwei Hauptgründe)?;1. Es lindert die panische Erstickungsangst und dämpft den unruhigen Atemantrieb (senkt den O2-Verbrauch). 2. Es bewirkt eine Vasodilatation (Erweiterung der Venen), was zu einem venösen Pooling führt und somit das linke Herz (Vorlast) entlastet.
Lungenödem;Welches ist das klassische Medikament (Diuretikum) zur Akuttherapie des Lungenödems und wie wirkt es?;Furosemid (Lasix), ein Schleifendiuretikum, meist i.v. verabreicht. Es führt kurzfristig zu einer leichten Venenerweiterung und mittelfristig zu einer massiven Urinausscheidung, was das Blutvolumen senkt und das Wasser aus der Lunge zurück ins Gefässsystem "zieht".
Lungenödem;Warum kommt bei der Sauerstofftherapie des Lungenödems häufig eine CPAP-Maske zum Einsatz?;Die reine O2-Gabe reicht oft nicht, da das Wasser die Diffusionsstrecke blockiert. CPAP (Continuous Positive Airway Pressure) bläst mit Überdruck Luft in die Lunge. Dieser Druck presst das Wasser aus den Alveolen zurück in das Interstitium/Kapillarsystem und hält die Atemwege offen.
Lungenödem;Welche Rolle spielt Nitroglycerin (Nitrospray) beim hypertensiven kardialen Lungenödem?;Wenn der Blutdruck stark erhöht ist, senkt Nitro extrem schnell die Vorlast (Venen) und die Nachlast (Arterien). Das Herz muss gegen weniger Widerstand anpumpen, kann sich entleeren und der Rückstau in die Lunge wird rasch abgebaut.
Lungenödem;Welche Infusionstherapie ist bei einem Lungenödem indiziert?;In der Regel sind Infusionen bei einem kardiogenen Lungenödem absolut kontraindiziert, da der Patient ohnehin schon an einer lebensgefährlichen Volumenüberladung des kleinen Kreislaufs leidet. Bestehende Infusionen müssen sofort gestoppt oder auf Minimalgeschwindigkeit (KVO) reduziert werden.
Motivierende Gespräche;Was ist die Grundhaltung (Spirit) der Motivierenden Gesprächsführung (MI) nach Miller und Rollnick?;MI basiert auf Partnerschaftlichkeit (Augenhöhe), Akzeptanz (bedingungslose Wertschätzung und Autonomie des Patienten), Mitgefühl (Compassion) und Evokation (Hervorlocken von Zielen/Lösungen aus dem Patienten). Es ist das Gegenteil von Experten-Belehrung.
Motivierende Gespräche;Welche Rolle spielt "Ambivalenz" bei Verhaltensänderungen und wie geht MI damit um?;Ambivalenz (Hin- und Hergerissen sein, z.B. rauchen wollen, aber gesund sein wollen) ist ein normales, zwingendes Stadium und kein "Widerstand". MI nutzt sie, um den Patienten seine eigenen Argumente für die Veränderung (Change Talk) aussprechen zu lassen, statt gegen ihn anzureden.
Motivierende Gespräche;Was verbirgt sich hinter dem Akronym OARS (bzw. BARS auf Deutsch) als Basistechniken der MI?;Offene Fragen (Open questions), Bestätigen/Würdigen (Affirmation), Aktives Zuhören/Reflektieren (Reflection) und Zusammenfassen (Summarizing). Diese Techniken steuern das Gespräch und bauen eine vertrauensvolle Basis auf.
Motivierende Gespräche;Erklären Sie den Unterschied zwischen "Change Talk" und "Sustain Talk".;Change Talk sind Äusserungen des Patienten, die für eine Veränderung sprechen (z.B. "Ich muss wirklich abnehmen für meine Gelenke"). Sustain Talk sind Argumente, die für die Beibehaltung des Status quo sprechen. Das Hauptziel von MI ist es, den Change Talk gezielt zu evozieren und zu verstärken.
Motivierende Gespräche;Was ist der "Korrekturreflex" (Righting Reflex) und warum ist er bei MI kontraproduktiv?;Es ist der starke Impuls von Pflegenden, den Patienten belehren und sofort gut gemeinte Lösungen aufzwingen zu wollen. Dies erzeugt Reaktanz (Widerstand) und drängt den Patienten dazu, sein ungesundes Verhalten verteidigen zu müssen (Sustain Talk).
Motivierende Gespräche;Wie reagieren Sie in der MI professionell auf "Widerstand" (Dissonanz) des Patienten?;Widerstand wird als Signal für eine Beziehungsstörung oder Überforderung verstanden. Man argumentiert nicht dagegen an (kein argumentatives Ping-Pong), sondern "rollt mit dem Widerstand": Man spiegelt die Emotion, wechselt das Thema oder gibt dem Patienten ausdrücklich die Autonomie zurück.
Motivierende Gespräche;Wozu dienen Skalierungsfragen (z.B. Zuversichtsskala 1-10) im Motivierenden Gespräch?;Sie machen Motivation und Zuversicht messbar und fördern den Change Talk. Fragt der Patient "Ich bin bei einer 4", fragt die Pflegende: "Warum eine 4 und keine 2?" (evoziert Gründe für den Wandel) oder "Was bräuchte es, um auf eine 5 zu kommen?" (deckt Ressourcen und Hürden auf).
Motivierende Gespräche;Warum ist das Transtheoretische Modell (TTM) von Prochaska/DiClemente eng mit MI verknüpft?;Das TTM beschreibt die Phasen der Verhaltensänderung (Absichtslosigkeit, Absichtsbildung, Vorbereitung, Handlung, Aufrechterhaltung). MI lehrt, dass die pflegerische Intervention exakt an die Phase angepasst werden muss, in der sich der Patient gerade befindet, sonst entsteht Widerstand.
Motivierende Gespräche;Wie intervenieren Sie bei einem Patienten in der Phase der Absichtslosigkeit (Precontemplation)?;In dieser Phase bringen Handlungspläne nichts. Das Ziel ist reiner Beziehungsaufbau. Man versucht, durch offene Fragen und nach Erlaubnis (!) sachlich informierend vorsichtig Zweifel am bisherigen Verhalten zu wecken, um ein Problembewusstsein zu schaffen.
Motivierende Gespräche;Was bedeutet das Prinzip der Evokation in der pflegerischen Praxis?;Es bedeutet, dass die Lösung im Patienten liegt, nicht in der Fachperson. Pflegende "locken hervor", indem sie nach den persönlichen Werten, Ressourcen und Ideen des Patienten fragen ("Wie haben Sie früher Krisen gemeistert?", "Was wäre für Sie der beste erste Schritt?").
Myokardinfarkt;Was ist ein Myokardinfarkt und wie entsteht er pathophysiologisch?;Es ist die irreversible Ischämie und Nekrose (Absterben) von Herzmuskelgewebe. Meist wird er durch die Ruptur einer arteriosklerotischen Plaque verursacht; an der Rissstelle bildet sich ein Thrombus, der die Koronararterie akut und komplett verschliesst.
Myokardinfarkt;Wie unterscheiden sich die Leitsymptome eines Myokardinfarkts bei Frauen oder Diabetikern oft von der "Klassik"?;Klassisch: Retrosternaler Vernichtungsschmerz, Ausstrahlung in linken Arm/Kiefer, Todesangst. Frauen/Diabetiker zeigen oft atypische Symptome: Starke Übelkeit, diffuse Oberbauchschmerzen, isolierte Atemnot, extreme Schwäche oder "stumme" (schmerzlose) Infarkte bei diabetischer Polyneuropathie.
Myokardinfarkt;Welche EKG-Veränderungen zeigen sich typischerweise bei einem frischen transmuralen Infarkt (STEMI)?;Das EKG zeigt eine signifikante ST-Strecken-Hebung in den Ableitungen, die dem betroffenen Infarktgebiet zugeordnet sind. Im weiteren Verlauf folgen oft eine T-Wellen-Inversion und (als Narbenzeichen) ein tiefer, pathologischer Q-Zacken.
Myokardinfarkt;Warum ist das hochsensitive Troponin (hs-cTn) der wichtigste Laborwert beim Verdacht auf einen Herzinfarkt?;Troponin ist ein Strukturprotein der Herzmuskelzellen. Es wird nur bei Nekrose (Zellzerfall) ins Blut freigesetzt. Es steigt rasch an (innerhalb von 1-3 Stunden) und ist der spezifischste Marker für einen Myokardschaden (wichtig zur Abgrenzung eines NSTEMI von einer instabilen Angina pectoris).
Myokardinfarkt;Welche medikamentösen Ansätze beinhaltet das klassische Notfall-Schema MONA beim akuten Herzinfarkt?;M: Morphin (Schmerz/Angst/Vorlastsenkung), O: O2 (nur bei SpO2 unter 90 Prozent), N: Nitrate (Vasodilatation/Vorlastsenkung, Achtung bei Hypotonie), A: ASS/Aspirin (Thrombozytenaggregationshemmung zur Thrombusstabilisierung).
Myokardinfarkt;Was ist die absolute Priorität in der medizinischen Therapie eines akuten STEMI ("Time is Muscle")?;Die schnellstmögliche Reperfusion (Wiedereröffnung) des verschlossenen Gefässes, um die Nekrose zu stoppen. Dies geschieht in der Regel durch eine primäre perkutane Koronarintervention (PCI/Herzkatheter) mit Ballondilatation und Stent-Einlage (Ziel: unter 90 Minuten).
Myokardinfarkt;Welche lebensbedrohliche Rhythmusstörung ist die häufigste Todesursache in den ersten Stunden eines Myokardinfarkts?;Das Kammerflimmern. Das minderdurchblutete (ischämische) Myokard ist elektrisch extrem instabil. Dies führt zu unkoordinierten, hochfrequenten Zuckungen des Muskels ohne Auswurfleistung (Herz-Kreislauf-Stillstand), was sofort defibrilliert werden muss.
Myokardinfarkt;Welche strukturellen Frühkomplikationen drohen bei einem massiven Infarkt der Herzwand?;Durch die Nekrose wird das Gewebe instabil. Es drohen ein Papillarmuskelabriss (führt zu akuter Mitralklappeninsuffizienz), ein Ventrikelseptumdefekt (Loch zwischen den Kammern) oder eine Herzwandruptur (Blutung in den Herzbeutel/Perikardtamponade). Alle führen zum kardiogenen Schock.
Myokardinfarkt;Welche pflegerischen Sofortmassnahmen leiten Sie bei Verdacht auf einen Herzinfarkt ein?;Alarmierung, absolute Herzbettlagerung (Oberkörper hoch zur Vorlastsenkung), absolute Körperruhe (keine Eigenbewegung des Patienten zur Senkung des O2-Verbrauchs im Myokard), enge Kleidung öffnen, 12-Kanal-EKG schreiben, grosslumige venöse Zugänge legen und lückenloses Monitoring starten.
Myokardinfarkt;Warum entwickelt sich nach einem grossen, überlebten Myokardinfarkt häufig eine chronische Herzinsuffizienz?;Das abgestorbene Herzmuskelgewebe regeneriert nicht, sondern wird durch starres, nicht-kontraktiles Bindegewebe (Narbe) ersetzt. Es kommt zum sogenannten "Remodeling" (Umbau), das Herz weitet sich aus, verliert massiv an Pumpleistung und entwickelt eine Insuffizienz.
Neuro;Wie unterscheiden sich das zentrale Nervensystem (ZNS) und das periphere Nervensystem (PNS) anatomisch und funktionell?;ZNS: Besteht aus Gehirn und Rückenmark, verarbeitet Informationen, steuert Bewusstsein, Kognition und Reflexe. PNS: Alle Hirn- und Spinalnerven ausserhalb des ZNS. Es ist das Leitungsnetz: afferent (Sensorik zum ZNS hin) und efferent (Motorik vom ZNS zum Muskel/Organ).
Neuro;Erklären Sie die antagonistische Wirkung von Sympathikus und Parasympathikus im vegetativen (autonomen) Nervensystem.;Der Sympathikus bereitet den Körper auf Leistung/Stress vor ("Fight or Flight", bewirkt Tachykardie, Bronchodilatation, weite Pupillen). Der Parasympathikus dient der Erholung und Verdauung ("Rest and Digest", bewirkt Bradykardie, enge Pupillen, gesteigerte Darmperistaltik).
Neuro;Was prüfen Sie im neurologischen Assessment bei der Pupillenkontrolle und was ist ein Warnzeichen für Hirndruck?;Man prüft Isokorie (Gleichheit), Form, Grösse und die prompte Reaktion auf Licht. Ein absolutes Alarmzeichen ist eine einseitig erweiterte (Anisokorie) und lichtstarre Pupille; dies deutet auf eine Einklemmung durch massiven Hirndruck hin (Kompression des N. oculomotorius).
Neuro;Wo wird der Liquor cerebrospinalis produziert und welche drei Hauptfunktionen hat er?;Produziert wird er in den Plexus choroidei (Gefässknäuel in den Hirnventrikeln). Seine Hauptfunktionen sind: Mechanischer Schutz (Stossdämpfer-Kissen), Stoffwechsel (Transport von Nährstoffen/Abbauprodukten) und Gewichtsreduktion des Gehirns durch Auftrieb im Wasserbad.
Neuro;Was ist die Blut-Hirn-Schranke und welche klinische Relevanz hat sie bei Infektionen (z.B. Meningitis)?;Es ist eine hochselektive Zellbarriere zwischen Blutgefässen und ZNS. Sie schützt das Gehirn vor Toxinen und Krankheitserregern. Klinisch erschwert sie die Therapie enorm, da viele Medikamente (z.B. Standard-Antibiotika) die gesunde Schranke nicht passieren können.
Neuro;Erklären Sie den anatomischen Ablauf eines Eigenreflexes (z.B. Patellarsehnenreflex).;Der Reiz (Dehnung) wird vom Rezeptor im Muskel aufgenommen, über sensible (afferente) Bahnen zum Rückenmark geleitet, dort über eine einzige Synapse direkt auf den motorischen (efferenten) Nerv umgeschaltet und löst die Kontraktion im gleichen Muskel aus – ganz ohne das Gehirn zu passieren.
Neuro;Was ist ein Dermatom und warum ist das Wissen darüber in der Pflege (z.B. nach einer PDA oder bei Herpes Zoster) wichtig?;Ein Dermatom ist das exakte Hautareal, das von einem einzigen Spinalnerven sensibel versorgt wird. Es hilft Pflegenden, die Höhe von Läsionen am Rückenmark zu lokalisieren (Sensibilitätsausfall ab Bauchnabel entspricht Th10) oder Schmerzausbreitungen (Gürtelrose) zuzuordnen.
Neuro;Wo kreuzen die motorischen Nervenbahnen der Pyramidenbahn und was ist die klinische Folge bei einem Schlaganfall (CVI)?;Die meisten Bahnen kreuzen im unteren Hirnstamm (Medulla oblongata) auf die Gegenseite. Folge: Eine Läsion in der rechten motorischen Hirnhälfte (Grosshirn) führt zu einer Lähmung (Hemiplegie) auf der linken, kontralateralen Körperseite.
Neuro;Welche Bedeutung hat der 10. Hirnnerv (Nervus vagus) im neurologischen System?;Er ist der Hauptnerv des Parasympathikus. Er wandert als einziger Hirnnerv in den Rumpf und innerviert lebenswichtige Organe (Lunge, Herz, Magen-Darm-Trakt), wo er herzfrequenzsenkend, blutdrucksenkend und verdauungsfördernd wirkt (Gefahr des Vagus-Reizes beim Absaugen!).
Neuro;Wie prüfen Sie klinisch mit dem "Halteversuch" grob die motorische Kraft der Arme und was prüfen Sie beim "Meningismus"?;Halteversuch: Patient hält beide Arme mit geschlossenen Augen und Handflächen nach oben (Supination) nach vorne gestreckt; sinkt ein Arm ab oder dreht sich nach innen (Pronation), deutet das auf eine Parese hin. Meningismus: Nackensteifigkeit; der Kopf lässt sich schmerzbedingt nicht passiv auf die Brust beugen.
Onkologie;Was ist der pathophysiologische Unterschied zwischen einer Hyperplasie und einer Neoplasie?;Hyperplasie ist eine reversible Zunahme der Zellzahl als Reaktion auf einen Reiz (z.B. Hornhaut bei Belastung). Neoplasie (Tumor) ist ein autonomes, unkontrolliertes und überschiessendes Gewebswachstum aufgrund von Gendefekten, das auch nach Wegfall des Auslösers persistiert.
Onkologie;Welche drei Kriterien unterscheiden bösartige (maligne) von gutartigen (benignen) Tumoren?;1. Wachstum: Maligne Tumoren wachsen infiltrativ und destruierend (zerstörend), benigne verdrängend. 2. Metastasierung: Nur maligne Tumoren bilden Tochtergeschwülste. 3. Differenzierung: Maligne Zellen sind entdifferenziert (atypisch), benigne Zellen ähneln dem Ursprungsgewebe.
Onkologie;Erklären Sie das TNM-System zur Klassifikation von Tumoren.;T (Tumor): Beschreibt die Grösse und lokale Ausdehnung des Primärtumors (T1-T4). N (Nodes): Beschreibt den Befall von regionalen Lymphknoten (N0-N3). M (Metastases): Gibt an, ob Fernmetastasen vorhanden sind (M0 oder M1).
Onkologie;Was versteht man unter dem "Grading" (G1 bis G4) eines Tumors?;Das Grading beschreibt den Grad der Malignität (Bösartigkeit) unter dem Mikroskop. G1 bedeutet hohe Differenzierung (ähnelt gesundem Gewebe, weniger aggressiv), G4 bedeutet völlige Entdifferenzierung (Anaplasie, sehr aggressiv und schnell wachsend).
Onkologie;Welche Symptome umfasst die sogenannte "B-Symptomatik" und worauf deutet sie hin?;Fieber (> 38 °C ohne Infekt), massiver Nachtschweiss (Wäschewechsel nötig) und ungewollter Gewichtsverlust (> 10 % in 6 Monaten). Sie deutet auf eine hohe Systemaktivität der Krebserkrankung hin und ist oft ein prognostisch relevantes Zeichen.
Onkologie;Was ist eine Metastasierung und welche drei Wege der Ausbreitung gibt es?;Es ist die Aussaat von Tumorzellen in gesundes Gewebe fernab des Primärtumors. Wege: 1. Lymphogen (über die Lymphbahnen), 2. Hämatogen (über die Blutbahn), 3. Intrakavitär (innerhalb von Körperhöhlen, z.B. Peritonealkarzinose).
Onkologie;Erklären Sie die Pathophysiologie der Tumorkachexie.;Es ist ein komplexes Auszehrungssyndrom. Tumorzellen schütten Zytokine (z.B. TNF-alpha) aus, die den Stoffwechsel massiv steigern, den Appetit hemmen und gleichzeitig den Abbau von Muskelmasse und Fettgewebe (Katabolismus) fördern. Sie ist durch normale Ernährung kaum aufzuhalten.
Onkologie;Was versteht man unter einem "paraneoplastischen Syndrom"?;Symptome, die nicht direkt durch das Tumorwachstum oder Metastasen verursacht werden, sondern durch vom Tumor produzierte Hormone oder Antikörper (z.B. ACTH-Produktion beim kleinzelligen Bronchial-Ca, was zu einem Cushing-Syndrom führt).
Onkologie;Warum ist die histologische Sicherung (Biopsie) vor jeder Krebstherapie zwingend erforderlich?;Weil die Wahl der Therapie (Chemo, Bestrahlung, OP, Antikörper) extrem spezifisch vom exakten Gewebetyp und den biologischen Eigenschaften der Zelle abhängt. Eine Fehlbehandlung aufgrund einer falschen Diagnose wäre wirkungslos und schädlich.
Onkologie;Was ist eine "Karzinogenese" und welche drei Phasen durchläuft sie?;Der Prozess der Krebsentstehung. 1. Initiation (irreversible Erbgutschädigung einer Zelle), 2. Promotion (weitere Reize führen zur Vermehrung der geschädigten Zelle), 3. Progression (der Tumor wird invasiv, bildet eigene Gefässe und beginnt zu metastasieren).
Onkologie Behandlung;Was ist der Unterschied zwischen einer kurativen und einer palliativen Therapiestrategie?;Kurativ: Das primäre Ziel ist die vollständige Heilung und dauerhafte Beseitigung des Tumors. Palliativ: Eine Heilung ist nicht mehr möglich; Ziel ist die Linderung von Symptomen, Erhalt der Lebensqualität und Lebensverlängerung.
Onkologie Behandlung;Erklären Sie den Unterschied zwischen neoadjuvanter und adjuvanter Therapie.;Neoadjuvant: Die Therapie (z.B. Chemo/Bestrahlung) erfolgt vor der Operation, um den Tumor zu verkleinern. Adjuvant: Die Therapie erfolgt nach der (kompletten) operativen Entfernung, um eventuell verbliebene Mikrometastasen zu zerstören und Rückfälle zu verhindern.
Onkologie Behandlung;Wie wirken Zytostatika (Chemotherapie) auf zellulärer Ebene?;Sie greifen in den Zellteilungszyklus ein und stören die DNA-Replikation oder Mitose. Da Tumorzellen sich besonders schnell teilen, sind sie empfindlicher, aber auch gesunde Gewebe mit hoher Teilungsrate (Schleimhaut, Haare, Knochenmark) werden geschädigt.
Onkologie Behandlung;Was ist eine Myelosuppression und welche drei Blutbildveränderungen resultieren daraus?;Die Unterdrückung der Knochenmarksfunktion durch Chemotherapie. Folgen: 1. Anämie (Sauerstoffmangel/Müdigkeit), 2. Leukopenie/Neutropenie (massive Infektgefahr), 3. Thrombozytopenie (erhöhte Blutungsneigung).
Onkologie Behandlung;Was ist ein Paravasat und welche pflegerischen Sofortmassnahmen sind bei einem Zytostatika-Paravasat nötig?;Zytostatika fliessen ins umliegende Gewebe statt in die Vene. Massnahmen: Infusion sofort stoppen, Kanüle liegen lassen und versuchen, Restmenge/Blut aspirieren, Arzt informieren, Extremität ruhigstellen und kühlen (bei manchen Stoffen wärmen), Dokumentation und Foto.
Onkologie Behandlung;Welche pflegerischen Hautpflege-Regeln gelten für Patienten während einer Strahlentherapie im Bestrahlungsfeld?;Keine Seifen/Duschmittel (nur lauwarmes Wasser), die Haut nur trocken tupfen (nicht reiben), keine Puder/Salben ohne Rücksprache, lockere Baumwollkleidung tragen (Reibung vermeiden), keine direkte Sonne und die Bestrahlungsmarkierungen niemals eigenmächtig entfernen.
Onkologie Behandlung;Was ist das Ziel der "Targeted Therapy" (zielgerichtete Therapie) in der Onkologie?;Diese Medikamente (z.B. monoklonale Antikörper) greifen gezielt spezifische Strukturen oder Signalwege an, die nur auf/in Tumorzellen vorkommen. Dadurch wird das gesunde Gewebe weniger geschädigt als bei der klassischen Chemotherapie.
Onkologie Behandlung;Wie unterscheidet sich "Tumor-Fatigue" von normaler Erschöpfung?;Fatigue ist eine lähmende, anhaltende körperliche und psychische Erschöpfung, die in keinem Verhältnis zur vorangegangenen Belastung steht und durch Schlaf oder Ruhepausen nicht gebessert werden kann. Sie schränkt die Lebensqualität massiv ein.
Onkologie Behandlung;Welche pflegerischen Massnahmen lindern eine therapiebedingte Stomatitis (Schleimhautentzündung)?;Regelmässige Mundspülungen (z.B. mit Salbeitee oder Kochsalz), Verzicht auf scharfe/saure/heisse Speisen, weiche Zahnbürsten verwenden, künstlicher Speichel bei Trockenheit und ggf. lokale Analgetika vor dem Essen.
Onkologie Behandlung;Welche psychologische Bedeutung hat die Alopezie (Haarausfall) für onkologische Patienten?;Die Haare sind ein zentrales Symbol für Identität, Attraktivität und Gesundheit. Der Verlust macht die Krankheit für das Umfeld sichtbar (Stigmatisierung) und führt oft zu einer schweren Erschütterung des Körperbildes (Body Image) und Selbstwertgefühls.
Orientierung;Welche vier Dimensionen der Orientierung werden im pflegerischen Assessment klassischerweise unterschieden?;1. Zur Zeit (Datum, Wochentag, Jahreszeit), 2. Zum Ort (Wo bin ich?), 3. Zur Situation (Warum bin ich hier?), 4. Zur Person (Name, Geburtsdatum, eigene Biografie).
Orientierung;Was ist der Unterschied zwischen einer örtlichen Desorientierung und einer situativen Desorientierung?;Örtlich: Der Patient weiss nicht, an welchem Ort er sich befindet (z.B. hält Spital für Hotel). Situativ: Der Patient erkennt den Sinn und Kontext der aktuellen Situation nicht (z.B. versteht nicht, warum er operiert werden muss oder warum Fremde ihn waschen).
Orientierung;Was ist das Ziel des "Reality Orientation Trainings" (ROT) und für welche Patientengruppe ist es geeignet?;Ziel ist die Verbesserung oder der Erhalt der Orientierung durch ständige Reize (Kalender, Uhren, Schilder, Wiederholung von Fakten). Es ist primär für Menschen in frühen Stadien der Demenz oder bei reversibler Verwirrtheit (Delir) geeignet.
Orientierung;Warum ist striktes ROT bei fortgeschrittener Demenz oft kontraproduktiv und führt zu herausforderndem Verhalten?;Da der Patient die objektive Realität kognitiv nicht mehr erfassen kann. Die ständige Konfrontation mit seinen Fehlern (z.B. "Heute ist nicht 1950") beschämt ihn, löst Stress aus und führt zu Rückzug oder Aggression. Hier ist Validation hilfreicher.
Orientierung;Welche Rolle spielt die "biografische Orientierung" für Menschen mit kognitiven Einschränkungen?;Wenn die aktuelle Zeit und der Ort verschwimmen, bleibt die eigene Lebensgeschichte (Biografie) der wichtigste Anker der Identität. Gespräche über die Vergangenheit bieten Sicherheit und Selbstwertgefühl ("Ich weiss noch, wer ich war").
Orientierung;Wie können Sie die räumliche Orientierung auf einer Abteilung durch "Milieutherapie" fördern?;Durch klare Farbleitsysteme (z.B. gelbe Linie zum WC), deutliche Piktogramme an Türen (Foto statt Text), gute Beleuchtung (Vermeidung von Angst auslösenden Schatten) und persönliche Gegenstände vor dem Zimmer (Wiedererkennungswert).
Orientierung;Warum fluktuiert (schwankt) die Orientierung bei einem Patienten mit Delir im Vergleich zu einem Demenzpatienten?;Das Delir ist eine akute Störung des Hirnstoffwechsels, die oft tageszeitabhängig (meist abends/nachts schlimmer) verläuft. Bei der Demenz ist der Orientierungsverlust meist stabil-progredient (langsam fortschreitend).
Orientierung;Wie wirkt sich "sensorische Deprivation" (Mangel an Sinnesreizen) auf die Orientierung aus?;Wenn Reize fehlen (z.B. keine Brille, kein Hörgerät, Isolation im Einzelzimmer), verliert das Gehirn den Kontakt zur Aussenwelt. Es fängt an, Reize selbst zu produzieren, was zu Halluzinationen und schwerer Desorientierung führen kann.
Orientierung;Was bedeutet "Orientierung geben durch Tagesstruktur"?;Feste Routinen, immer gleiche Abläufe und Bezugspersonen geben dem Patienten einen zeitlichen und sozialen Rahmen. Dies reduziert den kognitiven Aufwand für den Patienten, sich ständig neu zurechtfinden zu müssen, und vermittelt Sicherheit.
Orientierung;Welche Bedeutung hat die situative Orientierung für die Einwilligung in eine medizinische Massnahme (Urteilsfähigkeit)?;Nur wer situativ orientiert ist (den Sinn und die Folgen der Behandlung versteht), kann eine rechtlich gültige Einwilligung geben. Ist diese Orientierung nicht gegeben, muss ein gesetzlicher Vertreter entscheiden.
Osteoporose;Erklären Sie die grundlegende Pathophysiologie der Osteoporose.;Es besteht ein Ungleichgewicht im Knochenstoffwechsel: Die Aktivität der Osteoklasten (Knochenabbau) übersteigt die der Osteoblasten (Knochenaufbau). Dadurch sinkt die Knochendichte, die Mikroarchitektur des Knochengewebes wird zerstört und das Frakturrisiko steigt massiv an.
Osteoporose;Was ist der Unterschied zwischen einer primären und einer sekundären Osteoporose?;Primär: Tritt ohne direkte Vorerkrankung auf, meist altersbedingt (senil) oder durch Östrogenmangel nach der Menopause (postmenopausal). Sekundär: Folge einer anderen Erkrankung (z.B. Hyperkortisolismus) oder einer Langzeittherapie mit Medikamenten (z.B. Glukokortikoiden).
Osteoporose;Warum erhöht eine langjährige Cortison-Therapie das Risiko für Osteoporose?;Glukokortikoide hemmen direkt die Aktivität der Osteoblasten, fördern die Osteoklasten und vermindern gleichzeitig die Kalziumaufnahme im Darm. Dies führt zu einem raschen Verlust an Knochensubstanz (steroidinduzierte Osteoporose).
Osteoporose;Welche Knochen sind bei Osteoporose besonders häufig von Frakturen betroffen?;Die Wirbelkörper (Sinterungsfrakturen/Keilwirbelbildung), der Schenkelhals (Femurhalsfraktur) und die distale Radiusfraktur (handgelenksnaher Speichenbruch nach Sturz).
Osteoporose;Welche Rolle spielen Kalzium und Vitamin D3 in der Prophylaxe und Therapie?;Kalzium ist der wichtigste Baustein für die Knochenmatrix. Vitamin D3 ist zwingend erforderlich, um die Kalziumaufnahme aus dem Darm ins Blut zu ermöglichen und den Einbau in den Knochen zu fördern. Ohne Vitamin D bleibt das Kalzium wirkungslos.
Osteoporose;Was versteht man unter einer "Witwenbuckel"-Bildung (Kyphose)?;Durch multiple, oft schmerzlose Sinterungsfrakturen der Wirbelkörper bricht die vordere Wirbelkante ein. Die Wirbelsäule krümmt sich nach vorne, was zu einer Buckelbildung, einer Abnahme der Körpergrösse und einer Einschränkung der Lungenfunktion führen kann.
Osteoporose;Welche pflegerischen Massnahmen stehen bei der Sturzprophylaxe für Osteoporose-Patienten im Vordergrund?;Beseitigung von Stolperfallen, gute Beleuchtung, festes Schuhwerk, Einsatz von Gehhilfen, Kraft- und Balancetraining zur Sturzvermeidung sowie ggf. das Tragen von Hüftprotektoren, um im Falle eines Sturzes Frakturen zu verhindern.
Osteoporose;Warum ist regelmässige körperliche Belastung (Weight-bearing exercise) für den Knochen so wichtig?;Knochengewebe braucht mechanische Belastung (Druck und Zug), um aufgebaut zu werden. Durch Sport werden die Osteoblasten stimuliert. Inaktivität und Bettlägerigkeit hingegen beschleunigen den Knochenabbau massiv.
Osteoporose;Wie wirken Bisphosphonate (häufige Medikamentengruppe) bei Osteoporose?;Sie lagern sich an die Knochenoberfläche an und hemmen direkt die Osteoklasten. Dadurch wird der Knochenabbau verlangsamt und die Knochendichte kann stabilisiert oder sogar leicht erhöht werden.
Osteoporose;Was ist eine Osteodensitometrie (DXA-Messung)?;Es ist das Standardverfahren zur Messung der Knochendichte. Mittels schwacher Röntgenstrahlen wird der Mineralsalzgehalt (meist an LWS und Hüfte) gemessen. Das Ergebnis wird als T-Score angegeben (Osteoporose ab einem T-Score von <= -2,5).
Patientenedukation / Adhärenz;Definieren Sie den Begriff "Adhärenz" im Unterschied zur alten "Compliance".;Compliance bedeutet passives Befolgen von ärztlichen Anweisungen (Gehorsam). Adhärenz ist die Einhaltung gemeinsam vereinbarter Therapieziele durch den Patienten, basierend auf einer partnerschaftlichen Entscheidung (Shared Decision Making).
Patientenedukation / Adhärenz;Welche drei Faktoren beeinflussen die Adhärenz eines Patienten massiv?;1. Patientenbezogene Faktoren (Wissen, Ängste, Motivation), 2. Therapiebezogene Faktoren (Komplexität, Nebenwirkungen), 3. Systembezogene Faktoren (Vertrauen zum Personal, Kosten, Zugang zur Versorgung).
Patientenedukation / Adhärenz;Was ist das Ziel der Patientenedukation in der Pflege?;Ziel ist das "Empowerment": Der Patient soll befähigt werden, seine Erkrankung im Alltag selbstständig zu managen (Selbstmanagementkompetenz), richtige Entscheidungen zu treffen und dadurch eine höhere Lebensqualität zu erreichen.
Patientenedukation / Adhärenz;Erklären Sie die "Teach-Back-Methode" in der Edukation.;Am Ende einer Instruktion bittet man den Patienten, das Erklärte in seinen eigenen Worten zusammenzufassen (z.B.: "Erklären Sie mir bitte, wie Sie das Medikament morgen einnehmen"). So erkennt die Pflege sofort Missverständnisse oder Wissenslücken.
Patientenedukation / Adhärenz;Was bedeutet "Informierte Einwilligung" (Informed Consent)?;Dass ein Patient einer Massnahme erst zustimmt, nachdem er umfassend über Art, Umfang, Risiken, Erfolgsaussichten und Alternativen aufgeklärt wurde. Ohne diese Aufklärung ist jede Behandlung rechtlich eine Körperverletzung.
Patientenedukation / Adhärenz;Warum ist "Health Literacy" (Gesundheitskompetenz) eine wichtige Voraussetzung für Adhärenz?;Health Literacy ist die Fähigkeit, Gesundheitsinformationen zu finden, zu verstehen, zu bewerten und für eigene Entscheidungen anzuwenden. Patienten mit geringer Kompetenz verstehen oft den Sinn der Therapie nicht und brechen diese eher ab.
Patientenedukation / Adhärenz;Welche Rolle spielt die Selbstwirksamkeitserwartung nach Bandura für die Adhärenz?;Es ist der Glaube eines Menschen, eine schwierige Handlung (z.B. Ernährungsumstellung) aus eigener Kraft erfolgreich bewältigen zu können. Patienten mit hoher Selbstwirksamkeit zeigen eine deutlich bessere Adhärenz.
Patientenedukation / Adhärenz;Wie gehen Sie vor, wenn ein Patient eine lebensnotwendige Therapie ablehnt (Non-Adhärenz)?;Zuerst die Gründe wertfrei explorieren (Angst vor Nebenwirkungen? Mangelndes Wissen? Religiöse Gründe?). Die Autonomie des Patienten muss respektiert werden, aber die Pflege muss sicherstellen, dass die Ablehnung auf einer informierten Basis erfolgt.
