Patientenedukation / Adhärenz;Definieren Sie den Begriff "Adhärenz" im Unterschied zur alten "Compliance".;Compliance bedeutet passives Befolgen von ärztlichen Anweisungen (Gehorsam). Adhärenz ist die Einhaltung gemeinsam vereinbarter Therapieziele durch den Patienten, basierend auf einer partnerschaftlichen Entscheidung (Shared Decision Making).
Patientenedukation / Adhärenz;Welche drei Faktoren beeinflussen die Adhärenz eines Patienten massiv?;1. Patientenbezogene Faktoren (Wissen, Ängste, Motivation), 2. Therapiebezogene Faktoren (Komplexität, Nebenwirkungen), 3. Systembezogene Faktoren (Vertrauen zum Personal, Kosten, Zugang zur Versorgung).
Patientenedukation / Adhärenz;Was ist das Ziel der Patientenedukation in der Pflege?;Ziel ist das "Empowerment": Der Patient soll befähigt werden, seine Erkrankung im Alltag selbstständig zu managen (Selbstmanagementkompetenz), richtige Entscheidungen zu treffen und dadurch eine höhere Lebensqualität zu erreichen.
Patientenedukation / Adhärenz;Erklären Sie die "Teach-Back-Methode" in der Edukation.;Am Ende einer Instruktion bittet man den Patienten, das Erklärte in seinen eigenen Worten zusammenzufassen (z.B.: "Erklären Sie mir bitte, wie Sie das Medikament morgen einnehmen"). So erkennt die Pflege sofort Missverständnisse oder Wissenslücken.
Patientenedukation / Adhärenz;Was bedeutet "Informierte Einwilligung" (Informed Consent)?;Dass ein Patient einer Massnahme erst zustimmt, nachdem er umfassend über Art, Umfang, Risiken, Erfolgsaussichten und Alternativen aufgeklärt wurde. Ohne diese Aufklärung ist jede Behandlung rechtlich eine Körperverletzung.
Patientenedukation / Adhärenz;Warum ist "Health Literacy" (Gesundheitskompetenz) eine wichtige Voraussetzung für Adhärenz?;Health Literacy ist die Fähigkeit, Gesundheitsinformationen zu finden, zu verstehen, zu bewerten und für eigene Entscheidungen anzuwenden. Patienten mit geringer Kompetenz verstehen oft den Sinn der Therapie nicht und brechen diese eher ab.
Patientenedukation / Adhärenz;Welche Rolle spielt die Selbstwirksamkeitserwartung nach Bandura für die Adhärenz?;Es ist der Glaube eines Menschen, eine schwierige Handlung (z.B. Ernährungsumstellung) aus eigener Kraft erfolgreich bewältigen zu können. Patienten mit hoher Selbstwirksamkeit zeigen eine deutlich bessere Adhärenz.
Patientenedukation / Adhärenz;Wie gehen Sie vor, wenn ein Patient eine lebensnotwendige Therapie ablehnt (Non-Adhärenz)?;Zuerst die Gründe wertfrei explorieren (Angst vor Nebenwirkungen? Mangelndes Wissen? Religiöse Gründe?). Die Autonomie des Patienten muss respektiert werden, aber die Pflege muss sicherstellen, dass die Ablehnung auf einer informierten Basis erfolgt.
Patientenedukation / Adhärenz;Was versteht man unter "Mikroschulungen" im Pflegealltag?;Kurze (10-15 Min.), gezielte Lerneinheiten zu einem ganz spezifischen Thema (z.B. Insulin spritzen, Inhalationstechnik). Sie überfordern den Patienten weniger als lange Vorträge und lassen sich gut in den Stationsalltag integrieren.
Patientenedukation / Adhärenz;Warum scheitert Edukation oft in der "Transferphase"?;Weil das im Spital Gelernte (theoretisches Wissen) nicht auf die individuellen Barrieren zu Hause (Stress, fehlende Hilfe, Ablenkung) übertragen werden kann. Edukation muss daher immer den häuslichen Kontext einbeziehen.
Pflegeplanung;Wie werden Pflegeziele überprüft?;Durch die Evaluation (Soll-Ist-Vergleich). Man prüft, ob das Ziel innerhalb des festgelegten Zeitraums erreicht wurde. Falls nicht, müssen Ursachen analysiert und die Diagnose oder die Interventionen angepasst werden.
Pflegeplanung;Was bedeuten die Kürzel PESR, RUMBA/SMART und 6W in der Pflegeplanung?;PESR: Struktur der Pflegediagnose (Problem, Ätiologie, Symptome, Ressourcen). SMART/RUMBA: Kriterien für messbare Ziele (z.B. Spezifisch, Messbar). 6W: Struktur für präzise Massnahmen (Wer, Was, Wann, Wie, Wie oft, Womit).
Pflegeprozess & Qualität;Was ist der Pflegeprozess?;Ein problemgelöster, systematischer Regelkreis zur Planung, Durchführung und Evaluation der Pflege. Er besteht klassischerweise aus sechs Schritten (Fiechter/Meier) oder vier Schritten (WHO): Assessment, Diagnostik, Zielplanung, Intervention und Evaluation.
Pflegeprozess & Qualität;Welche Fähigkeiten benötigt eine Pflegende im Pflegeprozess?;Fachkompetenz (Wissen), Methodenkompetenz (Clinical Reasoning), Sozialkompetenz (Interaktion/Empathie) sowie die Fähigkeit zur kritischen Reflexion und strukturierten Dokumentation.
Pflegeprozess & Qualität;Was ist der Unterschied zwischen objektiven und subjektiven Merkmalen?;Objektiv: Messbare und nachprüfbare Daten (z.B. Vitalwerte, Labor, Wundgrösse). Subjektiv: Das persönliche Empfinden des Patienten (z.B. Schmerzintensität, Ängste, Übelkeit).
Pflegeprozess & Qualität;Was ist Pflegequalität?;Der Grad der Übereinstimmung zwischen den Zielen der Pflege (Soll-Zustand) und den tatsächlich erbrachten Leistungen (Ist-Zustand) unter Berücksichtigung von Patientenbedürfnissen und Expertenstandards.
Pflegeprozess & Qualität;Wie gewährleisten Sie Qualitätssicherung in Ihrem Arbeitsalltag?;Durch die Anwendung von Expertenstandards, lückenlose Dokumentation, die Teilnahme an Fallbesprechungen, die Evaluation von Pflegezielen und die Nutzung von evidenzbasierten Assessmentinstrumenten.
Pflegeprozess & Qualität;Welche Qualitätskriterien kennen Sie?;Kriterien der Strukturqualität (Personal, Ausstattung), Prozessqualität (korrekte Durchführung der Pflege) und Ergebnisqualität (Zufriedenheit, Zielerreichung, Komplikationsrate).
Pflegeprozess & Qualität;Was sind die Vorteile einer Concept Map?;Sie visualisiert komplexe Zusammenhänge zwischen Diagnosen, Ursachen und Interventionen, fördert das vernetzte Denken (Clinical Reasoning) und zeigt die Prioritäten der Pflege auf einen Blick.
Pflegeprozess & Qualität;Was sind Nachteile einer Concept Map?;Sie kann bei sehr vielen Problemen unübersichtlich werden, die Erstellung ist zeitaufwendig und sie erfordert eine hohe kognitive Abstraktionsfähigkeit der Erstellenden.
Pflegeprozess & Qualität;Erklären Sie das Qualitätsmodell nach Donabedian.;Es unterteilt Qualität in drei Säulen: 1. Strukturqualität (Rahmenbedingungen), 2. Prozessqualität (Handlungsabläufe), 3. Ergebnisqualität (Outcome des Patienten).
Pflegeprozess & Qualität;Von wem werden Pflegestandards erstellt?;Intern von Qualitätsgruppen des Betriebs oder extern durch Fachgesellschaften (z.B. DNQP Expertenstandards) auf Basis aktueller pflegewissenschaftlicher Erkenntnisse.
Pflegeprozess & Qualität;Welche Pflegestandards kennen Sie?;Beispiele sind die Expertenstandards zum Dekubitusrisiko, Sturzprophylaxe, Schmerzmanagement, Förderung der Harnkontinenz oder Pflege von Menschen mit chronischen Wunden.
Pflegeprozess & Qualität;Wo liegen die Grenzen von Pflegestandards?;Sie sind verallgemeinernd und können die individuelle Situation des Patienten nie vollständig abbilden. Sie entbinden die Pflegefachperson nicht von der Verantwortung, die Massnahmen an den Einzelfall anzupassen.
Pflegediagnostik;Was ist eine Pflegediagnose?;Eine klinische Beurteilung der Reaktion eines Individuums, einer Familie oder einer Gemeinschaft auf aktuelle oder potenzielle Gesundheitsprobleme oder Lebensprozesse (NANDA-I).
Pflegediagnostik;Was sind Vor- / Nachteile von Pflegediagnosen (für Pflege und für Pat.)?;Vorteile: Gemeinsame Fachsprache, Kontinuität der Pflege, erhöhte Patientensicherheit. Nachteile: Gefahr der Etikettierung (Stigmatisierung), zeitaufwendige Diagnosefindung, teils zu theoretische Formulierungen.
Pflegediagnostik;Was ist der Unterschied zwischen Pflegediagnosen und medizinischen Diagnosen?;Die medizinische Diagnose benennt die Pathologie (Krankheit). Die Pflegediagnose beschreibt die Auswirkungen der Krankheit auf das tägliche Leben und die Reaktion des Patienten darauf.
Pflegediagnostik;Wie kann die Pflegediagnose eine medizinische Diagnose positiv beeinflussen?;Durch die gezielte Behandlung der Symptomreaktionen (z.B. Schmerzlinderung oder Mobilisation) wird der Heilungsprozess beschleunigt und Komplikationen (z.B. Pneumonie), die den medizinischen Verlauf stören würden, werden vermieden.
Pflegediagnostik;Wie kann die Qualität von Pflegediagnosen überprüft werden?;Durch die PESR-Struktur (Problem, Ätiologie, Symptome, Ressourcen) sowie die Überprüfung der Stimmigkeit zwischen den beobachteten Merkmalen und den Definitionen in der NANDA-Klassifikation.
Pflegesysteme;Welche Pflegesysteme kennen Sie?;1. Funktionspflege (tätigkeitsorientiert, z.B. eine Person misst alle Blutdrücke), 2. Bereichspflege (Teampflege, Verantwortung für eine Gruppe von Pat.), 3. Bezugspflege/Primary Nursing (ganzheitliche Verantwortung einer Pflegeperson für einen Pat. vom Eintritt bis Austritt).
Pflegesysteme;Welche Bedeutung haben Angehörige in der Pflege?;Angehörige sind die wichtigste Ressource des Patienten, Experten für seine Biografie und Teil des sozialen Systems. Sie bieten emotionale Stütze, müssen aber auch selbst vor Überlastung geschützt und in den Informationsfluss einbezogen werden.
Pflegesysteme;Warum ist familienzentrierte Pflege wichtig (Definition)?;Sie betrachtet die Familie als Einheit (System). Krankheit betrifft alle Mitglieder; die Unterstützung der Familie stabilisiert den Patienten. Ziel ist die Stärkung der familiären Bewältigungsstrategien und die gemeinsame Entscheidungsfindung.
Pflegesysteme;Kriterien der Bezugspflege und Vergleich zu anderen Modellen?;Bezugspflege (Primary Nursing) beinhaltet die 24-Stunden-Verantwortung einer Pflegeperson für den gesamten Pflegeprozess eines Pat. Unterschied zur Funktionspflege: Ganzheitlichkeit statt Tätigkeitsorientierung. Unterschied zur Bereichspflege: Individuelle Verantwortung statt Teamverantwortung.
Pharma;Was unterscheidet die Pharmakokinetik von der Pharmakodynamik?;Pharmakokinetik: "Was macht der Körper mit dem Medikament?" (Aufnahme, Verteilung, Umbau, Ausscheidung). Pharmakodynamik: "Was macht das Medikament mit dem Körper?" (Wirkmechanismus am Rezeptor, Effekte).
Pharma;Erklären Sie den "First-Pass-Effekt".;Bei oraler Einnahme gelangt der Wirkstoff nach der Resorption im Darm über die Pfortader zuerst in die Leber. Dort wird ein Teil des Medikaments bereits abgebaut, bevor es den restlichen Körper (systemischen Kreislauf) erreicht.
Pharma;Was bedeutet die "Halbwertszeit" (t 1/2) eines Medikaments?;Die Zeitspanne, in der die Konzentration eines Arzneimittels im Blut auf die Hälfte des ursprünglichen Wertes abgesunken ist. Sie bestimmt massgeblich das Dosierungsintervall (wie oft eine Tablette genommen werden muss).
Pharma;Was ist der Unterschied zwischen einem Agonisten und einem Antagonisten am Rezeptor?;Ein Agonist bindet an einen Rezeptor und löst dort eine maximale Wirkung aus (Schlüssel-Schloss-Prinzip). Ein Antagonist besetzt den Rezeptor, löst aber keine Wirkung aus und blockiert ihn für andere Stoffe (Gegenspieler).
Pharma;Warum ist die "Therapeutische Breite" ein Mass für die Sicherheit eines Medikaments?;Sie beschreibt den Abstand zwischen der therapeutischen Dosis (Wirkung) und der toxischen Dosis (Vergiftung). Medikamente mit geringer therapeutischer Breite (z.B. Lithium, Digoxin) müssen engmaschig per Blutspiegel kontrolliert werden.
Pharma;Was bedeutet "Bioverfügbarkeit"?;Der Prozentsatz eines Wirkstoffs, der unverändert im systemischen Kreislauf (Blut) ankommt. Bei i.v. Gabe ist sie immer 100 %, bei oraler Gabe durch Abbauprozesse oft deutlich geringer.
Pharma;Warum müssen viele Medikamente bei Patienten mit Niereninsuffizienz niedriger dosiert werden?;Weil die renale Elimination (Ausscheidung über die Niere) verlangsamt ist. Das Medikament kumuliert (reichert sich an) im Körper, was ohne Dosisanpassung schnell zu toxischen Spiegeln führt.
Pharma;Erklären Sie den Begriff "Interaktion" (Wechselwirkung).;Die gegenseitige Beeinflussung von Medikamenten. Ein Stoff kann die Wirkung eines anderen verstärken (z.B. Alkohol und Schlafmittel) oder abschwächen (z.B. Antibiotika und die Pille).
Pharma;Was ist eine "Kontraindikation" und welche zwei Arten gibt es?;Ein Umstand, der die Anwendung eines Medikaments verbietet. Absolut: Das Medikament darf unter keinen Umständen gegeben werden (z.B. schwere Allergie). Relativ: Anwendung nur nach strenger Nutzen-Risiko-Abwägung.
Pharma;Warum sollten Tabletten in der Regel mit einem vollen Glas Leitungswasser eingenommen werden?;Um eine schnelle Passage in den Magen/Darm und eine gute Auflösung zu gewährleisten. Milch, Grapefruitsaft oder Kaffee können die Resorption massiv stören oder zu gefährlichen Interaktionen führen (z.B. Kalzium bindet Antibiotika).
Pharma;Wie wirken Nicht-Opioide und wie wirken Opioide?;Nicht-Opioide wirken primär peripher, indem sie die Bildung von Prostaglandinen (Schmerzbotenstoffe) hemmen. Opioide wirken zentral im Gehirn und Rückenmark, indem sie an spezifische Opiatrezeptoren binden und die Schmerzleitung sowie -wahrnehmung unterdrücken.
Pharma;Wirkung und Nebenwirkung Atrovent und Ventolin?;Ventolin (SABA, Salbutamol): Sympathomimetikum, wirkt rasch bronchodilatierend; NW: Tachykardie, Tremor. Atrovent (SAMA, Ipratropiumbromid): Parasympatholytikum, wirkt entkrampfend; NW: Mundtrockenheit, Harnverhalt.
Pharma;Besonderheiten bei der Verabreichung von Targin?;Targin ist ein Kombinationspräparat aus Oxycodon (Opioid) und Naloxon (Antagonist). Das Naloxon wirkt lokal im Darm gegen die Opioid-induzierte Obstipation, ohne die zentrale Schmerzlinderung aufzuheben. Tabletten dürfen nicht gemörsert werden!
Pharma;Effekt von ACE-Hemmern bei Niereninsuffizienz?;ACE-Hemmer wirken nephroprotektiv (nierenschützend), indem sie den Druck in den Glomeruli senken. Sie reduzieren die Proteinurie und verlangsamen dadurch das Fortschreiten der chronischen Niereninsuffizienz (v.a. bei Diabetikern).
Pharma;Wirkung Diuretika (Carrier-System) und Überwachung?;Sie blockieren Carrier-Systeme (Transportproteine wie Na-K-2Cl-Cotransporter) in den Nierentubuli. Dadurch werden Elektrolyte und Wasser vermehrt ausgeschieden. Überwachung: Gewicht, Elektrolyte (v.a. Kalium!), Blutdruck und Ödemrückgang.
Pharma;Bedeutung der Plasmaproteinbindung?;Arzneistoffe binden im Blut reversibel an Proteine (z.B. Albumin). Nur der freie, ungebundene Anteil ist pharmakologisch wirksam. Bei Proteinmangel oder Verdrängung durch andere Medikamente steigt die freie Wirkstoffkonzentration (Gefahr der Toxizität).
Pharma;Unterschiede in Pharmakokinetik und Pharmadynamik?;Pharmakokinetik beschreibt die Prozesse, denen ein Arzneistoff im Körper unterliegt (ADME-Modell: Aufnahme, Verteilung, Umbau/Metabolismus, Ausscheidung). Pharmadynamik beschreibt die biochemische und physiologische Wirkung des Medikaments am Wirkort (z.B. Rezeptorbindung).
Pharma;Besonderheiten im Medikamentenmanagement bei älteren Patienten?;Pharmakokinetik: Verminderte Nieren- und Leberleistung (langsamerer Abbau/Ausscheidung), weniger Körperwasser und mehr Fett (veränderte Verteilung). Pharmadynamik: Erhöhte Sensibilität (z.B. ZNS) und erhöhtes Nebenwirkungsrisiko (Multimorbidität/Polypharmazie).
Pharma;Was ist ASS und wer bekommt es?;Acetylsalicylsäure (ASS) ist ein Thrombozytenaggregationshemmer. Es wird Patienten mit KHK, nach Herzinfarkt oder Schlaganfall verschrieben, um das Verkleben von Blutplättchen zu verhindern und so erneute Gefässverschlüsse zu vermeiden.
Physiologie;Energiequelle der Zelle und Glukosemangel?;Die Zelle gewinnt Energie (ATP) primär durch die Glykolyse und Zellatmung aus Glukose. Ist Glukose aufgebraucht, nutzt der Körper erst Glykogenvorräte (Leber/Muskel), dann Lipolyse (Fettabbau mit Bildung von Ketonkörpern) und im Hungerzustand Proteolyse (Muskelabbau).
Physiologie;Erklären Sie das RAAS (Renin-Angiotensin-Aldosteron-System).;Ein Hormonsystem zur Blutdruck- und Volumenregulation. Sinkt der Blutdruck, schüttet die Niere Renin aus -> spaltet Angiotensinogen zu Angiotensin I -> Umwandlung durch ACE zu Angiotensin II (starke Vasokonstriktion + Aldosteron-Freisetzung zur Wasser-Rückresorption).
Pneumonie;Wie entsteht eine Pneumonie und was begünstigt sie?;Entsteht durch infektiöse (Bakterien, Viren) oder nicht-infektionsbedingte (Aspiration, Reizgase) Entzündung des Lungengewebes. Begünstigende Faktoren: Immobilität, flache Atmung, verminderter Hustenreflex, Exsikkose und Immunschwäche.
Pneumonieprophylaxe;Was sind die Prinzipien der Pneumonieprophylaxe nach LISA?;L: Lungenbelüftung verbessern (Mobilisation, Atemübungen), I: Infektionen vermeiden (Asepsis, Mundhygiene), S: Sekretmanagement (Flüssigkeit, Inhalation, Hustentechniken), A: Aspirationsprophylaxe (Oberkörperhochlagern beim Essen).
Pneumonieprophylaxe;Erklären Sie die VATI-Lagerung und deren Wirkung.;Es sind Lagerungsformen zur Belüftungsförderung: V-Lagerung (Belüftung der unteren Lungenbezirke), A-Lagerung (oberere Bezirke), T-Lagerung (alle Bezirke gleichmässig), I-Lagerung (gezielte Dehnung einer Flanke).
Professionalität;Unterschied zwischen FaGe und einer Pflegefachperson HF?;Die FaGe arbeitet primär in stabilen, delegierten Situationen nach Vorgabe. Die HF trägt die Verantwortung für komplexe Prozesse, Clinical Reasoning, Steuerung der Pflege, interdisziplinäre Koordination und wissenschaftsbasierte Entscheidungsfindung.
Professionalität;Was bedeutet Professionalisierung und professionelle Pflege?;Professionalisierung ist der Prozess zur Erlangung des Status einer Profession (Eigengestaltung, Ethik, Wissen). Professionelle Pflege basiert auf fachlicher Expertise, ethischen Richtlinien, wissenschaftlicher Fundierung und reflektiertem Handeln.
Professionalität;Umsetzung des Leitsatzes (Spital Schwyz) in der Praxis?;Individuelle Antwort erforderlich, meist: Fokus auf Patientenzentrierung, Wertschätzung im Team, Sicherheit und hohe Fachkompetenz im Alltag durch Clinical Reasoning und empathische Kommunikation vorleben.
Professionalität;Wie bilden Sie sich nach dem Studium weiter?;Durch Fachvertiefungen (CAS/DAS/MAS in Onkologie, Intensivpflege etc.), regelmässiges Studium von Fachjournalen, Besuch von Kongressen und das Anstreben von Rollen wie APN (Advanced Practice Nurse) oder Berufsbildnerin.
Professionalität;Wo und wie können Sie ein Vorbild sein?;Durch ethisch korrektes Handeln, konsequente Einhaltung von Standards, wertschätzende Kommunikation gegenüber Lernenden und durch die Bereitschaft, das eigene Handeln jederzeit kritisch zu hinterfragen.
Psychologie;Was ist die Definition einer Krise?;Ein zeitlich begrenzter Zustand des Ungleichgewichts zwischen einer akuten Belastung (Ereignis) und den aktuell zur Verfügung stehenden individuellen Bewältigungsstrategien (Ressourcen).
Psychologie;Wie zeigt sich maladaptives Coping?;Durch dysfunktionale Bewältigungsstrategien wie Verleugnung der Krankheit, sozialer Rückzug, Aggression gegen das Personal oder Substanzmissbrauch (Alkohol/Medikamente), was die Heilung behindert.
Psychologie;Was passiert im Körper bei einer Stressreaktion?;Aktivierung der Sympathikus-Nebennierenmark-Achse (Adrenalin: Puls/Blutdruck hoch) und der Hypothalamus-Hypophysen-Nebennierenrinden-Achse (Cortisol: Bereitstellung von Energiereserven, langfristig immunsuppressiv).
Psychosoziale Begleitung;Wie unterstützen Sie Patienten in Isolation bei sozialen Kontakten?;Einsatz digitaler Medien fördern (Video-Telefonie), häufige kurze Präsenzzeiten der Pflege (Einsamkeit mindern), Bereitstellen von Unterhaltungsmedien, Angehörige über Schutzmassnahmen schulen, damit Besuche trotz Isolation sicher möglich sind.
Qualität;Fehlermanagement: Welche Kultur wird gelebt?;Ideal ist eine "Just Culture": Fehler werden nicht bestraft, sondern als Lernchance genutzt. Instrumente wie CIRS (Critical Incident Reporting System) dienen der anonymen Meldung von Beinahe-Fehlern zur Systemverbesserung.
Qualität;Unterstützung einer Kollegin nach einem Fehler?;Zuerst emotionale Unterstützung (Entlastung), dann sachliche Analyse (Was ist passiert?), gemeinsame Schadensbegrenzung, Ermutigung zur Meldung/Dokumentation und Fokus auf Prävention für die Zukunft statt auf Schuldzuweisung.
Querschnittslähmung;Was ist der Unterschied zwischen einer Paraplegie und einer Tetraplegie?;Eine Paraplegie betrifft die Lähmung der unteren Extremitäten (Läsion unterhalb von Th1). Eine Tetraplegie betrifft alle vier Extremitäten sowie Teile der Rumpf- und Atemmuskulatur (Läsion im Bereich der Halswirbelsäule, C1-C8).
Querschnittslähmung;Was versteht man unter einem "spinalen Schock" unmittelbar nach dem Trauma?;Es ist ein Zustand des völligen Ausfalls aller Reflexe, der Motorik und Sensorik unterhalb der Läsion sowie ein Wegfall des Sympathikustonus. Er kann Tage bis Wochen anhalten und geht später meist in eine spastische Lähmung über.
Querschnittslähmung;Warum ist eine Läsion oberhalb von C4 lebensbedrohlich?;Weil die Atemmuskulatur (Nervus phrenicus, der das Zwerchfell innerviert) aus den Segmenten C3-C5 entspringt. Eine Läsion oberhalb von C4 führt zum Atemstillstand und erfordert eine lebenslange Beatmung.
Querschnittslähmung;Erklären Sie die Pathophysiologie der "autonomen Dysreflexie" bei Läsionen oberhalb von Th6.;Ein Reiz unterhalb der Läsion (z.B. volle Blase) löst eine massive Sympathikusreaktion aus (Vasokonstriktion, extremer Blutdruckanstieg). Da die dämpfenden Signale vom Gehirn die Läsion nicht passieren können, kommt es zu lebensgefährlichen Blutdruckspitzen.
Querschnittslähmung;Welche Symptome zeigt ein Patient oberhalb der Läsion während einer autonomen Dysreflexie?;Massive pulsierende Kopfschmerzen, hochrotes Gesicht, Schwitzen, verstopfte Nase und Bradykardie (Versuch des Körpers, den Blutdruck über den Vagusnerv zu senken).
Querschnittslähmung;Was ist eine "neurogene Blasenentleerungsstörung" und welche zwei Hauptformen gibt es?;Die Kommunikation zwischen Gehirn und Blase ist unterbrochen. 1. Reflexblase (spastisch): Blase entleert sich unkontrolliert bei Füllung. 2. Schlaffe Blase: Blase dehnt sich massiv aus ohne Entleerung (Gefahr des Harnrückstaus in die Nieren).
Querschnittslähmung;Warum ist die Thromboseprophylaxe bei Querschnittgelähmten von so zentraler Bedeutung?;Durch den Wegfall der Muskel-Venen-Pumpe in den Beinen und die oft gestörte Vasomotorik (Blutgefässweite) staut sich das Blut massiv. Das Risiko für tiefe Venenthrombosen und Lungenembolien ist daher extrem hoch.
Querschnittslähmung;Was versteht man unter "Deafferenzierten Schmerzen" bei Querschnittlähmung?;Es sind neuropathische Schmerzen, die der Patient in Bereichen empfindet, die eigentlich gefühllos (gelähmt) sind. Sie entstehen durch Fehlverschaltungen im Rückenmark oder Gehirn nach dem Verlust der normalen Nerveneingänge.
Querschnittslähmung;Welche pflegerischen Prioritäten setzen Sie bei der Darmfiltration (Darmmanagement) bei Querschnittlähmung?;Ziel ist eine regelmässige, geplante Entleerung zur Vermeidung von Inkontinenz oder Ileus. Dies geschieht durch ballaststoffreiche Ernährung, ausreichende Trinkmenge, Bauchmassagen und digitale Stimulation oder Suppositorien zu festen Zeiten.
Querschnittslähmung;Wie verändert sich die Sexualität bei Querschnittlähmung?;Die genitale Sensibilität ist oft verloren, aber Sexualität bleibt ein Bedürfnis. Bei Männern kann eine Reflexerektion möglich sein (ohne Gefühl), bei Frauen ist die Fertilität meist erhalten. Psychosexuelle Begleitung und Edukation über alternative Erogene Zonen sind essenziell.
REHA;Definieren Sie das Ziel der medizinischen Rehabilitation im Unterschied zur Akutbehandlung.;Die Akutbehandlung zielt auf die Heilung oder Stabilisierung einer Krankheit ab. Die Rehabilitation zielt darauf ab, die Folgen einer Krankheit (Behinderungen/Einschränkungen) zu minimieren, die Selbstständigkeit wiederherzustellen und die Teilhabe am sozialen Leben zu sichern.
REHA;Erklären Sie das Prinzip der "Neuroplastizität" in der neurologischen Rehabilitation.;Das Gehirn ist fähig, sich lebenslang umzustrukturieren. Nach einer Schädigung (z.B. CVI) können gesunde Hirnareale durch intensives Training (Lernen) die Funktionen der zerstörten Gebiete teilweise oder ganz übernehmen.
REHA;Was ist die "ICF" (International Classification of Functioning, Disability and Health) und warum ist sie das Fundament der REHA?;Die ICF klassifiziert Gesundheit nicht nach Diagnosen, sondern nach Funktionsfähigkeit. Sie betrachtet Körperstrukturen, Aktivitäten und Teilhabe unter Berücksichtigung von Umweltfaktoren und persönlichen Faktoren.
REHA;Was versteht man unter dem "interprofessionellen Team" in der Rehabilitation?;Pflege, Physiotherapie, Ergotherapie, Logopädie, Psychologie, Sozialdienst und Ärzte arbeiten nicht nebeneinander, sondern verfolgen gemeinsam mit dem Patienten koordinierte Therapieziele (wöchentliche Teambesprechungen).
REHA;Nennen Sie den Unterschied zwischen "Restitution" und "Kompensation" in der REHA.;Restitution: Vollständige Wiederherstellung einer gestörten Funktion (z.B. Arm wird wieder voll beweglich). Kompensation: Ersatz einer verlorenen Funktion durch Hilfsmittel oder andere Strategien (z.B. Rollstuhl bei Gehfähigkeit, Einhand-Eisessen).
REHA;Was ist die Aufgabe der Pflegefachperson HF in der Rehabilitation (im Gegensatz zur Akutpflege)?;Die Pflege hat eine Edukations- und Coaching-Rolle. Sie stellt sicher, dass die in den Therapien gelernten Fähigkeiten (z.B. Waschtraining der Ergotherapie) im 24-Stunden-Alltag auf der Abteilung konsequent angewendet und gefestigt werden.
REHA;Welche Bedeutung hat die "Zielvereinbarung" mit dem Patienten in der REHA?;Motivation ist der Schlüssel zum Erfolg. Ziele müssen SMART sein und für den Patienten einen Alltagsbezug haben (z.B. "Ich möchte wieder alleine zum Briefkasten gehen können"), um die Adhärenz im anstrengenden Therapieprozess zu sichern.
REHA;Was ist eine "Frührehabilitation"?;Sie beginnt bereits während der Akutbehandlung (z.B. auf der Intensivstation), sobald die Vitalfunktionen stabil sind. Ziel ist die Vermeidung von Sekundärschäden (Kontrakturen, Pneumonien, Dekubitus) und der frühestmögliche Beginn der Mobilisation.
REHA;Warum ist die Sturzprophylaxe in der REHA-Phase besonders kritisch?;Patienten überschätzen oft ihre Fortschritte oder sind durch Medikamente/neurologische Defizite unsicher. Ein Sturz in der REHA-Phase kann das physische und psychische Vertrauen massiv zurückwerfen und den Erfolg gefährden.
REHA;Was versteht man unter "Sozialer Reintegration"?;Der Prozess der Rückkehr in das gewohnte soziale Umfeld, die Wohnung und ggf. den Beruf. Dies beinhaltet auch die Anpassung des Wohnraums (Barrierefreiheit) und die Organisation von ambulanter Unterstützung (Spitex).
Relokation;Was ist das "Relokationssyndrom" (auch Verlegungs- oder Heimeintritts-Stress-Syndrom)?;Ein klinisches Bild mit physischen und psychischen Symptomen (Unruhe, Verwirrtheit, Sturzneigung, Depression), das als Reaktion auf einen plötzlichen Ortswechsel (z.B. Spitaleinweisung oder Heimeintritt) auftritt.
Relokation;Warum sind Menschen mit Demenz besonders gefährdet für ein Relokationssyndrom?;Weil ihre Fähigkeit zur Anpassung an neue Umgebungen massiv eingeschränkt ist. Bekannte Strukturen und Gegenstände geben ihnen Sicherheit; fehlt diese Vertrautheit, geraten sie in einen Zustand extremer Angst und Desorientierung.
Relokation;Nennen Sie drei typische Symptome eines akuten Relokationssyndroms.;1. Akute Verwirrtheit (Delir-Gefahr), 2. Schlafstörungen und Agitation, 3. Verweigerung von Nahrung oder Medikamenten sowie sozialer Rückzug.
Relokation;Was ist der Unterschied zwischen einer "geplanten" und einer "ungeplanten" Relokation hinsichtlich der Belastung?;Eine geplante Relokation erlaubt Vorbereitung, Besichtigung des neuen Ortes und Mitsprache, was den Kontrollverlust mindert. Eine ungeplante Relokation (Notfall) wird als massives Trauma erlebt und erhöht die Mortalität signifikant.
Relokation;Welche Rolle spielt der "Kontrollverlust" beim Relokationssyndrom?;Der Mensch verliert die Herrschaft über seinen Tagesablauf, seinen Raum und seine Privatsphäre. Dieser Verlust an Autonomie ist einer der stärksten Stressoren für die menschliche Psyche und führt zu Gefühlen von Hilflosigkeit.
Relokation;Wie können Pflegende den Eintritt in ein Heim (Relokation) abmildern?;Durch das Zulassen von persönlichen Gegenständen (Möbel, Bilder), eine Bezugspflegeperson ab dem ersten Tag, die Beibehaltung gewohnter Rituale und eine Biografiearbeit, die dem neuen Bewohner das Gefühl gibt, als Individuum gesehen zu werden.
Relokation;Was versteht man unter "Transferschock"?;Ein Synonym für das Relokationssyndrom, das besonders die physiologische Belastung (Anstieg von Cortisol, Herzfrequenz) und die daraus resultierende erhöhte Infekt- und Sturzanfälligkeit direkt nach dem Ortswechsel beschreibt.
Relokation;Wie lange dauert die typische Anpassungsphase nach einer Relokation?;Die akute Phase dauert meist einige Tage, die vollständige Einlebungs- und Integrationsphase kann jedoch 3 bis 6 Monate in Anspruch nehmen. In dieser Zeit ist die engmaschige Beobachtung auf depressive Entwicklungen wichtig.
Relokation;Welche Bedeutung haben die Angehörigen im Prozess der Relokation?;Sie sind die Brücke zur alten Identität. Sie können Informationen über Vorlieben und Abneigungen liefern und dem Betroffenen durch Präsenz Sicherheit vermitteln. Gleichzeitig müssen Angehörige oft selbst bei Schuldgefühlen (wegen Heimeintritt) unterstützt werden.
Relokation;Warum erhöht ein Relokationssyndrom das Risiko für eine Sturzfolge?;Die Desorientierung in der neuen Umgebung führt zu Fehlbewegungen, das Stressniveau beeinträchtigt die Koordination und die oft eingesetzten Sedativa zur Beruhigung erhöhen die Sturzgefahr zusätzlich.
Schädel-Hirn-Trauma;Was ist der Unterschied zwischen einer Commotio, Contusio und Compressio cerebri?;Commotio (Grad 1): Gehirnerschütterung, reversible Funktionsstörung, keine Gewebeschäden. Contusio (Grad 2/3): Gehirnprellung mit Gewebeschäden (Nekrosen/Blutungen). Compressio: Gehirnquetschung durch Druck (Hämatom/Ödem), führt zur Einklemmung.
Schädel-Hirn-Trauma;Erklären Sie das "Coup" und "Contrecoup"-Phänomen bei einem SHT.;Coup: Der Schaden entsteht direkt am Ort des Aufpralls. Contrecoup: Durch die Trägheit schlägt das Gehirn an der gegenüberliegenden Schädelseite auf und verursacht dort zusätzliche Verletzungen (Gegenstoss).
Schädel-Hirn-Trauma;Wie werden die Schweregrade des SHT anhand der Glasgow Coma Scale (GCS) eingeteilt?;Leichtes SHT: GCS 13-15 Punkte. Mittelschweres SHT: GCS 9-12 Punkte. Schweres SHT: GCS 3-8 Punkte (bewusstlos, meist intubationspflichtig).
Schädel-Hirn-Trauma;Was ist ein "freies Intervall" und für welche Verletzung ist es klassisch?;Ein Patient ist nach dem Trauma kurz bewusstlos, wacht dann auf und ist scheinbar orientiert, bevor er nach Minuten bis Stunden erneut eintrübt. Dies ist das klassische Zeichen für ein epidurales Hämatom (arterielle Blutung).
Schädel-Hirn-Trauma;Warum ist das Absaugen bei Verdacht auf eine Schädelbasisfraktur streng kontraindiziert?;Es besteht die Gefahr, dass die Sonden durch den frakturierten Knochen direkt in den Hirnraum gelangen (Infektionsgefahr/Verletzungsgefahr). Ebenso dürfen keine Magensonden nasal gelegt werden.
Schädel-Hirn-Trauma;Was bedeutet "Liquorrhoe" und worauf deutet sie klinisch hin?;Das Austreten von klarer Hirnflüssigkeit aus Nase oder Ohr. Es ist ein sicheres Zeichen für eine offene Schädel-Hirn-Verletzung (Dura-Riss), meist im Rahmen einer Schädelbasisfraktur.
Schädel-Hirn-Trauma;Welche klinischen Zeichen deuten auf ein "Brillenhämatom" hin und was ist die Ursache?;Blaufärbung rund um beide Augen ohne direktes Trauma der Augenpartie. Es entsteht durch Blut, das aus einer Fraktur der vorderen Schädelgrube in das lockere Bindegewebe der Augenhöhlen einsickert.
Schädel-Hirn-Trauma;Warum muss bei einem SHT-Patienten der Blutdruck stabil im normotensiven Bereich gehalten werden?;Ein zu niedriger Blutdruck (Hypotonie) gefährdet die Hirndurchblutung (CPP), während ein zu hoher Blutdruck das Hirnödem und bestehende Blutungen massiv verschlimmert.
Schädel-Hirn-Trauma;Was ist das Ziel der "Hypothermie-Behandlung" bei schwerem SHT?;Durch die Senkung der Körpertemperatur (auf ca. 33-35 Grad) wird der zerebrale Zellstoffwechsel und damit der Sauerstoffbedarf des Gehirns reduziert, was das Ausmass der Sekundärschäden verringern soll.
Schädel-Hirn-Trauma;Welche langfristigen neuropsychologischen Folgen können nach einem mittelschweren SHT auftreten?;Wesensveränderungen, Konzentrationsstörungen, erhöhte Reizbarkeit, Gedächtnislücken, schnelle Ermüdbarkeit (Fatigue) und teils posttraumatische Epilepsie.
Schlafmittel;Was ist der Wirkmechanismus von Benzodiazepinen (z.B. Temesta) am GABA-Rezeptor?;Sie wirken als allosterische Modulatoren am GABA-A-Rezeptor. Sie verstärken die Bindung des körpereigenen Hemmstoffes GABA, wodurch Chlorid-Ionen in die Zelle fliessen. Die Zelle wird hyperpolarisiert und ist weniger erregbar (beruhigend/schlaffördernd).
Schlafmittel;Welche vier Hauptwirkungen haben Benzodiazepine?;1. Anxiolytisch (angstlösend), 2. Sedierend (beruhigend/schlaffördernd), 3. Muskelrelaxierend (muskelentspannend), 4. Antikonvulsiv (krampfmildernd).
Schlafmittel;Warum sind Benzodiazepine bei älteren Menschen kritisch zu betrachten (Sturzgefahr)?;Durch die muskelrelaxierende Wirkung (Gangunsicherheit) und die Beeinträchtigung der kognitiven Wachheit (Hangover am nächsten Tag) steigt das Sturzrisiko und damit das Risiko für Schenkelhalsfrakturen massiv an.
Schlafmittel;Was ist der Unterschied zwischen Z-Substanzen (z.B. Zolpidem) und klassischen Benzodiazepinen?;Z-Substanzen binden spezifischer an die Alpha-1-Untereinheit des GABA-Rezeptors. Sie wirken stark schlafanstossend, haben aber kaum muskelrelaxierende oder angstlösende Effekte und eine kürzere Halbwertszeit.
Schlafmittel;Erklären Sie den Begriff "Rebound-Insomnie" nach Absetzen von Schlafmitteln.;Nach dem plötzlichen Absetzen einer längerfristigen Einnahme tritt die Schlaflosigkeit verstärkt wieder auf (schlimmer als vor der Therapie). Dies führt oft zu einem Teufelskreis und erneuter Medikamenteneinnahme.
Schlafmittel;Warum ist die Kombination von Schlafmitteln und Alkohol lebensgefährlich?;Alkohol verstärkt die dämpfende Wirkung am ZNS unvorhersehbar. Es kann zu einer massiven Atemdepression bis hin zum Atemstillstand kommen, da beide Stoffe das Atemzentrum im Hirnstamm hemmen.
Schlafmittel;Welche Rolle spielt Melatonin physiologisch bei der Schlafregulation?;Melatonin ist das "Dunkelhormon", das in der Zirbeldrüse (Epiphyse) produziert wird. Es signalisiert dem Körper die Nachtphase und steuert den zirkadianen Rhythmus. Als Medikament wird es primär bei Jetlag oder Einschlafstörungen im Alter eingesetzt.
Schlafmittel;Was versteht man unter "Toleranzentwicklung" bei Schlafmitteln?;Der Körper gewöhnt sich an die Substanz. Um den gleichen schlaffördernden Effekt zu erzielen, muss die Dosis immer weiter gesteigert werden, was das Risiko für eine Abhängigkeit (Sucht) erhöht.
Schlafmittel;Wann sollten Schlafmittel (Hypnotika) idealerweise eingenommen werden und was ist die pflegerische Konsequenz?;Die Einnahme erfolgt unmittelbar vor dem geplanten Schlafen (ca. 15-30 Min. vorher). Konsequenz: Der Patient sollte danach das Bett nicht mehr verlassen (Sturzprophylaxe!).
Schlafmittel;Welche pflanzlichen Alternativen gibt es zu chemischen Schlafmitteln und wie ist deren Wirksamkeit einzuschätzen?;Baldrian, Hopfen, Melisse und Passionsblume. Sie wirken sanfter, haben kaum Nebenwirkungen oder Abhängigkeitspotenzial, benötigen aber oft eine regelmässige Einnahme über 1-2 Wochen, bis ein Effekt spürbar ist.
Schilddrüse;Erklären Sie den Regelkreis der Schilddrüsenhormone (TRH, TSH, T3/T4).;Der Hypothalamus schüttet TRH aus -> stimuliert Hypophyse zur TSH-Ausschüttung -> TSH regt Schilddrüse zur Produktion von T3/T4 an. Hohe T3/T4-Spiegel im Blut bremsen Hypothalamus/Hypophyse (negatives Feedback).
Schilddrüse;Welches Spurenelement ist für die Produktion von Schilddrüsenhormonen essenziell?;Jod. Es wird aktiv in die Schilddrüsenzellen aufgenommen und dort in die Hormone T3 (Trijodthyronin) und T4 (Thyroxin) eingebaut.
Schilddrüse;Was ist der Unterschied zwischen Morbus Basedow und einer Schilddrüsenautonomie?;Basedow: Autoimmunerkrankung; Antikörper (TRAK) stimulieren den TSH-Rezeptor dauerhaft (Symptom: Exophthalmus). Autonomie: Teile der Schilddrüse produzieren völlig unabhängig vom Regelkreis Hormone (meist durch Jodmangel bedingt).
Schilddrüse;Nennen Sie drei typische Symptome einer Schilddrüsenüberfunktion (Hyperthyreose).;Tachykardie (Herzrasen), Gewichtsverlust trotz Heisshunger, Wärmeintoleranz/Schwitzen, Durchfälle, Tremor (Zittern) und psychische Unruhe.
Schilddrüse;Nennen Sie drei typische Symptome einer Schilddrüsenunterfunktion (Hypothyreose).;Bradykardie (langsamer Puls), Gewichtszunahme, Kälteintoleranz/Frieren, Obstipation (Verstopfung), Müdigkeit/Antriebslosigkeit und trockene Haut.
Schilddrüse;Was ist ein "Struma" und ist es immer mit einer Überfunktion verbunden?;Ein Struma ist eine Vergrösserung der Schilddrüse ("Kropf"). Es sagt nichts über die Funktion aus; ein Struma kann bei Überfunktion, Unterfunktion oder normaler Stoffwechsellage (Euthyreose) auftreten.
Schilddrüse;Was muss bei der Einnahme von L-Thyroxin (Schilddrüsenhormon-Ersatz) beachtet werden?;Es muss morgens nüchtern, mindestens 30 Minuten vor dem Frühstück mit Wasser eingenommen werden. Nahrungsmittel (v.a. Kalzium/Kaffee) stören die Resorption massiv.
Schilddrüse;Warum müssen bei einer Schilddrüsenoperation die Nebenschilddrüsen geschont werden?;Die Nebenschilddrüsen produzieren Parathormon, das den Kalziumspiegel regelt. Werden sie versehentlich entfernt, sinkt das Kalzium im Blut rapide ab, was zu lebensgefährlichen Muskelkrämpfen (Tetanie) führt.
Schilddrüse;Was ist eine "thyreotoxische Krise" und warum ist sie ein Notfall?;Eine lebensbedrohliche Entgleisung der Hyperthyreose (z.B. durch Jodgabe bei Kontrastmitteln). Es kommt zu extremem Herzrasen, Fieber bis 41 Grad, Agitation und Kreislaufschock.
Schilddrüse;Welche Bedeutung hat das Calcitonin, das ebenfalls in der Schilddrüse (C-Zellen) produziert wird?;Es ist der Gegenspieler zum Parathormon. Es senkt den Kalziumspiegel im Blut, indem es den Einbau von Kalzium in die Knochen fördert und den Knochenabbau hemmt.
Schmerzmanagement;Welche Schmerzformen gibt es?;1. Nozipzeptiver Schmerz (Gewebeschädigung), 2. Neuropathischer Schmerz (Nervenschädigung), 3. Psychogener Schmerz (psychische Ursachen ohne organischen Befund), 4. Funktioneller Schmerz (gestörte Schmerzverarbeitung).
Schmerzmanagement;Unterschiede zwischen chronischem und akutem Schmerz?;Akut: Warnfunktion, zeitlich begrenzt, klare Ursache, klingt nach Heilung ab. Chronisch: Eigenständiges Krankheitsbild, länger als 3-6 Monate, verliert Warnfunktion, oft multifaktoriell (biopsychosozial) und führt zu strukturellen Veränderungen im ZNS.
Schmerzmanagement;Was ist das Schmerzgedächtnis?;Durch anhaltende Schmerzreize werden Nervenzellen im Rückenmark empfindlicher (Zentralisierung). Die Schwelle für Schmerzsignale sinkt, sodass bereits harmlose Reize als Schmerz interpretiert werden, selbst wenn die ursprüngliche Verletzung geheilt ist.
Schmerzmanagement;Welchen Einfluss hat Schmerz auf die Psyche und soziale Kontakte?;Chronischer Schmerz führt oft zu Reizbarkeit, Depression und Hilflosigkeit. Dies resultiert häufig in sozialem Rückzug, Verlust der Arbeitsstelle, Isolation und einer massiv eingeschränkten Lebensqualität (Teufelskreis aus Schmerz und Psyche).
Schmerzmanagement;Erklären Sie das WHO-Stufenmodell der Schmerztherapie.;Stufe 1: Nicht-Opioide (z.B. Paracetamol, NSAR). Stufe 2: Schwach wirksame Opioide (z.B. Tramadol, Tilidin) + Nicht-Opioide. Stufe 3: Stark wirksame Opioide (z.B. Morphin, Fentanyl) + Nicht-Opioide. Auf jeder Stufe können Adjuvantien (z.B. Laxantien) ergänzt werden.
Schock;Definieren Sie den Begriff "Schock" aus pathophysiologischer Sicht.;Ein Schock ist ein lebensbedrohlicher Zustand einer generalisierten Minderdurchblutung (Hypoperfusion) des Gewebes. Es entsteht ein Missverhältnis zwischen Sauerstoffangebot und Sauerstoffbedarf, was zu Zellschäden und Organversagen führt.
Schock;Welche vier Hauptformen des Schocks werden unterschieden?;1. Hypovolämischer Schock (Volumenmangel), 2. Kardiogener Schock (Pumpversagen), 3. Distributiver Schock (Fehlverteilung, z.B. septisch, anaphylaktisch), 4. Obstruktiver Schock (Blockade, z.B. Lungenembolie).
Schock;Was ist die "Schockspirale" (Zentralisation) und welcher Mechanismus steckt dahinter?;Bei Volumenmangel schüttet der Körper Adrenalin aus. Dies bewirkt eine Vasokonstriktion in "unwichtigen" Gebieten (Haut, Magen-Darm), um Blut für Herz und Gehirn zu sparen. Klinisch zeigt sich dies durch Blässe und kalte Extremitäten.
Schock;Warum ist der septische Schock (distributiv) klinisch oft "warm" im Gegensatz zum kardiogenen Schock?;Beim septischen Schock führen bakterielle Toxine zu einer massiven Gefässerweiterung (Vasodilatation) und Hautdurchblutung ("Warm Shock"). Beim kardiogenen Schock führt die Zentralisation zu kalter, feuchter Haut ("Cold Shock").
Schock;Was ist das "MODS" im Zusammenhang mit einem Schockgeschehen?;Das Multi-Organ-Dysfunktions-Syndrom. Durch den anhaltenden Sauerstoffmangel fallen nacheinander lebenswichtige Organe aus (meist Niere, dann Lunge, Leber, Herz-Kreislauf), was die Mortalität massiv erhöht.
Schock;Warum ist eine Tachykardie bei einem Schockpatienten ein Kompensationsversuch?;Da das Schlagvolumen (wegen Volumenmangel oder Pumpversagen) sinkt, versucht das Herz die Auswurfleistung (Herzzeitvolumen) durch eine Steigerung der Herzfrequenz stabil zu halten.
Schock;Welche pflegerische Sofortmassnahme (Lagerung) ergreifen Sie beim hypovolämischen Schock und wann ist sie kontraindiziert?;Die Schocklagerung (Autotransfusionslage): Flachlagerung mit Beinhochlagerung, um Blut aus den Beinen zum Rumpf/Kopf zu leiten. Kontraindiziert bei kardiogenem Schock (Gefahr des Lungenödems) und bei schwerem SHT.
Schock;Was ist ein anaphylaktischer Schock und welches Medikament ist das Mittel der ersten Wahl?;Eine schwere allergische Reaktion vom Soforttyp. Histamin führt zu massiver Vasodilatation und Kapillarleckage. Mittel der Wahl ist Adrenalin (i.m. oder i.v.), da es die Gefässe verengt und die Bronchien erweitert.
Schock;Warum ist die Urinausscheidung (Stundenurin) ein so wichtiger Parameter in der Schocküberwachung?;Die Niere reagiert sehr empfindlich auf Minderdurchblutung. Eine sinkende Urinausscheidung (Oligurie/Anurie) ist ein Frühwarnzeichen für einen drohenden Schock oder ein beginnendes Nierenversagen (Schockniere).
Schock;Erklären Sie den Begriff "relativer Volumenmangel".;Das Blutvolumen ist eigentlich normal, aber die Gefässbahn ist durch massive Weitstellung (Vasodilatation) so gross geworden, dass das vorhandene Blut nicht mehr ausreicht, um den notwendigen Druck aufzubauen (z.B. bei Sepsis oder Anaphylaxie).
Sepsis;Definieren Sie "Sepsis" (nach Sepsis-3-Kriterien).;Eine lebensbedrohliche Organfehlfunktion aufgrund einer fehlgeleiteten Immunantwort des Körpers auf eine Infektion.
Sepsis;Was ist der "qSOFA-Score" und wozu dient er?;Ein Schnelltest zur Identifizierung von Patienten mit Sepsis-Verdacht ausserhalb der Intensivstation. Kriterien: Atemfrequenz > 22/min, verändertes Bewusstsein (GCS < 15) und systolischer Blutdruck < 100 mmHg.
Sepsis;Erklären Sie die Pathophysiologie des "septischen Schocks".;Bakterielle Giftstoffe führen zu einer extremen Gefässerweiterung und einer Störung der Kapillardurchlässigkeit (Kapillarleck). Flüssigkeit tritt ins Gewebe aus, der Blutdruck fällt massiv ab und es kommt zum Organversagen.
Sepsis;Was ist der Unterschied zwischen einer Bakteriämie und einer Sepsis?;Bakteriämie bedeutet lediglich das Vorhandensein von Bakterien im Blut. Eine Sepsis ist die lebensgefährliche systemische Reaktion des Körpers darauf inklusive Organschäden.
Sepsis;Nennen Sie drei häufige Eintrittspforten für Sepsis-Erreger.;Harnwegsinfekte (Urosepsis), Lungenentzündungen (Pneumonie) oder infizierte Wunden/Katheter (z.B. ZVK-Infektion).
Sepsis;Warum ist Laktat ein wichtiger Laborwert bei Sepsis?;Ein erhöhter Laktatwert deutet auf einen Sauerstoffmangel im Gewebe hin (anaerober Stoffwechsel). Er ist ein Marker für die Schwere des Schocks und die Minderdurchblutung der Organe.
Sepsis;Was bedeutet "DIC" im Rahmen einer schweren Sepsis?;Disseminierte Intravasale Coagulopathie. Es kommt zu einer unkontrollierten Blutgerinnung in den kleinsten Gefässen, was zum Verbrauch aller Gerinnungsfaktoren und schliesslich zu schweren Blutungen führt.
Sepsis;Welche Rolle spielt die Zeit bei der Sepsis-Therapie ("Hour-1 Bundle")?;Innerhalb der ersten Stunde müssen Blutkulturen abgenommen, Breitband-Antibiotika gegeben und Flüssigkeit (Kristalloide) infundiert werden, um die Überlebenschancen massiv zu erhöhen.
Sepsis;Warum ist die Abnahme von Blutkulturen vor der ersten Antibiotikagabe so wichtig?;Um den spezifischen Erreger zu identifizieren und die Therapie später gezielt anpassen zu können. Antibiotika im Blut können das Wachstum in der Kultur verhindern und die Diagnose erschweren.
Sepsis;Nennen Sie drei typische Anzeichen einer beginnenden Sepsis.;Hohes Fieber (oder Untertemperatur), Schüttelfrost, schneller Puls (Tachykardie) und schnelle Atmung (Tachypnoe).
Soziologie;Was bedeutet aus soziologischer Sicht der Begriff „Erwartungen“?;Erwartungen sind soziale Verhaltensnormen, die an eine bestimmte Rolle (z.B. "der kranke Patient" oder "die professionelle Pflegekraft") geknüpft sind und das Handeln in sozialen Systemen strukturieren.
Soziologie;Begriff „Rolle“ und Unterstützung der Patienten?;Rollen sind Erwartungen an eine Position. Patienten verlieren oft ihre Alltagsrollen (Beruf, Partner) und rutschen in die passive Patientenrolle. Unterstützung: Ressourcen fördern, Mitbestimmung ermöglichen und Autonomie stärken.
Soziologie;Bedeutung des sozialen Netzwerks?;Es umfasst alle stabilen Beziehungen (Familie, Freunde, Vereine). Es bietet emotionale und praktische Unterstützung. Aufgabe der Pflege: Ressourcen im Netzwerk identifizieren und Angehörige als Teil des Systems in den Pflegeprozess einbeziehen.
Soziologie;Was bedeutet transkulturelle Pflege?;Eine Pflege, die die kulturellen Hintergründe, Werte und Lebensweisen der Patienten bewusst einbezieht. Ziel ist die kulturelle Sensibilität und Kompetenz, um Barrieren (Sprache, Scham, Rituale) abzubauen und eine diskriminierungsfreie Versorgung zu sichern.
Stoma;Pflegeschwerpunkte bei Stomapatienten?;Physisch: Hautschutz rund um das Stoma, passgenaue Basisplatte, Beobachtung der Mukosa. Psychisch: Unterstützung bei der Bewältigung des veränderten Körperbildes, Einbezug der Stomaberatung und Förderung der Selbstständigkeit.
Stress Burnout;Was ist der Unterschied zwischen "Eustress" und "Distress"?;Eustress ist positiver Stress, der motiviert und die Leistungsfähigkeit steigert (Herausforderung). Distress ist negativer Stress, der als belastend, überfordernd und gesundheitsschädlich empfunden wird (Überlastung).
Stress Burnout;Erklären Sie die drei Phasen des Allgemeinen Anpassungssyndroms (AAS) nach Selye.;1. Alarmreaktion (Adrenalin steigt, Kampf-oder-Flucht), 2. Widerstandsphase (Körper versucht sich anzupassen, Cortisolspiegel bleibt hoch), 3. Erschöpfungsphase (Ressourcen sind verbraucht, es kommt zu Krankheit oder Burnout).
Stress Burnout;Definieren Sie das "Burnout-Syndrom" nach Maslach.;Ein Zustand ausgeprägter emotionaler Erschöpfung, Depersonalisierung (Zynismus gegenüber Patienten/Kollegen) und das Gefühl verminderter persönlicher Leistungsfähigkeit infolge chronischer beruflicher Überlastung.
Stress Burnout;Warum sind Pflegeberufe besonders gefährdet für ein Burnout?;Durch hohe emotionale Anforderungen (Leid, Tod), Zeitdruck, Schichtarbeit, geringe Autonomie bei hoher Verantwortung und das Idealbild der "aufopferungsvollen Pflege", was oft zur Vernachlässigung der eigenen Psychohygiene führt.
Stress Burnout;Was ist der Unterschied zwischen einer Depression und einem Burnout?;Ein Burnout ist primär arbeitsbezogen (kontextabhängig). Eine Depression ist eine klinische Diagnose, die alle Lebensbereiche umfasst und oft durch tiefe Hoffnungslosigkeit und körperliche Symptome (Morgentief) gekennzeichnet ist. Ein Burnout kann jedoch in eine Depression münden.
Stress Burnout;Was sind "Coping-Strategien" und nennen Sie zwei Beispiele.;Es sind Strategien zur Bewältigung von Stress. Problemorientiertes Coping: Die Ursache wird angegangen (z.B. Fortbildung, Gespräch mit Chef). Emotionsorientiertes Coping: Der Umgang mit den Gefühlen steht im Fokus (z.B. Meditation, Sport, Reden mit Freunden).
Stress Burnout;Was bedeutet "Resilienz" im Kontext der Gesundheitsförderung?;Resilienz ist die psychische Widerstandskraft; die Fähigkeit, Krisen und schwere Belastungen ohne langfristige Beeinträchtigung zu überstehen und sogar gestärkt daraus hervorzugehen.
Stress Burnout;Welche körperlichen Folgen kann chronischer Stress (Dauerhaft hohes Cortisol) haben?;Arterielle Hypertonie, Schwächung des Immunsystems (erhöhte Infektanfälligkeit), Schlafstörungen, Spannungskopfschmerzen, Magen-Darm-Geschwüre und ein erhöhtes Risiko für Myokardinfarkte.
Stress Burnout;Was versteht man unter "Gratifikationskrisen" am Arbeitsplatz?;Ein Ungleichgewicht zwischen hohem Einsatz (Anstrengung) und geringer Belohnung (Gehalt, Anerkennung, Aufstiegsmöglichkeiten). Dies gilt als einer der stärksten Treiber für beruflichen Stress und Burnout.
Stress Burnout;Welche Rolle spielt die "Achtsamkeit" (Mindfulness) in der Burnout-Prävention?;Sie schult die Wahrnehmung des gegenwärtigen Moments ohne Bewertung. Pflegende lernen dadurch, Stresssignale des Körpers früher zu erkennen und "Stopp"-Momente im hektischen Alltag einzubauen.
Suizid und Sterbehilfe;Unterscheiden Sie zwischen "Suizidalität" und einem "Suizidversuch".;Suizidalität beschreibt die Summe aller Denk- und Verhaltensweisen, die darauf abzielen, das eigene Leben zu beenden (Gedanken, Impulse, Pläne). Ein Suizidversuch ist die konkrete, aktiv herbeigeführte Handlung mit dem Ziel der Selbsttötung, die nicht tödlich endete.
Suizid und Sterbehilfe;Was ist das "Präsuizidale Syndrom" nach Ringel?;Es beschreibt drei Merkmale vor einem Suizid: 1. Situative Einengung (Tunnelblick, Ausweglosigkeit), 2. Gehemmte oder gegen die eigene Person gerichtete Aggression, 3. Suizidphantasien (Flucht in die Vorstellung des Todes).
Suizid und Sterbehilfe;Warum ist die Phase der "Ruhe vor dem Sturm" bei suizidalen Patienten besonders gefährlich?;Wenn ein Patient nach einer Phase schwerster Agitation plötzlich sehr ruhig und gelöst wirkt, kann das bedeuten, dass er den festen Entschluss zur Tat gefasst hat. Die Ambivalenz ist weg, was fälschlicherweise als Besserung interpretiert werden kann.
Suizid und Sterbehilfe;Wie reagieren Sie professionell, wenn ein Patient Suizidgedanken äussert?;Ruhig bleiben, das Thema aktiv und direkt ansprechen (Nachfragen löst keinen Suizid aus!), Ernst nehmen, nicht bewerten oder moralisieren, Sicherheit vermitteln und umgehend den Arzt/Psychiater beiziehen.
Suizid und Sterbehilfe;Was ist der Unterschied zwischen "aktiver" und "passiver" Sterbehilfe?;Aktive Sterbehilfe: Gezielte Tötung auf Verlangen (in der Schweiz verboten). Passive Sterbehilfe: Verzicht auf oder Abbruch von lebensverlängernden Massnahmen (z.B. Dialysestopp, Beatmungsstopp) bei Sterbenden (in der Schweiz unter Bedingungen erlaubt).
Suizid und Sterbehilfe;Definieren Sie die "Beihilfe zum Suizid" (Assistierter Suizid) und die rechtliche Lage in der Schweiz.;Die Fachperson (oder Organisation) stellt dem Patienten das tödliche Medikament zur Verfügung, aber der Patient muss es selbstständig einnehmen oder den Infusionshahn öffnen. In der Schweiz straffrei, sofern kein "selbstsüchtiges Motiv" des Helfers vorliegt.
Suizid und Sterbehilfe;Was ist die "indirekte Sterbehilfe" im Rahmen der Palliativmedizin?;Der Einsatz von Medikamenten zur Schmerzlinderung (z.B. hohe Dosen Morphin), die als Nebenwirkung die Lebensdauer verkürzen könnten. Hier steht die Leidenslinderung im Vordergrund, die Lebensverkürzung wird als unvermeidbare Folge in Kauf genommen.
Suizid und Sterbehilfe;Welches ethische Prinzip gerät bei der Sterbehilfe in Konflikt mit dem Prinzip der "Heiligkeit des Lebens"?;Das Prinzip der Autonomie (Selbstbestimmungsrecht des Patienten über sein eigenes Sterben).
Suizid und Sterbehilfe;Was bedeutet "Palliative Sedierung" am Lebensende?;Die medikamentöse Senkung des Bewusstseins (bis hin zum Koma), um unerträgliches Leiden (z.B. massive Atemnot, therapierefraktäre Angst) bei Sterbenden zu lindern. Ziel ist die Symptomkontrolle, nicht die Tötung.
Suizid und Sterbehilfe;Wie gehen Pflegende mit der eigenen Belastung um, wenn sie Patienten beim assistierten Suizid begleiten?;Es braucht eine klare Reflexion der eigenen Werte. In der Schweiz darf niemand zur Mitwirkung gezwungen werden (Gewissensfreiheit). Institutionelle Unterstützung durch Fallbesprechungen und Supervision ist hier zwingend erforderlich.
Supportive Care;Definieren Sie den Begriff "Supportive Care" in der Onkologie.;Es umfasst alle Massnahmen, die darauf abzielen, die Symptome der Krebserkrankung und die Nebenwirkungen der Therapie zu lindern. Das Ziel ist nicht die Heilung des Tumors, sondern die Optimierung der Lebensqualität und Unterstützung des Patienten und seiner Angehörigen in allen Krankheitsphasen.
Supportive Care;Welche Rolle spielt das "Symptommanagement" als Teil von Supportive Care?;Es ist der proaktive Umgang mit Beschwerden wie Übelkeit (Emesis), Schmerzen, Fatigue, Mukositis oder Hautveränderungen. Durch frühzeitige Intervention (z.B. Antiemetika-Gabe vor der Chemo) wird Leid minimiert und die Adhärenz zur Haupttherapie gestärkt.
Supportive Care;Was versteht man unter "rehabilitativer Supportive Care"?;Massnahmen zum Erhalt oder zur Wiederherstellung von Funktionen (z.B. Physiotherapie bei Lymphödem, Ernährungsberatung bei Kachexie), um die Selbstständigkeit des Patienten trotz Krebserkrankung so lange wie möglich zu bewahren.
Supportive Care;Warum ist die psychosoziale Unterstützung ein essenzieller Pfeiler von Supportive Care?;Eine Krebserkrankung löst existenzielle Ängste, Rollenverluste und soziale Isolation aus. Supportive Care beinhaltet hier die Vermittlung von Psychoonkologie, Seelsorge oder Sozialdienst, um das psychische Coping zu unterstützen.
Supportive Care;Was ist der Unterschied zwischen Supportive Care und Palliative Care?;Supportive Care beginnt idealerweise bereits bei der Diagnose und begleitet auch kurative Therapien. Palliative Care fokussiert sich primär auf die Lebensendphase, wenn eine Heilung ausgeschlossen ist. Die Übergänge sind jedoch fliessend.
Supportive Care;Nennen Sie drei Massnahmen zur Prävention von chemotherapie-induzierter Übelkeit (CINV).;1. Prophylaktische Gabe von Antiemetika (z.B. 5-HT3-Antagonisten), 2. Anbieten von kleinen, kalten, geruchsarmen Mahlzeiten, 3. Entspannungstechniken zur Reduktion von antizipatorischem Erbrechen.
Supportive Care;Was bedeutet "Informationsmanagement" im Rahmen von Supportive Care?;Pflegende stellen sicher, dass der Patient über den Verlauf, die Nebenwirkungen und Selbsthilfemassnahmen informiert ist. Gut informierte Patienten fühlen sich weniger hilflos und können Symptome früher melden.
Supportive Care;Warum ist das "Fatigue-Management" eine Herausforderung in der Supportive Care?;Weil Fatigue multidimensional ist. Neben körperlicher Schonung müssen auch moderate Bewegung, Ernährung und psychologische Unterstützung kombiniert werden, um die lähmende Erschöpfung zu lindern.
Supportive Care;Welche Bedeutung hat die Mundpflege bei onkologischen Patienten als supportive Massnahme?;Die Prävention und Behandlung der Mukositis (Schleimhautentzündung) ist zentral, da Schmerzen im Mund die Nahrungsaufnahme verhindern und Eintrittspforten für lebensgefährliche Keime (Sepsis-Gefahr bei Neutropenie) bieten.
Supportive Care;Wie unterstützen Sie Angehörige im Rahmen von Supportive Care?;Durch Entlastungsgespräche, Anleitung zur Pflegebeteiligung (sofern gewünscht), Vermittlung von Selbsthilfegruppen und Beratung bezüglich administrativer oder finanzieller Hürden.
Thoraxdrainage;Was ist das primäre Ziel einer Thoraxdrainage (z.B. Bülau- oder Monaldi-Drainage)?;Die Wiederherstellung des physiologischen Unterdrucks im Pleuraspalt durch das Absaugen von Luft (Pneumothorax), Blut (Hämatothorax) oder Sekret (Pleuraerguss), damit sich die Lunge wieder vollständig entfalten kann.
Thoraxdrainage;Erklären Sie das Funktionsprinzip des "Wasserschlosses" bei einer Thoraxdrainage.;Das Wasserschloss fungiert als Einwegventil. Luft kann aus dem Pleuraspalt durch das Wasser nach aussen entweichen, aber durch die Wassersäule kann keine Aussenluft zurück in die Brusthöhle gesaugt werden.
Thoraxdrainage;Was deutet auf eine Leckage im System hin, wenn es in der Wasserschlosskammer kontinuierlich blubbert?;Wenn es ständig blubbert (unabhängig von Husten oder Pressen), liegt meist ein Leck im Schlauchsystem oder direkt an der Einstichstelle vor, durch das Aussenluft eingezogen wird.
Thoraxdrainage;Warum darf eine Thoraxdrainage beim Transport eines Patienten niemals abgeklemmt werden (ausser bei expliziter ärztlicher Anordnung)?;Wenn Luft aus der Lunge nachströmt, aber durch das Abklemmen nicht entweichen kann, baut sich im Brustkorb ein Überdruck auf. Es droht ein lebensgefährlicher Spannungspneumothorax mit Kompression des Herzens und der grossen Gefässe.
Thoraxdrainage;Was bedeutet das "Atemschwingen" im Steigrohr der Drainage?;Die Wassersäule bewegt sich synchron zur Atmung (sinkt bei Inspiration, steigt bei Exspiration). Dies zeigt an, dass die Drainage korrekt im Pleuraspalt liegt und durchgängig ist. Fehlt das Schwingen, ist die Lunge entweder voll ausgedehnt oder das System ist verstopft/geknickt.
Thoraxdrainage;Welche pflegerischen Beobachtungsschwerpunkte haben Sie bezüglich des Sekrets (Drainageflüssigkeit)?;Menge (ml pro Stunde/Schicht), Farbe (serös, blutig, eitrig) und Konsistenz. Ein plötzlicher Anstieg von frischem Blut (> 100-200 ml/h) ist ein chirurgischer Notfall.
Thoraxdrainage;Warum muss das Drainagesystem immer deutlich unter dem Niveau des Patiententhorax stehen?;Um ein Zurücklaufen von (potenziell infiziertem) Sekret oder Wasser aus dem Schloss in den Pleuraspalt durch die Schwerkraft zu verhindern.
Thoraxdrainage;Wie verhalten Sie sich, wenn eine Thoraxdrainage versehentlich diskonnektiert (herausgerissen) wurde?;Sofort die Einstichstelle mit einem luftdichten Verband (z.B. Vaselinegaze) verschliessen, den Patienten beruhigen, Oberkörper hochlagern, Vitalzeichen kontrollieren und sofort den Arzt alarmieren.
Thoraxdrainage;Warum ist eine suffiziente Schmerztherapie bei Patienten mit Thoraxdrainage essenziell für die Lungenfunktion?;Schmerzen an der Eintrittsstelle führen zu einer flachen Schonatmung. Dies verhindert die vollständige Lungenentfaltung und begünstigt Atelektasen sowie Pneumonien. Nur ein schmerzfreier Patient kann effektiv tief atmen und husten.
Thoraxdrainage;Was ist ein "Spannungspneumothorax" und warum ist er eine absolute Notfallsituation?;Luft gelangt in den Pleuraspalt, kann aber nicht mehr raus (Ventilmechanismus). Der Druck steigt, die Lunge kollabiert und das Mediastinum wird zur gesunden Seite verschoben. Dies führt zum Herz-Kreislauf-Stillstand durch mangelnde Füllung des Herzens.
Tod;Definieren Sie den Begriff "Hirntod" als sicheres Todeszeichen.;Der Hirntod ist der irreversible Ausfall aller Funktionen des Grosshirns, Kleinhirns und Hirnstamms bei künstlich aufrechterhaltener Herz-Kreislauf-Funktion. Er gilt juristisch und ethisch als der Zeitpunkt des Todes des Menschen.
Tod;Unterscheiden Sie zwischen frühen und späten sicheren Todeszeichen.;Frühe sichere Zeichen: Totenflecken (Livores), Totenstarre (Rigor mortis). Späte sichere Zeichen: Fäulniserscheinungen, Autolyse oder mit dem Leben nicht vereinbare Verletzungen.
Tod;Wie entstehen Totenflecken (Livores) und welche Bedeutung haben sie für die Kriminalistik?;Nach dem Herzstillstand sinkt das Blut schwerkraftbedingt in die tiefer liegenden Körperpartien ab (Hypostase). Sie geben Auskunft über den Todeszeitpunkt und darüber, ob die Leiche nach dem Tod bewegt oder umgelagert wurde.
Tod;Erklären Sie die Entstehung der Totenstarre (Rigor mortis).;Durch den Mangel an ATP (Energiemangel) können sich die Bindungen zwischen den Muskelproteinen Actin und Myosin nicht mehr lösen. Die Muskeln versteifen. Sie beginnt meist am Kiefer und wandert nach unten (Nysten-Regel).
Tod;Was sind "unsichere Todeszeichen" und warum reichen sie zur Feststellung des Todes nicht aus?;Blässe, Abkühlung (Algor mortis), Atemstillstand, Pulslosigkeit und weite, lichtstarre Pupillen. Sie sind unsicher, da sie auch bei tiefer Bewusstlosigkeit oder extremer Unterkühlung (Scheintod) vorkommen können.
Tod;Welche pflegerischen Aufgaben umfasst die "Versorgung eines Verstorbenen" (Last Offices)?;Respektvolle Ganzkörperreinigung, Schliessen von Augen und Mund, Entfernen von Drainagen/Kathetern (nach ärztlicher Freigabe), Ankleiden (oft eigene Kleidung), würdevolle Lagerung (Hände falten) und Vorbereitung für die Abschiednahme der Angehörigen.
Tod;Wie gehen Sie als Pflegefachperson mit den Angehörigen unmittelbar nach dem Versterben eines Patienten um?;Einen ruhigen Raum bieten, Zeit zum Abschiednehmen lassen, Gefühlsäusserungen zulassen und aushalten, Unterstützung bei organisatorischen Fragen anbieten und ggf. Rituale (religiös/kulturell) ermöglichen.
Tod;Was ist eine "Leichenschau" und wer darf sie durchführen?;Es ist die offizielle ärztliche Untersuchung des Verstorbenen zur Feststellung des Todes, des Todeszeitpunkts und der Todesart (natürlich, unklar oder gewalmsam). Sie darf nur von einem approbierten Arzt durchgeführt werden.
Tod;Was bedeutet der Begriff "Agonie" in der Sterbephase?;Es beschreibt den eigentlichen Todeskampf bzw. die Phase unmittelbar vor dem Tod, gekennzeichnet durch unregelmässige Atmung (Schnappatmung), Rasselgeräusche (Distanzrasseln) und ein Nachlassen der Herz-Kreislauf-Funktion.
Tod;Warum ist die Dokumentation des Todeszeitpunkts juristisch so bedeutsam?;Der Todeszeitpunkt hat weitreichende Konsequenzen für das Erbrecht, Versicherungsleistungen und den Beginn gesetzlicher Fristen. Er wird im Totenschein offiziell festgehalten.
Transplantationen;Was ist der Unterschied zwischen einer autologen, allogenen und xenogenen Transplantation?;Autolog: Spender und Empfänger sind dieselbe Person (z.B. Stammzellen). Allogen: Spender und Empfänger gehören der gleichen Spezies an (Mensch zu Mensch). Xenogen: Spender gehört einer anderen Spezies an (z.B. Herzklappe vom Schwein).
Transplantationen;Erklären Sie den Begriff "Warteliste" und die Rolle von Swisstransplant.;Auf der Warteliste stehen Patienten, die ein Organ benötigen. Swisstransplant ist die nationale Zuteilungsstelle in der Schweiz, die die Organe nach medizinischer Dringlichkeit und Erfolgsaussicht fair und transparent zuteilt.
Transplantationen;Warum müssen Transplantatempfänger lebenslang Immunsuppressiva einnehmen?;Das Immunsystem erkennt das transplantierte Organ als "fremd" (HLA-Antigene). Ohne Unterdrückung der Immunantwort durch Medikamente würden T-Zellen das Spenderorgan angreifen und zerstören (Abstossungsreaktion).
Transplantationen;Was ist der Unterschied zwischen einer akuten und einer chronischen Abstossungsreaktion?;Akut: Tritt meist in den ersten Wochen/Monaten auf; durch T-Zellen vermittelt, oft durch hohe Dosen Steroide reversibel. Chronisch: Findet über Jahre statt; führt zu schleichendem Funktionsverlust durch Gefässveränderungen und Umbau in Bindegewebe (irreversibel).
Transplantationen;Welche zwei Formen der Organspende werden nach dem Tod unterschieden?;1. Spende nach Hirntod (DBD): Herz-Kreislauf-Funktion wird künstlich aufrechterhalten. 2. Spende nach Herz-Kreislauf-Stillstand (DCD): Organentnahme nach festgestelltem Tod durch Herzstillstand und anschliessender Wartefrist.
Transplantationen;Was besagt die "Erweiterte Widerspruchslösung", die in der Schweiz eingeführt wird?;Jeder Mensch gilt grundsätzlich als Organspender, es sei denn, er hat zu Lebzeiten aktiv widersprochen. Die Angehörigen werden jedoch weiterhin befragt, ob ihnen ein Widerspruch des Verstorbenen bekannt ist.
Transplantationen;Was versteht man unter einer "Lebendspende" (z.B. Niere)?;Ein gesunder Mensch spendet ein Organ oder Organteile (Niere, Leberteil). Dies ist ethisch streng reglementiert: Es muss Freiwilligkeit vorliegen, eine enge emotionale Beziehung bestehen und das Risiko für den Spender muss vertretbar sein.
Transplantationen;Welche pflegerischen Besonderheiten gelten für Patienten unmittelbar nach einer Transplantation?;Strikte aseptische Arbeitsweise (Infektionsschutz bei Immunsuppression), engmaschige Überwachung der Organfunktion (z.B. Urinausscheidung bei Niere), Medikamenten-Monitoring (Spiegelmessung) und psychosoziale Unterstützung.
Transplantationen;Was ist eine Graft-versus-Host-Disease (GvHD)?;Eine Besonderheit bei Stammzelltransplantationen: Die Immunzellen des Spenders (Graft) greifen den Körper des Empfängers (Host) an. Dies betrifft oft Haut, Leber und Darm und kann lebensbedrohlich sein.
Transplantationen;Welche Edukation ist für Transplantatempfänger bezüglich ihres Lebensstils wichtig?;Konsequente Medikamenteneinnahme, Meiden von Infektionsquellen (Menschenmengen, rohes Fleisch/Fisch), Sonnenschutz (erhöhtes Hautkrebsrisiko durch Immunsuppression) und regelmässige Nachkontrollen.
Transitionen;Definieren Sie das Konzept der "Transition" nach Afaf Meleis.;Transitionen sind Übergänge im Leben, die durch Veränderungen im Gesundheitszustand, in Rollen oder in Beziehungen entstehen. Sie sind Prozesse über Zeit und erfordern vom Individuum Anpassungsleistungen, um ein neues Gleichgewicht zu finden.
Transitionen;Nennen Sie die vier Arten von Transitionen nach Meleis.;1. Gesundheit/Krankheit (z.B. Diagnose Krebs), 2. Entwicklungsbezogen (z.B. Pubertät, Mutterwerden), 3. Situativ (z.B. Heimeintritt, Stellenwechsel), 4. Organisational (z.B. Einführung neuer Pflegemodelle).
Transitionen;Was sind "Indikatoren für eine erfolgreiche Transition"?;Subjektives Wohlbefinden, Beherrschen neuer Fertigkeiten (Mastery), Aufbau eines stabilen Selbstwertgefühls in der neuen Rolle und gelungene soziale Integration.
Transitionen;Warum ist die "Vorbereitung" eine zentrale pflegerische Intervention bei Transitionen?;Wenn Patienten wissen, was auf sie zukommt (z.B. Austrittsplanung), sinkt die Angst und die Fähigkeit zum Coping steigt. Unvorhergesehene Übergänge sind deutlich krisenanfälliger.
Transitionen;Welche Rolle spielt das soziale Umfeld (Support) für den Verlauf einer Transition?;Ein stabiles Umfeld wirkt als Ressource (Puffer). Fehlt soziale Unterstützung, ist das Risiko für eine "misslungene" Transition (Depression, Hilflosigkeit) massiv erhöht.
Transitionen;Was versteht man unter "Transition Care" beim Wechsel vom Kindes- ins Erwachsenenalter bei chronisch Kranken?;Der geplante Übergang von der pädiatrischen Versorgung in die Erwachsenenmedizin. Ziel ist es, den Jugendlichen zur Eigenverantwortung zu führen, damit die Therapieadhärenz nicht abbricht.
Transitionen;Wie können Pflegende eine "situative Transition" wie den Heimeintritt unterstützen?;Durch Biografiearbeit, Einbezug von Gewohnheiten, Begleitung der Angehörigen und das Schaffen einer Atmosphäre von Sicherheit und Kontinuität in der neuen Umgebung.
Transitionen;Was bedeutet "Lernbedarf" im Kontext einer gesundheitsbezogenen Transition?;Patienten müssen oft neues Wissen erwerben (z.B. wie man mit einem Stoma lebt), um die Transition erfolgreich zu bewältigen. Die Pflege identifiziert diesen Bedarf und schult gezielt.
Transitionen;Warum sind Transitionen oft mit "Rollenunsicherheit" verbunden?;Weil alte Verhaltensmuster nicht mehr passen und die neuen Erwartungen (z.B. vom gesunden Berufstätigen zum chronisch Kranken) noch nicht verinnerlicht oder akzeptiert sind.
Transitionen;Welches Ziel verfolgt die Pflege HF, wenn sie Transitionen begleitet?;Das Ziel ist die Unterstützung der Anpassungsfähigkeit des Patienten, die Vermeidung von Krisen und die Förderung der Selbstmanagementkompetenz in der neuen Lebenssituation.
Transition & Versorgung;Was ist Übergangspflege und Unterschied zu anderen Settings?;Zeitlich befristete Pflege (meist 14 Tage) nach einem Spitalaufenthalt zur weiteren Stabilisierung. Ziel: Vorbereitung auf die Rückkehr nach Hause. Unterschied: Fokus liegt auf Rehabilitation und Austrittsplanung, nicht auf Akutdiagnostik.
Urologie;Worauf achten bei Patienten mit Dauerkatheter (DK)?;Geschlossenes System wahren, Beutel immer unter Blasenniveau (Reflux verhindern), tägliche Reinigung des Meatus, regelmässige Kontrolle von Urinmenge/Farbe und knickfreie Ableitung.
Urologie;Welche verschiedenen Inkontinenzformen gibt es?;Stressinkontinenz (Druckanstieg durch Husten/Niesen), Dranginkontinenz (überfallartiger Harndrang), Überlaufinkontinenz (Abflussbehinderung, z.B. Prostata), Neurogene Blasenstörung (Nervenschädigung).
Urologie;Risikofaktoren für einen Harnwegsinfekt (HWI)?;Weibliche Anatomie (kurze Urethra), liegende Katheter, Restharnbildung, mangelnde Trinkmenge, Diabetes mellitus und Hormonmangel in der Menopause.
Wunden;Was ist der Unterschied zwischen einer primären (p.p.) und einer sekundären (p.s.) Wundheilung?;Primär: Wundränder liegen eng aneinander, sind glatt und sauber (z.B. OP-Schnitt); heilt schnell mit minimaler Narbe. Sekundär: Wundränder klaffen, Gewebedefekt muss durch Granulation aufgefüllt werden; heilt langsamer, höheres Infektionsrisiko.
Wunden;Erklären Sie die drei Phasen der physiologischen Wundheilung.;1. Exsudationsphase (Reinigung/Blutstillung), 2. Proliferationsphase (Aufbau von Granulationsgewebe), 3. Regenerationsphase (Epithelisierung/Narbenbildung).
Wunden;Was versteht man unter der "URGE"-Regel bei der Wundbeurteilung?;U: Umgebung (Farbe, Ödeme), R: Rand (zerklüftet, glatt, unterminiert), G: Grund (Beläge, Granulation, Nekrose), E: Exsudat (Menge, Farbe, Geruch).
Wunden;Warum ist das Prinzip der "feuchten Wundbehandlung" heute Standard?;Feuchtigkeit verhindert das Verkleben des Verbandes, schützt die Botenstoffe der Heilung, hält die Wunde auf Idealtemperatur und ermöglicht den Zellen (Fibroblasten) eine schnellere Wanderung und Teilung.
Wunden;Was ist ein "Débridement" und warum ist es für die Heilung wichtig?;Die Entfernung von nekrotischem Gewebe, Belägen oder Fremdkörpern. Nekrosen behindern die Heilung und bieten idealen Nährboden für Bakterien. Es kann chirurgisch, autolytisch (Gele) oder bio-chirurgisch (Maden) erfolgen.
Wunden;Wie unterscheiden sich venöse und arterielle Ulzera (Ulcera cruris) klinisch?;Venös: Meist am Innenknöchel, grossflächig, oberflächlich, stark exsudierend, Haut oft braun verfärbt. Arteriell: Meist an Zehen/Fersen, tief, schmerzhaft, "ausgestanzt", Haut kühl und blass.
Wunden;Welche Rolle spielt die Ernährung bei der Heilung chronischer Wunden?;Proteinmangel verzögert den Gewebeaufbau massiv. Auch Zink, Vitamin C und eine ausreichende Kalorienzufuhr sind essenziell, da Wundheilung ein energieintensiver Prozess ist.
Wunden;Was ist eine "Wundinfektion" und nennen Sie drei klassische Zeichen (Kardinalsymptome).;Eindringen und Vermehren von pathogenen Keimen. Zeichen: Rubor (Rötung), Calor (Überwärmung), Tumor (Schwellung), Dolor (Schmerz) und Functio laesa (Funktionseinschränkung).
Wunden;Was ist der Zweck eines Unterdruck-Wundtherapie-Systems (V.A.C.)?;Durch einen kontinuierlichen Sog wird Exsudat entfernt, die lokale Durchblutung gefördert und die Wundränder werden zusammengezogen. Dies beschleunigt die Granulation bei tiefen Wunden massiv.
Wunden;Warum dürfen moderne Wundauflagen (z.B. Alginate oder Schaumstoffe) oft mehrere Tage auf der Wunde verbleiben?;Um die Wundruhe zu wahren. Jeder Verbandswechsel stört das Mikroklima (Temperaturabfall) und kann neu gebildetes Gewebe traumatisieren. Ein Wechsel erfolgt meist nach Sättigung des Verbandes.
Wunden;Voraussetzungen für optimale Wundheilung und Ernährung?;Benötigt wird ein feuchtes Wundmilieu, Wärme (Zellteilung stoppt bei Auskühlung) und ausreichende Durchblutung (O2). Ernährung: Proteinreich (Gewebeaufbau), Vitamin C, Zink und ausreichende Hydratation.
Wunden;Unterschied primäre/sekundäre Wunde und Phasen?;Primär: Glatte Ränder, heilt durch direktes Verwachsen (z.B. OP-Naht). Sekundär: Gewebedefekt, heilt aus der Tiefe durch Granulation. Phasen: 1. Exsudation (Reinigung), 2. Proliferationsphase (Granulation), 3. Regenerationsphase (Epithelisierung).
Würdig sterben;Was bedeutet der Begriff "Würde" am Lebensende aus pflegeethischer Sicht?;Würde ist ein subjektives Empfinden des Patienten, das durch Autonomie, Respekt, Privatsphäre und das Gefühl, als Individuum (nicht als Fall) gesehen zu werden, gewahrt bleibt. In der Pflege bedeutet dies, die Werte des Sterbenden bis zuletzt zu schützen.
Würdig sterben;Nennen Sie die vier Säulen der Palliative Care nach der WHO-Definition.;1. Schmerzlinderung und Symptomkontrolle, 2. Psychosoziale Unterstützung, 3. Spirituelle Begleitung, 4. Unterstützung der Angehörigen über den Tod hinaus.
Würdig sterben;Was ist das Ziel der "vorausschauenden Behandlungsplanung" (Advance Care Planning) für ein würdiges Sterben?;Dass medizinische Entscheidungen auch dann im Sinne des Patienten getroffen werden können, wenn dieser nicht mehr urteilsfähig ist. Dies verhindert unnötiges Leid durch Übertherapie und sichert die Selbstbestimmung.
Würdig sterben;Wie können Pflegende ein würdevolles Umfeld im Sterbezimmer gestalten?;Durch die Schaffung von Ruhe (Vermeidung von Stationslärm), gedimmtes Licht, Zulassen von persönlichen Ritualen/Musik, diskretes Bereitstellen von Erfrischungen für Angehörige und eine respektvolle, ruhige Kommunikation.
Würdig sterben;Warum ist "Mundpflege" eine zentrale Massnahme für ein würdevolles Sterben?;Sterbende leiden oft unter extremer Mundtrockenheit (Xerostomie) durch Mundatmung und Medikamente. Regelmässige Mundpflege mit den Lieblingsgeschmacksrichtungen des Patienten lindert Durstgefühl und Schmerzen und ermöglicht ein friedlicheres Einschlafen.
Würdig sterben;Welche Bedeutung hat das "Aushalten von Schweigen" in der Begleitung Sterbender?;Es signalisiert Präsenz und Akzeptanz. Sterbende ziehen sich oft innerlich zurück; nonverbale Nähe (Dasein, Handhalten) ist in dieser Phase oft wichtiger und würdevoll als bemühte Gesprächsversuche.
Würdig sterben;Wie gehen Sie mit dem Sterbefasten (freiwilliger Verzicht auf Nahrung und Flüssigkeit) ethisch um?;Es ist eine form der Selbstbestimmung. Die Pflege begleitet diesen Prozess durch intensive Symptomkontrolle (v.a. Mundpflege), ohne den Patienten zum Essen/Trinken zu drängen, sofern dies sein klarer Wille ist.
Würdig sterben;Was ist die "spirituelle Dimension" am Lebensende?;Die Suche nach Sinn, Hoffnung oder Versöhnung, unabhängig von einer Religionszugehörigkeit. Ein würdiges Sterben beinhaltet den Raum für diese Auseinandersetzung, ggf. durch Beizug von Seelsorgern.
Würdig sterben;Was versteht man unter dem "totalen Schmerz" (Total Pain) Konzept nach Cicely Saunders?;Schmerz am Lebensende ist nicht nur physisch, sondern setzt sich aus körperlichen, psychischen, sozialen und spirituellen Komponenten zusammen. Nur wenn alle Ebenen beachtet werden, ist ein würdiges Sterben möglich.
Würdig sterben;Warum ist die Begleitung der Angehörigen Teil eines würdiges Sterbeprozesses?;Angehörige sind Mitbetroffene. Wenn sie sich gut betreut und informiert fühlen, können sie Ruhe auf den Sterbenden übertragen. Ein würdevoller Abschied prägt den späteren Trauerprozess der Hinterbliebenen massiv.
Zelluläre Blutbestandteile;Nennen Sie die drei Hauptgruppen der zellulären Blutbestandteile und deren medizinische Fachbegriffe.;1. Rote Blutkörperchen (Erythrozyten), 2. Weisse Blutkörperchen (Leukozyten), 3. Blutplättchen (Thrombozyten).
Zelluläre Blutbestandteile;Was ist die Hauptaufgabe der Erythrozyten und welches Protein ist dafür verantwortlich?;Der Transport von Sauerstoff von der Lunge zu den Zellen und der Abtransport von CO2. Verantwortlich ist das eisenhaltige Protein Hämoglobin (Hb), welches den Sauerstoff bindet.
Zelluläre Blutbestandteile;Erklären Sie die Funktion der Thrombozyten bei einer Gefässverletzung.;Sie sind für die primäre Hämostase (Blutstillung) zuständig. Sie lagern sich an der verletzten Gefässwand an (Adhäsion) und verklumpen miteinander (Aggregation), um einen vorläufigen Pfropf zu bilden.
Zelluläre Blutbestandteile;In welche drei Untergruppen lassen sich die Leukozyten unterteilen?;1. Granulozyten (unspezifische Abwehr), 2. Lymphozyten (spezifische Abwehr: B- und T-Zellen), 3. Monozyten (werden zu Makrophagen/Fresszellen).
Zelluläre Blutbestandteile;Wo findet beim Erwachsenen die Blutbildung (Hämatopoese) hauptsächlich statt?;Im roten Knochenmark, vor allem in den kurzen und flachen Knochen (z.B. Beckenkammer, Brustbein, Wirbelkörper).
Zelluläre Blutbestandteile;Was versteht man unter einer "Linksverschiebung" im Differenzialblutbild?;Ein vermehrtes Auftreten von unreifen, stabkernigen neutrophilen Granulozyten im Blut. Dies ist ein Zeichen dafür, dass das Immunsystem unter Hochdruck gegen eine akute bakterielle Infektion kämpft.
Zelluläre Blutbestandteile;Warum führt ein Mangel an Erythrozyten (Anämie) zu klinischen Symptomen wie Dyspnoe und Tachykardie?;Durch den Hb-Mangel sinkt die Sauerstoffkapazität des Blutes. Der Körper versucht diesen Sauerstoffmangel durch schnelleres Atmen (Tachypnoe) und eine höhere Pumpleistung des Herzens (Tachykardie) zu kompensieren.
Zelluläre Blutbestandteile;Was ist die Aufgabe der B-Lymphozyten?;Nach Kontakt mit einem Antigen wandeln sie sich in Plasmazellen um und produzieren spezifische Antikörper (Immunglobuline), die Krankheitserreger markieren oder neutralisieren.
Zelluläre Blutbestandteile;Welches Hormon regelt die Produktion der Erythrozyten und wo wird es gebildet?;Erythropoetin (EPO). Es wird bei Sauerstoffmangel in der Niere gebildet und stimuliert im Knochenmark die Neubildung von roten Blutkörperchen.
Zelluläre Blutbestandteile;Was passiert bei einer Thrombozytopenie (Mangel an Blutplättchen)?;Die Blutungsneigung steigt massiv an. Es kann zu punktförmigen Hautblutungen (Petechien), Zahnfleischbluten oder gefährlichen inneren Blutungen kommen.
Zusammenhang CVI und Demenz;Was versteht man unter einer "Vaskulären Demenz" (VaD)?;Eine Demenzform, die durch Durchblutungsstörungen im Gehirn verursacht wird (z.B. nach mehreren kleinen Schlaganfällen). Sie ist nach Alzheimer die zweithäufigste Demenzform.
Zusammenhang CVI und Demenz;Wie unterscheidet sich der Beginn einer vaskulären Demenz klinisch von einer Alzheimer-Demenz?;Vaskuläre Demenz beginnt oft plötzlich oder stufenweise (nach jedem CVI-Ereignis eine Verschlechterung). Alzheimer beginnt schleichend und verläuft kontinuierlich abbauend.
Zusammenhang CVI und Demenz;Warum erhöht ein CVI das Risiko für eine spätere Demenzentwicklung?;Ein CVI zerstört Hirngewebe. Wenn strategisch wichtige Areale (z.B. Thalamus, Hippocampus) betroffen sind oder die Summe der Gewebeverluste zu gross wird, bricht die kognitive Reserve zusammen.
Zusammenhang CVI und Demenz;Erklären Sie den Begriff "Multi-Infarkt-Demenz".;Hier führen viele kleine, oft unbemerkte Schlaganfälle (Mikroinfarkte) über einen längeren Zeitraum zu einer fortschreitenden Zerstörung der weissen Substanz und somit zur Demenz.
Zusammenhang CVI und Demenz;Welche Rolle spielen die kardiovaskulären Risikofaktoren (Hypertonie, Diabetes) für beide Erkrankungen?;Sie sind die gemeinsame Ursache. Bluthochdruck und Diabetes schädigen die Gefässe (Arteriosklerose). Dies führt sowohl zu akuten Ereignissen (CVI) als auch zu chronischen Minderdurchblutungen, die die Demenz fördern.
