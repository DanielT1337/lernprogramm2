Herzinsuffizienz;Was bedeutet die NYHA-Stufe 3?;Der Patient hat eine erhebliche Einschränkung der körperlichen Leistungsfähigkeit. Er ist bei Ruhe beschwerdefrei, aber bereits bei geringer körperlicher Belastung (z.B. Gehen auf ebener Strecke, Ankleiden) treten Symptome wie Dyspnoe, Erschöpfung oder Herzrhythmusstörungen auf.
Pathophysiologie;Erklären Sie die pAVK und deren Stadien.;Die periphere arterielle Verschlusskrankheit ist eine Durchblutungsstörung der Extremitäten (meist Beine). Stadien nach Fontaine: I (asymptomatisch), IIa (schmerzfreies Gehen > 200m), IIb (Gehstrecke < 200m), III (Ruheschmerz), IV (Nekrose/Gangrän/Ulkus).
Herz Physiologie;Warum können Tachykardien entstehen?;Als Kompensation bei Sauerstoffmangel (Anämie, Herzinsuffizienz), bei Volumenmangel (Schock/Dehydration), durch Fieber (gesteigerter Stoffwechsel), bei Stress/Angst (Sympathikusaktivierung), durch Medikamente oder bei Schilddrüsenüberfunktion.
Schmerzmanagement;Welche Schmerzformen gibt es?;1. Nozipzeptiver Schmerz (Gewebeschädigung), 2. Neuropathischer Schmerz (Nervenschädigung), 3. Psychogener Schmerz (psychische Ursachen ohne organischen Befund), 4. Funktioneller Schmerz (gestörte Schmerzverarbeitung).
Schmerzmanagement;Unterschiede zwischen chronischem und akutem Schmerz?;Akut: Warnfunktion, zeitlich begrenzt, klare Ursache, klingt nach Heilung ab. Chronisch: Eigenständiges Krankheitsbild, länger als 3-6 Monate, verliert Warnfunktion, oft multifaktoriell (biopsychosozial) und führt zu strukturellen Veränderungen im ZNS.
Schmerzmanagement;Was ist das Schmerzgedächtnis?;Durch anhaltende Schmerzreize werden Nervenzellen im Rückenmark empfindlicher (Zentralisierung). Die Schwelle für Schmerzsignale sinkt, sodass bereits harmlose Reize als Schmerz interpretiert werden, selbst wenn die ursprüngliche Verletzung geheilt ist.
Schmerzmanagement;Einfluss von Schmerz auf Psyche und soziale Kontakte?;Chronischer Schmerz führt oft zu Reizbarkeit, Depression und Hilflosigkeit. Dies resultiert häufig in sozialem Rückzug, Verlust der Arbeitsstelle, Isolation und einer massiv eingeschränkten Lebensqualität (Teufelskreis aus Schmerz und Psyche).
Neurologie;Strukturen des Wirbelkörpers und Funktion der Spinalnerven?;Ein Wirbel besteht aus Wirbelkörper, Wirbelbogen und Quer-/Dornfortsätzen. Dazwischen liegt die Bandscheibe. Spinalnerven treten paarig aus dem Rückenmark aus; sie leiten sensible Signale zum Gehirn (Afferenz) und motorische Befehle zum Muskel (Efferenz).
Schmerzmanagement;Erklären Sie das WHO-Stufenmodell der Schmerztherapie.;Stufe 1: Nicht-Opioide (z.B. Paracetamol, NSAR). Stufe 2: Schwach wirksame Opioide (z.B. Tramadol, Tilidin) + Nicht-Opioide. Stufe 3: Stark wirksame Opioide (z.B. Morphin, Fentanyl) + Nicht-Opioide. Auf jeder Stufe können Adjuvantien (z.B. Laxantien) ergänzt werden.
Pharma;Wie wirken Nicht-Opioide und wie wirken Opioide?;Nicht-Opioide wirken primär peripher, indem sie die Bildung von Prostaglandinen (Schmerzbotenstoffe) hemmen. Opioide wirken zentral im Gehirn und Rückenmark, indem sie an spezifische Opiatrezeptoren binden und die Schmerzleitung sowie -wahrnehmung unterdrücken.
Neurologie;Definition und Ziele des Bobath-Konzepts?;Bobath ist ein neurophysiologisches Rehabilitationskonzept für Pat. mit ZNS-Schädigungen. Ziele: Hemmung abnormaler Tonusmuster (Spastik), Fazilitation (Bahnen) normaler Bewegungen und Förderung der Wahrnehmung der betroffenen Körperseite. In der Praxis: 24-Stunden-Konzept, Einbezug der gelähmten Seite.
Orthopädie;Was ist eine Fragilitätsbecken-Fraktur (FFP) und warum drohen Blutungen?;Eine FFP ist ein Bruch des Beckens bei minimalem Trauma (z.B. Sturz aus Stand) aufgrund von Osteoporose. Blutungen entstehen, weil das Becken stark vaskularisiert ist (venöser Plexus und Beckenarterien liegen direkt am Knochen) und nach einer OP die Knochensubstanz oft schlecht hält.
Orthopädie;Anatomie des Beckenrings und chirurgische Behandlung?;Der vordere Ring besteht aus Schambein und Sitzbein, der hintere aus Kreuzbein und Iliosakralgelenken. Stabile Brüche werden konservativ behandelt; instabile Brüche (besonders hinterer Ring) werden mittels Osteosynthese (Schrauben, Platten) oder externem Fixateur stabilisiert.
Orthopädie;Was sind allgemeine Ursachen für Frakturen?;Traumatisch (direkte/indirekte Gewalteinwirkung), Pathologisch (bei Vorerkrankungen wie Metastasen oder Osteoporose ohne adäquates Trauma) oder durch Dauerbelastung (Ermüdungsbruch).
Osteoporose;Entstehung und Hormone beim Knochenstoffwechsel?;Entsteht durch ein Missverhältnis zwischen Knochenaufbau (Osteoblasten) und Abbau (Osteoklasten). Beteiligte Hormone: Östrogen (schützend), Parathormon (setzt Kalzium aus Knochen frei), Calcitonin (fördert Einbau) und Vitamin D3 (Kalziumaufnahme).
Osteoporose;Beeinflussbare und nicht beeinflussbare Faktoren?;Nicht beeinflussbar: Alter, Geschlecht (weiblich), Genetik, frühe Menopause. Beeinflussbar: Kalzium- und Vitamin-D-arme Ernährung, Bewegungsmangel, Untergewicht (BMI < 20), Nikotinabusus, hoher Alkoholkonsum und Langzeit-Kortisontherapie.
Orthopädie;Was ist eine Diarthrose?;Eine Diarthrose ist ein "echtes", freies Gelenk. Es ist gekennzeichnet durch einen Gelenkspalt, eine Gelenkkapsel, Gelenkflächen mit hyalinem Knorpel und Gelenkschmiere (Synovia), welche die Beweglichkeit ermöglicht.
Orthopädie;Unterschied Arthritis vs. Arthrose (Schmerzcharakter)?;Arthritis ist eine entzündliche Gelenkerkrankung (oft autoimmun/infektiös); typisch ist der Ruheschmerz und die morgendliche Gelenksteife. Arthrose ist eine degenerative Abnutzung des Knorpels; typisch ist der Anlaufschmerz nach Ruhe sowie Belastungsschmerz.
Pathophysiologie;Unterschied zwischen einer Entzündung und einem Infekt?;Eine Entzündung ist die allgemeine Reaktion des Körpers auf einen Reiz (biologisch, chemisch, physikalisch). Ein Infekt ist das Eindringen, Anhaften und Vermehren von Mikroorganismen (Bakterien, Viren, Pilze) im Körper, was meist eine Entzündung auslöst.
Orthopädie;Risiken von Orthogilets und orthopädischen Hilfsmitteln?;Hautkomplikationen (Druckstellen, Dekubitus, Mazeration), Muskelatrophie durch mangelnde Eigenaktivität, Sensibilitätsstörungen durch Nervenkompression, Thromboserisiko bei Immobilisation sowie psychische Belastung durch das eingeschränkte Körperbild.
Diabetes;Gegenüberstellung Diabetes Typ 1 und Typ 2?;Typ 1: Absoluter Insulinmangel durch Autoimmunzerstörung der B-Zellen, meist junges Alter, rascher Beginn, schlanke Patienten. Typ 2: Relativer Insulinmangel durch Insulinresistenz, meist höheres Alter, schleichend, oft assoziiert mit Adipositas/Metabolischem Syndrom.
Diabetes;Pflegeschwerpunkte bei Diabetes Typ 2 (Edukation FaGe)?;Überwachung auf Spätkomplikationen (Fusspflege!), BZ-Selbstkontrolle, Schulung zu Ernährung und Bewegung (Gewichtsreduktion), Erkennen von Hypoglykämie-Anzeichen sowie Förderung der Adhärenz bei der oralen Antidiabetika-Einnahme.
Physiologie;Energiequelle der Zelle und Glukosemangel?;Die Zelle gewinnt Energie (ATP) primär durch die Glykolyse und Zellatmung aus Glukose. Ist Glukose aufgebraucht, nutzt der Körper erst Glykogenvorräte (Leber/Muskel), dann Lipolyse (Fettabbau mit Bildung von Ketonkörpern) und im Hungerzustand Proteolyse (Muskelabbau).
Pathophysiologie;Erklären Sie den Ikterus.;Ikterus (Gelbsucht) ist eine Gelbfärbung von Haut und Skleren durch erhöhtes Bilirubin im Blut. Ursachen: Prähepatisch (vermehrter Hämolyse), Intrahepatisch (Leberzellschaden, z.B. Hepatitis) oder Posthepatisch (Gallenabflussstörung, z.B. Gallensteine).
Onkologie;Maligne vs. Benigne und Metastasen?;Benigne (gutartig): Expansives Wachstum, meist gekapselt, keine Metastasen. Maligne (bösartig): Infiltratives, destruierendes Wachstum, Bildung von Metastasen (Tochtergeschwülsten). Ein Tumor gilt als bösartig, wenn er Basalmembranen durchbricht und streut.
Onkologie;Tumorklassifikation und Tumorentstehung?;Klassifikation nach TNM (Tumorgrösse, Nodes/Lymphknoten, Metastasen) und Grading (G1-G4, Differenzierung). Entstehung durch Karzinogenese: Mutationen in Onkogenen oder Tumorsuppressorgenen führen zu unkontrollierter Zellteilung.
Neurologie;Hirndruckzeichen und Krankheiten mit erhöhtem Hirndruck?;Zeichen: Kopfschmerz, Übelkeit/Erbrechen (schwallartig), Bewusstseinstrübung, Pupillenveränderung (Anisokorie), Bradykardie. Krankheiten: Hirnblutung, Tumore, Ödeme nach Schädel-Hirn-Trauma, Meningitis oder Hydrozephalus.
Neurologie;Was ist eine Liquordrainage (Lage und Ziel)?;Ein Katheter im Hirnventrikel (EVD) oder im Lumbalraum. Ziel ist die Ableitung von überschüssigem Liquor zur Senkung des intrakraniellen Drucks oder zur Diagnostik/Entlastung bei Liquorabflussstörungen.
Neurologie;Einteilung des SHT (Grade/GCS) und Verlauf?;Grad 1 (leicht): GCS 13-15, meist reversible Symptome. Grad 2 (mittelschwer): GCS 9-12, oft strukturelle Schäden. Grad 3 (schwer): GCS 3-8, meist Koma und lebensbedrohlich. Verlauf: Akutphase (Primärschaden) gefolgt von Ödemphase (Sekundärschaden).
Neurologie;Unterschied direktes und indirektes SHT?;Direkt: Gewalteinwirkung unmittelbar auf den Schädel (Schlag, Aufprall). Indirekt: Schädigung durch Beschleunigungs- und Verzögerungskräfte ohne direkten Kontakt (z.B. schweres Schleudertrauma bei Auffahrunfall).
Pharma;Wirkung und Nebenwirkung Atrovent und Ventolin?;Ventolin (SABA, Salbutamol): Sympathomimetikum, wirkt rasch bronchodilatierend; NW: Tachykardie, Tremor. Atrovent (SAMA, Ipratropiumbromid): Parasympatholytikum, wirkt entkrampfend; NW: Mundtrockenheit, Harnverhalt.
Pharma;Besonderheiten bei der Verabreichung von Targin?;Targin ist ein Kombinationspräparat aus Oxycodon (Opioid) und Naloxon (Antagonist). Das Naloxon wirkt lokal im Darm gegen die Opioid-induzierte Obstipation, ohne die zentrale Schmerzlinderung aufzuheben. Tabletten dürfen nicht gemörsert werden!
Immunologie;Blutgruppenkompatibilität und Pathophysiologie?;Gruppe 0 ist Universalspender (Erythrozyten), Gruppe AB ist Universalempfänger. Bei Inkompatibilität kommt es zur Antigen-Antikörper-Reaktion (Hämolyse), die zum Nierenversagen und anaphylaktischen Schock führt (v.a. bei Rhesus-Unverträglichkeit).
Hämatologie;Vorbereitung EC-Transfusion und Komplikationen?;Vorbereitung: Identitätskontrolle (Bedside-Test), Vitalzeichen-Nullwert. Häufigste Komplikation: Hämolytische Transfusionsreaktion oder allergische Reaktion. Reaktion: Transfusion sofort stoppen, Leitung belassen, Arzt alarmieren, Schockbehandlung starten.
Pharma;Effekt von ACE-Hemmern bei Niereninsuffizienz?;ACE-Hemmer wirken nephroprotektiv (nierenschützend), indem sie den Druck in den Glomeruli senken. Sie reduzieren die Proteinurie und verlangsamen dadurch das Fortschreiten der chronischen Niereninsuffizienz (v.a. bei Diabetikern).
Pharma;Wirkung Diuretika (Carrier-System) und Überwachung?;Sie blockieren Carrier-Systeme (Transportproteine wie Na-K-2Cl-Cotransporter) in den Nierentubuli. Dadurch werden Elektrolyte und Wasser vermehrt ausgeschieden. Überwachung: Gewicht, Elektrolyte (v.a. Kalium!), Blutdruck und Ödemrückgang.
Pharma;Bedeutung der Plasmaproteinbindung?;Arzneistoffe binden im Blut reversibel an Proteine (z.B. Albumin). Nur der freie, ungebundene Anteil ist pharmakologisch wirksam. Bei Proteinmangel oder Verdrängung durch andere Medikamente steigt die freie Wirkstoffkonzentration (Gefahr der Toxizität).
Pharma;Unterschiede in Pharmakokinetik und Pharmadynamik?;Pharmakokinetik beschreibt die Prozesse, denen ein Arzneistoff im Körper unterliegt (ADME-Modell: Aufnahme, Verteilung, Umbau/Metabolismus, Ausscheidung). Pharmadynamik beschreibt die biochemische und physiologische Wirkung des Medikaments am Wirkort (z.B. Rezeptorbindung).
Pharma;Besonderheiten im Medikamentenmanagement bei älteren Patienten?;Pharmakokinetik: Verminderte Nieren- und Leberleistung (langsamerer Abbau/Ausscheidung), weniger Körperwasser und mehr Fett (veränderte Verteilung). Pharmadynamik: Erhöhte Sensibilität (z.B. ZNS) und erhöhtes Nebenwirkungsrisiko (Multimorbidität/Polypharmazie).
Pharma;Was ist ASS und wer bekommt es?;Acetylsalicylsäure (ASS) ist ein Thrombozytenaggregationshemmer. Es wird Patienten mit KHK, nach Herzinfarkt oder Schlaganfall verschrieben, um das Verkleben von Blutplättchen zu verhindern und so erneute Gefässverschlüsse zu vermeiden.
Wunden;Voraussetzungen für optimale Wundheilung und Ernährung?;Benötigt wird ein feuchtes Wundmilieu, Wärme (Zellteilung stoppt bei Auskühlung) und ausreichende Durchblutung (O2). Ernährung: Proteinreich (Gewebeaufbau), Vitamin C, Zink und ausreichende Hydratation.
Wunden;Unterschied primäre/sekundäre Wunde und Phasen?;Primär: Glatte Ränder, heilt durch direktes Verwachsen (z.B. OP-Naht). Sekundär: Gewebedefekt, heilt aus der Tiefe durch Granulation. Phasen: 1. Exsudation (Reinigung), 2. Proliferation (Granulation), 3. Regeneration (Epithelisierung).
Urologie;Worauf achten bei Patienten mit Dauerkatheter (DK)?;Geschlossenes System wahren, Beutel immer unter Blasenniveau (Reflux verhindern), tägliche Reinigung des Meatus, regelmässige Kontrolle von Urinmenge/Farbe und knickfreie Ableitung.
Urologie;Welche verschiedenen Inkontinenzformen gibt es?;Stressinkontinenz (Druckanstieg durch Husten/Niesen), Dranginkontinenz (überfallartiger Harndrang), Überlaufinkontinenz (Abflussbehinderung, z.B. Prostata), Neurogene Blasenstörung (Nervenschädigung).
Urologie;Risikofaktoren für einen Harnwegsinfekt (HWI)?;Weibliche Anatomie (kurze Urethra), liegende Katheter, Restharnbildung, mangelnde Trinkmenge, Diabetes mellitus und Hormonmangel in der Menopause.
Stoma;Pflegeschwerpunkte bei Stomapatienten?;Physisch: Hautschutz rund um das Stoma, passgenaue Basisplatte, Beobachtung der Mukosa. Psychisch: Unterstützung bei der Bewältigung des veränderten Körperbildes, Einbezug der Stomaberatung und Förderung der Selbstständigkeit.
Geriatrie;Unterschied zwischen Fatigue und Müdigkeit?;Müdigkeit ist physiologisch und verschwindet nach Schlaf/Erholung. Fatigue ist eine pathologische, chronische Erschöpfung (oft bei Krebs oder Entzündungen), die durch Ruhepausen nicht gebessert werden kann.
Geriatrie;Was ist das Frailty-Syndrom?;Ein Syndrom der Gebrechlichkeit im Alter, gekennzeichnet durch verminderte Widerstandsfähigkeit gegenüber Stressoren. Symptome sind unbeabsichtigter Gewichtsverlust, Muskelschwäche (Sarkopenie), langsame Gehgeschwindigkeit und geringe körperliche Aktivität.
Geriatrie;Sturzprophylaxe und altersabhängige Sturzgefahren?;Prophylaxe: Krafttraining, Licht, festes Schuhwerk, Medikamentencheck. Gefahren: Kleinkinder (Neugier/Koordination), Erwachsene (Sport/Ablenkung), Senioren (Multimorbidität, Sehschwäche, Umgebungsgefahren).
Psychologie;Wie zeigt sich maladaptives Coping?;Durch dysfunktionale Bewältigungsstrategien wie Verleugnung der Krankheit, sozialer Rückzug, Aggression gegen das Personal oder Substanzmissbrauch (Alkohol/Medikamente), was die Heilung behindert.
Psychologie;Was passiert im Körper bei einer Stressreaktion?;Aktivierung der Sympathikus-Nebennierenmark-Achse (Adrenalin: Puls/Blutdruck hoch) und der Hypothalamus-Hypophysen-Nebennierenrinden-Achse (Cortisol: Bereitstellung von Energiereserven, langfristig immunsuppressiv).
Pathophysiologie;Zusammenhang Diabetes, pAVK, Hypertonie und Niereninsuffizienz?;Sie verstärken sich gegenseitig (Mikro-/Makroangiopathie). Bluthochdruck und Diabetes schädigen Nieren und Gefässe (pAVK). Für Wunden bedeutet dies: Minderdurchblutung, Ödeme und schlechte Nährstoffversorgung führen zu chronischen Wundheilungsstörungen.
Führung;Eigenschaften eines Teamplayers?;Zuverlässigkeit, aktive Kommunikation, Kritikfähigkeit, Hilfsbereitschaft und das Zurückstellen persönlicher Interessen zugunsten der gemeinsamen Teamziele (Interprofessionalität).
Soziologie;Begriff „Rolle“ und Unterstützung der Patienten?;Rollen sind Erwartungen an eine Position. Patienten verlieren oft ihre Alltagsrollen (Beruf, Partner) und rutschen in die passive Patientenrolle. Unterstützung: Ressourcen fördern, Mitbestimmung ermöglichen und Autonomie stärken.
Soziologie;Bedeutung des sozialen Netzwerks?;Es umfasst alle stabilen Beziehungen (Familie, Freunde, Vereine). Es bietet emotionale und praktische Unterstützung. Aufgabe der Pflege: Ressourcen im Netzwerk identifizieren und Angehörige als Teil des Systems in den Pflegeprozess einbeziehen.
Pflegesysteme;Welche Pflegesysteme kennen Sie?;1. Funktionspflege (tätigkeitsorientiert, z.B. eine Person misst alle Blutdrücke), 2. Bereichspflege (Teampflege, Verantwortung für eine Gruppe von Pat.), 3. Bezugspflege/Primary Nursing (ganzheitliche Verantwortung einer Pflegeperson für einen Pat. vom Eintritt bis Austritt).
Pflegesysteme;Welche Bedeutung haben Angehörige in der Pflege?;Angehörige sind die wichtigste Ressource des Patienten, Experten für seine Biografie und Teil des sozialen Systems. Sie bieten emotionale Stütze, müssen aber auch selbst vor Überlastung geschützt und in den Informationsfluss einbezogen werden.
Pflegesysteme;Warum ist familienzentrierte Pflege wichtig (Definition)?;Sie betrachtet die Familie als Einheit (System). Krankheit betrifft alle Mitglieder; die Unterstützung der Familie stabilisiert den Patienten. Ziel ist die Stärkung der familiären Bewältigungsstrategien und die gemeinsame Entscheidungsfindung.
Delegation;Was delegieren Sie an Lernende und was nicht?;Delegierbar: Tätigkeiten, die dem Ausbildungsstand entsprechen und für die die Lernende kompetent ist. Nicht delegierbar: Hochkomplexe, instabile Situationen, Erst-Assessments, komplexe Pflegeplanungen oder Tätigkeiten, die eine HF-spezifische klinische Beurteilung erfordern.
Delegation;Kriterien des Delegationsmodells nach Horlacher?;1. Richtige Aufgabe (Komplexität?), 2. Richtige Bedingungen (Ressourcen?), 3. Richtige Person (Kompetenz?), 4. Richtige Anleitung/Kommunikation (klare Aufträge), 5. Richtige Überwachung/Bewertung (Feedback/Kontrolle).
Delegation;Delegation nach Benner in der Begleitung?;Basierend auf dem Modell "Vom Anfänger zum Experten". Aufgaben werden dem Entwicklungsstand angepasst: Anfänger benötigen klare Regeln und Instruktionen, Fortgeschrittene handeln zunehmend situationsbezogen unter Supervision.
Delegation;Welche Tätigkeiten dürfen Sie als HF nicht delegieren?;Die Gesamtverantwortung für den Pflegeprozess (Recountability), die klinische Entscheidungsfindung in instabilen Situationen sowie die fachliche Aufsicht und abschliessende Evaluation der Pflegequalität.
Professionalität;Unterschied zwischen FaGe und Pflegefachperson HF?;Die FaGe arbeitet primär in stabilen, delegierten Situationen nach Vorgabe. Die HF trägt die Verantwortung für komplexe Prozesse, Clinical Reasoning, Steuerung der Pflege, interdisziplinäre Koordination und wissenschaftsbasierte Entscheidungsfindung.
Management;Was ist Casemanagement und dessen Vorteile?;Ein koordinierter Prozess zur Steuerung komplexer Krankheitsverläufe. Vorteile: Vermeidung von Versorgungslücken an Schnittstellen, effiziente Ressourcennutzung, Kontinuität der Betreuung und Entlastung des Patienten durch einen zentralen Ansprechpartner.
Management;Was bedeuten Skill-/Grademix und Case Mix?;Skill-Mix: Kombination verschiedener Erfahrungen/Fähigkeiten im Team. Grade-Mix: Kombination verschiedener Ausbildungsstufen (HF, FaGe, AGS). Case Mix: Der "Fall-Mix-Index", der die durchschnittliche Schwere und den Ressourcenaufwand der behandelten Patienten beschreibt.
Forschung;Bedeutung von Forschung im Pflegeberuf?;Forschung generiert neues Wissen, um die Pflegequalität zu sichern, die Wirksamkeit von Interventionen zu belegen (EBN) und die Professionalisierung der Pflege durch eine eigene theoretische Basis voranzutreiben.
Forschung;Was bedeutet EBN (Evidence Based Nursing)?;Die Integration der derzeit besten wissenschaftlichen Belege in die tägliche Pflege, kombiniert mit klinischer Erfahrung, den Präferenzen des Patienten und den vorhandenen Ressourcen (intern im Betrieb z.B. durch Leitlinien/Expertenstandards).
Professionalität;Was bedeutet Professionalisierung und professionelle Pflege?;Professionalisierung ist der Prozess zur Erlangung des Status einer Profession (Eigengestaltung, Ethik, Wissen). Professionelle Pflege basiert auf fachlicher Expertise, ethischen Richtlinien, wissenschaftlicher Fundierung und reflektiertem Handeln.
Professionalität;Umsetzung des Leitsatzes (Spital Schwyz) in der Praxis?;Individuelle Antwort erforderlich, meist: Fokus auf Patientenzentrierung, Wertschätzung im Team, Sicherheit und hohe Fachkompetenz im Alltag durch Clinical Reasoning und empathische Kommunikation vorleben.
Management;Was heisst Rationalisierung und Rationierung?;Rationalisierung: Effizienzsteigerung (gleiche Leistung mit weniger Aufwand, z.B. optimierte Dokumentation). Rationierung: Vorenthaltung notwendiger Leistungen aufgrund von Ressourcenmangel (z.B. Zeitmangel für Gespräche oder Mobilisation).
Management;Was heisst integrierte Versorgung?;Die sektorenübergreifende Vernetzung aller Beteiligten (Spital, Hausarzt, Spitex, Reha). Ziel ist ein nahtloser Behandlungspfad ohne Informationsverluste für den Patienten.
Qualität;Fehlermanagement: Welche Kultur wird gelebt?;Ideal ist eine "Just Culture": Fehler werden nicht bestraft, sondern als Lernchance genutzt. Instrumente wie CIRS (Critical Incident Reporting System) dienen der anonymen Meldung von Beinahe-Fehlern zur Systemverbesserung.
Qualität;Unterstützung einer Kollegin nach einem Fehler?;Zuerst emotionale Unterstützung (Entlastung), dann sachliche Analyse (Was ist passiert?), gemeinsame Schadensbegrenzung, Ermutigung zur Meldung/Dokumentation und Fokus auf Prävention für die Zukunft statt auf Schuldzuweisung.
Edukation;Unterschied Schulung, Beratung und Instruktion?;Instruktion: Vermittlung technischer Fertigkeiten (Handhabung Pen). Schulung: Gezielter Wissensaufbau zu einem Thema (Diabetes-Schulung). Beratung: Gemeinsame Lösungssuche bei individuellen Problemen/Entscheidungen (ergebnisoffen).
Edukation;Erklären Sie das Modell von Schulung und Beratung?;Es basiert auf einem interaktiven Prozess: 1. Bedarfsanalyse (Was braucht der Pat.?), 2. Zielsetzung, 3. Durchführung (Methodenwahl), 4. Evaluation des Lernerfolgs. Es erfordert pädagogische Kompetenz und die Berücksichtigung der Health Literacy.
Beratung & Support;Was ist eine Fachberatung, was ist eine Prozessberatung?;Fachberatung: Der Berater ist Experte für ein Sachthema und gibt direkte Lösungsvorschläge vor (Beispiel: Wundexpertin empfiehlt spezifische Verbandmittel). Prozessberatung: Der Berater begleitet den Kunden dabei, eigene Lösungen zu finden (Beispiel: Supervision zur Teamdynamik).
Berufspolitik & Zukunft;Herausforderungen in der Pflege der nächsten 10-20 Jahre?;Demografischer Wandel (Zunahme hochaltriger, multimorbider Patienten), Fachkräftemangel bei steigendem Pflegebedarf, Finanzierungsdruck im Gesundheitswesen sowie die fortschreitende Digitalisierung (eHealth/AAL).
Gesundheitssystem;Aktuelle Schwierigkeiten im Gesundheitswesen?;Steigende Gesundheitskosten bei begrenzten Ressourcen, Überlastung des Personals, Bettenknappheit in Langzeitpflege/Psychiatrie und die Komplexität der interprofessionellen Vernetzung bei chronisch Kranken.
Pflegesysteme;Kriterien der Bezugspflege und Vergleich zu anderen Modellen?;Bezugspflege (Primary Nursing) beinhaltet die 24-Stunden-Verantwortung einer Pflegeperson für den gesamten Pflegeprozess eines Pat. Unterschied zur Funktionspflege: Ganzheitlichkeit statt Tätigkeitsorientierung. Unterschied zur Bereichspflege: Individuelle Verantwortung statt Teamverantwortung.
Zusammenarbeit & Kommunikation;Bedeutung inter- vs. intradisziplinärer Zusammenarbeit?;Interdisziplinär: Zusammenarbeit verschiedener Berufsgruppen (Pflege, Arzt, Physio). Intradisziplinär: Zusammenarbeit innerhalb der eigenen Berufsgruppe (z.B. HF mit FaGe). Ziel ist die Bündelung von Expertisen für das Patientenwohl.
Zusammenarbeit & Kommunikation;Instrumente und Schnittstellenprobleme der Zusammenarbeit?;Instrumente: Gemeinsame Visiten, Rapporte, SBAR-Konzept, interprofessionelle Fallbesprechungen. Probleme: Informationsverlust bei Verlegungen, unterschiedliche Fachsprachen, Hierarchiekonflikte und unklare Kompetenzabgrenzungen.
Organisationen & Netzwerke;Was ist die Pro Senectute und welche Ziele verfolgt sie?;Die grösste Fachorganisation für Fragen rund um das Alter in der Schweiz. Ziele: Erhalt der Autonomie und Lebensqualität im Alter, Beratung bei Finanzen/Recht, soziale Teilhabe fördern und Unterstützung pflegender Angehöriger.
Organisationen & Netzwerke;Beratungsfelder für Diabetiker ausserhalb des Spitals?;Diabetesgesellschaften bieten Ernährungsberatung, Fusspflege, Schulungen zur Medikation/Technik, psychosoziale Beratung und den Austausch in Selbsthilfegruppen an, um das Selbstmanagement zu Hause zu stärken.
Transition & Versorgung;Was ist Übergangspflege und Unterschied zu anderen Settings?;Zeitlich befristete Pflege (meist 14 Tage) nach einem Spitalaufenthalt zur weiteren Stabilisierung. Ziel: Vorbereitung auf die Rückkehr nach Hause. Unterschied: Fokus liegt auf Rehabilitation und Austrittsplanung, nicht auf Akutdiagnostik.
Denken & Handeln;Was verstehen Sie unter kritischem Denken (Critical Thinking)?;Ein kognitiver Prozess der Analyse, Synthese und Evaluation von Informationen. Es bedeutet, Situationen zu hinterfragen, Evidenz zu suchen, eigene Vorurteile zu reflektieren und logisch begründete Entscheidungen im Sinne des Clinical Reasoning zu treffen.
Denken & Handeln;Was bedeutet divergentes und konvergentes Denken?;Divergent: Kreatives, offenes Denken in viele Richtungen, um viele Ideen/Lösungen zu generieren (Brainstorming). Konvergent: Logisches, fokussiertes Denken, um aus vielen Möglichkeiten die eine, beste Lösung zu finden.
Professionelles Selbstverständnis;Wie würden Sie den Beruf der Pflegefachfrau „verkaufen“?;Als einen hochverantwortungsvollen, krisensicheren Beruf an der Schnittstelle von High-Tech-Medizin und menschlicher Begleitung, der hohe klinische Expertise, Führungsfähigkeit und echte Sinnhaftigkeit vereint.
Berufspolitik & Zukunft;Fachkräftemangel: Was ist Ihre Meinung dazu?;Es ist eine systemische Krise, die nicht nur mehr Ausbildungsplätze braucht, sondern vor allem bessere Arbeitsbedingungen (Personalschlüssel, Vereinbarkeit), um erfahrene Fachkräfte langfristig im Beruf zu halten.
Professionelles Selbstverständnis;Was können Sie für ein gutes Image des Berufs tun?;Professionelles Auftreten (Habitus), Fachsprache nutzen, pflegerische Entscheidungen evidenzbasiert begründen, Stolz auf die eigene Expertise zeigen und den Beruf in der Öffentlichkeit als anspruchsvolle Profession statt als "Hilfsjob" präsentieren.
Professionelles Selbstverständnis;Wie bilden Sie sich nach dem Studium weiter?;Durch Fachvertiefungen (CAS/DAS/MAS in Onkologie, Intensivpflege etc.), regelmässiges Studium von Fachjournalen, Besuch von Kongressen und das Anstreben von Rollen wie APN (Advanced Practice Nurse) oder Berufsbildnerin.
Professionelles Selbstverständnis;Passender Werbeslogan für das Spital Schwyz?;Beispiel: "Menschlichkeit trifft Expertise – Gemeinsam für Ihre Gesundheit im Herzen der Zentralschweiz." (Fokus auf Regionalität und Qualität).
Professionelles Selbstverständnis;Was schätzen Sie an Ihrem Beruf / Arbeitsort?;Die tägliche Herausforderung des Clinical Reasoning, die Arbeit im interprofessionellen Team, die tiefe menschliche Interaktion und die Möglichkeit, Patienten in vulnerablen Lebensphasen massgeblich zu unterstützen.
Berufspolitik & Zukunft;Wie entwickelt sich unser Beruf weiter?;Hin zu mehr akademischer Verantwortung (Pflegewissenschaft), technischer Unterstützung durch Robotik/KI, aber auch zu einer stärkeren Rolle in der Primärversorgung (Gemeindepflege) und präventiven Gesundheitsberatung.
Kommunikation;Was sind die vier Ebenen einer Äusserung im 4-Ohren-Modell nach Schulz von Thun?;1. Sachinformation (Daten/Fakten), 2. Selbstkundgabe (Infos über den Sender), 3. Beziehungshinweis (Wie der Sender zum Empfänger steht), 4. Appell (Was beim Empfänger erreicht werden soll).
Kommunikation;Warum spricht man im 4-Ohren-Modell von "vier Schnäbeln" und "vier Ohren"?;Der Sender kommuniziert seine Botschaft immer auf vier Ebenen gleichzeitig (vier Schnäbel), und der Empfänger nimmt die Botschaft entsprechend auf diesen vier Ebenen wahr (vier Ohren).
Kommunikation;Wovon hängt die Qualität der Kommunikation laut dem 4-Ohren-Modell massgeblich ab?;Sie hängt von der Klarheit und der unmissverständlichen Übereinstimmung der Botschaften auf allen vier Ebenen ab.
Psychologie & Identität;Benennen Sie die 5 Säulen der Identität nach Petzold.;1. Körper und Gesundheit, 2. Soziale Beziehungen, 3. Arbeit und Leistung, 4. Finanzielle Sicherheit, 5. Werte und Sinn.
Psychologie & Identität;Was passiert laut Petzolds Modell, wenn die einzelnen Säulen der Identität gut "gefüllt" sind?;Je mehr die einzelnen Säulen gefüllt und ausgewogen sind, desto höher ist das allgemeine Wohlempfinden und desto stabiler und krisenfester ist die Identität eines Menschen.
Psychologie & Identität;Welche Faktoren zählen im Modell von Petzold zur Säule "Werte und Sinn"?;Dazu gehören Lebensziele, Glaube, Spiritualität, Moral, Ethik, Liebe und Tradition. Sie geben dem Menschen Sinn, Orientierung und Kraft für sein Tun.
Kommunikation;Auf welchen drei Grundhaltungen (nach Carl Rogers) basiert das Aktive Zuhören?;Auf Empathie (Einfühlungsvermögen), bedingungsloser Wertschätzung (Akzeptanz) und Kongruenz (Echtheit/Authentizität).
Kommunikation;Nennen Sie vier Techniken des aktiven Zuhörens in der Pflege.;Offene Fragen stellen, Paraphrasieren (in eigenen Worten wiederholen), Verbalisieren von Gefühlen, Zusammenfassen, Schweigen aushalten und Unklares klären.
Kommunikation;Was bedeutet die Technik "Paraphrasieren" im aktiven Zuhören?;Es bedeutet, wichtige geäusserte Gedanken und sachliche Inhalte des Gegenübers in eigenen Worten zu wiederholen, um das Verständnis zu sichern und dem Gegenüber zu zeigen, dass man zuhört.
Kommunikation;Wie reagieren Sie beim aktiven Zuhören auf "inkongruentes Verhalten" (z.B. Patient sagt lächelnd, er habe starke Schmerzen)?;Man macht das Gegenüber behutsam und wertfrei auf den Widerspruch zwischen der verbalen Aussage und der nonverbalen Körpersprache (Mimik/Gestik) aufmerksam.
Coping & Bewältigung;Was sind die Berner Bewältigungsformen (BEFO) und wozu dienen sie?;Es ist ein Instrument zur Beobachtung und Beurteilung der individuellen Krankheitsbewältigung. Sie helfen, Bewältigungsstrategien in ihrer Ausprägung (von 0 bis 4) durch Fremd- oder Selbsteinschätzung zu erfassen.
Coping & Bewältigung;In welche drei Hauptkategorien werden die Berner Bewältigungsformen (BEFO) unterteilt?;1. Handlungsbezogene Bewältigung (z.B. Zupacken, Ablenkendes Anpacken), 2. Kognitionsbezogene Bewältigung (z.B. Relativieren, Problemanalyse), 3. Emotionsbezogene Bewältigung (z.B. Optimismus, Resignation).
Coping & Bewältigung;Nennen Sie je ein Beispiel für kognitionsbezogene und emotionsbezogene Bewältigung nach BEFO.;Kognitiv: Problemanalyse, Sinngebung, Akzeptieren oder Ablenken. Emotional: Optimismus, Wut ausleben, Isolieren oder Resignation.
Gesundheitsmodelle;Wie definiert das Biopsychosoziale Modell nach Engel Gesundheit und Krankheit?;Nicht als rein körperlichen Zustand, sondern als Ergebnis komplexer Wechselwirkungen zwischen biologischen (Körper/Genetik), psychologischen (Denkmuster/Emotionen) und sozialen Faktoren (Umfeld/Beziehungen).
Gesundheitsmodelle;Was versteht die ICF unter "funktionaler Gesundheit" im Rahmen des Biopsychosozialen Modells?;Eine Person ist funktional gesund, wenn ihre Körperfunktionen/-strukturen der Norm entsprechen und sie alles tun kann (Aktivität) sowie an allen Lebensbereichen so teilhaben kann (Partizipation), wie es erwartet wird.
Gesundheitsmodelle;Nennen Sie Beispiele für soziale und psychologische Faktoren im Biopsychosozialen Modell.;Soziale Faktoren: Wohnumgebung, Arbeitsbedingungen, soziales Netzwerk/Familie. Psychologische Faktoren: Stressbewältigung, Denkmuster, emotionale Stabilität, Einstellungen.
Rehabilitation & Neurologie;Was ist das grundlegende Fundament (neurophysiologisches Prinzip) des Bobath-Konzepts?;Es basiert auf der Plastizität des Nervensystems (Neuroplastizität). Gesunde Hirnanteile werden aktiviert und gefördert, damit sie die Steuerung von gelähmten oder ausgefallenen Funktionen übernehmen können.
Rehabilitation & Neurologie;Was versteht man im Bobath-Konzept unter "Fazilitation"?;Die gezielte pflegerische und therapeutische Anbahnung und Erleichterung von Muskelaktivität durch spezifische Handgriffe, wobei immer auf die selbst initiierte Eigenbewegung des Patienten gewartet wird.
Rehabilitation & Neurologie;Warum ist die Rumpfaufrichtung (Kernstabilität) im Bobath-Konzept so elementar?;Sie ist die Basis für die Haltungskontrolle (posturale Kontrolle). Nur mit einem stabilen Rumpf im Schwerkraftfeld sind die Arme und Beine frei für Bewegungen. Fehlt diese, entstehen pathologische Spannungen (Spastik).
Rehabilitation & Neurologie;An welchen neuropsychologischen Störungen orientiert sich die symptomorientierte Pflege nach Bobath?;An Ausfällen wie Spastik (assoziierte Reaktionen), Sensibilitätsstörungen, Apraxie (Handlungsstörung), Neglect-Phänomen (Vernachlässigung einer Körperhälfte), Pusher-Symptomatik und Aphasie (Sprachstörung).
Familienzentrierte Pflege;In welche drei Hauptkategorien unterteilt das Calgary-Familien-Assessment-Modell (CFAM) die Familie?;In 1. Struktur (Wer gehört zur Familie und in welchem Kontext lebt sie?), 2. Entwicklung (In welcher familiären Lebensphase stehen sie?) und 3. Funktion (Wie interagieren sie im Alltag?).
Familienzentrierte Pflege;Welche Subkategorien gehören im CFAM zur "Struktur" der Familie?;Die interne Struktur (Familienzusammensetzung, Geschlecht, Rangordnung), die externe Struktur (erweiterte Familie, grössere Systeme) und der Kontext (Ethnie, soziale Schicht, Religion/Spiritualität, Umgebung).
Familienzentrierte Pflege;Wozu dient ein Genogramm in der familienzentrierten Pflege?;Es visualisiert die Familienkonstellation (Stammbaum) und zeigt komplexe Beziehungen, Rollenstrukturen sowie genetische Risiken und Belastungen über mehrere Generationen hinweg auf einen Blick.
Familienzentrierte Pflege;Wozu dient das Calgary-Familien-Interventions-Modell (CFIM) und in welchem Verhältnis steht es zum CFAM?;Das CFIM ist das direkte Gegenstück zum Assessment-Modell (CFAM). Es dient dazu, nach der Datenerhebung gezielte pflegerische Interventionen zu identifizieren und umzusetzen, um die Familienfunktion zu fördern oder zu erhalten[cite: 248, 249, 250].
Familienzentrierte Pflege;Auf welche drei grundlegenden Bereiche zielen die Interventionen im Calgary-Familien-Interventions-Modell (CFIM) ab?;Die Förderung und Interventionen erfolgen in den drei Bereichen Kognition (Denken/Wissen), Affekt (Gefühle) und Verhalten, wobei sich diese Bereiche gegenseitig beeinflussen[cite: 251].
Pflegekonzepte;Was versteht man in der Pflege unter dem Begriff "Caring" nach Kristen Swanson?;Caring ist eine innere pflegerische Haltung der Achtsamkeit und Fürsorge. Sie geht über die personenzentrierte Grundhaltung hinaus und zeichnet sich durch starkes Engagement, Anteilnahme und vertrauensvollen Beistand in Krisen aus[cite: 262, 265].
Pflegekonzepte;Nennen Sie die fünf Caring-Dimensionen nach Swanson.;1. Knowing (Bescheid wissen), 2. Being with (Mit jemandem sein), 3. Doing for (Für jemanden etwas tun), 4. Enabling (Ermöglichen/Befähigen), 5. Maintaining belief (Glaube aufrechterhalten)[cite: 266, 267, 270, 273, 276, 279].
Pflegekonzepte;Erklären Sie die Caring-Dimension "Enabling" (Ermöglichen/Befähigen).;Die Pflegefachperson versucht, die Lebenssituation der betroffenen Person so zu erleichtern, dass diese sich (wenn möglich) wieder selbst pflegen kann. Dies geschieht durch gezielte Unterstützung, Information und das gemeinsame Erarbeiten von Lösungen[cite: 277, 278].
Delegation;Wozu dient der Leitfaden zur Delegation und Evaluation nach Horlacher?;Er dient Pflegefachpersonen als Instrument, um die Delegation von Pflegeaufgaben an nicht diplomiertes Personal sicher, effizient und zielgerichtet durchzuführen und Risiken zu minimieren[cite: 287, 288].
Delegation;Welche vier Hauptkriterien müssen laut Horlacher vor jeder Delegation zwingend beurteilt werden?;1. Die Patientensituation (Komplexität und Stabilität), 2. Die Pflegeaufgabe (Verletzungsrisiko und Häufigkeit der nötigen Neubewertung), 3. Erfahrung/Kompetenz der nicht-diplomierten Person, 4. Erfahrung der delegierenden diplomierten Pflegefachperson[cite: 290, 291, 293, 294, 295, 296].
Delegation;Wie wird die "Patientensituation" im Delegationsmodell von Horlacher bewertet?;Sie wird in zwei Dimensionen eingeteilt: Die Komplexität (niedrig, mittel, hoch) und die Stabilität (hoch, mittel, niedrig). Instabile und hochkomplexe Situationen sind in der Regel nicht delegierbar[cite: 290, 291].
Ethik & Recht;Nennen Sie die vier Schritte der ethischen Fallbesprechung nach der Nijmegener Methode in der korrekten Reihenfolge.;1. Problemdefinition, 2. Fakten sammeln, 3. Bewertung, 4. Entscheidungsfindung / Beschlussfassung[cite: 748, 750, 751, 752, 753].
Ethik & Recht;Was geschieht im Schritt "Fakten" der Nijmegener Methode?;Es werden alle relevanten Fakten aus verschiedenen Perspektiven (medizinisch, pflegerisch, weltanschaulich, sozial und organisatorisch) zusammengetragen, um eine umfassende und interprofessionelle Beurteilung zu ermöglichen[cite: 751].
Ethik & Recht;Worauf stützt sich der Schritt "Bewertung" in der ethischen Fallbesprechung nach der Nijmegener Methode?;Die vorliegende Situation wird anhand der vier ethischen Prinzipien (z.B. Patientenwohl, Patientenautonomie) sowie der professionellen Verantwortung der Pflegenden kritisch reflektiert[cite: 752].
Ethik & Recht;Nennen Sie die vier klassischen ethischen Prinzipien in der Pflege.;1. Autonomie (Selbstbestimmung), 2. Gutes tun (Beneficence), 3. Nicht schaden (Nonmaleficence), 4. Gerechtigkeit (Justice)[cite: 309, 314, 318, 323].
Ethik & Recht;Warum ist in ethischen Dilemmata oft eine "Güterabwägung" der ethischen Prinzipien zwingend nötig?;Weil keines dieser Prinzipien absolute Geltung hat. In der Praxis können Situationen entstehen, in denen die Prinzipien (z.B. Autonomie vs. Fürsorge) in direktem Widerspruch zueinander stehen, aber beide gleichzeitig relevant sind[cite: 307, 308].
Ethik & Recht;Was umfasst das ethische Prinzip der Gerechtigkeit (Justice) in der Pflege?;Es umfasst die Pflicht, dass medizinische und pflegerische Ressourcen fair und gerecht verteilt werden und alle Menschen entsprechend ihrem individuellen Bedarf gepflegt werden[cite: 324, 325].
Familienzentrierte Pflege;Was ist der Kernansatz der Familienzentrierten Pflege (FZP)?;Sie richtet sich nicht nur an den einzelnen Patienten, sondern bezieht die pflegenden Angehörigen und die Familie als ganzes System kontinuierlich von Beginn an in den Behandlungsplan ein[cite: 332, 333].
Familienzentrierte Pflege;Wie wird der Begriff "Familie" in der Familienzentrierten Pflege definiert?;Als eine Gruppe von Individuen, die durch starke emotionale Bindungen und ein Zugehörigkeitsgefühl verbunden sind und gegenseitig Anteil an ihrem Leben nehmen. Sie müssen nicht zwingend blutsverwandt sein[cite: 338, 339].
Familienzentrierte Pflege;Welchen Zweck erfüllt das "Ökogramm" in Ergänzung zum Genogramm in der Familienzentrierten Pflege?;Während das Genogramm die familiären internen Beziehungen darstellt, zeigt das Ökogramm zusätzlich die Beziehungen der Familie zu externen Kontakten (z.B. Spitex, Vereine, Arbeit) und Umwelteinflüssen auf[cite: 346, 347].
Pflegediagnostik;Was sind die funktionellen Gesundheitsverhaltensmuster nach Gordon und wozu dienen sie?;Marjory Gordon entwickelte elf Muster (z. B. Ernährung, Ausscheidung, Schlaf), die zur systematischen Pflegeanamnese und zur Klassifizierung von Pflegediagnosen dienen[cite: 354].
Pflegediagnostik;Was umfasst das Gesundheitsverhaltensmuster "Kognition und Perzeption" nach Gordon?;Es umfasst die sensorische Wahrnehmung und die kognitiven Fähigkeiten, inklusive Gedächtnis, Denken, Orientierung und Kommunikation[cite: 369, 370].
Pflegediagnostik;Welches Gesundheitsverhaltensmuster nach Gordon betrachtet die Stressbewältigung einer Person?;Das Muster "Bewältigungsverhalten und Stresstoleranz". Es erfasst, wie eine Person mit Stress und Belastungen umgeht und wie effektiv ihre Bewältigungsstrategien sind[cite: 381, 382].
Pflegediagnostik;Was wird im Gesundheitsverhaltensmuster "Werte und Überzeugungen" erfasst?;Persönliche Überzeugungen, Werte, ethische Prinzipien sowie religiöse und spirituelle Ansichten, die das Verhalten und die Entscheidungen einer Person leiten[cite: 383, 384].
Kommunikation;Was ist das Hauptziel der Gewaltfreien Kommunikation nach Rosenberg?;Ziel ist es, in der Kommunikation aggressive Signale wie Bewertung, Schuldzuweisung oder Kritik zu vermeiden, da aggressive Sprache zu gegenseitiger Aggression führt, und stattdessen eine positive Konfliktbearbeitung zu ermöglichen[cite: 404, 405, 407].
Kommunikation;Nennen Sie die vier Schritte der Gewaltfreien Kommunikation nach Rosenberg.;1. Beobachten (ohne zu bewerten), 2. Gefühle erkennen und benennen, 3. Bedürfnisse wahrnehmen und ernst nehmen, 4. Klare und erfüllbare Anliegen (Bitten) formulieren[cite: 408, 409, 410, 411, 412].
Kommunikation;Was bedeutet der Schritt "Beobachten statt bewerten" in der Gewaltfreien Kommunikation?;Es wird darauf geachtet, konkrete und sachliche Beobachtungen einer Situation zu schildern, ohne diese direkt mit eigenen Interpretationen oder moralischen Bewertungen zu vermischen[cite: 409].
Kommunikation;Wie werden die Schritte der Gewaltfreien Kommunikation in der Interaktion angewendet (zwei Formen)?;In Form der "Selbstmitteilung" (eigene Gefühle und Bedürfnisse ausdrücken) oder der "Einfühlsamkeit" (die Bedürfnisse des Gegenübers empathisch erkunden, um eine Verbindung herzustellen)[cite: 413, 414].
Beratung & Support;Wofür steht das Akronym GROW und wo wird dieses Modell in der Pflege angewendet?;G: Goal (Ziel), R: Reality (Realität/Ist-Zustand), O: Options (Optionen), W: Way forward / Will (Wille/Umsetzung). Ursprünglich aus dem Coaching, wird es in der Pflege erfolgreich für zielgerichtete Beratungsgespräche genutzt[cite: 458, 460, 462, 464, 466].
Beratung & Support;Was geschieht in der "Reality"-Phase (R) des GROW-Modells?;Der Ist-Zustand wird erfasst. Die aktuelle Situation wird geklärt und das Bewusstsein für das Problem oder die Ausgangslage beim Patienten gebildet[cite: 462, 463].
Beratung & Support;Was wird in der Phase "Way forward / Will" (W) im GROW-Modell festgelegt?;Es werden konkrete Handlungsschritte definiert: Was wird wann, von wem und wie getan? Zudem werden mögliche Hindernisse und Stolpersteine im Vorfeld erfasst und diskutiert[cite: 466, 467].
Zusammenarbeit & Führung;Nennen Sie die fünf Phasen der Teamentwicklung nach Tuckmann.;1. Orientierungsphase (Forming), 2. Kampf- oder Konfliktphase (Storming), 3. Normierungsphase (Norming), 4. Integrationsphase (Performing), 5. Auflösungsphase (Adjourning)[cite: 424, 430, 435, 440, 449].
Zusammenarbeit & Führung;Was kennzeichnet die "Storming"-Phase (Kampfphase) in der Teamentwicklung?;Nach einer ersten Kennenlernphase treten Frustrationen und Krisenstimmungen auf, wenn Erwartungen nicht übereinstimmen. Es kommt zu Konflikten (oft unsachlich) und der Bildung von Untergruppen[cite: 431, 432, 433, 434].
Zusammenarbeit & Führung;Was passiert in der "Norming"-Phase (Normierungsphase) der Gruppe?;Es entwickeln und festigen sich Umgangsformen, Rollen und Aufgabenverteilungen. Das Team arbeitet kooperativer, anerkennt die Leistungen anderer und beginnt sich zunehmend selbst zu organisieren[cite: 436, 437, 438, 439].
Zusammenarbeit & Führung;Wie verhält sich ein Team in der "Performing"-Phase (Integrationsphase)?;Es entsteht ein starkes "Wir-Gefühl". Die Gruppenstruktur ist klar definiert, der Informationsfluss ist gut, und die gesamte Energie kann effizient und hochmotiviert auf die Aufgabenbewältigung konzentriert werden[cite: 441, 442, 447, 448].
Kommunikation;Was ist das Hauptziel des Harvard-Konzepts?;Es ist ein Verhandlungsansatz für einen konstruktiven und friedlichen Konsens. Das Ziel ist eine faire Einigung, bei der für alle beteiligten Parteien der grösste Nutzen entsteht (Win-Win-Situation)[cite: 474, 475, 476].
Kommunikation;Nennen Sie die vier Prinzipien des Harvard-Konzepts.;1. Mensch und Problem trennen, 2. Erfassung der Interessen (statt starrer Positionen), 3. Vorteilhafte Optionen für alle erarbeiten, 4. Neutral beurteilen anhand objektiver Kriterien[cite: 478, 481, 484, 486].
Kommunikation;Was bedeutet der Grundsatz "Mensch und Problem trennen" im Harvard-Konzept?;Emotionales Befinden und subjektive Wahrnehmungen sollen strikt vom sachlichen Problem getrennt werden, um persönliche Konflikte zu reduzieren und sachliche Dialoge zu ermöglichen[cite: 479, 480].
Kommunikation;Warum fokussiert das Harvard-Konzept auf "Interessen" statt auf "Positionen"?;Das Festhalten an starren Positionen blockiert Lösungen. Das Verstehen der zugrunde liegenden Interessen und Bedürfnisse aller Parteien ermöglicht es, gemeinsame Lösungen zu finden, die diese Bedürfnisse berücksichtigen[cite: 482, 483].
Gesundheitsmodelle;Worin liegt der Unterschied zwischen "Illness" und "Disease" nach dem SRK-Erklärungsmodell?;Illness ist die subjektive Wahrnehmung und Erfahrung der Krankheit durch den Patienten. Disease ist die Krankheit aus medizinischer Perspektive, definiert durch objektive Symptome und ärztliche Diagnosen[cite: 493, 495, 499, 500].
Gesundheitsmodelle;Wodurch wird das subjektive Erleben von Krankheit ("Illness") massgeblich geprägt?;Es wird stark durch individuelle und soziokulturelle Faktoren wie Sozialisation, Biografie, Persönlichkeit, soziale Ressourcen und den sozioökonomischen Kontext der betroffenen Person beeinflusst[cite: 496, 497].
Gesundheitsmodelle;Kann eine Person ein "Disease" haben, ohne eine "Illness" zu verspüren (und umgekehrt)?;Ja. Jemand kann medizinisch krank sein (z. B. Frühstadium eines Tumors), ohne sich krank zu fühlen. Umgekehrt kann sich jemand subjektiv krank fühlen (Illness), ohne dass ein ärztlich messbarer Befund (Disease) vorliegt[cite: 501, 502, 503].
Gesundheitsmodelle;Was ist die grösste Herausforderung für Pflegefachpersonen im Umgang mit dem Illness-Disease-Modell?;Die Herausforderung liegt darin, nicht nur das "Disease" zu behandeln, sondern das subjektive Krankheitserleben ("Illness") des Patienten im jeweiligen soziokulturellen Kontext richtig zu verstehen und in die Pflege einzubeziehen[cite: 504].
Pflegemodelle;Was ist der Fokus des Illness-Trajectory Modells nach Corbin und Strauss?;Das Modell fokussiert sich auf den Krankheitsverlauf einer chronischen Krankheit und deren Auswirkungen auf die Betroffenen und ihre Bezugspersonen[cite: 550].
Pflegemodelle;Wie beschreiben Corbin und Strauss die Krankheitsverlaufskurve?;Sie ist individuell, durch Schwankungen und verschiedene Phasen gekennzeichnet und wird von der Krankheit, den Reaktionen und den Bewältigungsstrategien beeinflusst[cite: 554, 555].
Pflegemodelle;Nennen Sie Beispiele für Phasen der Krankheitsverlaufskurve nach Corbin und Strauss.;Das Modell umfasst neun Phasen, darunter die akute (Acute), stabile (Stable), instabile (Unstable) und kritische Phase (Crisis)[cite: 557, 558, 559, 562, 563, 564, 565].
Pflegemodelle;Welche Bedeutung haben "Biografie und Arbeit" im Illness-Trajectory Modell?;Chronische Krankheiten erfordern umfassende Bewältigungsarbeit, die biografische, krankheitsbezogene und alltagsbezogene Aspekte umfasst, welche miteinander verknüpft sind und ständig angepasst werden müssen[cite: 574, 575].
Psychologie & Krisen;Wodurch entstehen Krisen im Modell von Caplan?;Krisen entstehen durch Veränderungen im Leben, insbesondere wenn Menschen sich an neue Lebensphasen anpassen müssen und bisherige Bewältigungsstrategien versagen[cite: 598, 601].
Psychologie & Krisen;Nennen Sie die vier Hauptphasen der Krise nach Caplan.;1. Konfrontation, 2. Mobilisierung, 3. Vollbild der Krise, 4. Bewältigung / Neuorientierung[cite: 600, 602, 605, 608, 610].
Psychologie & Krisen;Was geschieht in Caplans Phase "Vollbild der Krise"?;Wenn die Belastung nicht bewältigt werden kann, eskaliert die Krise. Es kommt zu Rat- und Orientierungslosigkeit, Verzweiflung und gegebenenfalls zu selbst- oder fremdgefährdendem Verhalten[cite: 606, 607].
Psychologie & Krisen;Welche Art von Krisen beschreibt das Krisenmodell nach Cullberg?;Es beschreibt traumatische Krisen als Reaktion auf plötzliche, schwere Schicksalsschläge, welche die psychische Existenz bedrohen und häufig zu einem Trauerprozess führen[cite: 635, 636].
Psychologie & Krisen;Nennen Sie die vier Krisenphasen nach Cullberg.;1. Schockphase, 2. Reaktionsphase, 3. Verarbeitungsphase, 4. Phase der Neuorientierung[cite: 637, 638, 641, 644, 647].
Psychologie & Krisen;Wie äussert sich die Schockphase nach Cullberg und wie lange kann sie dauern?;Sie ist gekennzeichnet durch Desorientierung und emotionale Taubheit und kann einige Sekunden bis zu zwei Wochen dauern[cite: 639, 640].
Edukation;Was ist eine Mikroschulung und welches Ziel verfolgt sie?;Es ist eine 15 bis 30-minütige Lerneinheit, die strukturiert spezifische Fertigkeiten und Wissen vermittelt, um Pflegeempfänger zur selbstständigen Durchführung von Massnahmen zu ermutigen[cite: 676, 677].
Edukation;Warum ist der erste Schritt der Mikroschulung ("Vorwissen ermitteln") so wichtig?;Um unnötige Wiederholungen zu vermeiden, Desinteresse vorzubeugen und um Schwächen oder Fehlinformationen zu erkennen, damit die Lerneinheit angepasst werden kann[cite: 680, 681].
Edukation;Wie sollte die Erfolgsüberprüfung am Ende einer Mikroschulung durchgeführt werden?;Die Frage "Haben Sie alles verstanden?" ist ungeeignet. Stattdessen sollten spezifische Fragen gestellt werden, wie z.B. "Zeigen Sie mir noch einmal, wie..." oder "Wie würden Sie vorgehen, wenn...?"[cite: 704].
Pflegemodelle;Was ist das Ziel der Pflege nach dem Modell der 14 Grundbedürfnisse von Virginia Henderson?;Die Patientin/den Patienten bei der Befriedigung der 14 Grundbedürfnisse so zu unterstützen, dass diese Person möglichst schnell wieder unabhängig und selbstständig wird (Hinweis: Das Modell ist im Skript nur als Fakultativliteratur gelistet, daher stammt diese Antwort aus dem allgemeinen Pflegewissen).
Pflegemodelle;Nennen Sie Beispiele für die 14 Grundbedürfnisse nach Henderson.;Normal atmen, ausreichend essen und trinken, Körpertemperatur halten, sich sauber halten sowie kommunizieren und Gefühle ausdrücken.
Beratung & Support;Was ist das Hauptziel der Motivierenden Gesprächsführung (MI) nach Miller und Rollnick?;Sie zielt darauf ab, die Ambivalenz des Klienten zwischen dem Beibehalten des Problemverhaltens und der Veränderung zu adressieren, um Verhaltensänderungen im Einklang mit eigenen Werten zu fördern[cite: 719, 720].
Beratung & Support;Auf welchen vier Elementen basiert die Grundhaltung der Motivierenden Gesprächsführung?;Auf Partnerschaftlichkeit (Augenhöhe), Akzeptanz (bedingungslose Wertschätzung/Empathie), Mitgefühl und Evokation[cite: 722, 723, 727, 730, 731].
Beratung & Support;Was bedeutet das Prinzip der "Evokation" in der MI?;Es bedeutet, die vorhandenen Bewältigungsressourcen des Klienten aufzudecken und hervorzuholen, anstatt sich auf die Beseitigung von Defiziten zu konzentrieren oder Fachwissen überzustülpen[cite: 731].
Beratung & Support;Wie geht man in der Motivierenden Gesprächsführung mit Widerständen und Ambivalenzen um?;Widerständen wird nicht konfrontativ begegnet. Stattdessen werden Pro und Contra diskutiert und "Change Talk" (Aussagen, die für eine Veränderung sprechen) wird aktiv angeregt[cite: 740].
Kommunikation;Wofür steht das Akronym NURSE und in welcher Situation wird es angewendet?;Es steht für Naming, Understanding, Respecting, Supporting, Exploring und bietet Techniken im Umgang mit emotionalen Äusserungen von Patienten[cite: 776, 777, 780, 782, 784, 787].
Kommunikation;Was bedeutet der Schritt "Naming" (N) im NURSE-Modell?;Die Emotionen des Patienten werden benannt, um seine Wahrnehmung wiederzugeben, sofern er seine Gefühle nicht bereits selbst ausgedrückt hat[cite: 778, 779].
Kommunikation;Wie wird die Phase "Supporting" (S) im NURSE-Modell korrekt umgesetzt?;Die Unterstützung wird als Angebot formuliert, um dem Patienten zu helfen, ohne diese sofort aufzudrängen oder umzusetzen[cite: 785, 786].
Qualitätsmanagement;Wofür wird der PDCA-Zyklus nach Deming in der Pflege primär eingesetzt?;Er wird für die Umsetzung und Sicherung von Qualität empfohlen und kann direkt innerhalb des Pflegeprozesses angewendet werden[cite: 885].
Qualitätsmanagement;Wofür stehen die vier Buchstaben im PDCA-Zyklus?;Plan (Planen), Do (Umsetzen/Durchführen im kleinen Massstab), Check (Überprüfen/Auswerten) und Act (Handeln/Standardisieren)[cite: 886, 893, 896, 898].
Qualitätsmanagement;Was sind typische Aufgaben in der "Plan"-Phase des PDCA-Zyklus?;Den Ist-Zustand ermitteln, das Problem und Ziel beschreiben, Lösungen erarbeiten sowie einen Massnahmenplan erstellen[cite: 887, 888, 889, 890, 891].
Qualitätsmanagement;Was geschieht in der "Act"-Phase des PDCA-Zyklus?;Die erfolgreichen Massnahmen werden als neue Standards vereinbart, dokumentiert und dauerhaft in den Arbeitsablauf integriert[cite: 899].
Kommunikation;Welche drei wesentlichen Haltungen prägen die personenzentrierte Therapie nach Carl Rogers?;Empathie (Einfühlungsvermögen), bedingungslose Wertschätzung (Akzeptanz) und Kongruenz (Echtheit)[cite: 799].
Kommunikation;Was versteht Carl Rogers unter "Kongruenz" in der pflegerischen Kommunikation?;Kongruenz bedeutet Echtheit. Es bedeutet, klare, verständliche Botschaften zu senden, bei denen Körpersprache und verbale Aussagen übereinstimmen, ohne Zuneigung oder Zeit vorzutäuschen[cite: 807, 808, 810].
Kommunikation;Warum ist die "bedingungslose Wertschätzung" laut Rogers so entscheidend für die Pflegebeziehung?;Sie vermittelt dem Gegenüber, dass es als Individuum wahrgenommen und unvoreingenommen akzeptiert wird, selbst wenn es sich einmal nicht erwartungskonform verhält[cite: 804, 805].
Pflegeprozess;In welchem Schritt des Pflegeprozesses ist der pflegediagnostische Prozess angesiedelt und was geschieht dort grundlegend?;Er ist der zweite Schritt des Pflegeprozesses. Die im Assessment erhobenen Daten werden interpretiert und ausgewertet, um Pflegediagnosen zu erstellen[cite: 863].
Pflegeprozess;Wo finden Studierende der XUND detaillierte Informationen zum pflegediagnostischen Prozess?;Der ausführliche pflegediagnostische Prozess wird spezifisch im Pflegeprozess-Skript der XUND in Kapitel 4 behandelt[cite: 880].
Pflegeprozess;Wie wird der Pflegeprozess generell definiert?;Er ist ein logischer, patientenzentrierter, zielgerichteter und systematischer Denk- und Handlungsprozess in aufeinander aufbauenden Phasen, um bestimmte Pflegeziele zu erreichen[cite: 838, 839].
Pflegeprozess;Nennen Sie die fünf Phasen des Pflegeprozesses nach Müller-Staub.;1. Pflegeassessment, 2. Pflegediagnose, 3. Ergebnis / Planung (Pflegeziele und -interventionen), 4. Pflegeinterventionen (Durchführung), 5. Pflegeevaluation[cite: 858, 862, 864, 867, 870].
Pflegeprozess;Was ist das Hauptziel in der Phase der "Pflegeevaluation"?;Es wird überprüft, ob die festgelegten Ziele erreicht wurden. Werden die Ziele nicht erreicht, wird jeder Schritt des Pflegeprozesses kritisch hinterfragt und angepasst[cite: 872, 873].
Rehabilitation;Was ist das primäre Ziel der medizinischen Rehabilitation?;Funktionsstörungen zu verhindern oder deren Auswirkungen zu minimieren, um dauerhafte Beeinträchtigungen zu vermeiden und die soziale Integration der betroffenen Menschen zu ermöglichen[cite: 979, 980].
Rehabilitation;Was kennzeichnet die Phase A im Phasenmodell der neurologischen Rehabilitation?;Phase A ist die Akutbehandlung (inkl. Intensivmedizin). Sie ist abgeschlossen, wenn keine vitale Bedrohung mehr besteht und eine weitere Mobilisation medizinisch möglich ist[cite: 984, 985, 986].
Rehabilitation;In welcher Phase der Rehabilitation befinden sich stark bewusstseinsgetrübte Patienten und was ist das Ziel?;In Phase B. Das Hauptziel ist es, die grundlegenden Voraussetzungen für eine kooperative Mitarbeit im weiteren Rehabilitationsprozess zu schaffen[cite: 990, 991].
Rehabilitation;Wodurch zeichnet sich die Phase C im Rehabilitationsmodell aus?;Der Patient ist weitgehend bei Bewusstsein und nimmt an Therapien teil, benötigt jedoch noch Unterstützung bei den Aktivitäten des täglichen Lebens (ATL). Ziel ist die Wiederherstellung motorischer/neurophysiologischer Grundfunktionen[cite: 993, 994, 995].
Rehabilitation;Für wen ist die Phase F im Phasenmodell der Rehabilitation vorgesehen?;Für Personen, die in den vorherigen Phasen keine Fortschritte mehr erzielen konnten und zur Erhaltung ihrer Lebensqualität dauerhaft unterstützende, betreuende oder zustandserhaltende Leistungen benötigen[cite: 1005, 1006].
Psychologie & Entwicklung;Was beschreibt die Theorie der psychosozialen Entwicklung nach Erik H. Erikson grundlegend?;Sie beschreibt, wie die Entwicklung von der Kindheit bis zum Erwachsenenalter durch soziale Faktoren (Kultur, Beziehungen, gesellschaftliche Normen) beeinflusst wird.
Psychologie & Entwicklung;Wie ist jede Entwicklungsphase im Modell von Erikson charakterisiert?;Jede der acht Phasen ist durch zwei Pole bzw. einen Konflikt gekennzeichnet (z.B. Urvertrauen vs. Urmisstrauen), den das Individuum lösen muss, um eine gesunde Persönlichkeit zu entwickeln.
Psychologie & Entwicklung;Nennen Sie drei Beispiele für die acht Konfliktpaare (Stadien) nach Erikson.;1. Urvertrauen vs. Urmisstrauen (Säugling), 2. Autonomie vs. Scham/Zweifel (Kleinkind), 3. Identität vs. Identitätsdiffusion (Adoleszenz).
Zusammenarbeit & Führung;Was versteht man unter einer "Teamrolle" nach dem Modell von Meredith Belbin?;Eine Teamrolle ist eine Reihe von Verhaltensmerkmalen, die für den Erfolg eines Teams entscheidend sind. Erfolgreiche Teams brauchen eine vielfältige Mischung aus verschiedenen individuellen Stärken und Rollen.
Zusammenarbeit & Führung;In welche drei Hauptkategorien werden die Teamrollen nach Belbin unterteilt?;1. Handlungsorientierte Rollen, 2. Kommunikationsorientierte Rollen, 3. Wissensorientierte Rollen.
Zusammenarbeit & Führung;Nennen Sie die drei handlungsorientierten Rollen nach Belbin.;Macher/in (dynamisch, entscheidungsfreudig), Umsetzer/in (zuverlässig, strukturiert) und Perfektionist/in (genau, pünktlich).
Zusammenarbeit & Führung;Welche Rolle nimmt der/die "Erfinder/in" (Plant) in einem Team nach Belbin ein?;Er/Sie gehört zu den wissensorientierten Rollen, ist kreativ und findet unübliche Lösungen, neigt aber dazu, Details zu übersehen.
Pflegemodelle;Was sind die zentralen Elemente des Pflegemodells nach Roper, Logan und Tierney (RLT-Modell)?;Das Modell basiert auf fünf Hauptkomponenten: 1. Lebensspanne, 2. Abhängigkeits-/Unabhängigkeitskontinuum, 3. Lebensaktivitäten (LA), 4. Einflussfaktoren, 5. Individualität im Leben. (Hinweis: Fakultativliteratur).
Pflegemodelle;Wofür stehen die "Lebensaktivitäten" (LA) im RLT-Modell und wozu dienen sie?;Es gibt 12 Lebensaktivitäten (z.B. Atmen, Kommunizieren, Schlafen, sich waschen). Sie dienen als Struktur, um den Pflegebedarf und die Selbstständigkeit des Patienten in diesen grundlegenden Bereichen einzuschätzen.
Pflegemodelle;Welche Faktoren beeinflussen nach dem RLT-Modell die Lebensaktivitäten eines Menschen?;Biologische, psychologische, soziokulturelle, umgebungsabhängige und wirtschaftspolitische Faktoren beeinflussen, wie ein Mensch seine Lebensaktivitäten ausführen kann.
Gesundheitsförderung;Was ist die zentrale Fragestellung der Salutogenese nach Antonovsky im Gegensatz zur Pathogenese?;Die Salutogenese fragt "Warum und wie bleiben Menschen trotz gesundheitsschädigender Einflüsse und Stressoren gesund?", während die Pathogenese primär fragt, was Menschen krank macht.
Gesundheitsförderung;Erklären Sie das "Gesundheits-Krankheits-Kontinuum" nach Antonovsky.;Gesundheit und Krankheit sind keine getrennten Zustände. Ein Mensch ist nie völlig gesund oder völlig krank, sondern bewegt sich als dynamischer Prozess stets auf einer Linie (Kontinuum) zwischen diesen beiden Polen.
Gesundheitsförderung;Was sind "Widerstandsressourcen" im Modell der Salutogenese?;Es sind Merkmale und Eigenschaften (z.B. Immunsystem, Intelligenz, finanzieller Rückhalt, soziales Netzwerk), die eine effektive Spannungsverarbeitung und Bewältigung von Belastungen (Stressoren) ermöglichen.
Gesundheitsförderung;Nennen Sie die drei Komponenten, aus denen sich das Kohärenzgefühl (Sense of Coherence) zusammensetzt.;1. Verstehbarkeit (Ereignisse sind strukturiert und erklärbar), 2. Handhabbarkeit (Ressourcen zur Bewältigung sind vorhanden), 3. Sinnhaftigkeit (Herausforderungen haben einen Sinn und lohnen sich).
Psychologie & Resilienz;Worauf basieren die "Säulen der Resilienz" nach Emmy Werner?;Sie basieren auf Werners Langzeitstudie, die untersuchte, warum sich einige Kinder trotz widriger Umstände (Armut, Vernachlässigung) zu psychisch gesunden Erwachsenen entwickelten (Resilienz). (Hinweis: Fakultativliteratur).
Psychologie & Resilienz;Was versteht man generell unter dem Begriff "Resilienz"?;Die psychische Widerstandskraft, Krisen, Rückschläge oder traumatische Erfahrungen durch Rückgriff auf persönliche und sozial vermittelte Ressourcen zu bewältigen und gestärkt daraus hervorzugehen.
Psychologie & Resilienz;Nennen Sie klassische Schutzfaktoren (Säulen) der Resilienz nach Werner.;Wichtige Säulen sind unter anderem Optimismus, Akzeptanz der Situation, Lösungsorientierung, Selbstwirksamkeit, Eigenverantwortung sowie ein stützendes soziales Netzwerk.
Edukation;Welche Strukturähnlichkeit weist der Schulungsprozess in der Patientenedukation auf?;Der Schulungsprozess besteht aus einer Reihe systematischer Schritte und weist starke inhaltliche und strukturelle Parallelen zum allgemeinen Pflegeprozess auf.
Edukation;Nennen Sie die vier zentralen Phasen des Schulungsprozesses.;1. Einschätzung des Schulungsbedarfs, 2. Zielvereinbarung, 3. Durchführung der Schulung, 4. Erfolgsüberprüfung.
Edukation;Was passiert in der Phase "Einschätzung des Schulungsbedarfs"?;Die Schulungsperson informiert sich (z.B. mittels Anamnese) über das Vorwissen, die Motivation, die Krankheits- und Lebenssituation sowie die Probleme und Ressourcen der lernenden Person.
Edukation;Worauf muss bei der "Durchführung der Schulung" besonders geachtet werden?;Sie muss unter Anwendung verschiedener Lernmethoden erfolgen und zwingend an die Vorkenntnisse, die Erfahrungen und das individuelle Lerntempo der lernenden Person angepasst werden.
Psychologie & Resilienz;Wie werden die Schutzfaktoren im Resilienzmodell grundsätzlich eingeteilt?;In externe Schutzfaktoren (Ressourcen aus der Umwelt) und interne Schutzfaktoren (personale Eigenschaften).
Psychologie & Resilienz;Nennen Sie Beispiele für externe Schutzfaktoren (Ressourcen) nach dem Resilienzmodell.;Kultur, Gesellschaft, das unmittelbare Umfeld (wie Schule oder Nachbarschaft) und vor allem die Familie als Mikrosystem.
Psychologie & Resilienz;Welche internen (personalen) Schutzfaktoren begünstigen die Resilienz eines Individuums?;Eigenschaften wie Intelligenz, ein aktives Temperament und eine sichere Bindung zu primären Bezugspersonen.
Psychologie & Resilienz;Nennen Sie Faktoren, die als Belastungs- oder Risikofaktoren die Resilienz verringern können.;Armut, soziale Konflikte, beengte Wohnverhältnisse, chronische Krankheiten der Eltern oder abwesende/wechselnde Bezugspersonen.
Psychologie & Identität;Wie wird das Selbstkonzept nach Käppeli definiert?;Als die Gesamtheit der Überzeugungen und Vorstellungen (kognitive Repräsentation), die eine Person über sich selbst entwickelt hat (oft synonym zum Begriff "Selbstbild" verwendet).
Psychologie & Identität;Welche Faktoren beeinflussen die Selbstbewertung und damit das Selbstkonzept einer Person massgeblich?;Körperliche Leistungsfähigkeit, körperliches Aussehen, konvergentes Denken, akademische Fähigkeiten sowie die Qualität der sozialen Beziehungen.
Psychologie & Identität;Welchen Einfluss haben "kritische Lebensereignisse" auf das Selbstkonzept?;Nicht-normative Ereignisse (wie Arbeitsplatzverlust, Unfall oder schwere Krankheit) sowie normative Phasen (wie Adoleszenz) können das Selbstkonzept signifikant verändern oder erschüttern.
Pflegemodelle;Was steht im Zentrum des Selbstpflegemodells von Dorothea Orem?;Die Selbstpflege (Self-Care), also die Handlungen, die Menschen selbst initiieren und durchführen, um ihr Leben, ihre Gesundheit und ihr Wohlbefinden zu erhalten. (Fakultativliteratur)
Pflegemodelle;Wann entsteht nach Orem ein "Selbstpflegedefizit"?;Ein Defizit entsteht, wenn der situative Selbstpflegebedarf einer Person grösser ist als ihre aktuellen Fähigkeiten (Selbstpflegekompetenz), diesen Bedarf eigenständig zu decken.
Pflegemodelle;Welche drei Pflegesysteme beschreibt Orem, um ein Selbstpflegedefizit auszugleichen?;1. Vollständig kompensatorisches System (Pflege übernimmt alles), 2. Teilweise kompensatorisches System (Zusammenarbeit), 3. Unterstützend-erzieherisches System (Beratung/Anleitung).
Kommunikation & Ethik;Wozu dient das SPIKES-Modell in der medizinisch-pflegerischen Praxis?;Es bietet Fachpersonen eine praxisnahe und strukturierte Anleitung, um emotionale und belastende Aufklärungsgespräche (das Überbringen schlechter Nachrichten) effektiv zu führen.
Kommunikation & Ethik;Was beinhaltet der erste Schritt "Setting up" (Situation) im SPIKES-Modell?;Die Vorbereitung auf emotionale Reaktionen und die Schaffung einer ruhigen, störungsfreien Umgebung ohne Zeitdruck mit einer angemessenen Sitzposition.
Kommunikation & Ethik;Wie erfassen Sie im Schritt "Patientenvorwissen" (Perception) die Wahrnehmung des Patienten?;Durch offene Fragen (z.B. "Was wissen Sie über Ihren Zustand?") wird ermittelt, welchen Kenntnisstand und welche Vorahnungen der Patient bereits hat.
Kommunikation & Ethik;Worauf muss bei der Vermittlung der schlechten Nachricht ("Knowledge") besonders geachtet werden?;Vorwarnung geben ("Es folgt eine schwierige Nachricht"), Informationen in kleinen Einheiten ohne Fachjargon vermitteln, Verständnis prüfen und beschönigende Formulierungen vermeiden.
Kommunikation & Ethik;Wie sollte das Fachpersonal im Schritt "Emotions/Empathy" auf Reaktionen des Patienten reagieren?;Emotionen anerkennen, Schweigen aushalten, körperliche Nähe/Taschentücher anbieten und erst im Gespräch weitergehen, wenn der Patient wieder stabiler ist.
Palliative Care;Nennen Sie die fünf Phasen der Auseinandersetzung mit dem Tod nach Elisabeth Kübler-Ross in ihrer klassischen Abfolge.;1. Nicht-wahrhaben-wollen, 2. Zorn, 3. Verhandeln, 4. Depression, 5. Annahme/Akzeptanz.
Palliative Care;Müssen Sterbende zwingend alle fünf Phasen nach Kübler-Ross nacheinander durchlaufen?;Nein. Die Phasen sind nicht starr. Menschen können Phasen überspringen, in alte Phasen zurückfallen oder mehrere gleichzeitig erleben. Nicht jeder erreicht die Akzeptanz.
Palliative Care;Wie äussert sich die Phase "Nicht-wahrhaben-wollen" und wie reagieren Pflegende professionell darauf?;Betroffene leugnen die Diagnose (Schock/Erstarrung). Pflegende sollten dies respektieren, nicht mit weiteren Fakten konfrontieren, aber gesprächsbereit bleiben, ohne sich aufzudrängen.
Palliative Care;Was kennzeichnet die Phase des "Verhandelns" nach Kübler-Ross?;Der Betroffene klammert sich an Hoffnungen und versucht, durch Versprechungen (oft an Gott oder das Schicksal) oder extrem gesundes Verhalten noch Lebenszeit "herauszuschlagen".
Palliative Care;Wer hat das Konzept "Total Pain" geprägt und worum geht es dabei im Kern?;Cicely Saunders (1967) prägte den Begriff. Es verdeutlicht, dass Schmerz am Lebensende multidimensional ist und nicht nur aus rein körperlichen Beschwerden besteht.
Palliative Care;Nennen Sie die vier Dimensionen des Schmerzes im Total-Pain-Konzept.;1. Physische Dimension (Körper), 2. Psychische/Emotionale Dimension, 3. Soziale Dimension, 4. Spirituelle Dimension.
Palliative Care;Was umfasst die "soziale Dimension" im Total-Pain-Konzept?;Sorgen um die Familie, den Verlust der sozialen Rolle und des Berufs sowie die Angst vor dem Abschied von Familie und Freunden.
Palliative Care;Warum ist das Verständnis von Total Pain für die Schmerztherapie in der Palliative Care so wichtig?;Weil sich die vier Dimensionen gegenseitig verstärken. Körperliche Schmerzmittel wirken oft nicht ausreichend, wenn z.B. schwere ungelöste psychische oder spirituelle Nöte vorliegen.
Kommunikation & Psychologie;Was beschreibt die Transaktionsanalyse (TA) nach Eric Berne grundlegend?;Sie beschreibt, wie soziale Interaktionen durch drei Ich-Zustände geprägt werden: das kindliche Ich, das Eltern-Ich und das Erwachsenen-Ich[cite: 1237].
Kommunikation & Psychologie;Was versteht die Transaktionsanalyse unter "komplementären" und "überschneidenden" Transaktionen?;Komplementär: Die Ich-Zustände der Gesprächspartner stimmen überein (erfolgreich)[cite: 1238]. Überschneidend: Die Ich-Zustände stimmen nicht überein, was zu Missverständnissen und Konflikten führt[cite: 1239].
Kommunikation & Psychologie;Wie ist das "Eltern-Ich" in der Transaktionsanalyse definiert?;Es besteht aus Normen, Regeln und Prinzipien, die in den ersten fünf Lebensjahren von den Eltern übernommen wurden[cite: 1245]. Es wird in ein fürsorgliches und ein kritisches Eltern-Ich unterteilt[cite: 1246].
Kommunikation & Psychologie;Was kennzeichnet das "Erwachsenen-Ich" nach Eric Berne?;Es bewertet Situationen, denkt rational und berücksichtigt die Folgen des eigenen Handelns[cite: 1248].
Psychologie & Entwicklung;Was betrachtet das Transitionsmodell (z.B. nach Griebel) im Kern?;Es betrachtet Lebensereignisse (Übergänge), die Veränderungen auf individueller, interaktionaler und kontextueller Ebene erfordern und durch deren Bewältigung Entwicklung angeregt wird[cite: 1303].
Psychologie & Entwicklung;Warum sind Transitionen für die Entwicklung wichtig?;Weil sie die Auseinandersetzung mit neuen gesellschaftlichen Anforderungen erfordern[cite: 1304].
Psychologie & Entwicklung;Nennen Sie drei typische Beispiele für Übergänge im Lebenslauf (Transitionsmodell).;Der Übergang in die Schule [cite: 1307], der Übergang in den Beruf [cite: 1309] oder die neue Rolle als Eltern[cite: 1310].
Gesundheitsförderung & Edukation;Wozu dient das Transtheoretische Modell im Gesundheitswesen?;Es beschreibt verschiedene Stufen der Verhaltensänderung, die Menschen durchlaufen, um gesundheitsschädliche Gewohnheiten aufzugeben oder gesundheitsförderliche Verhaltensweisen zu etablieren[cite: 1318].
Gesundheitsförderung & Edukation;Was kennzeichnet die Phase der "Absichtslosigkeit" (Precontemplation) im Transtheoretischen Modell?;Es besteht keine Absicht, das problematische Verhalten in naher Zukunft zu ändern[cite: 1321]. Die Person erkennt das Problem nicht oder unterschätzt die negativen Auswirkungen[cite: 1322].
Gesundheitsförderung & Edukation;In welcher Phase des Transtheoretischen Modells werden erste konkrete Schritte geplant?;In der Phase "Vorbereitung" (Preparation)[cite: 1328]. Die Person hat einen konkreten Plan und ist bereit, in naher Zukunft zu handeln[cite: 1329, 1330].
Gesundheitsförderung & Edukation;Was ist das Ziel in der Phase der "Aufrechterhaltung" (Maintenance)?;Das veränderte Verhalten wird bereits länger als sechs Monate beibehalten[cite: 1336]. Die Person arbeitet aktiv daran, Rückfälle zu vermeiden und das neue Verhalten zu festigen[cite: 1337].
Palliative Care & Trauer;Wie viele Phasen beschreibt das Trauermodell nach Kübler-Ross und wie verlaufen diese?;Es beschreibt fünf Phasen, die Menschen im Sterbe- und Trauerprozess durchlaufen[cite: 1416]. Diese Phasen sind nicht streng sequenziell, treten aber typischerweise auf[cite: 1417].
Palliative Care & Trauer;Nennen Sie die fünf Phasen des Trauermodells nach Kübler-Ross.;1. Verleugnung und Isolation [cite: 1419], 2. Wut [cite: 1420], 3. Verhandeln [cite: 1421], 4. Depression [cite: 1422], 5. Akzeptanz[cite: 1423].
Palliative Care & Trauer;Was geschieht in der Trauerphase der "Depression" nach Kübler-Ross?;Es treten Gefühle von Desinteresse, Antriebslosigkeit und emotionaler Erschöpfung auf[cite: 1422].
Soziologie & Entwicklung;Wozu dienen "Übergangsriten" nach dem Konzept von Arnold van Gennep?;Sie helfen Menschen, sichere Übergänge zwischen Lebensabschnitten oder sozialen Zuständen zu vollziehen[cite: 1281].
Soziologie & Entwicklung;Nennen Sie die drei Phasen eines Übergangsrituals nach van Gennep.;1. Ablösungsphase (Séparation) [cite: 1283], 2. Zwischenphase (Liminalität) [cite: 1286], 3. Integrationsphase (Agrégation)[cite: 1291].
Soziologie & Entwicklung;Was kennzeichnet die "Zwischenphase" (Liminalität) nach van Gennep?;Das Individuum befindet sich in einem undefinierten, oft verletzlichen Zwischenzustand[cite: 1287]. Es gehört weder zur alten noch zur neuen Rolle und ist besonders anfällig für äussere Einflüsse[cite: 1288].
Soziologie & Entwicklung;Was geschieht in der "Integrationsphase" (Agrégation) eines Übergangs?;Das Individuum wird in seiner neuen Rolle oder Identität offiziell in die Gesellschaft oder Gemeinschaft wiedereingegliedert und akzeptiert[cite: 1292, 1293].
Professionelles Selbstverständnis;Wo und wie können Sie ein Vorbild sein?;Durch ethisch korrektes Handeln, konsequente Einhaltung von Standards, wertschätzende Kommunikation gegenüber Lernenden und durch die Bereitschaft, das eigene Handeln jederzeit kritisch zu hinterfragen.

    function parseCSV(input) {
        if(!input) return [];
        const lines = input.trim().split('\n');
        return lines.map(line => {
            const parts = line.split(';');
            if (parts.length >= 3) {
                return { theme: parts[0].trim(), q: parts[1].trim(), a: parts[2].trim() };
            }
            return null;
        }).filter(q => q !== null);
    }

    function extractThemes() {
        const themes = new Set(allQuestions.map(q => q.theme));
        uniqueThemes = Array.from(themes).sort();
        
        const themeListContainer = document.getElementById('theme-list');
        themeListContainer.innerHTML = ''; // Clear existing

        uniqueThemes.forEach((theme, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'theme-checkbox-wrapper';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'theme-' + index;
            checkbox.value = theme;
            checkbox.checked = true; // Standardmässig alle ausgewählt
            checkbox.className = 'theme-cb';

            const label = document.createElement('label');
            label.htmlFor = 'theme-' + index;
            label.innerText = theme;

            wrapper.appendChild(checkbox);
            wrapper.appendChild(label);
            themeListContainer.appendChild(wrapper);
        });
    }

    function toggleAllThemes(checkState) {
        const checkboxes = document.querySelectorAll('.theme-cb');
        checkboxes.forEach(cb => cb.checked = checkState);
    }

    function showView(viewId) {
        document.querySelectorAll('.container').forEach(v => v.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
    }

    function updateHomeInfo() {
        const info = document.getElementById('question-count-info');
        if (allQuestions.length > 0) {
            info.innerHTML = `Datenbank geladen: <strong>${allQuestions.length} Fragen</strong> gesamt.`;
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('filter-container').classList.remove('hidden');
        } else {
            info.innerText = "Fehler beim Laden der Fragen. Bitte CSV-Daten prüfen.";
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('filter-container').classList.add('hidden');
        }
    }

    function startLearning() {
        // 1. Ausgewählte Themen ermitteln
        const checkboxes = document.querySelectorAll('.theme-cb');
        const selectedThemes = Array.from(checkboxes)
                                   .filter(cb => cb.checked)
                                   .map(cb => cb.value);

        if (selectedThemes.length === 0) {
            alert("Bitte wähle mindestens ein Themengebiet aus, um zu starten!");
            return;
        }

        // 2. Fragen filtern
        const filteredQuestions = allQuestions.filter(q => selectedThemes.includes(q.theme));

        if (filteredQuestions.length === 0) {
            alert("Zu den ausgewählten Themen wurden keine Fragen gefunden.");
            return;
        }

        // 3. Mischen und Starten
        currentPool = [...filteredQuestions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        showView('view-learn');
        displayQuestion();
    }

    function displayQuestion() {
        const q = currentPool[currentIndex];
        document.getElementById('current-index').innerText = currentIndex + 1;
        document.getElementById('total-count').innerText = currentPool.length;
        document.getElementById('theme-display').innerText = q.theme;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('answer-text').innerText = q.a;
        
        document.getElementById('answer-text').classList.add('hidden');
        document.getElementById('btn-show-answer').classList.remove('hidden');
        document.getElementById('btn-next').classList.add('hidden');
    }

    function showAnswer() {
        document.getElementById('answer-text').classList.remove('hidden');
        document.getElementById('btn-show-answer').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentPool.length) {
            displayQuestion();
        } else {
            alert("Hervorragend! Du hast alle Fragen aus den gewählten Themen durchgearbeitet.");
            showView('view-home');
        }
    }
</script>
