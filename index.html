        .container {

    const QUESTIONS_DATA = `Altersbedingte Veränderungen;Welchen Einfluss hat die verminderte glomeruläre Filtrationsrate (GFR) im Alter auf die Pharmakotherapie?;Durch die nachlassende Nierenfunktion verlängert sich die Halbwertszeit renal ausgeschiedener Medikamente, was das Risiko für Akkumulation und Toxizität (z.B. bei Digoxin oder NSAR) massiv erhöht.
Altersbedingte Veränderungen;Erklären Sie den Begriff der Presbyakusis und die daraus resultierenden pflegerischen Konsequenzen.;Es handelt sich um die Altersschwerhörigkeit (v.a. im Hochtonbereich). Pflegerisch muss tief moduliert, deutlich, langsam und von Angesicht zu Angesicht gesprochen werden, da hohe Töne schlechter gefiltert werden können.
Altersbedingte Veränderungen;Wie verändert sich die Thermoregulation im Alter und welche Gefahr resultiert daraus?;Durch weniger Unterhautfettgewebe, verminderte Schweissproduktion und ein reduziertes Durstgefühl können ältere Menschen Hitze und Kälte schlechter kompensieren, was zu Dehydration oder unbemerkter Hypothermie führen kann.
Altersbedingte Veränderungen;Was bedeutet die Abnahme der Lungenelastizität (Compliance) für die Atemreserve älterer Patienten?;Die Vitalkapazität sinkt und das Residualvolumen steigt, da die Lunge sich nicht mehr vollständig zusammenzieht. Dies führt bei Belastung schneller zu Dyspnoe und erhöht das Risiko für respiratorische Infekte (Atelektasenbildung).
Altersbedingte Veränderungen;Beschreiben Sie die Veränderung der Haut im Alter in Bezug auf das Dekubitusrisiko.;Die Haut wird dünner (Atrophie), weniger durchblutet und verliert an Elastizität. Zudem nimmt die Feuchtigkeit ab (Xerosis). Dies macht sie anfälliger für Scherkräfte und Druckbelastungen, was das Dekubitusrisiko steigert.
Altersbedingte Veränderungen;Warum steigt im Alter das Risiko für eine orthostatische Hypotonie?;Die Barorezeptoren (Druckfühler in den Gefässen) reagieren langsamer auf Lagewechsel. Zudem ist die Gefässelastizität vermindert, sodass der Blutdruck beim Aufstehen absackt, was zu Schwindel und Stürzen führen kann.
Altersbedingte Veränderungen;Erklären Sie die Veränderung der Magen-Darm-Passage im Alter und eine häufige Folge.;Die Peristaltik verlangsamt sich und die Sekretion von Verdauungssäften nimmt ab. Gepaart mit oft geringer Flüssigkeitsaufnahme und Bewegungsmangel ist eine chronische Obstipation eine sehr häufige Folge.
Altersbedingte Veränderungen;Wie verändert sich das Immunsystem im Alter (Immunseneszenz)?;Die Produktion von T-Zellen und Antikörpern nimmt ab. Infektionen verlaufen oft ohne hohes Fieber (atypisch), werden später erkannt und führen schneller zu schweren Verläufen oder Sepsis.
Altersbedingte Veränderungen;Welchen Einfluss hat die Abnahme der Knochendichte im Alter auf die Mobilität?;Die Knochen werden poröser (Osteopenie/Osteoporose), was die Frakturgefahr bei Stürzen massiv erhöht. Dies führt oft zu einer Angst vor Stürzen, was die Mobilität weiter einschränkt (Teufelskreis).
Altersbedingte Veränderungen;Was passiert mit dem Wasser- und Fettanteil im Körper im Alter und was bedeutet dies für die Pharmakologie?;Der Gesamtkörperwasseranteil sinkt, während der Fettanteil relativ steigt. Fettlösliche Medikamente (z.B. Benzodiazepine) reichern sich stärker im Fettgewebe an und wirken dadurch deutlich länger und unberechenbarer.
Amputation;Was ist das Hauptziel einer Amputation aus medizinischer Sicht?;Die Entfernung eines irreversibel geschädigten, abgestorbenen oder infizierten Körperteils (z.B. bei Gangrän), um das Leben des Patienten zu retten oder die Ausbreitung einer Sepsis zu verhindern.
Amputation;Was versteht man unter einem "Phantomschmerz" und wie entsteht er?;Schmerzempfindungen in einem Körperteil, das nicht mehr vorhanden ist. Die Ursache liegt in der Reorganisation des Gehirns (somatosensorischer Kortex), das die fehlenden Signale aus dem Stumpf falsch interpretiert.
Amputation;Welche pflegerische Massnahme ist zur Vermeidung von Beugekontrakturen (z.B. im Knie) nach einer Beinamputation wichtig?;Regelmässige Flachlagerung des Stumpfes und Vermeidung einer dauerhaften Hochlagerung auf einem Kissen (v.a. in der Leiste oder im Knie), da dies die Verkürzung der Sehnen begünstigt.
Amputation;Was ist ein "Stumpfödem" und warum muss es mit Kompression behandelt werden?;Nach der OP tritt Flüssigkeit ins Gewebe aus. Die Kompression (Wickelung oder Silikonliner) dient der Ödemreduktion und der Formung des Stumpfes, damit dieser später in eine Prothese passt.
Amputation;Nennen Sie drei psychologische Herausforderungen, mit denen Patienten nach einer Amputation konfrontiert sind.;Veränderung des Körperbildes (Body Image), Verlust von Autonomie/Mobilität sowie Trauerprozesse über den Verlust des Körperteils (ähnlich einem Todesfall).
Amputation;Warum ist die Hautpflege am Amputationsstumpf so kritisch?;Die Haut im Stumpfbereich muss später das gesamte Körpergewicht in der Prothese tragen und ist durch Schwiess und Reibung extrem belastet. Infektionen am Stumpf können die Prothesenversorgung unmöglich machen.
Amputation;Was bedeutet "Stumpfabhärtung"?;Massnahmen, um die Empfindlichkeit der Haut am Stumpf zu reduzieren (z.B. Massagen mit verschiedenen Materialien, leichtes Klopfen), um sie auf den Druck und die Reibung der Prothesenhülse vorzubereiten.
Amputation;Welche Rolle spielt die Physiotherapie unmittelbar nach einer Amputation?;Frühmobilisation, Gleichgewichtstraining (Schwerpunktverlagerung), Kräftigung der verbliebenen Muskulatur und Anleitung zum Transfer (z.B. Bett-Rollstuhl).
Amputation;Was ist der Unterschied zwischen einer Minor- und einer Major-Amputation?;Minor-Amputation: Abtrennung von Zehen oder Teilen des Vorfusses. Major-Amputation: Abtrennung oberhalb des Knöchels (Unterschenkel, Oberschenkel), was die Mobilität massiv stärker beeinträchtigt.
Amputation;Was sind häufige Ursachen, die im Alter zu einer Amputation führen?;In über 80% der Fälle sind es Durchblutungsstörungen infolge von pAVK oder Komplikationen des Diabetes mellitus (Diabetisches Fusssyndrom).
Angina Pectoris;Definieren Sie "Angina Pectoris" und beschreiben Sie die typische Schmerzcharakteristik.;Es bedeutet "Brustenge". Es ist ein dumpfer, drückender oder brennender Schmerz hinter dem Brustbein, der oft in den linken Arm, Hals oder Oberbauch ausstrahlt (Gefühl eines schweren Steins auf der Brust).
Angina Pectoris;Was ist die häufigste Ursache für eine Angina Pectoris?;Eine Koronare Herzkrankheit (KHK). Durch Arteriosklerose verengte Herzkranzgefässe führen zu einem Missverhältnis zwischen Sauerstoffbedarf und Sauerstoffangebot im Herzmuskel.
Angina Pectoris;Unterscheiden Sie zwischen einer stabilen und einer instabilen Angina Pectoris.;Stabil: Schmerzen treten nur bei Belastung auf und verschwinden in Ruhe oder nach Nitrogabe. Instabil: Schmerzen treten bereits in Ruhe auf, nehmen an Intensität/Dauer zu oder sprechen nicht mehr auf Nitro an (Notfall!).
Angina Pectoris;Welche Massnahme sollte ein Patient bei einem akuten Angina-Pectoris-Anfall sofort ergreifen?;Körperliche Belastung sofort stoppen, Oberkörper hochlagern, Enge Kleidung öffnen und das verordnete Notfallmedikament (z.B. Nitro-Spray) unter die Zunge (sublingual) verabreichen.
Angina Pectoris;Wie wirkt Nitroglycerin (Nitro-Spray) im Körper?;Es wirkt gefässerweiternd (Vasodilatation). Dadurch sinkt der Blutdruck und der Rückstrom zum Herzen (Vorlast), was das Herz entlastet und den Sauerstoffverbrauch senkt. Zudem werden die Koronarien direkt erweitert.
Angina Pectoris;Warum darf Nitro-Spray nicht eingenommen werden, wenn der Patient zuvor Potenzmittel (z.B. Viagra) genommen hat?;Beide führen zu einer massiven Gefässerweiterung. In Kombination kann es zu einem lebensbedrohlichen, unkontrollierbaren Blutdruckabfall (Schock) führen.
Angina Pectoris;Was sind typische Auslöser für einen stabilen Angina-Pectoris-Anfall?;Körperliche Anstrengung, psychischer Stress, Kälteexposition (Gefässverengung) oder eine üppige Mahlzeit (Blut wird im Verdauungstrakt benötigt).
Angina Pectoris;Nennen Sie drei wichtige diagnostische Verfahren zur Abklärung einer Angina Pectoris.;Belastungs-EKG (Ergometrie), Echokardiographie (Herz-Ultraschall) und die Koronarangiographie (Herzkatheteruntersuchung).
Angina Pectoris;Was ist das primäre Ziel der Langzeittherapie bei Angina Pectoris?;Das Fortschreiten der Arteriosklerose verhindern (Lebensstiländerung), Anfälle vermeiden und das Risiko für einen Myokardinfarkt senken.
Angina Pectoris;Welchen pflegerischen Rat geben Sie einem Patienten zur Vorbeugung von Anfällen?;Rauchen aufgeben, langsame Steigerung der körperlichen Aktivität, Stressmanagement, gesunde Ernährung und konsequente Medikamenteneinnahme (z.B. ASS, Statine).
Anorexia nervosa;Nennen Sie drei Kernmerkmale der Anorexia nervosa (Magersucht).;Massives, selbstherbeigeführtes Untergewicht (BMI < 17,5), ausgeprägte Angst vor Gewichtszunahme (Gewichtsphobie) und eine Körperschemastörung (sich trotz Untergewicht zu dick fühlen).
Anorexia nervosa;Welche endokrinen (hormonellen) Folgen hat extremes Untergewicht bei Frauen?;Es kommt zum Ausfall der Menstruation (Amenorrhoe), da der Körper aufgrund des Energiemangels die Produktion von Geschlechtshormonen einstellt.
Anorexia nervosa;Nennen Sie drei typische körperliche Warnzeichen (Symptome) bei fortgeschrittener Anorexie.;Bradykardie (langsamer Puls), Hypotonie (niedriger Blutdruck), Lanugobehaarung (feine Flaumhaare am Rücken/Armen) und ständiges Frieren.
Anorexia nervosa;Was ist das "Refeeding-Syndrom" und warum ist es lebensgefährlich?;Bei zu schneller Nahrungszufuhr nach langem Hungern kommt es zu massiven Elektrolytverschiebungen (v.a. Phosphat- und Kaliummangel im Blut), was zu Herzversagen und Ödemen führen kann.
Anorexia nervosa;Welches psychologische Ziel steht in der Therapie der Anorexie neben der Gewichtszunahme im Vordergrund?;Die Normalisierung des Essverhaltens, der Aufbau eines gesunden Körperbildes und die Bearbeitung der zugrunde liegenden psychischen Konflikte (oft Kontrollzwang oder Leistungsdruck).
Anorexia nervosa;Warum ist die Überwachung nach den Mahlzeiten in der Pflege von Anorexie-Patienten wichtig?;Um zu verhindern, dass die Patienten heimlich exzessiven Sport treiben, Abführmittel einnehmen oder die Nahrung wieder erbrechen (Purging-Verhalten).
Anorexia nervosa;Was versteht man unter einer "Körperschemastörung"?;Die Betroffenen nehmen ihren Körper völlig verzerrt wahr. Selbst bei lebensbedrohlichem Untergewicht sehen sie im Spiegel "Fettpolster" oder fühlen sich zu massig.
Anorexia nervosa;Nennen Sie zwei häufige Komorbiditäten (Begleiterkrankungen) bei Anorexie.;Depressionen und Zwangsstörungen (z.B. zwanghaftes Kalorienzählen oder Wiegen).
Anorexia nervosa;Welche Rolle spielt die Familie in der Entstehung und Therapie der Anorexie?;Oft liegen familiäre Konflikte oder hohe Erwartungshaltungen vor. Die Familientherapie ist daher ein essenzieller Bestandteil, um das System zu entlasten und die Genesung zu unterstützen.
Anorexia nervosa;Welche lebensbedrohliche Komplikation resultiert oft aus Elektrolytstörungen bei Anorexie?;Herzrhythmusstörungen, die bis zum plötzlichen Herztod führen können (meist durch Kaliummangel).
Aspiration;Definieren Sie den Begriff "Aspiration".;Das Eindringen von festen oder flüssigen Stoffen (Speichel, Nahrung, Erbrochenes, Fremdkörper) in die unteren Atemwege (Trachea und Lunge) unterhalb der Glottis-Ebene.
Aspiration;Wer ist besonders gefährdet für eine Aspiration (Risikogruppen)?;Menschen mit Dysphagie (Schluckstörungen, z.B. nach Schlaganfall), Bewusstseinsgestörte, Menschen mit neurologischen Erkrankungen (Parkinson, Demenz) oder nach Vollnarkosen.
Aspiration;Was ist eine "stille Aspiration"?;Wenn Stoffe in die Luftröhre gelangen, ohne dass ein Hustenreflex ausgelöst wird. Dies ist besonders gefährlich, da die Aspiration unbemerkt bleibt (häufig bei neurologischen Schäden).
Aspiration;Nennen Sie drei Anzeichen, die während des Essens auf eine Aspiration hindeuten.;Heisere oder "feuchte" Stimme nach dem Schlucken, heftiges Husten/Würgen, Atemnot oder Zyanose (Blaufärbung der Lippen).
Aspiration;Was ist eine Aspirationspneumonie?;Eine Lungenentzündung, die durch in die Lunge gelangte Stoffe (und die darin enthaltenen Bakterien oder Magensäure) verursacht wird. Sie ist oft schwerwiegend und schwer therapierbar.
Aspiration;Welche Positionierung ist bei der Nahrungsaufnahme zur Prophylaxe zwingend erforderlich?;Eine aufrechte Sitzposition (90 Grad), auch im Bett. Der Oberkörper sollte auch nach der Mahlzeit noch mindestens 30 Minuten hochgelagert bleiben.
Aspiration;Was bedeutet "Andicken" von Flüssigkeiten und warum wird es gemacht?;Flüssigkeiten fliessen sehr schnell und sind schwer zu kontrollieren. Durch Andickmittel (Pulver) wird die Konsistenz breiiger, was dem Patienten mehr Zeit für den Schluckreflex gibt und das Risiko des "Verschluckens" senkt.
Aspiration;Nennen Sie zwei pflegerische Massnahmen bei der Mundpflege zur Aspirationsprophylaxe.;Verwendung von wenig Flüssigkeit (evtl. nur feuchte Tupfer), Absaugbereitschaft herstellen und den Patienten leicht nach vorne gebeugt lagern.
Aspiration;Was ist der "Mendelsohn-Handgriff" oder das "Kinn-zur-Brust-Manöver"?;Pflegerische Techniken beim Schlucktraining: Das Senken des Kinns zur Brust verengt den Eingang zur Luftröhre und erweitert den Speiseröhreneingang, was das Schlucken sicherer macht.
Aspiration;Wie reagieren Sie als Sofortmassnahme, wenn ein Patient massiv aspiriert und keine Luft mehr bekommt?;Patienten zum kräftigen Husten auffordern, Oberkörper tief hängen lassen; falls erfolglos: kräftige Schläge zwischen die Schulterblätter oder (bei Lebensgefahr) der Heimlich-Handgriff.
Assessment & Datenerhebung;Wozu dienen Assessments?;Zur systematischen und objektiven Sammlung von Informationen über den Gesundheitszustand, um Risiken frühzeitig zu erkennen und die Pflegeplanung auf valide Daten zu stützen.
Assessment & Datenerhebung;Was ist der Unterschied zur Pflegeanamnese?;Die Anamnese ist das erste, breite Gespräch zur Erfassung der Lebensgeschichte und Bedürfnisse. Das Assessment ist die gezielte Einschätzung spezifischer Probleme oder Risiken mit strukturierten Instrumenten.
Assessment & Datenerhebung;Nennen Sie Arten von Assessments (Basis-, Screening-, Fokusassessment) und erklären Sie, was was ist.;Basisassessment: Erstaufnahme des Gesamtzustandes. Screening: Schneller Test auf ein spezifisches Risiko (z.B. MNA-Shortform). Fokusassessment: Tiefgehende Analyse eines bereits erkannten Problems (z.B. Schmerzassessment).
Assessment & Datenerhebung;Zeigen Sie Beispiele für Assessments auf.;Braden-Skala (Dekubitus), Morse-Skala (Sturz), GCS (Bewusstsein), NRS (Schmerz), DOS (Delir), MNA (Ernährung).
Assessment & Datenerhebung;Was sind Vor- / Nachteile von Assessments?;Vorteile: Objektivierung, Vergleichbarkeit, rechtliche Absicherung. Nachteile: Zeitaufwand, Gefahr der "Zahlenhörigkeit" (Bauchgefühl wird ignoriert), Belastung für den Patienten bei zu vielen Fragen.
Assessment & Datenerhebung;Benennen Sie die Gütekriterien von Assessments (valide, reliabel, praktikabel, empirisch).;Validität (misst das Tool, was es messen soll?), Reliabilität (liefert es bei Wiederholung das gleiche Ergebnis?), Praktikabilität (ist es im Alltag anwendbar?), Empirie (ist es wissenschaftlich belegt?).
Assessment & Datenerhebung;Nennen Sie Ihnen bekannte Fokusassessments.;Besonderes Augenmerk auf: Wong-Baker-Gesichterskala (Schmerz bei Kindern/Demenz), CAM (Delir-Diagnostik), WOMAC-Index (Arthrose).
Assessment & Datenerhebung;Nennen Sie ein bekanntes Screeningassessment.;Der "Mini Nutritional Assessment" (MNA-SF) zur schnellen Identifikation eines Mangelernährungsrisikos oder der "Is Your Patient Overweight?"-Check.
Assessment & Monitoring;Was wird bei Fokusassessments allgemein gemessen?;Es werden spezifische Risiken oder Symptome quantifiziert, um den Interventionsbedarf zu bestimmen. Beispiele: Braden-Skala (Dekubitusrisiko via Mobilität/Feuchtigkeit), Morse-Skala (Sturzrisiko via Gang/Vorgeschichte) oder das Nutritional Risk Screening (Mangelernährung).
Assessment & Monitoring;Welche Konsequenzen ziehen Sie bei einer positiven Einschätzung in einem Assessment?;Eine positive Einschätzung (Risiko identifiziert) führt zwingend zur Einleitung des Pflegeprozesses: Stellung einer Pflegediagnose, Planung evidenzbasierter Prophylaxen (z.B. Lagerungsplan) und engmaschige Re-Evaluation.
Assessment & Monitoring;Welche körperlichen Untersuchungen werden beim Clinical Assessment durchgeführt?;Die vier Grundtechniken: 1. Inspektion (Betrachten), 2. Palpation (Abtasten/Fühlen), 3. Auskultation (Abhören, z.B. Lunge/Darm), 4. Perkussion (Abklopfen von Hohlräumen).
Assessment & Monitoring;Welche Techniken und Hilfsmittel können für die Datenerhebung genutzt werden?;Techniken: Systematisches Interview (Anamnese), körperliche Untersuchung, strukturierte Beobachtung. Hilfsmittel: Assessment-Skalen (Fragebögen), Messgeräte (Blutdruck, Thermometer, BZ-Gerät) und die Pflegedokumentation.
Asthma bronchiale;Definieren Sie Asthma bronchiale.;Eine chronisch-entzündliche Erkrankung der Atemwege, charakterisiert durch bronchiale Hyperreaktivität (Überempfindlichkeit) und eine reversible (umkehrbare) Atemwegsobstruktion.
Asthma bronchiale;Nennen Sie die drei Faktoren der "Asthma-Trias", die zur Verengung der Atemwege führen.;1. Bronchospasmus (Verkrampfung der Muskulatur), 2. Schleimhautödem (Schwellung), 3. Hypersekretion (vermehrte Bildung von zähem Schleim).
Asthma bronchiale;Unterscheiden Sie zwischen allergischem (extrinsischem) und nicht-allergischem (intrinsischem) Asthma.;Allergisch: Ausgelöst durch Pollen, Tierhaare, Hausstaub (meist im Kindesalter). Nicht-allergisch: Ausgelöst durch Infekte, kalte Luft, Anstrengung oder Medikamente (meist erst im Erwachsenenalter).
Asthma bronchiale;Beschreiben Sie das typische Atemgeräusch bei einem Asthmaanfall.;Ein exspiratorischer Stridor (Pfeifen oder Giemen beim Ausatmen), bedingt durch die Verengung der Bronchien.
Asthma bronchiale;Warum ist bei Asthma die Ausatmung (Exspiration) erschwert?;Durch die Verengung der Atemwege kollabieren diese beim Ausatmen früher, die Luft staut sich in der Lunge (Überblähung) und muss mühsam gegen den Widerstand ausgepresst werden.
Asthma bronchiale;Was ist das Ziel eines Peak-Flow-Meters?;Der Patient misst damit seine maximale Ausatmungsgeschwindigkeit. Es dient zur Selbstkontrolle, um Verschlechterungen frühzeitig zu erkennen und die Therapie anzupassen (Ampelschema).
Asthma bronchiale;Wie wirkt ein "Reliever" (Bedarfsmedikament, z.B. Ventolin) beim Asthmaanfall?;Es ist ein kurzwirksames Beta-2-Sympathomimetikum (SABA), das die Bronchialmuskulatur innerhalb von Minuten entspannt und so die Atemwege erweitert.
Asthma bronchiale;Was ist die Aufgabe eines "Controllers" (Langzeitmedikament, z.B. inhalative Kortikoide)?;Es wirkt entzündungshemmend. Es heilt nicht den akuten Anfall, sondern senkt die ständige Entzündungsbereitschaft der Schleimhaut, um Anfällen vorzubeugen.
Asthma bronchiale;Welche Körperposition unterstützt einen Patienten im akuten Asthmaanfall am besten?;Der Kutschersitz oder die Torwartstellung (Oberkörper nach vorne gebeugt, Arme abgestützt), um die Atemhilfsmuskulatur optimal einzusetzen.
Asthma bronchiale;Warum ist eine ruhige und sichere Ausstrahlung der Pflegeperson bei einem Asthmaanfall so wichtig?;Angst und Panik führen zu einer schnelleren, flacheren Atmung (Hyperventilation), was die Atemnot massiv verschlimmert. Ruhe hilft dem Patienten, sich auf eine ruhige Ausatmung zu konzentrieren.
Beziehung & Kommunikation;Erläutern Sie die Bedeutung der Genogrammarbeit.;Ein Genogramm visualisiert komplexe Familienstrukturen und Beziehungsmuster über Generationen hinweg. Es hilft, Ressourcen, Belastungen und genetische Risiken im familiären System des Patienten schnell zu erfassen.
Beziehung & Kommunikation;Wie gestalten Sie eine vertrauensvolle, professionelle Beziehung zu Patienten?;Durch Authentizität, Empathie, Einhaltung der Schweigepflicht, Verlässlichkeit bei Zusagen sowie die klare Abgrenzung (professionelle Nähe bei gleichzeitiger Distanz).
Beziehung & Kommunikation;Erklären Sie das Modell von Schulz von Thun und das von C. Rogers.;Schulz von Thun: Das Vier-Seiten-Modell (Sachebene, Selbstkundgabe, Beziehung, Appell). C. Rogers: Die klientenzentrierte Haltung durch Empathie (Einfühlung), Akzeptanz (Wertschätzung) und Kongruenz (Echtheit).
Beziehung & Kommunikation;Machen Sie Beispiele, wie Sie empathisch sind.;Aktives Zuhören ("Ich höre heraus, dass Sie das beunruhigt"), Validieren von Gefühlen ("Es ist verständlich, dass Sie nach dieser Nachricht Angst haben") und das Spiegeln der Körpersprache.
Beziehung & Kommunikation;Beschreiben Sie vertrauensbildende Massnahmen in der Pflege.;Anklopfen vor dem Eintreten, Vorstellen mit Namen/Funktion, Erklären jeder pflegerischen Handlung vor der Durchführung, Diskretion wahren und den Patienten in Entscheidungen einbeziehen.
Beratung & Support;Was ist eine Fachberatung, was ist eine Prozessberatung?;Fachberatung: Der Berater ist Experte für ein Sachthema und gibt direkte Lösungsvorschläge vor (Beispiel: Wundexpertin empfiehlt spezifische Verbandmittel). Prozessberatung: Der Berater begleitet den Kunden dabei, eigene Lösungen zu finden (Beispiel: Supervision zur Teamdynamik).
Berufspolitik & Zukunft;Herausforderungen in der Pflege der nächsten 10-20 Jahre?;Demografischer Wandel (Zunahme hochaltriger, multimorbider Patienten), Fachkräftemangel bei steigendem Pflegebedarf, Finanzierungsdruck im Gesundheitswesen sowie die fortschreitende Digitalisierung (eHealth/AAL).
Berufspolitik & Zukunft;Fachkräftemangel: Was ist Ihre Meinung dazu?;Es ist eine systemische Krise, die nicht nur mehr Ausbildungsplätze braucht, sondern vor allem bessere Arbeitsbedingungen (Personalschlüssel, Vereinbarkeit), um erfahrene Fachkräfte langfristig im Beruf zu halten.
Berufspolitik & Zukunft;Wie entwickelt sich unser Beruf weiter?;Hin zu mehr akademischer Verantwortung (Pflegewissenschaft), technischer Unterstützung durch Robotik/KI, aber auch zu einer stärkeren Rolle in der Primärversorgung (Gemeindepflege) und präventiven Gesundheitsberatung.
Blutgruppen;Zeigen Sie die Kompatibilität der einzelnen Blutgruppen auf (inkl. Rhesusfaktor und Pathophysiologie, wenn nicht kompatibel).;Gruppe 0 ist Universalspender (Erythrozyten), Gruppe AB ist Universalempfänger. Bei Inkompatibilität kommt es zur Antigen-Antikörper-Reaktion (Hämolyse), die zum Nierenversagen und anaphylaktischen Schock führt (v.a. bei Rhesus-Unverträglichkeit).
COPD;Definieren Sie die COPD.;Die Chronisch Obstruktive Lungenerkrankung ist eine meist fortschreitende Erkrankung, die durch eine dauerhafte Verengung der Atemwege infolge von chronischer Bronchitis und/oder Lungenemphysem gekennzeichnet ist.
COPD;Was ist die Hauptursache für die Entstehung einer COPD?;In ca. 90% der Fälle ist langjähriges Tabakrauchen (Aktiv- oder Passivrauchen) die Ursache. Weitere Faktoren sind berufliche Staubbelastungen oder seltener ein Alpha-1-Antitrypsin-Mangel.
COPD;Erklären Sie den Begriff "Lungenemphysem".;Es ist eine irreversible Überblähung der Lungenbläschen (Alveolen). Die Alveolarwände werden zerstört, es entstehen grosse "Emphysemblasen", wodurch die Fläche für den Gasaustausch massiv verkleinert wird.
COPD;Nennen Sie die drei Leitsymptome der COPD (AHA-Symptomatik).;A: Auswurf (Produktiv), H: Husten (Chronisch), A: Atemnot (anfänglich bei Belastung, später in Ruhe).
COPD;Warum ist bei COPD-Patienten die Lippenbremse als Atemtechnik hilfreich?;Durch den Widerstand beim Ausatmen durch die locker aufeinandergelegten Lippen entsteht ein Rückstau (PEEP-Effekt), der die Bronchien stabilisiert und deren Kollaps verhindert.
COPD;Was versteht man unter einer "Exazerbation" bei COPD?;Eine akute, über mindestens zwei Tage anhaltende Verschlechterung der Symptome (Husten, Atemnot, Auswurf), oft ausgelöst durch Infekte oder Luftverschmutzung. Sie ist ein Notfall!
COPD;Welchen Einfluss hat eine fortgeschrittene COPD auf das rechte Herz?;Durch den hohen Druck im Lungenkreislauf muss das rechte Herz stärker pumpen. Dies führt langfristig zu einer Rechtsherzhypertrophie und schliesslich zum Rechtsherzversagen (Cor pulmonale).
COPD;Warum ist körperliches Training bei COPD trotz Atemnot wichtig?;Um die Muskulatur zu stärken, die Sauerstoffausnutzung im Gewebe zu verbessern und die Belastungstoleranz zu erhöhen. Inaktivität führt zu Muskelabbau, was die Atemnot weiter verschlimmert.
COPD;Warum sollte Sauerstoff bei COPD-Patienten nur sehr vorsichtig dosiert werden?;Bei schwerer COPD ist das Atemzentrum nicht mehr auf CO2, sondern auf O2-Mangel als Atemreiz eingestellt. Zu viel Sauerstoff kann diesen Reiz ausschalten und zu einer lebensgefährlichen CO2-Narkose (Atemstillstand) führen.
COPD;Nennen Sie drei pflegerische Massnahmen zur Sekretlösung bei COPD.;Ausreichende Flüssigkeitszufuhr (sofern keine Herzinsuffizienz), Inhalationen und atemerleichternde Lagerungen (z.B. VATI-Lagerung).
COPD;Wie erfolgt die GOLD-Einteilung und was bedeutet der Begriff?;GOLD steht für „Global Initiative for Chronic Obstructive Lung Disease“. Die Einteilung erfolgt über die Spirometrie (Lungenfunktionstest) anhand des FEV1-Wertes (Einsekundenkapazität) im Verhältnis zur Vitalkapazität (Tiffeneau-Index) nach Bronchospasmolyse.
COPD;Wie wirkt die Lippenbremse?;Sie erzeugt einen positiven exspiratorischen Druck (PEEP). Dieser Rückstau der Luft schient die instabilen Bronchiolen von innen auf, verhindert deren Kollaps beim Ausatmen und ermöglicht so eine tiefere Entleerung der Lunge (Reduktion von Air Trapping).
COPD;Wieso verabreicht man bei COPD oft nur max. 2 Liter O2?;Da das Atemzentrum bei schwerer COPD an hohes CO2 gewöhnt ist, läuft der Atemantrieb primär über den Sauerstoffmangel (Hypoxie). Zu viel O2 nimmt dem Körper diesen letzten Reiz zur Atmung, was zur CO2-Retention und Atemstillstand führen kann.
COPD;Wie zeigt sich ein Patient mit einer CO2-Narkose (Symptome)?;Somnolenz (Schläfrigkeit) bis hin zum Koma, feuchte warme Haut, Myoklonien (Muskelzuckungen), Tachykardie und weite, träge Pupillen. Laborchemisch zeigt sich eine respiratorische Azidose.
Delir;Was ist ein Delir und wie unterscheidet es sich von einer Demenz?;Ein Delir ist ein akuter, potenziell reversibler Verwirrtheitszustand mit Störungen des Bewusstseins und der Aufmerksamkeit. Es tritt plötzlich auf und fluktuiert im Tagesverlauf. Eine Demenz ist chronisch und fortschreitend.
Delir;Nennen Sie drei typische Ursachen (Auslöser) für ein postoperatives Delir.;Schmerzen, Infektionen (z.B. HWI), Dehydration, Medikamentennebenwirkungen, ungewohnte Umgebung oder Sauerstoffmangel.
Delir;Unterscheiden Sie zwischen hyperaktivem und hypoaktivem Delir.;Hyperaktiv: Unruhe, Agitation, Halluzinationen, Weglauftendenz (fällt sofort auf). Hypoaktiv: Teilnahmslosigkeit, Schläfrigkeit, Rückzug (wird oft übersehen, hat aber eine schlechtere Prognose).
Delir;Was ist das Hauptziel der pflegerischen Delirprophylaxe?;Die Erhaltung der Orientierung und die Minimierung von Stressoren. Dazu gehören vertraute Gegenstände, Brille/Hörgerät bereitstellen, Tag-Nacht-Rhythmus fördern und eine ruhige Kommunikation.
Delir;Warum ist ein Delir ein medizinischer Notfall?;Weil es oft ein Anzeichen für eine schwere körperliche Erkrankung ist und mit einer deutlich erhöhten Sterblichkeit (Mortalität) sowie bleibenden kognitiven Schäden einhergeht.
Delir;Welche Rolle spielt die Flüssigkeitszufuhr bei der Vermeidung eines Delirs?;Flüssigkeitsmangel (Exsikkose) führt zu Elektrolytstörungen und einer schlechteren Hirndurchblutung, was einer der häufigsten Auslöser für Verwirrtheit im Alter ist.
Delir;Was versteht man unter "Sundowning" beim Delir?;Die Verschlechterung der Symptome (Unruhe, Verwirrtheit) bei Einbruch der Dunkelheit oder am Abend, oft bedingt durch fehlende Orientierungspunkte und Müdigkeit.
Delir;Nennen Sie zwei Medikamentengruppen, die häufig ein Delir auslösen können.;Benzodiazepine (Schlafmittel) und Anticholinergika (z.B. bestimmte Medikamente gegen Inkontinenz oder Parkinson).
Delir;Warum sollte die Anwendung von Fixierungen bei einem deliranten Patienten vermieden werden?;Fixierungen verstärken die Angst und Agitation massiv, was das Delir verschlimmert und das Risiko für Verletzungen und Dekubitus erhöht.
Delir;Wie kommunizieren Sie mit einem Patienten im Delir?;In kurzen, klaren Sätzen, nur eine Information pro Satz, direkter Blickkontakt, ruhige Stimme und ständige Re-Orientierung (Zeit, Ort, Person).
Delir-Management;Erklären Sie Assessmentinstrumente zur Erfassung eines Delirs (DOS & CAM).;Die DOS (Delirium Observation Screening) dient der pflegerischen Beobachtung von Symptomen über 24h. Die CAM (Confusion Assessment Method) ist ein diagnostisches Tool, das nach Akutheit, Inaufmerksamkeit und Denhstörungen sucht.
Delegation;Was delegieren Sie an Lernende und was nicht?;Delegierbar: Tätigkeiten, die dem Ausbildungsstand entsprechen und für die die Lernende kompetent ist. Nicht delegierbar: Hochkomplexe, instabile Situationen, Erst-Assessments, komplexe Pflegeplanungen oder Tätigkeiten, die eine HF-spezifische klinische Beurteilung erfordern.
Delegation;Kriterien des Delegationsmodells nach Horlacher?;1. Richtige Aufgabe (Komplexität?), 2. Richtige Bedingungen (Ressourcen?), 3. Richtige Person (Kompetenz?), 4. Richtige Anleitung/Kommunikation (klare Aufträge), 5. Richtige Überwachung/Bewertung (Feedback/Kontrolle).
Delegation;Delegation nach Benner in der Begleitung?;Basierend auf dem Modell "Vom Anfänger zum Experten". Aufgaben werden dem Entwicklungsstand angepasst: Anfänger benötigen klare Regeln und Instruktionen, Fortgeschrittene handeln zunehmend situationsbezogen unter Supervision.
Delegation;Welche Tätigkeiten dürfen Sie als HF nicht delegieren?;Die Gesamtverantwortung für den Pflegeprozess (Recountability), die klinische Entscheidungsfindung in instabilen Situationen sowie die fachliche Aufsicht und abschliessende Evaluation der Pflegequalität.
Denken & Handeln;Was verstehen Sie unter kritischem Denken (Critical Thinking)?;Ein kognitiver Prozess der Analyse, Synthese und Evaluation von Informationen. Es bedeutet, Situationen zu hinterfragen, Evidenz zu suchen, eigene Vorurteile zu reflektieren und logisch begründete Entscheidungen im Sinne des Clinical Reasoning zu treffen.
Denken & Handeln;Was bedeutet divergentes und konvergentes Denken?;Divergent: Kreatives, offenes Denken in viele Richtungen, um viele Ideen/Lösungen zu generieren (Brainstorming). Konvergent: Logisches, fokussiertes Denken, um aus vielen Möglichkeiten die eine, beste Lösung zu finden.
Diabetes;Gegenüberstellung Diabetes Typ 1 und Typ 2?;Typ 1: Absoluter Insulinmangel durch Autoimmunzerstörung der B-Zellen, meist junges Alter, rascher Beginn, schlanke Patienten. Typ 2: Relativer Insulinmangel durch Insulinresistenz, meist höheres Alter, schleichend, oft assoziiert mit Adipositas/Metabolischem Syndrom.
Diabetes;Pflegeschwerpunkte bei Diabetes Typ 2 (Edukation FaGe)?;Überwachung auf Spätkomplikationen (Fusspflege!), BZ-Selbstkontrolle, Schulung zu Ernährung und Bewegung (Gewichtsreduktion), Erkennen von Hypoglykämie-Anzeichen sowie Förderung der Adhärenz bei der oralen Antidiabetika-Einnahme.
Diabetes mellitus;Erklären Sie den Unterschied zwischen Diabetes mellitus Typ 1 und Typ 2.;Typ 1: Absoluter Insulinmangel durch Autoimmunzerstörung der insulinproduzierenden Zellen (Pankreas). Typ 2: Relativer Insulinmangel durch Insulinresistenz (Zellen reagieren nicht mehr gut auf Insulin).
Diabetes mellitus;Nennen Sie drei klassische Symptome bei Erstmanifestation eines Diabetes mellitus.;Polyurie (vermehrter Harndrang), Polydipsie (starker Durst) und ungewollter Gewichtsverlust trotz Nahrungsaufnahme.
Diabetes mellitus;Was ist das Ziel des HbA1c-Wertes?;Er gibt den durchschnittlichen Blutzuckerspiegel der letzten 8-12 Wochen an ("Blutzuckergedächtnis"). Er ist der wichtigste Parameter zur Kontrolle der Therapiequalität.
Diabetes mellitus;Warum ist die Fusspflege bei Diabetikern so wichtig (Diabetisches Fusssyndrom)?;Durch Polyneuropathie (Gefühlsverlust) und pAVK (Durchblutungsstörung) werden kleine Verletzungen nicht bemerkt, heilen schlecht und führen schnell zu tiefen Ulzera oder Gangrän.
Diabetes mellitus;Was ist eine Hypoglykämie und nennen Sie drei Anzeichen.;Blutzucker unter 3,9 mmol/l (bzw. 70 mg/dl). Anzeichen: Kalter Schweiss, Zittern, Heisshunger, Verwirrtheit oder Herzrasen.
Diabetes mellitus;Wie reagieren Sie sofort bei einer leichten Hypoglykämie (Patient bei Bewusstsein)?;Sofortige Zufuhr von schnell wirksamen Kohlenhydraten (Traubenzucker, Fruchtsaft), gefolgt von einer langsamer wirksamen "Basis" (z.B. Brot), um ein erneutes Absinken zu verhindern.
Diabetes mellitus;Warum müssen Diabetiker die Einstichstellen beim Insulinspritzen regelmässig wechseln?;Um Lipodystrophien (Verhärtungen des Fettgewebes) zu vermeiden. Aus solchen Stellen wird das Insulin unregelmässig und unberechenbar aufgenommen, was zu Blutzuckerschwankungen führt.
Diabetes mellitus;Nennen Sie drei langfristige Spätkomplikationen des Diabetes mellitus.;Retinopathie (Erblindungsgefahr), Nephropathie (Nierenversagen) und Makroangiopathie (erhöhtes Risiko für Herzinfarkt/Schlaganfall).
Diabetes mellitus;Wie wirkt Metformin (ein häufiges orales Antidiabetikum)?;Es erhöht die Empfindlichkeit der Zellen für Insulin (senkt Insulinresistenz), hemmt die Neubildung von Glukose in der Leber und verzögert die Zuckeraufnahme im Darm.
Diabetes mellitus;Was ist die "Ketoazidose" und bei welchem Diabetestyp tritt sie eher auf?;Eine lebensgefährliche Übersäuerung des Blutes durch Ketonkörper (beim Fettabbau infolge von Insulinmangel). Sie tritt klassischerweise beim Typ-1-Diabetes auf.
Dokumentation;Was wird beim Schreiben des Pflegeberichtes beachtet?;Er muss objektiv, zeitnah, wertfrei und präzise sein. Er dokumentiert Abweichungen vom Plan, die Wirkung von Interventionen sowie subjektive Äusserungen des Patienten in Anführungszeichen.
Dokumentation;Was muss in einer professionellen Wunddokumentation alles erfasst werden?;Wundart, Lokalisation, Grösse (Länge/Breite/Tiefe), Wundgrund (Nekrose/Fibrin/Granulation), Exsudat (Menge/Farbe/Geruch), Wundrand/Umgebung, Schmerzintensität und die durchgeführte Therapie.
Dyspnoe;Welche Formen der Dyspnoe kennen Sie und wie erkennen Sie diese?;1. Inspiratorische Dyspnoe (Problem beim Einatmen, Stridor bei Fremdkörper/Ödem), 2. Exspiratorische Dyspnoe (Problem beim Ausatmen, Giemen/Brummen bei Asthma/COPD), 3. Orthopnoe (Atemnot im Liegen, Pat. muss aufsitzen).
Edukation;Unterschied Schulung, Beratung und Instruktion?;Instruktion: Vermittlung technischer Fertigkeiten (Handhabung Pen). Schulung: Gezielter Wissensaufbau zu einem Thema (Diabetes-Schulung). Beratung: Gemeinsame Lösungssuche bei individuellen Problemen/Entscheidungen (ergebnisoffen).
Edukation;Erklären Sie das Modell von Schulung und Beratung?;Es basiert auf einem interaktiven Prozess: 1. Bedarfsanalyse (Was braucht der Pat.?), 2. Zielsetzung, 3. Durchführung (Methodenwahl), 4. Evaluation des Lernerfolgs. Es erfordert pädagogische Kompetenz und die Berücksichtigung der Health Literacy.
Ethik & Recht;Was ist ein ethisches Dilemma?;Eine Situation, in der zwei gleichwertige moralische Prinzipien oder Werte (z.B. Autonomie vs. Fürsorge) in Konflikt stehen und man sich für eines entscheiden muss, wobei das andere zwangsläufig verletzt wird (Wahl zwischen zwei Übeln).
Ethik & Recht;Was machen Sie bei Therapieverweigerung einer dementen/deliranten Person (ethische Prinzipien)?;Konflikt zwischen Autonomie (Wille des Pat.) und Fürsorge (Beneficence). Zuerst Urteilsfähigkeit prüfen. Bei fehlender Urteilsfähigkeit: Mutmasslichen Willen ermitteln (Angehörige/PV). Ziel ist die Schadensvermeidung (Non-Maleficence), wobei Zwangsmassnahmen immer die absolute Ultima Ratio bleiben.
Ethik & Autonomie;Beschreiben Sie den Unterschied zwischen Compliance und Adhärenz.;Compliance ist das passive Befolgen von Anweisungen (Paternalismus). Adhärenz ist die aktive, vereinbarte Zusammenarbeit zwischen Patient und Fachperson auf Basis gemeinsamer Entscheidungen (Autonomie).
Ethik & Autonomie;Wie ist der Zusammenhang zwischen Adhärenz und dem ethischen Grundprinzip der Autonomie?;Adhärenz setzt Autonomie voraus. Nur wenn der Patient seine Therapieziele selbst mitbestimmt und versteht, kann er sich aus innerer Überzeugung (nicht aus Gehorsam) daran halten.
Ethik & Autonomie;Nennen Sie Autonomieformen.;1. Handlungsautonomie (selbstständig handeln), 2. Entscheidungsautonomie (Wahl zwischen Optionen), 3. Kognitive Autonomie (Informationen verstehen), 4. Institutionelle Autonomie (Rechte im System).
Ethik & Autonomie;Wie unterstützen/stärken Sie generell die Autonomie von Patienten?;Durch umfassende Information (Edukation), das Anbieten von Wahlmöglichkeiten im Alltag, die Förderung von Selbstpflegekompetenzen und den Respekt vor Ablehnung (Widerruf der Einwilligung).
Forschung;Bedeutung von Forschung im Pflegeberuf?;Forschung generiert neues Wissen, um die Pflegequalität zu sichern, die Wirksamkeit von Interventionen zu belegen (EBN) und die Professionalisierung der Pflege durch eine eigene theoretische Basis voranzutreiben.
Forschung;Was bedeutet EBN (Evidence Based Nursing)?;Die Integration der derzeit besten wissenschaftlichen Belege in die tägliche Pflege, kombiniert mit klinischer Erfahrung, den Präferenzen des Patienten und den vorhandenen Ressourcen (intern im Betrieb z.B. durch Leitlinien/Expertenstandards).
Führung;Eigenschaften eines Teamplayers?;Zuverlässigkeit, aktive Kommunikation, Kritikfähigkeit, Hilfsbereitschaft und das Zurückstellen persönlicher Interessen zugunsten der gemeinsamen Teamziele (Interprofessionalität).
Geriatrie;Unterschied zwischen Fatigue und Müdigkeit?;Müdigkeit ist physiologisch und verschwindet nach Schlaf/Erholung. Fatigue ist eine pathologische, chronische Erschöpfung (oft bei Krebs oder Entzündungen), die durch Ruhepausen nicht gebessert werden kann.
Geriatrie;Was ist das Frailty-Syndrom?;Ein Syndrom der Gebrechlichkeit im Alter, gekennzeichnet durch verminderte Widerstandsfähigkeit gegenüber Stressoren. Symptome sind unbeabsichtigter Gewichtsverlust, Muskelschwäche (Sarkopenie), langsame Gehgeschwindigkeit und geringe körperliche Aktivität.
Geriatrie;Sturzprophylaxe und altersabhängige Sturzgefahren?;Prophylaxe: Krafttraining, Licht, festes Schuhwerk, Medikamentencheck. Gefahren: Kleinkinder (Neugier/Koordination), Erwachsene (Sport/Ablenkung), Senioren (Multimorbidität, Sehschwäche, Umgebungsgefahren).
Gesundheitssystem;Aktuelle Schwierigkeiten im Gesundheitswesen?;Steigende Gesundheitskosten bei begrenzten Ressourcen, Überlastung des Personals, Bettenknappheit in Langzeitpflege/Psychiatrie und die Komplexität der interprofessionellen Vernetzung bei chronisch Kranken.
Gesundheitsförderung;Erklären Sie die Entstehung und Definition der Salutogenese.;Entwickelt von Aaron Antonovsky als Gegenmodell zur Pathogenese. Salutogenese fragt nicht „Was macht krank?“, sondern „Was hält den Menschen trotz Belastungen gesund?“. Gesundheit wird dabei als dynamisches Kontinuum zwischen „gesund“ und „krank“ betrachtet.
Gesundheitsförderung;Was bedeutet das Kohärenzgefühl (SOC) und welche drei Begriffe gehören dazu?;Es ist die psychische Grundorientierung, dass das Leben sinnvoll und bewältigbar ist. Die drei Komponenten sind: 1. Verstehbarkeit (Kognition), 2. Handhabbarkeit/Bewältigbarkeit (Ressourcen), 3. Sinnhaftigkeit (Motivation/Bedeutung).
Hämatologie;Vorbereitung EC-Transfusion und Komplikationen?;Vorbereitung: Identitätskontrolle (Bedside-Test), Vitalzeichen-Nullwert. Häufigste Komplikation: Hämolytische Transfusionsreaktion oder allergische Reaktion. Reaktion: Transfusion sofort stoppen, Leitung belassen, Arzt alarmieren, Schockbehandlung starten.
Herz Physiologie;Warum können Tachykardien entstehen?;Als Kompensation bei Sauerstoffmangel (Anämie, Herzinsuffizienz), bei Volumenmangel (Schock/Dehydration), durch Fieber (gesteigerter Stoffwechsel), bei Stress/Angst (Sympathikusaktivierung), durch Medikamente oder bei Schilddrüsenüberfunktion.
Herzinsuffizienz;Definition und Entstehung von Ödemen?;Herzinsuffizienz ist die Unfähigkeit des Herzens, den Körper ausreichend mit Blut/Sauerstoff zu versorgen. Ödeme entstehen durch Rückwärtsversagen (Anstieg des hydrostatischen Drucks in den Venen/Kapillaren presst Wasser ins Gewebe) sowie durch die Aktivierung des RAAS (Natrium- und Wasserrückhaltung).
Herzinsuffizienz;Zusammenhang zwischen Bein- und Lungenödemen?;Beinödeme weisen auf ein Rückwärtsversagen des rechten Herzens hin (Stau in den Körperkreislauf). Lungenödeme weisen auf ein Rückwärtsversagen des linken Herzens hin (Stau in den Lungenkreislauf). Besteht eine Globalinsuffizienz, treten oft beide Formen zeitgleich oder nacheinander auf.
Herzinsuffizienz;Was bedeutet die NYHA-Stufe 3?;Der Patient hat eine erhebliche Einschränkung der körperlichen Leistungsfähigkeit. Er ist bei Ruhe beschwerdefrei, aber bereits bei geringer körperlicher Belastung (z.B. Gehen auf ebener Strecke, Ankleiden) treten Symptome wie Dyspnoe, Erschöpfung oder Herzrhythmusstörungen auf.
Hypertonie;Definieren Sie "Arterielle Hypertonie" (Grenzwerte).;Dauerhafte Erhöhung des Blutdrucks auf Werte von über 140 mmHg (systolisch) und/oder 90 mmHg (diastolisch).
Hypertonie;Unterscheiden Sie zwischen primärer und sekundärer Hypertonie.;Primär (90%): Keine eindeutige Ursache, beeinflusst durch Lebensstil (Salz, Stress, Übergewicht). Sekundär (10%): Folge einer anderen Erkrankung (z.B. Nierenarterienstenose oder endokrine Störungen).
Hypertonie;Warum wird Hypertonie oft als "Silent Killer" bezeichnet?;Weil sie über Jahre hinweg keine oder nur sehr unspezifische Symptome (z.B. Kopfschmerzen am Morgen) verursacht, aber im Hintergrund Gefässe und Organe massiv schädigt.
Hypertonie;Nennen Sie drei wichtige Zielorgane, die durch chronische Hypertonie geschädigt werden.;Herz (Herzinfarkt/Insuffizienz), Gehirn (Schlaganfall) und Niere (Niereninsuffizienz).
Hypertonie;Welche Lebensstiländerungen können den Blutdruck senken?;Gewichtsreduktion, kochsalzarme Ernährung, regelmässige körperliche Aktivität, Verzicht auf Nikotin und Reduktion des Alkoholkonsums.
Hypertonie;Was ist eine "hypertensive Krise" und wie reagieren Sie?;Ein plötzlicher Blutdruckanstieg auf Werte > 180/120 mmHg ohne Organschäden. Bei zusätzlichen Symptomen (ZNS, Herz) spricht man vom Notfall. Reaktion: Ruhe bewahren, Pat. flach mit erhöhtem Oberkörper lagern, Arzt informieren, engmaschige Kontrolle.
Hypertonie;Wie wirken ACE-Hemmer (ein häufiges Blutdruckmedikament)?;Sie blockieren das Enzym, das Angiotensin I in das stark gefässverengende Angiotensin II umwandelt. Folge: Die Gefässe weiten sich, der Blutdruck sinkt.
Hypertonie;Was ist eine typische Nebenwirkung von ACE-Hemmern?;Ein trockener Reizhusten (bedingt durch den verminderten Abbau von Bradykinin).
Hypertonie;Worauf müssen Sie bei der Gabe von Diuretika zur Blutdrucksenkung achten?;Überwachung des Flüssigkeitshaushalts (Ein-/Ausfuhr), tägliche Gewichtskontrolle und Kontrolle der Elektrolyte (v.a. Kalium).
Hypertonie;Was ist die "Weisskittelhypertonie"?;Ein Phänomen, bei dem der Blutdruck nur in der Arztpraxis oder im Spital aufgrund von Nervosität erhöht ist, während die Werte zu Hause (Heimmessung) normal sind.
Immunologie;Blutgruppenkompatibilität und Pathophysiologie?;Gruppe 0 ist Universalspender (Erythrozyten), Gruppe AB ist Universalempfänger. Bei Inkompatibilität kommt es zur Antigen-Antikörper-Reaktion (Hämolyse), die zum Nierenversagen und anaphylaktischen Schock führt (v.a. bei Rhesus-Unverträglichkeit).
Interdisziplinäre Zusammenarbeit;Was ist ein „Runder Tisch“ (Round Table) und welches Ziel verfolgt er?;Ein interprofessionelles Gefäss (Pflege, Ärzte, Therapeuten, Angehörige), um komplexe Fallsituationen gemeinsam zu besprechen. Ziel: Konsensfindung bei schwierigen Entscheidungen (z.B. Austrittsplanung oder Therapieabbruch) und die Bündelung aller Fachkompetenzen.
Kommunikation;Erklären Sie „Aktives Zuhören“ (Absichten und Gewinn).;Es ist eine wertschätzende Grundhaltung (nach Rogers), bei der man dem Gegenüber ungeteilte Aufmerksamkeit schenkt. Absichten: Empathie zeigen, Gehörtes prüfen (Paraphrasieren/Verbalisieren), Vertrauen schaffen. Gewinn: Höhere Informationsdichte, Deeskalation und eine tragfähige professionelle Beziehung.
Kommunikation;Erklären Sie die motivierende Gesprächsführung (MI) und die Umsetzung.;MI zielt darauf ab, die Eigenmotivation zur Verhaltensänderung zu stärken (Spirit: Partnerschaftlichkeit). Umsetzung: OARS-Techniken anwenden (Offene Fragen, Bestätigen, Reflektieren, Zusammenfassen), Change Talk evozieren und den Korrekturreflex vermeiden.
Kommunikation;Was sagt Ihnen das Harvard-Konzept?;Es ist eine Methode des sachbezogenen Verhandelns mit dem Ziel einer Win-Win-Lösung. Vier Prinzipien: 1. Menschen und Probleme trennen, 2. Interessen statt Positionen fokussieren, 3. Auswahlmöglichkeiten entwickeln, 4. Objektive Entscheidungskriterien nutzen.
Kompetenz & Qualität;Welche Fähigkeiten benötigen Sie, um die Komplexität von Patienten einschätzen zu können?;Vernetztes Denken (Zusammenhänge von Multimorbidität erkennen), klinische Expertise (Clinical Reasoning), Wahrnehmungsschärfe für subtile Veränderungen sowie ein Verständnis für das soziale System des Patienten.
Kompetenz & Qualität;Wie können Sie Ihre eigene Fachkompetenz erweitern?;Durch kontinuierliche Fortbildung, Literaturstudium (EBN - Evidence Based Nursing), Reflexion der eigenen Praxis (Supervision/Intervision), Fachberatungen und das Lernen von Spezialisten (z.B. Wundexperten).
Management;Was ist Casemanagement und dessen Vorteile?;Ein koordinierter Prozess zur Steuerung komplexer Krankheitsverläufe. Vorteile: Vermeidung von Versorgungslücken an Schnittstellen, effiziente Ressourcennutzung, Kontinuität der Betreuung und Entlastung des Patienten durch einen zentralen Ansprechpartner.
Management;Was bedeuten Skill-/Grademix und Case Mix?;Skill-Mix: Kombination verschiedener Erfahrungen/Fähigkeiten im Team. Grade-Mix: Kombination verschiedener Ausbildungsstufen (HF, FaGe, AGS). Case Mix: Der "Fall-Mix-Index", der die durchschnittliche Schwere und den Ressourcenaufwand der behandelten Patienten beschreibt.
Management;Was heisst Rationalisierung und Rationierung?;Rationalisierung: Effizienzsteigerung (gleiche Leistung mit weniger Aufwand, z.B. optimierte Dokumentation). Rationierung: Vorenthaltung notwendiger Leistungen aufgrund von Ressourcenmangel (z.B. Zeitmangel für Gespräche oder Mobilisation).
Management;Was heisst integrierte Versorgung?;Die sektorenübergreifende Vernetzung aller Beteiligten (Spital, Hausarzt, Spitex, Reha). Ziel ist ein nahtloser Behandlungspfad ohne Informationsverluste für den Patienten.
Motivierende Gespräche;Was ist die Grundhaltung (Spirit) der Motivierenden Gesprächsführung (MI) nach Miller und Rollnick?;MI basiert auf Partnerschaftlichkeit (Augenhöhe), Akzeptanz (bedingungslose Wertschätzung und Autonomie des Patienten), Mitgefühl (Compassion) und Evokation (Hervorlocken von Zielen/Lösungen aus dem Patienten). Es ist das Gegenteil von Experten-Belehrung.
Motivierende Gespräche;Welche Rolle spielt "Ambivalenz" bei Verhaltensänderungen und wie geht MI damit um?;Ambivalenz (Hin- und Hergerissen sein, z.B. rauchen wollen, aber gesund sein wollen) ist ein normales, zwingendes Stadium und kein "Widerstand". MI nutzt sie, um den Patienten seine eigenen Argumente für die Veränderung (Change Talk) aussprechen zu lassen, statt gegen ihn anzureden.
Motivierende Gespräche;Was verbirgt sich hinter dem Akronym OARS (bzw. BARS auf Deutsch) als Basistechniken der MI?;Offene Fragen (Open questions), Bestätigen/Würdigen (Affirmation), Aktives Zuhören/Reflektieren (Reflection) und Zusammenfassen (Summarizing). Diese Techniken steuern das Gespräch und bauen eine vertrauensvolle Basis auf.
Motivierende Gespräche;Erklären Sie den Unterschied zwischen "Change Talk" und "Sustain Talk".;Change Talk sind Äusserungen des Patienten, die für eine Veränderung sprechen (z.B. "Ich muss wirklich abnehmen für meine Gelenke"). Sustain Talk sind Argumente, die für die Beibehaltung des Status quo sprechen. Das Hauptziel von MI ist es, den Change Talk gezielt zu evozieren und zu verstärken.
Motivierende Gespräche;Was ist der "Korrekturreflex" (Righting Reflex) und warum ist er bei MI kontraproduktiv?;Es ist der starke Impuls von Pflegenden, den Patienten belehren und sofort gut gemeinte Lösungen aufzwingen zu wollen. Dies erzeugt Reaktanz (Widerstand) und drängt den Patienten dazu, sein ungesundes Verhalten verteidigen zu müssen (Sustain Talk).
Motivierende Gespräche;Wie reagieren Sie in der MI professionell auf "Widerstand" (Dissonanz) des Patienten?;Widerstand wird als Signal für eine Beziehungsstörung oder Überforderung verstanden. Man argumentiert nicht dagegen an (kein argumentatives Ping-Pong), sondern "rollt mit dem Widerstand": Man spiegelt die Emotion, wechselt das Thema oder gibt dem Patienten ausdrücklich die Autonomie zurück.
Motivierende Gespräche;Wozu dienen Skalierungsfragen (z.B. Zuversichtsskala 1-10) im Motivierenden Gespräch?;Sie machen Motivation und Zuversicht messbar und fördern den Change Talk. Fragt der Patient "Ich bin bei einer 4", fragt die Pflegende: "Warum eine 4 und keine 2?" (evoziert Gründe für den Wandel) oder "Was bräuchte es, um auf eine 5 zu kommen?" (deckt Ressourcen und Hürden auf).
Motivierende Gespräche;Warum ist das Transtheoretische Modell (TTM) von Prochaska/DiClemente eng mit MI verknüpft?;Das TTM beschreibt die Phasen der Verhaltensänderung (Absichtslosigkeit, Absichtsbildung, Vorbereitung, Handlung, Aufrechterhaltung). MI lehrt, dass die pflegerische Intervention exakt an die Phase angepasst werden muss, in der sich der Patient gerade befindet, sonst entsteht Widerstand.
Motivierende Gespräche;Wie intervenieren Sie bei einem Patienten in der Phase der Absichtslosigkeit (Precontemplation)?;In dieser Phase bringen Handlungspläne nichts. Das Ziel ist reiner Beziehungsaufbau. Man versucht, durch offene Fragen und nach Erlaubnis (!) sachlich informierend vorsichtig Zweifel am bisherigen Verhalten zu wecken, um ein Problembewusstsein zu schaffen.
Motivierende Gespräche;Was bedeutet das Prinzip der Evokation in der pflegerischen Praxis?;Es bedeutet, dass die Lösung im Patienten liegt, nicht in der Fachperson. Pflegende "locken hervor", indem sie nach den persönlichen Werten, Ressourcen und Ideen des Patienten fragen ("Wie haben Sie früher Krisen gemeistert?", "Was wäre für Sie der beste erste Schritt?").
Myokardinfarkt;Was ist ein Myokardinfarkt und wie entsteht er pathophysiologisch?;Es ist die irreversible Ischämie und Nekrose (Absterben) von Herzmuskelgewebe. Meist wird er durch die Ruptur einer arteriosklerotischen Plaque verursacht; an der Rissstelle bildet sich ein Thrombus, der die Koronararterie akut und komplett verschliesst.
Myokardinfarkt;Wie unterscheiden sich die Leitsymptome eines Myokardinfarkts bei Frauen oder Diabetikern oft von der "Klassik"?;Klassisch: Retrosternaler Vernichtungsschmerz, Ausstrahlung in linken Arm/Kiefer, Todesangst. Frauen/Diabetiker zeigen oft atypische Symptome: Starke Übelkeit, diffuse Oberbauchschmerzen, isolierte Atemnot, extreme Schwäche oder "stumme" (schmerzlose) Infarkte bei diabetischer Polyneuropathie.
Myokardinfarkt;Welche EKG-Veränderungen zeigen sich typischerweise bei einem frischen transmuralen Infarkt (STEMI)?;Das EKG zeigt eine signifikante ST-Strecken-Hebung in den Ableitungen, die dem betroffenen Infarktgebiet zugeordnet sind. Im weiteren Verlauf folgen oft eine T-Wellen-Inversion und (als Narbenzeichen) ein tiefer, pathologischer Q-Zacken.
Myokardinfarkt;Warum ist das hochsensitive Troponin (hs-cTn) der wichtigste Laborwert beim Verdacht auf einen Herzinfarkt?;Troponin ist ein Strukturprotein der Herzmuskelzellen. Es wird nur bei Nekrose (Zellzerfall) ins Blut freigesetzt. Es steigt rasch an (innerhalb von 1-3 Stunden) und ist der spezifischste Marker für einen Myokardschaden (wichtig zur Abgrenzung eines NSTEMI von einer instabilen Angina pectoris).
Myokardinfarkt;Welche medikamentösen Ansätze beinhaltet das klassische Notfall-Schema MONA beim akuten Herzinfarkt?;M: Morphin (Schmerz/Angst/Vorlastsenkung), O: O2 (nur bei SpO2 unter 90 Prozent), N: Nitrate (Vasodilatation/Vorlastsenkung, Achtung bei Hypotonie), A: ASS/Aspirin (Thrombozytenaggregationshemmung zur Thrombusstabilisierung).
Myokardinfarkt;Was ist die absolute Priorität in der medizinischen Therapie eines akuten STEMI ("Time is Muscle")?;Die schnellstmögliche Reperfusion (Wiedereröffnung) des verschlossenen Gefässes, um die Nekrose zu stoppen. Dies geschieht in der Regel durch eine primäre perkutane Koronarintervention (PCI/Herzkatheter) mit Ballondilatation und Stent-Einlage (Ziel: unter 90 Minuten).
Myokardinfarkt;Welche lebensbedrohliche Rhythmusstörung ist die häufigste Todesursache in den ersten Stunden eines Myokardinfarkts?;Das Kammerflimmern. Das minderdurchblutete (ischämische) Myokard ist elektrisch extrem instabil. Dies führt zu unkoordinierten, hochfrequenten Zuckungen des Muskels ohne Auswurfleistung (Herz-Kreislauf-Stillstand), was sofort defibrilliert werden muss.
Myokardinfarkt;Welche strukturellen Frühkomplikationen drohen bei einem massiven Infarkt der Herzwand?;Durch die Nekrose wird das Gewebe instabil. Es drohen ein Papillarmuskelabriss (führt zu akuter Mitralklappeninsuffizienz), ein Ventrikelseptumdefekt (Loch zwischen den Kammern) oder eine Herzwandruptur (Blutung in den Herzbeutel/Perikardtamponade). Alle führen zum kardiogenen Schock.
Myokardinfarkt;Welche pflegerischen Sofortmassnahmen leiten Sie bei Verdacht auf einen Herzinfarkt ein?;Alarmierung, absolute Herzbettlagerung (Oberkörper hoch zur Vorlastsenkung), absolute Körperruhe (keine Eigenbewegung des Patienten zur Senkung des O2-Verbrauchs im Myokard), enge Kleidung öffnen, 12-Kanal-EKG schreiben, grosslumige venöse Zugänge legen und lückenloses Monitoring starten.
Myokardinfarkt;Warum entwickelt sich nach einem grossen, überlebten Myokardinfarkt häufig eine chronische Herzinsuffizienz?;Das abgestorbene Herzmuskelgewebe regeneriert nicht, sondern wird durch starres, nicht-kontraktiles Bindegewebe (Narbe) ersetzt. Es kommt zum sogenannten "Remodeling" (Umbau), das Herz weitet sich aus, verliert massiv an Pumpleistung und entwickelt eine Insuffizienz.
Neuro;Was ist eine Liquordrainage (Lage und Ziel)?;Ein Katheter im Hirnventrikel (EVD) oder im Lumbalraum. Ziel ist die Ableitung von überschüssigem Liquor zur Senkung des intrakraniellen Drucks oder zur Diagnostik/Entlastung bei Liquorabflussstörungen.
Neuro;Einteilung des SHT (Grade/GCS) und Verlauf?;Grad 1 (leicht): GCS 13-15, meist reversible Symptome. Grad 2 (mittelschwer): GCS 9-12, oft strukturelle Schäden. Grad 3 (schwer): GCS 3-8, meist Koma und lebensbedrohlich. Verlauf: Akutphase (Primärschaden) gefolgt von Ödemphase (Sekundärschaden).
Neuro;Unterschied direktes und indirektes SHT?;Direkt: Gewalteinwirkung unmittelbar auf den Schädel (Schlag, Aufprall). Indirekt: Schädigung durch Beschleunigungs- und Verzögerungskräfte ohne direkten Kontakt (z.B. schweres Schleudertrauma bei Auffahrunfall).
Neuro;Was ist der Unterschied zwischen dem zentralen Nervensystem (ZNS) und dem peripheren Nervensystem (PNS) anatomisch und funktionell?;ZNS: Besteht aus Gehirn und Rückenmark, verarbeitet Informationen, steuert Bewusstsein, Kognition und Reflexe. PNS: Alle Hirn- und Spinalnerven ausserhalb des ZNS. Es ist das Leitungsnetz: afferent (Sensorik zum ZNS hin) und efferent (Motorik vom ZNS zum Muskel/Organ).
Neuro;Erklären Sie die antagonistische Wirkung von Sympathikus und Parasympathikus im vegetativen (autonomen) Nervensystem.;Der Sympathikus bereitet den Körper auf Leistung/Stress vor ("Fight or Flight", bewirkt Tachykardie, Bronchodilatation, weite Pupillen). Der Parasympathikus dient der Erholung und Verdauung ("Rest and Digest", bewirkt Bradykardie, enge Pupillen, gesteigerte Darmperistaltik).
Neuro;Was prüfen Sie im neurologischen Assessment bei der Pupillenkontrolle und was ist ein Warnzeichen für Hirndruck?;Man prüft Isokorie (Gleichheit), Form, Grösse und die prompte Reaktion auf Licht. Ein absolutes Alarmzeichen ist eine einseitig erweiterte (Anisokorie) und lichtstarre Pupille; dies deutet auf eine Einklemmung durch massiven Hirndruck hin (Kompression des N. oculomotorius).
Neuro;Wo wird der Liquor cerebrospinalis produziert und welche drei Hauptfunktionen hat er?;Produziert wird er in den Plexus choroidei (Gefässknäuel in den Hirnventrikeln). Seine Hauptfunktionen sind: Mechanischer Schutz (Stossdämpfer-Kissen), Stoffwechsel (Transport von Nährstoffen/Abbauprodukten) und Gewichtsreduktion des Gehirns durch Auftrieb im Wasserbad.
Neuro;Was ist die Blut-Hirn-Schranke und welche klinische Relevanz hat sie bei Infektionen (z.B. Meningitis)?;Es ist eine hochselektive Zellbarriere zwischen Blutgefässen und ZNS. Sie schützt das Gehirn vor Toxinen und Krankheitserregern. Klinisch erschwert sie die Therapie enorm, da viele Medikamente (z.B. Standard-Antibiotika) die gesunde Schranke nicht passieren können.
Neuro;Erklären Sie den anatomischen Ablauf eines Eigenreflexes (z.B. Patellarsehnenreflex).;Der Reiz (Dehnung) wird vom Rezeptor im Muskel aufgenommen, über sensible (afferente) Bahnen zum Rückenmark geleitet, dort über eine einzige Synapse direkt auf den motorischen (efferenten) Nerv umgeschaltet und löst die Kontraktion im gleichen Muskel aus – ganz ohne das Gehirn zu passieren.
Neuro;Was ist ein Dermatom und warum ist das Wissen darüber in der Pflege (z.B. nach einer PDA oder bei Herpes Zoster) wichtig?;Ein Dermatom ist das exakte Hautareal, das von einem einzigen Spinalnerven sensibel versorgt wird. Es hilft Pflegenden, die Höhe von Läsionen am Rückenmark zu lokalisieren (Sensibilitätsausfall ab Bauchnabel entspricht Th10) oder Schmerzausbreitungen (Gürtelrose) zuzuordnen.
Neuro;Wo kreuzen die motorischen Nervenbahnen der Pyramidenbahn und was ist die klinische Folge bei einem Schlaganfall (CVI)?;Die meisten Bahnen kreuzen im unteren Hirnstamm (Medulla oblongata) auf die Gegenseite. Folge: Eine Läsion in der rechten motorischen Hirnhälfte (Grosshirn) führt zu einer Lähmung (Hemiplegie) auf der linken, kontralateralen Körperseite.
Neuro;Welche Bedeutung hat der 10. Hirnnerv (Nervus vagus) im neurologischen System?;Er ist der Hauptnerv des Parasympathikus. Er wandert als einziger Hirnnerv in den Rumpf und innerviert lebenswichtige Organe (Lunge, Herz, Magen-Darm-Trakt), wo er herzfrequenzsenkend, blutdrucksenkend und verdauungsfördernd wirkt (Gefahr des Vagus-Reizes beim Absaugen!).
Neuro;Wie prüfen Sie klinisch mit dem "Halteversuch" grob die motorische Kraft der Arme und was prüfen Sie beim "Meningismus"?;Halteversuch: Patient hält beide Arme mit geschlossenen Augen und Handflächen nach oben (Supination) nach vorne gestreckt; sinkt ein Arm ab oder dreht sich nach innen (Pronation), deutet das auf eine Parese hin. Meningismus: Nackensteifigkeit; der Kopf lässt sich schmerzbedingt nicht passiv auf die Brust beugen.
Neurologie;Strukturen des Wirbelkörpers und Funktion der Spinalnerven?;Ein Wirbel besteht aus Wirbelkörper, Wirbelbogen und Quer-/Dornfortsätzen. Dazwischen liegt die Bandscheibe. Spinalnerven treten paarig aus dem Rückenmark aus; sie leiten sensible Signale zum Gehirn (Afferenz) und motorische Befehle zum Muskel (Efferenz).
Neurologie;Definition und Ziele des Bobath-Konzepts?;Bobath ist ein neurophysiologisches Rehabilitationskonzept für Pat. mit ZNS-Schädigungen. Ziele: Hemmung abnormaler Tonusmuster (Spastik), Fazilitation (Bahnen) normaler Bewegungen und Förderung der Wahrnehmung der betroffenen Körperseite. In der Praxis: 24-Stunden-Konzept, Einbezug der gelähmten Seite.
Neurologie;Hirndruckzeichen und Krankheiten mit erhöhtem Hirndruck?;Zeichen: Kopfschmerz, Übelkeit/Erbrechen (schwallartig), Bewusstseinstrübung, Pupillenveränderung (Anisokorie), Bradykardie. Krankheiten: Hirnblutung, Tumore, Ödeme nach Schädel-Hirn-Trauma, Meningitis oder Hydrozephalus.
Onkologie;Was ist der pathophysiologische Unterschied zwischen einer Hyperplasie und einer Neoplasie?;Hyperplasie ist eine reversible Zunahme der Zellzahl als Reaktion auf einen Reiz (z.B. Hornhaut bei Belastung). Neoplasie (Tumor) ist ein autonomes, unkontrolliertes und überschiessendes Gewebswachstum aufgrund von Gendefekten, das auch nach Wegfall des Auslösers persistiert.
Onkologie;Welche drei Kriterien unterscheiden bösartige (maligne) von gutartigen (benignen) Tumoren?;1. Wachstum: Maligne Tumoren wachsen infiltrativ und destruierend (zerstörend), benigne verdrängend. 2. Metastasierung: Nur maligne Tumoren bilden Tochtergeschwülste. 3. Differenzierung: Maligne Zellen sind entdifferenziert (atypisch), benigne Zellen ähneln dem Ursprungsgewebe.
Onkologie;Erklären Sie das TNM-System zur Klassifikation von Tumoren.;T (Tumor): Beschreibt die Grösse und lokale Ausdehnung des Primärtumors (T1-T4). N (Nodes): Beschreibt den Befall von regionalen Lymphknoten (N0-N3). M (Metastases): Gibt an, ob Fernmetastasen vorhanden sind (M0 oder M1).
Onkologie;Was versteht man unter dem "Grading" (G1 bis G4) eines Tumors?;Das Grading beschreibt den Grad der Malignität (Bösartigkeit) unter dem Mikroskop. G1 bedeutet hohe Differenzierung (ähnelt gesundem Gewebe, weniger aggressiv), G4 bedeutet völlige Entdifferenzierung (Anaplasie, sehr aggressiv und schnell wachsend).
Onkologie;Welche Symptome umfasst die sogenannte "B-Symptomatik" und worauf deutet sie hin?;Fieber (> 38 °C ohne Infekt), massiver Nachtschweiss (Wäschewechsel nötig) und ungewollter Gewichtsverlust (> 10 % in 6 Monaten). Sie deutet auf eine hohe Systemaktivität der Krebserkrankung hin und ist oft ein prognostisch relevantes Zeichen.
Onkologie;Was ist eine Metastasierung und welche drei Wege der Ausbreitung gibt es?;Es ist die Aussaat von Tumorzellen in gesundes Gewebe fernab des Primärtumors. Wege: 1. Lymphogen (über die Lymphbahnen), 2. Hämatogen (über die Blutbahn), 3. Intrakavitär (innerhalb von Körperhöhlen, z.B. Peritonealkarzinose).
Onkologie;Erklären Sie die Pathophysiologie der Tumorkachexie.;Es ist ein komplexes Auszehrungssyndrom. Tumorzellen schütten Zytokine (z.B. TNF-alpha) aus, die den Stoffwechsel massiv steigern, den Appetit hemmen und gleichzeitig den Abbau von Muskelmasse und Fettgewebe (Katabolismus) fördern. Sie ist durch normale Ernährung kaum aufzuhalten.
Onkologie;Was versteht man unter einem "paraneoplastischen Syndrom"?;Symptome, die nicht direkt durch das Tumorwachstum oder Metastasen verursacht werden, sondern durch vom Tumor produzierte Hormone oder Antikörper (z.B. ACTH-Produktion beim kleinzelligen Bronchial-Ca, was zu einem Cushing-Syndrom führt).
Onkologie;Warum ist die histologische Sicherung (Biopsie) vor jeder Krebstherapie zwingend erforderlich?;Weil die Wahl der Therapie (Chemo, Bestrahlung, OP, Antikörper) extrem spezifisch vom exakten Gewebetyp und den biologischen Eigenschaften der Zelle abhängt. Eine Fehlbehandlung aufgrund einer falschen Diagnose wäre wirkungslos und schädlich.
Onkologie;Was ist eine "Karzinogenese" und welche drei Phasen durchläuft sie?;Der Prozess der Krebsentstehung. 1. Initiation (irreversible Erbgutschädigung einer Zelle), 2. Promotion (weitere Reize führen zur Vermehrung der geschädigten Zelle), 3. Progression (der Tumor wird invasiv, bildet eigene Gefässe und beginnt zu metastasieren).
Onkologie;Maligne vs. Benigne und Metastasen?;Benigne (gutartig): Expansives Wachstum, meist gekapselt, keine Metastasen. Maligne (bösartig): Infiltratives, destruierendes Wachstum, Bildung von Metastasen (Tochtergeschwülsten). Ein Tumor gilt als bösartig, wenn er Basalmembranen durchbricht und streut.
Onkologie;Tumorklassifikation und Tumorentstehung?;Klassifikation nach TNM (Tumorgrösse, Nodes/Lymphknoten, Metastasen) und Grading (G1-G4, Differenzierung). Entstehung durch Karzinogenese: Mutationen in Onkogenen oder Tumorsuppressorgenen führen zu unkontrollierter Zellteilung.
Onkologie Behandlung;Was ist der Unterschied zwischen einer kurativen und einer palliativen Therapiestrategie?;Kurativ: Das primäre Ziel ist die vollständige Heilung und dauerhafte Beseitigung des Tumors. Palliativ: Eine Heilung ist nicht mehr möglich; Ziel ist die Linderung von Symptomen, Erhalt der Lebensqualität und Lebensverlängerung.
Onkologie Behandlung;Erklären Sie den Unterschied zwischen neoadjuvanter und adjuvanter Therapie.;Neoadjuvant: Die Therapie (z.B. Chemo/Bestrahlung) erfolgt vor der Operation, um den Tumor zu verkleinern. Adjuvant: Die Therapie erfolgt nach der (kompletten) operativen Entfernung, um eventuell verbliebene Mikrometastasen zu zerstören und Rückfälle zu verhindern.
Onkologie Behandlung;Wie wirken Zytostatika (Chemotherapie) auf zellulärer Ebene?;Sie greifen in den Zellteilungszyklus ein und stören die DNA-Replikation oder Mitose. Da Tumorzellen sich besonders schnell teilen, sind sie empfindlicher, aber auch gesunde Gewebe mit hoher Teilungsrate (Schleimhaut, Haare, Knochenmark) werden geschädigt.
Onkologie Behandlung;Was ist eine Myelosuppression und welche drei Blutbildveränderungen resultieren daraus?;Die Unterdrückung der Knochenmarksfunktion durch Chemotherapie. Folgen: 1. Anämie (Sauerstoffmangel/Müdigkeit), 2. Leukopenie/Neutropenie (massive Infektgefahr), 3. Thrombozytopenie (erhöhte Blutungsneigung).
Onkologie Behandlung;Was ist ein Paravasat und welche pflegerischen Sofortmassnahmen sind bei einem Zytostatika-Paravasat nötig?;Zytostatika fliessen ins umliegende Gewebe statt in die Vene. Massnahmen: Infusion sofort stoppen, Kanüle liegen lassen und versuchen, Restmenge/Blut aspirieren, Arzt informieren, Extremität ruhigstellen und kühlen (bei manchen Stoffen wärmen), Dokumentation und Foto.
Onkologie Behandlung;Welche pflegerischen Hautpflege-Regeln gelten für Patienten während einer Strahlentherapie im Bestrahlungsfeld?;Keine Seifen/Duschmittel (nur lauwarmes Wasser), die Haut nur trocken tupfen (nicht reiben), keine Puder/Salben ohne Rücksprache, lockere Baumwollkleidung tragen (Reibung vermeiden), keine direkte Sonne und die Bestrahlungsmarkierungen niemals eigenmächtig entfernen.
Onkologie Behandlung;Was ist das Ziel der "Targeted Therapy" (zielgerichtete Therapie) in der Onkologie?;Diese Medikamente (z.B. monoklonale Antikörper) greifen gezielt spezifische Strukturen oder Signalwege an, die nur auf/in Tumorzellen vorkommen. Dadurch wird das gesunde Gewebe weniger geschädigt als bei der klassischen Chemotherapie.
Onkologie Behandlung;Wie unterscheidet sich "Tumor-Fatigue" von normaler Erschöpfung?;Fatigue ist eine lähmende, anhaltende körperliche und psychische Erschöpfung, die in keinem Verhältnis zur vorangegangenen Belastung steht und durch Schlaf oder Ruhepausen nicht gebessert werden kann. Sie schränkt die Lebensqualität massiv ein.
Onkologie Behandlung;Welche pflegerischen Massnahmen lindern eine therapiebedingte Stomatitis (Schleimhautentzündung)?;Regelmässige Mundspülungen (z.B. mit Salbeitee oder Kochsalz), Verzicht auf scharfe/saure/heisse Speisen, weiche Zahnbürsten verwenden, künstlicher Speichel bei Trockenheit und ggf. lokale Analgetika vor dem Essen.
Onkologie Behandlung;Welche psychologische Bedeutung hat die Alopezie (Haarausfall) für onkologische Patienten?;Die Haare sind ein zentrales Symbol für Identität, Attractivität und Gesundheit. Der Verlust macht die Krankheit für das Umfeld sichtbar (Stigmatisierung) und führt oft zu einer schweren Erschütterung des Körperbildes (Body Image) und Selbstwertgefühls.
Orientierung;Welche vier Dimensionen der Orientierung werden im pflegerischen Assessment klassischerweise unterschieden?;1. Zur Zeit (Datum, Wochentag, Jahreszeit), 2. Zum Ort (Wo bin ich?), 3. Zur Situation (Warum bin ich hier?), 4. Zur Person (Name, Geburtsdatum, eigene Biografie).
Orientierung;Was ist der Unterschied zwischen einer örtlichen Desorientierung und einer situativen Desorientierung?;Örtlich: Der Patient weiss nicht, an welchem Ort er sich befindet (z.B. hält Spital für Hotel). Situativ: Der Patient erkennt den Sinn und Kontext der aktuellen Situation nicht (z.B. versteht nicht, warum er operiert werden muss oder warum Fremde ihn waschen).
Orientierung;Was ist das Ziel des "Reality Orientation Trainings" (ROT) und für welche Patientengruppe ist es geeignet?;Ziel ist die Verbesserung oder der Erhalt der Orientierung durch ständige Reize (Kalender, Uhren, Schilder, Wiederholung von Fakten). Es ist primär für Menschen in frühen Stadien der Demenz oder bei reversibler Verwirrtheit (Delir) geeignet.
Orientierung;Warum ist striktes ROT bei fortgeschrittener Demenz oft kontraproduktiv und führt zu herausforderndem Verhalten?;Da der Patient die objektive Realität kognitiv nicht mehr erfassen kann. Die ständige Konfrontation mit seinen Fehlern (z.B. "Heute ist nicht 1950") beschämt ihn, löst Stress aus und führt zu Rückzug oder Aggression. Hier ist Validation hilfreicher.
Orientierung;Welche Rolle spielt die "biografische Orientierung" für Menschen mit kognitiven Einschränkungen?;Wenn die aktuelle Zeit und der Ort verschwimmen, bleibt die eigene Lebensgeschichte (Biografie) der wichtigste Anker der Identität. Gespräche über die Vergangenheit bieten Sicherheit und Selbstwertgefühl ("Ich weiss noch, wer ich war").
Orientierung;Wie können Sie die räumliche Orientierung auf einer Abteilung durch "Milieutherapie" fördern?;Durch klare Farbleitsysteme (z.B. gelbe Linie zum WC), deutliche Piktogramme an Türen (Foto statt Text), gute Beleuchtung (Vermeidung von Angst auslösenden Schatten) und persönliche Gegenstände vor dem Zimmer (Wiedererkennungswert).
Orientierung;Warum fluktuiert (schwankt) die Orientierung bei einem Patienten mit Delir im Vergleich zu einem Demenzpatienten?;Das Delir ist eine akute Störung des Hirnstoffwechsels, die oft tageszeitabhängig (meist abends/nachts schlimmer) verläuft. Bei der Demenz ist der Orientierungsverlust meist stabil-progredient (langsam fortschreitend).
Orientierung;Wie wirkt sich "sensorische Deprivation" (Mangel an Sinnesreizen) auf die Orientierung aus?;Wenn Reize fehlen (z.B. keine Brille, kein Hörgerät, Isolation im Einzelzimmer), verliert das Gehirn den Kontakt zur Aussenwelt. Es fängt an, Reize selbst zu produzieren, was zu Halluzinationen und schwerer Desorientierung führen kann.
Orientierung;Was bedeutet "Orientierung geben durch Tagesstruktur"?;Feste Routinen, immer gleiche Abläufe und Bezugspersonen geben dem Patienten einen zeitlichen und sozialen Rahmen. Dies reduziert den kognitiven Aufwand für den Patienten, sich ständig neu zurechtfinden zu müssen, und vermittelt Sicherheit.
Orientierung;Welche Bedeutung hat die situative Orientierung für die Einwilligung in eine medizinische Massnahme (Urteilsfähigkeit)?;Nur wer situativ orientiert ist (den Sinn und die Folgen der Behandlung versteht), kann eine rechtlich gültige Einwilligung geben. Ist diese Orientierung nicht gegeben, muss ein gesetzlicher Vertreter entscheiden.
Orthopädie;Was ist eine Fragilitätsbecken-Fraktur (FFP) und warum drohen Blutungen?;Eine FFP ist ein Bruch des Beckens bei minimalem Trauma (z.B. Sturz aus Stand) aufgrund von Osteoporose. Blutungen entstehen, weil das Becken stark vaskularisiert ist (venöser Plexus und Beckenarterien liegen direkt am Knochen) und nach einer OP die Knochensubstanz oft schlecht hält.
Orthopädie;Anatomie des Beckenrings und chirurgische Behandlung?;Der vordere Ring besteht aus Schambein und Sitzbein, der hintere aus Kreuzbein und Iliosakralgelenken. Stabile Brüche werden konservativ behandelt; instabile Brüche (besonders hinterer Ring) werden mittels Osteosynthese (Schrauben, Platten) oder externem Fixateur stabilisiert.
Orthopädie;Was sind allgemeine Ursachen für Frakturen?;Traumatisch (direkte/indirekte Gewalteinwirkung), Pathologisch (bei Vorerkrankungen wie Metastasen oder Osteoporose ohne adäquates Trauma) oder durch Dauerbelastung (Ermüdungsbruch).
Orthopädie;Was ist eine Diarthrose?;Eine Diarthrose ist ein "echtes", freies Gelenk. Es ist gekennzeichnet durch einen Gelenkspalt, eine Gelenkkapsel, Gelenkflächen mit hyalinem Knorpel und Gelenkschmiere (Synovia), welche die Beweglichkeit ermöglicht.
Orthopädie;Unterschied Arthritis vs. Arthrose (Schmerzcharakter)?;Arthritis ist eine entzündliche Gelenkerkrankung (oft autoimmun/infektiös); typisch ist der Ruheschmerz und die morgendliche Gelenksteife. Arthrose ist eine degenerative Abnutzung des Knorpels; typisch ist der Anlaufschmerz nach Ruhe sowie Belastungsschmerz.
Orthopädie;Risiken von Orthogilets und orthopädischen Hilfsmitteln?;Hautkomplikationen (Druckstellen, Dekubitus, Mazeration), Muskelatrophie durch mangelnde Eigenaktivität, Sensibilitätsstörungen durch Nervenkompression, Thromboserisiko bei Immobilisation sowie psychische Belastung durch das eingeschränkte Körperbild.
Osteoporose;Erklären Sie die grundlegende Pathophysiologie der Osteoporose.;Es besteht ein Ungleichgewicht im Knochenstoffwechsel: Die Aktivität der Osteoklasten (Knochenabbau) übersteigt die der Osteoblasten (Knochenaufbau). Dadurch sinkt die Knochendichte, die Mikroarchitektur des Knochengewebes wird zerstört und das Frakturrisiko steigt massiv an.
Osteoporose;Was ist der Unterschied zwischen einer primären und einer sekundären Osteoporose?;Primär: Tritt ohne direkte Vorerkrankung auf, meist altersbedingt (senil) oder durch Östrogenmangel nach der Menopause (postmenopausal). Sekundär: Folge einer anderen Erkrankung (z.B. Hyperkortisolismus) oder einer Langzeittherapie mit Medikamenten (z.B. Glukokortikoiden).
Osteoporose;Warum erhöht eine langjährige Cortison-Therapie das Risiko für Osteoporose?;Glukokortikoide hemmen direkt die Aktivität der Osteoblasten, fördern die Osteoklasten und vermindern gleichzeitig die Kalziumaufnahme im Darm. Dies führt zu einem raschen Verlust an Knochensubstanz (steroidinduzierte Osteoporose).
Osteoporose;Welche Knochen sind bei Osteoporose besonders häufig von Frakturen betroffen?;Die Wirbelkörper (Sinterungsfrakturen/Keilwirbelbildung), der Schenkelhals (Femurhalsfraktur) und die distale Radiusfraktur (handgelenksnaher Speichenbruch nach Sturz).
Osteoporose;Welche Rolle spielen Kalzium und Vitamin D3 in der Prophylaxe und Therapie?;Kalzium ist der wichtigste Baustein für die Knochenmatrix. Vitamin D3 ist zwingend erforderlich, um die Kalziumaufnahme aus dem Darm ins Blut zu ermöglichen und den Einbau in den Knochen zu fördern. Ohne Vitamin D bleibt das Kalzium wirkungslos.
Osteoporose;Was versteht man unter einer "Witwenbuckel"-Bildung (Kyphose)?;Durch multiple, oft schmerzlose Sinterungsfrakturen der Wirbelkörper bricht die vordere Wirbelkante ein. Die Wirbelsäule krümmt sich nach vorne, was zu einer Buckelbildung, einer Abnahme der Körpergrösse und einer Einschränkung der Lungenfunktion führen kann.
Osteoporose;Welche pflegerischen Massnahmen stehen bei der Sturzprophylaxe für Osteoporose-Patienten im Vordergrund?;Beseitigung von Stolperfallen, gute Beleuchtung, festes Schuhwerk, Einsatz von Gehhilfen, Kraft- und Balancetraining zur Sturzvermeidung sowie ggf. das Tragen von Hüftprotektoren, um im Falle eines Sturzes Frakturen zu verhindern.
Osteoporose;Warum ist regelmässige körperliche Belastung (Weight-bearing exercise) für den Knochen so wichtig?;Knochengewebe braucht mechanische Belastung (Druck und Zug), um aufgebaut zu werden. Durch Sport werden die Osteoblasten stimuliert. Inaktivität und Bettlägerigkeit hingegen beschleunigen den Knochenabbau massiv.
Osteoporose;Wie wirken Bisphosphonate (häufige Medikamentengruppe) bei Osteoporose?;Sie lagern sich an die Knochenoberfläche an und hemmen direkt die Osteoklasten. Dadurch wird der Knochenabbau verlangsamt und die Knochendichte kann stabilisiert oder sogar leicht erhöht werden.
Osteoporose;Was ist eine Osteodensitometrie (DXA-Messung)?;Es ist das Standardverfahren zur Messung der Knochendichte. Mittels schwacher Röntgenstrahlen wird der Mineralsalzgehalt (meist an LWS und Hüfte) gemessen. Das Ergebnis wird als T-Score angegeben (Osteoporose ab einem T-Score von <= -2,5).
Osteoporose;Entstehung und Hormone beim Knochenstoffwechsel?;Entsteht durch ein Missverhältnis zwischen Knochenaufbau (Osteoblasten) und Abbau (Osteoklasten). Beteiligte Hormone: Östrogen (schützend), Parathormon (setzt Kalzium aus Knochen frei), Calcitonin (fördert Einbau) und Vitamin D3 (Kalziumaufnahme).
Osteoporose;Beeinflussbare und nicht beeinflussbare Faktoren?;Nicht beeinflussbar: Alter, Geschlecht (weiblich), Genetik, frühe Menopause. Beeinflussbar: Kalzium- und Vitamin-D-arme Ernährung, Bewegungsmangel, Untergewicht (BMI < 20), Nikotinabusus, hoher Alkoholkonsum und Langzeit-Kortisontherapie.
Pädagogik & Ausbildung;Wie geben Sie Feedback (Regeln)?;Nach der WWW-Regel: 1. Wahrnehmung (Ich-Botschaft, konkrete Beobachtung), 2. Wirkung (Wie ist es bei mir angekommen?), 3. Wunsch (Was soll künftig anders gemacht werden?). Feedback muss zeitnah, konstruktiv und wertschätzend sein.
Pädagogik & Ausbildung;Wie gestalten Sie einen Tag mit einer Lernenden lernfördernd?;Durch die Strukturierung in drei Phasen: 1. Vorbesprechung (Ziele festlegen, Vorwissen aktivieren), 2. Durchführung (Begleiten, Beobachten oder Vormachen), 3. Nachbesprechung (Reflexion, Feedback, Transferfragen stellen).
Pathophysiologie;Zeigen Sie den Zusammenhang zwischen COPD und KHK auf.;Beide Erkrankungen teilen Risikofaktoren (Rauchen, Alter). Die chronische Hypoxie und systemische Entzündungsprozesse der COPD fördern die Arteriosklerose der Koronarien. Zudem belastet die pulmonale Hypertonie das Herz zusätzlich (erhöhte Nachlast).
Pathophysiologie;Erklären Sie das Cor pulmonale.;Es ist eine Hypertrophie oder Dilatation des rechten Herzventrikels infolge einer Lungenerkrankung (z.B. COPD). Der hohe Widerstand im Lungenkreislauf zwingt das rechte Herz zu massiver Mehrarbeit, was langfristig zum Rechtsherzversagen führt.
Pathophysiologie;Erklären Sie die Entstehung einer Arteriosklerose.;Sie beginnt mit einer Endothelschädigung (z.B. durch Hypertonie/Rauchen). LDL-Cholesterin lagert sich in der Gefässwand ein und wird oxidiert. Makrophagen fressen das Fett (Schaumzellen) und lösen eine chronische Entzündung aus. Es bilden sich Plaques, die später verkalken und das Gefäss verengen.
Pathophysiologie;Erklären Sie die pAVK und deren Stadien.;Die periphere arterielle Verschlusskrankheit ist eine Durchblutungsstörung der Extremitäten (meist Beine). Stadien nach Fontaine: I (asymptomatisch), IIa (schmerzfreies Gehen > 200m), IIb (Gehstrecke < 200m), III (Ruheschmerz), IV (Nekrose/Gangrän/Ulkus).
Pathophysiologie;Erklären Sie den Ikterus.;Ikterus (Gelbsucht) ist eine Gelbfärbung von Haut und Skleren durch erhöhtes Bilirubin im Blut. Ursachen: Prähepatisch (vermehrter Hämolyse), Intrahepatisch (Leberzellschaden, z.B. Hepatitis) oder Posthepatisch (Gallenabflussstörung, z.B. Gallensteine).
Pathophysiologie;Unterschied zwischen einer Entzündung und einem Infekt?;Eine Entzündung ist die allgemeine Reaktion des Körpers auf einen Reiz (biologisch, chemisch, physikalisch). Ein Infekt ist das Eindringen, Anhaften und Vermehren von Mikroorganismen (Bakterien, Viren, Pilze) im Körper, was meist eine Entzündung auslöst.
Pathophysiologie;Zusammenhang Diabetes, pAVK, Hypertonie und Niereninsuffizienz?;Sie verstärken sich gegenseitig (Mikro-/Makroangiopathie). Bluthochdruck und Diabetes schädigen Nieren und Gefässe (pAVK). Für Wunden bedeutet dies: Minderdurchblutung, Ödeme und schlechte Nährstoffversorgung führen zu chronischen Wundheilungsstörungen.
