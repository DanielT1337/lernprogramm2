Zusammenhang CVI und Demenz;Was ist das "Post-Stroke-Delir" und wie grenzt es sich von einer Demenz ab?;Ein akuter Verwirrtheitszustand unmittelbar nach einem Schlaganfall. Es ist fluktuierend und potenziell reversibel, während eine Demenz ein dauerhafter, progredienter Zustand ist. Ein Delir nach CVI erhöht aber das Risiko für eine spätere Demenz.
Zusammenhang CVI und Demenz;Können vaskuläre und degenerative Demenz (Alzheimer) gleichzeitig auftreten?;Ja, man spricht dann von einer "Mischdemenz". Hierbei finden sowohl degenerative Prozesse (Plaques) als auch vaskuläre Schäden (Durchblutungsstörungen) gleichzeitig im Gehirn statt.
Zusammenhang CVI und Demenz;Warum ist die Blutdruckeinstellung bei vaskulärer Demenz ein pflegerisches Dilemma?;Ein zu hoher Blutdruck verursacht weitere Infarkte. Ein zu niedriger Blutdruck (durch zu starke Medikation) kann bei bereits verengten Gefässen zu einer Minderdurchblutung des Gehirns führen und die Demenzsymptome akut verschlechtern.
Zusammenhang CVI und Demenz;Welche kognitiven Domänen sind bei der vaskulären Demenz oft früher betroffen als das Gedächtnis?;Häufig stehen zunächst Verlangsamung im Denken, Konzentrationsstörungen, Antriebslosigkeit oder Schwierigkeiten bei der Planung von Abläufen (Exekutivfunktionen) im Vordergrund.
Zusammenhang CVI und Demenz;Was ist die wichtigste präventive Massnahme, um das Fortschreiten einer vaskulären Demenz nach einem CVI zu verhindern?;Die konsequente Sekundärprävention: Optimale Einstellung von Blutdruck und Blutzucker, Nikotinstopp und die Einnahme von Thrombozytenaggregationshemmern, um weitere Infarkte zu verhindern.`;

    // ==========================================
    // APP LOGIK
    // ==========================================

    let questions = [];
    let currentPool = [];
    let currentIndex = 0;

    window.onload = () => {
        // Lade die integrierten Fragen
        questions = parseCSV(QUESTIONS_DATA);
        updateHomeInfo();
    };

    function parseCSV(input) {
        if(!input) return [];
        const lines = input.trim().split('\n');
        return lines.map(line => {
            const parts = line.split(';');
            if (parts.length >= 3) {
                return { theme: parts[0].trim(), q: parts[1].trim(), a: parts[2].trim() };
            }
            return null;
        }).filter(q => q !== null);
    }

    function showView(viewId) {
        document.querySelectorAll('.container').forEach(v => v.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
    }

    function updateHomeInfo() {
        const info = document.getElementById('question-count-info');
        if (questions.length > 0) {
            info.innerHTML = `Katalog bereit: <strong>${questions.length} Fragen</strong> integriert.`;
            document.getElementById('btn-start').style.display = "inline-block";
        } else {
            info.innerText = "Fehler beim Laden der Fragen.";
            document.getElementById('btn-start').style.display = "none";
        }
    }

    function startLearning() {
        if (questions.length === 0) return;
        // Fragen mischen
        currentPool = [...questions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        showView('view-learn');
        displayQuestion();
    }

    function displayQuestion() {
        const q = currentPool[currentIndex];
        document.getElementById('current-index').innerText = currentIndex + 1;
        document.getElementById('total-count').innerText = currentPool.length;
        document.getElementById('theme-display').innerText = q.theme;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('answer-text').innerText = q.a;
        
        document.getElementById('answer-text').classList.add('hidden');
        document.getElementById('btn-show-answer').classList.remove('hidden');
        document.getElementById('btn-next').classList.add('hidden');
    }

    function showAnswer() {
        document.getElementById('answer-text').classList.remove('hidden');
        document.getElementById('btn-show-answer').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentPool.length) {
            displayQuestion();
        } else {
            alert("Hervorragend! Du hast alle Fragen dieser Runde gelernt.");
            showView('view-home');
        }
    }
</script>
